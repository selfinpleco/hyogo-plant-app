動植物解説ページ\"}},\"japanDistribution\":{\"summary\":\"宮崎県北部のごく限られた地域にのみ分布する県内固有のカンアオイ。かつては北部の広い範囲に分布していたが、園芸目的の採取等により生育地が激減し、現存個体群は極めて少ない。\",\"status\":\"自生\",\"source\":{\"name\":\"宮崎県「指定希少野生動植物の概要（オナガカンアオイ）」\",\"url\":\"https://www.pref.miyazaki.lg.jp/shizen/kurashi/shizen/onagakanaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"宮崎県公式ページに基づく情報で信頼性は比較的高いが、生育地の詳細な数値データは非公開。\",\"habitat\":\"里山の雑木林の林床。カンアオイ属の中でも特に観賞価値が高いとされ、盗掘・乱獲の対象となってきた。環境省レッドリスト絶滅危惧IA類。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（宮崎県北部固有種のため）\",\"detail\":\"本種は宮崎県北部のごく限られた地域にのみ分布する県内固有種であり、兵庫県・近畿地方とは1000km近く離れた九州南部に分布が限定される。兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"宮崎県「指定希少野生動植物の概要（オナガカンアオイ）」\",\"url\":\"https://www.pref.miyazaki.lg.jp/shizen/kurashi/shizen/onagakanaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"宮崎県固有種であることは複数資料で一致しており、兵庫県での自生はありえないと判断できる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"フタバアオイは葉が心形で薄く落葉性だが、オナガカンアオイは腎形の葉と暗紫色で萼裂片が糸状に長く伸びる特徴的な花を持つ点で大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"ウスバサイシンは萼裂片が短く三角状なのに対し、オナガカンアオイは名前の由来通り萼裂片が尾状に長く伸びる点で明瞭に区別できる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"ミヤコアオイは萼裂片が比較的短いが、オナガカンアオイは特徴的に長く伸びた萼裂片を持つ点で識別できる。\"}],\"source\":{\"name\":\"宮崎県「指定希少野生動植物の概要（オナガカンアオイ）」\",\"url\":\"https://www.pref.miyazaki.lg.jp/shizen/kurashi/shizen/onagakanaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"オナガカンアオイと兵庫県産3種との直接の形態比較資料は限られるため、記載形質からの概略比較である。\"}},{\"id\":\"asarum-misandrum\",\"nameJa\":\"アソサイシン\",\"nameJaAlt\":[],\"sciName\":\"Asarum misandrum B.U.Oh et J.G.Kim\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"アソサイシン\",\"あそさいしん\",\"Asarum misandrum\",\"カンアオイ\",\"クロフネサイシン\"],\"worldDistribution\":{\"summary\":\"日本固有種とみられる。世界的分布は熊本県阿蘇地方に限られるとみられ、日本国外には分布しない。\",\"source\":{\"name\":\"植物写真図鑑サイト（ymkr-okurimono.sakura.ne.jp）\",\"url\":\"http://ymkr-okurimono.sakura.ne.jp/plants/angiosperm/f10401_umanosuzukusa/asosaisin.html\",\"type\":\"secondary\",\"note\":\"個人運営の植物図鑑サイトで、他に有力な情報源を確認できなかった\"}},\"japanDistribution\":{\"summary\":\"九州中部・熊本県阿蘇地方（阿蘇烏帰山周辺など）に分布するとされるカンアオイ。同一の掲載ページが「クロフネサイシン」の名称も用いており、名称の対応関係には注意を要する。\",\"status\":\"自生\",\"source\":{\"name\":\"植物写真図鑑サイト（ymkr-okurimono.sakura.ne.jp）\",\"url\":\"http://ymkr-okurimono.sakura.ne.jp/plants/angiosperm/f10401_umanosuzukusa/asosaisin.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営の植物写真図鑑サイトの情報に基づいており、分布域の詳細（産地の広がりなど）を裏付ける学術文献や環境省レッドリスト掲載情報は今回の調査では十分に確認できなかった。情報は他種に比べ限定的であることに留意されたい。\",\"habitat\":\"山地の林床とみられる（詳細情報が乏しい）。草丈10〜20cmほどとされる（種小名misandrumは「雄しべが少ない」の意）。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（熊本県阿蘇地方固有種とみられるため）\",\"detail\":\"本種は熊本県阿蘇地方に分布するとみられる九州のカンアオイであり、兵庫県・近畿地方からは遠く離れた九州中部に分布が限定される。兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"植物写真図鑑サイト（ymkr-okurimono.sakura.ne.jp）\",\"url\":\"http://ymkr-okurimono.sakura.ne.jp/plants/angiosperm/f10401_umanosuzukusa/asosaisin.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"情報源が限定的であるため分布の詳細（阿蘇地方以外への広がりの有無等）には不確実性が残るが、少なくとも兵庫県からの記録は確認されておらず、分布地（阿蘇）から見ても兵庫県との関連は認められない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"詳細な形態比較資料は乏しいが、フタバアオイは茎先に2枚の対生する葉をつける特徴的な形態を持ち、アソサイシンとは識別可能とみられる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"同じウスバサイシン節に近縁とみられ外見が類似する可能性があるが、雄しべの数など細部形質で区別されるとされる（詳細データは乏しい）。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"ミヤコアオイは葉や葉柄の毛が粗い点が特徴で、アソサイシンとの区別点になり得るが、詳細な比較情報は今回確認できなかった。\"}],\"source\":{\"name\":\"植物写真図鑑サイト（ymkr-okurimono.sakura.ne.jp）\",\"url\":\"http://ymkr-okurimono.sakura.ne.jp/plants/angiosperm/f10401_umanosuzukusa/asosaisin.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"アソサイシンに関する情報が全般的に乏しいため、他種との形態比較は限定的な情報に基づく概略に留まる。\"}},{\"id\":\"asarum-mitoanum\",\"nameJa\":\"フクエジマカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum mitoanum T.Sugaw.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"フクエジマカンアオイ\",\"ふくえじまかんあおい\",\"Asarum mitoanum\",\"カンアオイ\",\"福江島\"],\"worldDistribution\":{\"summary\":\"日本固有種とみられる。和名（フクエジマ＝福江島）が示す通り、世界的分布は長崎県五島列島の福江島周辺に限られるとみられ、日本国外には分布しないとみられる。\",\"source\":{\"name\":\"Wikipedia日本語版「カンアオイ属」（属全体の概説）\",\"url\":\"https://ja.wikipedia.org/wiki/カンアオイ属\",\"type\":\"secondary\",\"note\":\"本種単独の専用記事・一次資料は今回の調査で確認できなかったため、属全体の概説ページと和名・命名者情報からの推定に基づく\"}},\"japanDistribution\":{\"summary\":\"和名『フクエジマカンアオイ』が示すとおり、長崎県・五島列島の福江島およびその周辺に分布するとみられる。命名者T.Sugawara（菅原敬）は九州・南西諸島の島嶼固有カンアオイ（例：コトウカンアオイ）を複数記載していることで知られる。\",\"status\":\"自生（分布情報が限定的）\",\"source\":{\"name\":\"Wikipedia日本語版「カンアオイ属」（属全体の概説）\",\"url\":\"https://ja.wikipedia.org/wiki/カンアオイ属\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種について専用の解説記事や学術文献を今回の調査で見つけることができなかった。和名『フクエジマ』は福江島（長崎県五島列島）に由来すると強く推定されるが、確定的な分布資料（レッドデータブック掲載情報や分類学的原記載論文）は確認できていない。他の9種と比べて情報の信頼性が低いことに留意されたい。\",\"habitat\":\"詳細不明。同属の他種から類推すると、島嶼部の常緑広葉樹林の林床に自生する常緑性カンアオイと考えられる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（長崎県五島列島固有種とみられるため）\",\"detail\":\"本種は和名・分布推定から長崎県五島列島の福江島周辺に固有と考えられ、瀬戸内海を越えた九州西方の離島に分布が限定される。兵庫県・近畿地方は分布域に含まれないとみられ、兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"Wikipedia日本語版「カンアオイ属」（属全体の概説）\",\"url\":\"https://ja.wikipedia.org/wiki/カンアオイ属\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布情報自体が限定的であるため断定は避けるが、少なくとも兵庫県での自生記録は一切確認されておらず、和名が示す福江島という産地は兵庫県から極めて離れている。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が重ならないとみられるため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"フタバアオイは落葉性で茎先に2枚の葉をつける点で識別が比較的容易とされるが、フクエジマカンアオイとの詳細な形態比較資料は確認できなかった。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"同属の近縁種と推定されるが、詳細な識別点に関する資料は確認できなかった。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"同属の近縁種と推定されるが、詳細な識別点に関する資料は確認できなかった。\"}],\"source\":{\"name\":\"Wikipedia日本語版「カンアオイ属」（属全体の概説）\",\"url\":\"https://ja.wikipedia.org/wiki/カンアオイ属\",\"type\":\"secondary\"},\"reliabilityNote\":\"フクエジマカンアオイに関する情報が全般的に乏しいため、他種との形態比較は一般的なカンアオイ属の特徴に基づく概略に留まり、確度は低い。\"}},{\"id\":\"asarum-monodoriflorum\",\"nameJa\":\"モノドラカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum monodoriflorum Hatus. et Yamahata\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"モノドラカンアオイ\",\"ものどらかんあおい\",\"Asarum monodoriflorum\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的分布は沖縄県西表島のごく限られた一地域に限られ、日本国外には分布しない。\",\"source\":{\"name\":\"Wikipedia日本語版「モノドラカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/モノドラカンアオイ\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"沖縄県八重山諸島・西表島のごく限られた一地域にのみ自生する常緑カンアオイ。他に自生地は知られていない。\",\"status\":\"自生\",\"source\":{\"name\":\"国立科学博物館「日本の生物多様性ホットスポット」データベース\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S23.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布が単一の狭い地域に限定されることは複数資料（Wikipedia、環境省レッドリスト、国立科学博物館）で一致しており、信頼性は比較的高い。\",\"habitat\":\"亜熱帯の森林。革質で心卵形の葉を持つ常緑多年草。4〜5月に開花し、萼筒は暗紫色で内面に格子状の模様がある。国内希少野生動植物種に指定され採取・譲渡が禁止されている。環境省レッドリスト絶滅危惧IA類(CR)。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（西表島固有種のため）\",\"detail\":\"本種は沖縄県西表島のごく限られた一地域にのみ自生する亜熱帯性の希少種であり、兵庫県とは2000km近く離れた日本最南西端の島嶼に分布が限定される。兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"国立科学博物館「日本の生物多様性ホットスポット」データベース\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S23.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"西表島固有であることは環境省レッドリスト等でも確認されており、兵庫県での自生は地理的に全くありえないと判断できる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"フタバアオイは落葉性で萼が浅い皿状なのに対し、モノドラカンアオイは常緑で萼筒が壺形かつ内面に格子状模様を持つ点で大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"ウスバサイシンは落葉性で葉が薄いが、モノドラカンアオイは常緑で革質の厚い葉を持つ点で明瞭に異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"ミヤコアオイは落葉性で毛の多い葉を持つが、モノドラカンアオイは常緑で無毛に近い革質の葉を持つ点で区別できる。\"}],\"source\":{\"name\":\"Wikipedia日本語版「モノドラカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/モノドラカンアオイ\",\"type\":\"secondary\"},\"reliabilityNote\":\"モノドラカンアオイと兵庫県産3種との直接の形態比較資料は限られるため、記載形質からの概略比較である。\"}},{\"id\":\"asarum-muramatsui\",\"nameJa\":\"アマギカンアオイ\",\"nameJaAlt\":[\"シモダカンアオイ\"],\"sciName\":\"Asarum muramatsui Makino\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"アマギカンアオイ\",\"あまぎかんあおい\",\"シモダカンアオイ\",\"しもだかんあおい\",\"Asarum muramatsui\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。Plants of the World Online (POWO) によれば本州伊豆半島に分布し、日本国外には分布しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Asarum muramatsui Makino\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93546-1\",\"type\":\"primary\",\"note\":\"Native range: Japan (Honshu: Izu Peninsula)\"}},\"japanDistribution\":{\"summary\":\"本州伊豆半島とその周辺（静岡県）に分布する常緑カンアオイ。\",\"status\":\"自生\",\"source\":{\"name\":\"Wikipedia日本語版「アマギカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/アマギカンアオイ\",\"type\":\"secondary\"},\"reliabilityNote\":\"POWOとWikipedia双方で伊豆半島（静岡県）への分布限定が確認されており、信頼性は高い。\",\"habitat\":\"低地〜山地の落葉・常緑広葉樹混交林、植林地にも生育。常緑多年草で葉は光沢のある濃緑色。4〜5月に開花し、萼筒は鐘形で暗紫色。環境省レッドリスト絶滅危惧II類(VU)。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（伊豆半島固有種のため）\",\"detail\":\"本種は本州伊豆半島とその周辺（静岡県）に分布が限定される種であり、兵庫県・近畿地方とは本州を横断する距離（400km以上）が離れている。兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"Plants of the World Online (Kew) — Asarum muramatsui Makino\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93546-1\",\"type\":\"primary\"},\"reliabilityNote\":\"POWOの分布データは伊豆半島に明確に限定されており、兵庫県との重複は認められない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"フタバアオイは落葉性で葉が薄く艶がないが、アマギカンアオイは常緑で葉に強い光沢があり葉脈が凹む点で異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"ウスバサイシンは落葉性で葉が薄いが、アマギカンアオイは常緑で葉が厚く光沢がある点で明瞭に異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"ミヤコアオイは葉や葉柄に粗い毛が目立つが、アマギカンアオイは萼裂片に暗紫色の短毛を密生する点など毛質・分布部位が異なる。\"}],\"source\":{\"name\":\"Wikipedia日本語版「アマギカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/アマギカンアオイ\",\"type\":\"secondary\"},\"reliabilityNote\":\"アマギカンアオイと兵庫県産3種との直接の形態比較資料は限られるため、記載形質からの概略比較である。\"}},{\"id\":\"asarum-nazeanum\",\"nameJa\":\"ナゼカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum nazeanum T.Sugaw.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ナゼカンアオイ\",\"なぜかんあおい\",\"Asarum nazeanum\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種で、世界的にも鹿児島県奄美大島のみに知られる。POWO（Kew）には本種単独の分布データは確認できず、日本国内の専門サイト情報に依拠する。\",\"source\":{\"name\":\"GKZ植物事典\",\"url\":\"https://gkzplant.sakura.ne.jp/souhon2/shousai2/na-gyou/na/nazekannaoi/nazekannaoi.html\",\"type\":\"secondary\",\"note\":\"POWOに独立した分類群としてのデータが見つからなかったため、日本の植物専門サイトを一次的な情報源とした。\"}},\"japanDistribution\":{\"summary\":\"鹿児島県奄美大島に固有。奄美大島の名瀬（ナゼ）地方に由来する和名を持ち、同島の常緑樹林下にのみ自生が確認されている。\",\"status\":\"自生\",\"source\":{\"name\":\"GKZ植物事典\",\"url\":\"https://gkzplant.sakura.ne.jp/souhon2/shousai2/na-gyou/na/nazekannaoi/nazekannaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種はごく限られた地域に分布する希少種で、環境省レッドデータブックでは絶滅危惧IB類（EN）に指定されている。専門的な学術論文までは確認できておらず、日本の山野草専門サイトの記載に基づく。\",\"habitat\":\"奄美大島の常緑広葉樹林下に自生する多年草。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（奄美大島固有種のため）\",\"detail\":\"本種の分布は鹿児島県奄美大島に限られ、兵庫県・近畿地方は含まれない。奄美大島は亜熱帯の琉球列島に属し、兵庫県の温帯林とは気候・植生帯が大きく異なる。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GKZ植物事典\",\"url\":\"https://gkzplant.sakura.ne.jp/souhon2/shousai2/na-gyou/na/nazekannaoi/nazekannaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県産維管束植物リスト等の一次資料は本調査では参照していないが、本種の分布は奄美大島に限定されるという複数の情報が一致しており、兵庫県での記録の可能性はきわめて低いと判断できる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で、茎の先端に2枚の葉が対になって付く点が特徴的。葉質は薄い。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉質が薄く先が尖る。根に強い香気があり生薬「細辛」の原料となる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で葉に白斑が入ることが多く、萼筒はやや壺形で口部がすぼまる。\"}],\"source\":{\"name\":\"一般的なカンアオイ属の識別情報（三河の植物観察等）\",\"url\":\"https://mikawanoyasou.org/kamei/umanosuzukusa-ka.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種そのものと3種との直接比較記述は確認できておらず、属レベルの一般的な識別ポイントに基づく。\"}},{\"id\":\"asarum-nipponicum-var-nankaiense\",\"nameJa\":\"ナンカイアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum nipponicum F.Maek. var. nankaiense (F.Maek.) T.Sugaw.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ナンカイアオイ\",\"なんかいあおい\",\"Asarum nipponicum var. nankaiense\",\"Asarum nankaiense\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有。基本種カンアオイ（Asarum nipponicum）はPOWOで本州（Honshu）分布とされるが、変種ナンカイアオイ単独の世界分布データはPOWOに見当たらない。近畿地方南西部～四国にかけての限定分布とされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93549-1\",\"type\":\"primary\",\"note\":\"POWOは基本種Asarum nipponicumを本州(Honshu)分布とするのみで、変種レベルの個別データは掲載していない。\"}},\"japanDistribution\":{\"summary\":\"本州（兵庫県・和歌山県）および四国（香川県・徳島県・高知県）に分布するとされる。和名「南海アオイ」は、これらの分布域がかつての令制国区分「南海道」（紀伊・淡路・阿波・讃岐・伊予・土佐）にほぼ対応することに由来すると考えられる。\",\"status\":\"自生\",\"source\":{\"name\":\"三河の植物観察／GKZ植物事典\",\"url\":\"https://gkzplant.sakura.ne.jp/souhon2/shousai2/na-gyou/na/nannkaiaoi/nannkaiaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"複数の独立した専門サイト（三河の植物観察、GKZ植物事典）がいずれも兵庫県を分布県として明記しており、単純な誤記とは考えにくい。ただし本調査では兵庫県内の具体的産地（自治体名・山域名）を一次資料で確認できておらず、後述の通り注意が必要。\",\"habitat\":\"山地の林床に生育する丈の低い常緑多年草。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に分布記録の可能性が高い（要確認）\",\"detail\":\"本種は複数の独立した専門サイト情報において兵庫県が分布県の一つとして明記されている（例：「本州：兵庫県・和歌山県・四国：香川県・徳島県・高知県」）。和名の由来である「南海道」には淡路国（現・兵庫県淡路島）が含まれることから、兵庫県内の記録は淡路島方面である可能性が地理的・歴史的に整合する。ただし本調査では兵庫県内の具体的な自治体名・山域名・採集記録等を一次資料（学術論文や兵庫県版レッドリスト個票、兵庫県産維管束植物リスト等）で直接確認できていない。関西の花・野草を紹介する専門サイトに「ナンカイアオイ-関西の花・春の花・兵庫県-」と題されたページが存在することも状況証拠として補足的に確認したが、当該ページの本文内容は技術的な理由で取得できなかった。この種はフタバアオイ・ウスバサイシン・ミヤコアオイと同様に兵庫県内に分布する可能性がある種として扱うべきであり、他の多くのカンアオイ属遠隔地固有種とは事情が異なる点に注意されたい。\",\"localities\":[\"兵庫県内（詳細な産地は未確認。分布域の南海道との対応関係から淡路島方面の可能性が示唆されるが、一次資料による裏付けは今回未確認）\"],\"volume\":null,\"page\":null,\"source\":{\"name\":\"三河の植物観察／GKZ植物事典\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種はこのバッチ調査において「兵庫県に分布しない」という前提が当てはまらない可能性がある種として特に注意を要する。兵庫県版レッドリスト（2020）の植物個票や兵庫県産維管束植物での本種の掲載有無を、可能であれば別途一次資料で確認することを強く推奨する。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は種間の外見が近似しており、識別には専門的な観察（萼筒内部の形状など）が必要である。ナンカイアオイは兵庫県内に分布する可能性がある種であるため、フタバアオイ・ウスバサイシン・ミヤコアオイとの識別だけでなく、本種自体である可能性も念頭に置く必要がある。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で茎の先端に2枚の葉が対をなして付く点が大きく異なる（ナンカイアオイは常緑で葉が地際に広がる）。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉が薄く、早春に開花し萼裂片が平開する。ナンカイアオイは常緑で萼筒上部内側がややくびれる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑同士で紛らわしいが、ミヤコアオイは葉に白斑が入りやすく、ナンカイアオイは萼片がやや波打ち蕾の萼片基部が凹む点が異なるとされる。\"}],\"source\":{\"name\":\"三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"萼筒形状などの識別点は基本種カンアオイとの比較記述からの引用であり、フタバアオイ・ウスバサイシン・ミヤコアオイとの直接比較記述ではない。\"}},{\"id\":\"asarum-nipponicum-var-nipponicum\",\"nameJa\":\"カンアオイ\",\"nameJaAlt\":[\"カントウカンアオイ\"],\"sciName\":\"Asarum nipponicum F.Maek. var. nipponicum\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"カンアオイ\",\"かんあおい\",\"カントウカンアオイ\",\"かんとうかんあおい\",\"Asarum nipponicum\",\"カンアオイ属\"],\"worldDistribution\":{\"summary\":\"日本固有種。POWOでは本州（Honshu）に分布するとされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93549-1\",\"type\":\"primary\",\"note\":\"POWOの分布記載は種レベル(Asarum nipponicum)であり変種は区別されていない。\"}},\"japanDistribution\":{\"summary\":\"基本変種（カントウカンアオイ）は関東地方南部から紀伊半島東部にかけての太平洋岸に分布し、具体的には千葉県・東京都・埼玉県・神奈川県・静岡県・愛知県・三重県に自生するとされる。近畿地方西部・兵庫県は分布域に含まれない（近畿地方南部にはナンカイアオイが分布）。\",\"status\":\"自生\",\"source\":{\"name\":\"三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"「カンアオイ」の和名は本来この基本変種を指すが、カンアオイ属全体の総称としても広く使われるため、他種との混同に注意が必要。分布情報は複数の専門サイトで一致している。\",\"habitat\":\"山地の林下に生育する常緑多年草。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（関東地方南部～紀伊半島東部の太平洋岸固有のため）\",\"detail\":\"本種（基本変種）の分布は関東地方南部（千葉・東京・埼玉・神奈川）から東海地方（静岡・愛知）、紀伊半島東部（三重）までの太平洋岸に限られ、兵庫県・近畿地方西部は含まれない。近畿地方南部（和歌山県・淡路島方面を含む兵庫県）に分布するのは別の変種ナンカイアオイ（var. nankaiense）であり、基本変種カンアオイそのものは兵庫県には分布しない。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"「カンアオイ」という名称は属全体の通称としても用いられるため、兵庫県内で『カンアオイ』と呼ばれる株を見つけた場合、実際には近縁種（フタバアオイ・ウスバサイシン・ミヤコアオイ、あるいはナンカイアオイ）である可能性が高い点に注意。基本変種そのものの兵庫県内記録は確認されなかった。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は種間の外見が近似しており、識別には専門的な観察が必要とされる。基本変種カンアオイ自体は兵庫県に分布しないが、近縁のナンカイアオイは兵庫県に分布する可能性があるため、兵庫県内での識別では特に注意を要する。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で茎の先端に2枚の葉が対をなして付く。カンアオイは常緑で葉が地際から出る。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉が薄く先端が尖る。カンアオイは常緑で葉質がやや厚い。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑同士で似るが、ミヤコアオイは葉に白斑が入りやすく分布は近畿地方中北部を含む。\"}],\"source\":{\"name\":\"三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"属レベルの一般的な識別情報に基づく。\"}},{\"id\":\"asarum-nomadakense\",\"nameJa\":\"ノマダケカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum nomadakense Hatus.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ノマダケカンアオイ\",\"のまだけかんあおい\",\"Asarum nomadakense\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種とされる。GBIF等のデータベースには分類学的な登録（1968年、Journal of Japanese Botany誌 43巻432頁に初島住彦により記載）は確認できるが、具体的な分布範囲を示す一次資料は本調査では確認できなかった。\",\"source\":{\"name\":\"GBIF Species\",\"url\":\"https://www.gbif.org/species/search?q=Asarum%20nomadakense\",\"type\":\"secondary\",\"note\":\"分類学的登録情報のみで、産地・分布に関する記述は確認できなかった。\"}},\"japanDistribution\":{\"summary\":\"命名者の初島住彦は九州・南西諸島の植物相を専門とした植物学者であり、本種も九州地方（またはその周辺の島嶼）のごく限られた地域に自生する固有種である可能性が高いが、本調査で具体的な都道府県・産地を明記した情報源には到達できなかった。\",\"status\":\"自生（詳細不明）\",\"source\":{\"name\":\"GBIF Species\",\"url\":\"https://www.gbif.org/species/search?q=Asarum%20nomadakense\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種については、日本の代表的な植物専門サイト（三河の植物観察、GKZ植物事典等）にも該当ページが見つからず、情報が非常に乏しい。命名者の専門分野と「タケ（岳）」を含む地名由来の和名から地理的推定を行っているが、これは推定であり確定的な分布情報ではない。より信頼性の高い情報を得るには専門文献（初島 1968, Journal of Japanese Botany 43: 432）の直接参照が必要である。\",\"habitat\":\"カンアオイ属に共通する、山地の林床に生育する常緑または落葉の多年草と推定される。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（狭域固有種であり近畿地方の分布記録が確認されないため）\",\"detail\":\"本種の分布域の詳細は本調査では特定できなかったが、命名者の研究対象地域（九州・南西諸島）や、カンアオイ属の他の多くの狭域固有種と同様の傾向を踏まえると、兵庫県・近畿地方に分布するという情報は一切確認されなかった。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なると考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF Species\",\"url\":\"https://www.gbif.org/species/search?q=Asarum%20nomadakense\",\"type\":\"secondary\"},\"reliabilityNote\":\"この種については情報が薄く、兵庫県への非分布という結論はカンアオイ属全般の狭域固有性の傾向および近畿地方言及の不在に基づく消極的な判断である点に留意されたい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は種間の外見が近似しており、識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が重ならないと考えられるため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で茎の先端に2枚の葉が対をなして付く点が特徴的。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉質が薄く、早春に開花する。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で葉に白斑が入ることが多い。\"}],\"source\":{\"name\":\"一般的なカンアオイ属の識別情報\",\"url\":\"https://mikawanoyasou.org/kamei/umanosuzukusa-ka.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種固有の形態情報が乏しいため、属レベルの一般的な識別ポイントに基づく。\"}},{\"id\":\"asarum-okinawense\",\"nameJa\":\"ヒナカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum okinawense Hatus.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ヒナカンアオイ\",\"ひなかんあおい\",\"Asarum okinawense\",\"カンアオイ\"],\"worldDistribution\":{\"summary\": tatus\":\"自生\",\"source\":{\"name\":\"京都府レッドデータブック2015「ヒメカンアオイ（ヒガシヤマカンアオイ）」\",\"url\":\"https://www.pref.kyoto.jp/kankyo/rdb/bio/db/flo0233.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種は本州中部以西から四国まで比較的広く分布し、近畿地方では京都府に分布記録があることが京都府レッドデータブック等で確認できた。ただし兵庫県内での分布・記録の有無を直接示す資料は本調査では見つからなかった。他の9種（狭域固有種）と比べて分布域が兵庫県に地理的に近く、絶対的に「分布しない」と断定できるほどの確証はない点に留意されたい。\",\"habitat\":\"山地の林内に生育する常緑の多年草。葉は卵円形～腎円形で長さ5～8cm、幅4～7cm、花は淡緑色～暗紫褐色。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内の分布は未確認（近畿地方に分布記録があるため要注意）\",\"detail\":\"本種は本州中部以西～四国に比較的広く分布し、近畿地方でも京都府に分布記録があることが京都府レッドデータブック等で確認された。この点は他の9種（九州・南西諸島・フォッサマグナ地域などの狭域固有種）とは異なり、地理的には兵庫県に比較的近い。しかし今回の調査では兵庫県内での具体的な分布記録・自生地情報を示す資料は見つからず、既存の3種（フタバアオイ・ウスバサイシン・ミヤコアオイ）のような確認済みの兵庫県記録があるわけではない。したがって「兵庫県に分布記録なし」と断定するのではなく、現時点で確認記録が見つからなかったに留まる旨を明記する。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"京都府レッドデータブック2015「ヒメカンアオイ（ヒガシヤマカンアオイ）」\",\"url\":\"https://www.pref.kyoto.jp/kankyo/rdb/bio/db/flo0233.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県版レッドリストや兵庫県内観察記録サイトを検索したが、本種の兵庫県内における明確な記録は確認できなかった。ただし分布域が近畿地方（京都府）まで及ぶことから、近隣の兵庫県東部（六甲山系・北摂山地・丹波地域等）での自生の可能性を完全には否定できず、将来的な確認記録の有無について注意が必要である。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。ヒメカンアオイは近畿地方（京都府）にも分布することが確認されているため、兵庫県内で類似株を見た場合、フタバアオイ・ウスバサイシン・ミヤコアオイに加えて本種の可能性も慎重に検討する必要がある。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"地上茎の先に2枚の葉を対状につける落葉性種で、常緑性で地際に葉が広がるヒメカンアオイとは生活形が明確に異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性・葉質が薄く、早春に葉の展開とほぼ同時に開花する。常緑で葉が5～8cmとやや小型のヒメカンアオイとは区別できる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で近畿地方の山地林床に生育する点はヒメカンアオイと共通するが、葉表の質感や萼筒の形状が異なるとされ、両種は近縁のカンアオイ節に属するため野外での識別には注意を要する。\"}],\"source\":{\"name\":\"三河の植物観察「ヒメカンアオイ」\",\"url\":\"https://mikawanoyasou.org/data/himekanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"ヒメカンアオイとミヤコアオイの詳細な形態比較（萼筒内部の隔壁形状など）についての一次資料は確認できておらず、専門的な検鏡による識別が推奨される。\"}},{\"id\":\"asarum-takaoi-var-austrokiiensie\",\"nameJa\":\"キナンカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum takaoi F.Maek. var. austrokiiensie (Kinoshita) Yonek.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"キナンカンアオイ\",\"きなんかんあおい\",\"Asarum takaoi austrokiiensie\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有。変種小名austrokiiensieは「南紀伊（紀南）」を意味し、紀伊半島南部（和歌山県南部）に分布する狭域固有変種とされる。基本変種（ヒメカンアオイ var. takaoi）はより広く本州中部以西～四国に分布する。\",\"source\":{\"name\":\"kanaoiasarum（カンアオイ属愛好家サイト・和歌山県産カテゴリー）\",\"url\":\"https://kanaoiasarum.jimdofree.com/\",\"type\":\"secondary\",\"note\":\"同サイトは都道府県別にカンアオイ属を分類しており、和歌山県産カテゴリーに近縁の紀南地方産カンアオイ類（クシモトカンアオイ等）が掲載されている。\"}},\"japanDistribution\":{\"summary\":\"和名「キナン」は紀南（紀伊半島南部、和歌山県南部の串本・那智勝浦周辺地域）を指し、変種小名austrokiiensie（「南の紀伊」の意）とも整合する。紀伊半島南部（和歌山県南部）に分布する狭域固有変種と考えられる。\",\"status\":\"自生\",\"source\":{\"name\":\"kanaoiasarum（カンアオイ属愛好家サイト・和歌山県産カテゴリー）\",\"url\":\"https://kanaoiasarum.jimdofree.com/\",\"type\":\"secondary\"},\"reliabilityNote\":\"本変種を直接的に解説する詳細な一次資料（学術論文・都道府県レッドデータブック等）は本調査では見つからず、和名・学名の語源解析（紀南＝紀伊半島南部）と、近縁の紀南産カンアオイ類を掲載する専門愛好家サイトの分類（和歌山県産カテゴリー）を根拠とした。信頼性は中程度であり、より正確な分布確認には専門文献の追加調査が望ましい。\",\"habitat\":\"常緑広葉樹林の林床に生育する常緑の多年草と推定される（基本変種ヒメカンアオイに準ずる）。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（紀伊半島南部・紀南地方固有変種のため）\",\"detail\":\"和名「キナン」が示す紀南地方は和歌山県南部（串本・那智勝浦周辺）を指す。ユーザーの指示に基づき兵庫県・紀南地方双方について追加検索を行ったが、兵庫県内で本変種（キナンカンアオイ）に関する言及は一切見つからなかった。紀伊半島南部は近畿地方の中でも兵庫県から地理的に最も離れた地域の一つであり、兵庫県・近畿地方北西部（兵庫県はその一部）とは分布域が異なると考えられる。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"kanaoiasarum（カンアオイ属愛好家サイト）\",\"url\":\"https://kanaoiasarum.jimdofree.com/\",\"type\":\"secondary\"},\"reliabilityNote\":\"「兵庫県 キナンカンアオイ」で検索したが該当する情報は得られなかった。分布域が紀伊半島南部という狭い地域に限定されると考えられることから、兵庫県との地理的隔たりは大きいと判断したが、本変種を直接解説する一次資料が乏しいため、断定的な結論というよりは現時点で確認できた最善の推定である旨を付記する。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本変種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が重ならないと考えられるため、兵庫県内で本変種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"地上茎の先に2枚の葉を対状につける落葉性種で、常緑性のヒメカンアオイ系統とは生活形が異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性・葉質が薄く、早春に開花する。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で近畿地方の山地林床に生育する点は共通するが、萼筒の形状等で識別されるとされる。基本変種ヒメカンアオイと同様、近縁種との区別には専門的観察が必要。\"}],\"source\":{\"name\":\"三河の植物観察「ヒメカンアオイ」（基本変種の解説）\",\"url\":\"https://mikawanoyasou.org/data/himekanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"本変種固有の詳細な形態記載（基本変種var. takaoiとの具体的な相違点を含む）についての一次資料は確認できておらず、識別点は基本変種の一般的特徴に基づく概説にとどまる。\"}},{\"id\":\"asarum-takaoi-var-hisauchii\",\"nameJa\":\"ゼニバサイシン\",\"nameJaAlt\":[\"キソジノカンアオイ\"],\"sciName\":\"Asarum takaoi F.Maek. var. hisauchii (F.Maek.) F.Maek.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ゼニバサイシン\",\"ぜにばさいしん\",\"キソジノカンアオイ\",\"Asarum takaoi hisauchii\",\"カンアオイ\",\"タカオスミレサイシン\"],\"worldDistribution\":{\"summary\":\"日本固有。世界的にはブラジル・北米等に分布する近縁属Hexastylisとは異なり、Asarum属タカオカンアオイの変種として本州中部（東海・信州）にのみ知られる日本固有変種であり、国外に分布しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) / 三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/zenibasaisin.htm\",\"type\":\"secondary\",\"note\":\"POWOには近縁taxonのAsarum fauriei var. takaoiのエントリはあるが、var. hisauchii単独の独立ページは確認できず、日本の専門サイト情報を主に採用した。\"}},\"japanDistribution\":{\"summary\":\"本州中部の静岡県・長野県・愛知県・三重県に分布する（三河の植物観察による）。「キソジノカンアオイ」の別名が示す通り、長野県木曽地方を含む中部山地が分布の中心。\",\"status\":\"自生\",\"source\":{\"name\":\"三河の植物観察 (mikawanoyasou.org)\",\"url\":\"https://mikawanoyasou.org/data/zenibasaisin.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営の植物観察サイトが主な典拠であり、県別の詳細な分布境界は一次資料（各県レッドデータブック等）で未検証。ただし分布域が東海・中部地方に限られる点は複数の類縁種資料と整合する。\",\"habitat\":\"山地の林内に生育する常緑の多年草。カンアオイ属に典型的な、地表近くに隠れるように咲く花をつける。花期は2〜3月。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（東海・中部地方固有変種のため）\",\"detail\":\"本変種の分布は静岡県・長野県・愛知県・三重県という本州中部（東海・信州）地域に限られる。三重県は近畿地方に含める分類もあるが、兵庫県は近畿地方の西端に位置し、三重県とは大きく離れているため両県の分布は重ならない。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が明確に異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"三河の植物観察 (mikawanoyasou.org)\",\"url\":\"https://mikawanoyasou.org/data/zenibasaisin.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県産維管束植物目録等の一次資料には未照会。分布域が東海・中部地方に限定されるという複数の二次資料の一致から、兵庫県への分布拡張の可能性は極めて低いと判断した。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で、地上茎の先に2枚の葉を対につける点が特徴的。ゼニバサイシンのような丸く小さい常緑葉ではなく、薄く広卵形の葉を持つ。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉質が薄く、萼筒は漏斗状で萼裂片が上向きに開く。ゼニバサイシンの萼筒内部の約20本の縦じわ・短い萼筒とは形状が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で葉表面がざらつく質感を持ち、雲紋状の斑が入ることが多い。ゼニバサイシンの円形で小型（幅3〜4cm）の葉とは大きさ・形が異なる。\"}],\"source\":{\"name\":\"三河の植物観察 (mikawanoyasou.org)\",\"url\":\"https://mikawanoyasou.org/data/zenibasaisin.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"形態比較は主に葉・萼筒の外見的特徴に基づく概説であり、厳密な区別には専門的な花部解剖が必要。\"}},{\"id\":\"asarum-tamaense\",\"nameJa\":\"タマノカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum tamaense Makino\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"タマノカンアオイ\",\"たまのかんあおい\",\"Asarum tamaense\",\"カンアオイ\",\"多摩の寒葵\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な分布は日本国内（本州南関東地方）のみに限られ、国外には分布しない。\",\"source\":{\"name\":\"日本のレッドデータ検索システム（環境省, RL/RDB）\",\"url\":\"https://ikilog.biodic.go.jp/rl_rdb/c/1190.html\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"本州の南関東地方、多摩丘陵およびその周辺、多摩川流域を中心に分布する日本固有種。\",\"status\":\"自生\",\"source\":{\"name\":\"ウィキペディア「タマノカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%BF%E3%83%9E%E3%83%8E%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"環境省レッドリストで絶滅危惧II類（VU、2017年）に指定されており、分布域が多摩丘陵周辺の限られた範囲であることは複数の資料で一致している。\",\"habitat\":\"広葉樹林内のやや湿った林床に生育する。花期は4〜5月で、暗紫色の花を地表近くに半ば埋もれるようにつける。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（南関東地方・多摩丘陵固有種のため）\",\"detail\":\"本種の分布は東京都・神奈川県にまたがる多摩丘陵とその周辺の南関東地方に限られ、兵庫県・近畿地方は分布域から遠く離れている。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"日本のレッドデータ検索システム（環境省, RL/RDB）\",\"url\":\"https://ikilog.biodic.go.jp/rl_rdb/c/1190.html\",\"type\":\"primary\"},\"reliabilityNote\":\"環境省レッドリストという一次資料に基づく分布情報であり信頼性は高い。兵庫県産維管束植物目録は本種を対象としていないが、分布域の隔絶から兵庫県への分布拡張は考えにくい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に葉を2枚対生させる特異な形態を持ち、タマノカンアオイのような濃緑で光沢のある単独の卵形葉とは大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉柄は緑色。タマノカンアオイに特徴的な褐色〜暗紫色の葉柄を持たない点で区別できる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で葉の質感がざらつき、雲紋状の斑紋が目立つ。タマノカンアオイの光沢ある厚い葉とは質感が異なる。\"}],\"source\":{\"name\":\"ウィキペディア「タマノカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%BF%E3%83%9E%E3%83%8E%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"形態比較は葉柄の色や葉質感など外見的特徴に基づく概説であり、厳密な区別には花部の観察が必要。\"}},{\"id\":\"asarum-tohokuense\",\"nameJa\":\"トウゴクサイシン\",\"nameJaAlt\":[],\"sciName\":\"Asarum tohokuense Yamaji et Ter.Nakam.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"トウゴクサイシン\",\"とうごくさいしん\",\"Asarum tohokuense\",\"カンアオイ\",\"東国細辛\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な分布は日本国内（本州関東北部〜中部北部〜東北地方）のみに限られる。\",\"source\":{\"name\":\"ウィキペディア「トウゴクサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%88%E3%82%A6%E3%82%B4%E3%82%AF%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"本州の関東地方北部および中部地方北部から東北地方にかけて分布する。2007年に山地博幸らの研究によりウスバサイシンから独立した種として記載された比較的新しい分類群。\",\"status\":\"自生\",\"source\":{\"name\":\"ウィキペディア「トウゴクサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%88%E3%82%A6%E3%82%B4%E3%82%AF%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種は2007年の分類学的研究（山地・中村）で記載された比較的新しい種であり、旧分類ではウスバサイシンに含められていた経緯があるため、古い文献では区別されていない可能性がある。\",\"habitat\":\"山地の落葉広葉樹林内の林床に生育する。花期は4〜5月、萼筒は扁球形で内壁は白色〜淡紅色を帯びる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（関東北部〜東北地方分布種のため）\",\"detail\":\"本種の分布は関東地方北部・中部地方北部から東北地方にかけての本州中北部に限られ、近畿地方の兵庫県は分布域に含まれない。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。なお本種はもともとウスバサイシンの一部とされていたが、2007年の研究で別種として分離された。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"ウィキペディア「トウゴクサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%88%E3%82%A6%E3%82%B4%E3%82%AF%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布記述は関東北部〜東北という広い地理表現で、近畿地方への分布は資料上一切示唆されていない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。特に本種はもともとウスバサイシンと同一種とみなされていた経緯があり外見が近い。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"地上茎の先に葉を2枚対生させる特異な形態で、萼裂片が平開して星形になる点がトウゴクサイシンとは大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"近縁種で外見が非常に類似するが、トウゴクサイシンは萼筒内壁が白色〜淡紅色で一部暗紫色を帯びるのに対し、ウスバサイシンは萼筒内壁が一様に暗紫色に近いとされる。分布域も異なり、識別には花部の詳細な観察が必要。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で葉表面がざらつき雲紋状の斑が入る点で、落葉性で葉先が尖るトウゴクサイシンとは区別できる。\"}],\"source\":{\"name\":\"ウィキペディア「トウゴクサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%88%E3%82%A6%E3%82%B4%E3%82%AF%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"ウスバサイシンとの識別点は萼筒内壁の色調など専門的な形質に依存し、野外での即断は難しいとされる。\"}},{\"id\":\"asarum-tokarense\",\"nameJa\":\"トカラカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum tokarense Hatus.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"トカラカンアオイ\",\"とからかんあおい\",\"Asarum tokarense\",\"カンアオイ\",\"トカラ列島\"],\"worldDistribution\":{\"summary\":\"日本固有種。POWOでは分布域を「Nansei-shoto (Tokara-retto)」（南西諸島のトカラ列島）とし、国外には分布しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:936121-1/general-information\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"鹿児島県のトカラ列島（口之島・中之島・悪石島など）に分布する日本固有種。シノニムとして「Asarum yakusimense var. glabrum」の名も知られ、屋久島のヤクシマアオイに近縁とされる。\",\"status\":\"自生\",\"source\":{\"name\":\"ウィキペディア「カンアオイ属」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4%E5%B1%9E\",\"type\":\"secondary\"},\"reliabilityNote\":\"個別の独立記事がなく、POWOと属全体のリスト記事という限られた情報源に基づく。トカラ列島内のどの島に具体的に分布するかまでの詳細な一次資料は今回確認できなかった。\",\"habitat\":\"亜熱帯性の常緑広葉樹林の林床に生育すると推定される（カンアオイ属の一般的な生態に基づく）。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（トカラ列島固有種のため）\",\"detail\":\"本種の分布は鹿児島県のトカラ列島という南西諸島の離島群に限られ、本州の兵庫県・近畿地方とは著しく離れている。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:936121-1/general-information\",\"type\":\"primary\"},\"reliabilityNote\":\"POWOという信頼性の高い一次資料でトカラ列島固有であることが確認できるため、兵庫県への分布はないと判断してよい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に葉を2枚対生させる特異な形態を持つ点で、南西諸島の常緑性カンアオイ類とは大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で薄い葉質を持つ点が、常緑性とされるトカラカンアオイと異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で葉表面がざらつく点は共通するが、分布域が近畿・中国地方に限られ、南西諸島には分布しない。\"}],\"source\":{\"name\":\"ウィキペディア「カンアオイ属」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4%E5%B1%9E\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種に関する詳細な形態記載を持つ資料が乏しく、比較点は一般的なカンアオイ属の特徴に基づく概説にとどまる。\"}},{\"id\":\"asarum-trigynum\",\"nameJa\":\"サンコカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum trigynum (F.Maek.) Araki\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"サンコカンアオイ\",\"さんこかんあおい\",\"Asarum trigynum\",\"Heterotropa trigyna\",\"カンアオイ\",\"甑島\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な分布は日本国内（鹿児島県甑島列島）のみに限られる。\",\"source\":{\"name\":\"鹿児島大学総合研究博物館ニュースレター No.44\",\"url\":\"https://www.museum.kagoshima-u.ac.jp/publications/pdf_images/newsletter/News%20Letter%20No44.pdf\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"鹿児島県薩摩半島西方の甑島列島（下甑島など）の固有種。九州北西部に分布する近縁のツクシアオイに似るが、雄蕊・花柱が6個に減数する点で区別されるとされる。\",\"status\":\"自生\",\"source\":{\"name\":\"鹿児島大学総合研究博物館ニュースレター No.44（丸野勝敏「下甑島の植物」）\",\"url\":\"https://www.museum.kagoshima-u.ac.jp/publications/pdf_images/newsletter/News%20Letter%20No44.pdf\",\"type\":\"secondary\"},\"reliabilityNote\":\"甑島列島の固有種5種のうちの1つとして紹介する大学博物館ニュースレター記事を主な典拠とした。一般向けの図鑑・データベースには独立記事が乏しく、情報源はやや限られる。\",\"habitat\":\"甑島列島の常緑広葉樹林の林床に生育すると考えられる（現地調査記録の写真は2011年4月、口岡での撮影）。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（甑島列島固有種のため）\",\"detail\":\"本種の分布は鹿児島県甑島列島という九州西方の離島に限られ、本州の兵庫県・近畿地方とは大きく離れている。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"鹿 ki/%E3%83%A4%E3%82%A8%E3%83%A4%E3%83%9E%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種の葉の大きさに関する記述は具体的で信頼度が高いが、フタバアオイ等3種との直接比較データは今回確認できず、一般的な特徴からの推定を含む。\"}},{\"id\":\"asarum-yakusimense\",\"nameJa\":\"ヤクシマアオイ\",\"nameJaAlt\":[\"オニカンアオイ\"],\"sciName\":\"Asarum yakusimense Masam.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ヤクシマアオイ\",\"やくしまあおい\",\"オニカンアオイ\",\"Asarum yakusimense\",\"カンアオイ\",\"屋久島\"],\"worldDistribution\":{\"summary\":\"日本固有種。POWOでは分布域を「Japan (Yakushima)」（日本・屋久島）とし、国外には分布しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93592-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"鹿児島県屋久島に分布する固有種。シノニムに Asarum hirsutisepalum S.Hatusima があり、別名オニカンアオイとしても栽培・流通する。\",\"status\":\"自生\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93592-1\",\"type\":\"primary\"},\"reliabilityNote\":\"POWOによる分布記述は屋久島限定と明確である一方、屋久島内の詳細な自生地情報は今回の調査では確認できなかった。園芸分野では「オニカンアオイ」の名で流通する個体があり、その分布・来歴の詳細確認は限定的。\",\"habitat\":\"屋久島の山地林床に生育すると考えられる（カンアオイ属の一般的な生態に基づく）。近縁のトカラカンアオイ（Asarum yakusimense var. glabrumがシノニムとされる）とも近縁とされる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（屋久島固有種のため）\",\"detail\":\"本種の分布は鹿児島県屋久島に限られ、本州の兵庫県・近畿地方とは著しく離れている。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93592-1\",\"type\":\"primary\"},\"reliabilityNote\":\"POWOという信頼性の高い一次資料で屋久島固有であることが確認できるため、兵庫県への分布はないと判断してよい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に葉を2枚対生させる特異な形態を持つ点で、常緑性の屋久島産カンアオイ類とは大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で薄い葉質を持つ点が、常緑性とされるヤクシマアオイとは異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿・中国地方に分布する常緑性カンアオイで、分布域が屋久島とは大きく離れている。\"}],\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93592-1\",\"type\":\"primary\"},\"reliabilityNote\":\"本種固有の詳細な形態記載を持つ資料は限られ、比較点は一般的なカンアオイ属の特徴に基づく概説にとどまる。\"}},{\"id\":\"asarum-yoshikawae\",\"nameJa\":\"クロヒメカンアオイ\",\"nameJaAlt\":[\"クビキカンアオイ\"],\"sciName\":\"Asarum yoshikawae T.Sugaw.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"クロヒメカンアオイ\",\"くろひめかんあおい\",\"クビキカンアオイ\",\"Asarum yoshikawae\",\"カンアオイ\",\"頸城\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な分布は日本国内（本州日本海側、新潟県〜富山県）のみに限られる。\",\"source\":{\"name\":\"ウィキペディア「クロヒメカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AD%E3%83%92%E3%83%A1%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"本州日本海側の新潟県西部（頸城地方・上越地方）から富山県東部にかけて分布する。別名クビキカンアオイは新潟県の旧頸城郡地域に由来する。1998年に近縁種との花の形態・染色体の比較研究を経て新種として記載された。\",\"status\":\"自生\",\"source\":{\"name\":\"ウィキペディア「クロヒメカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AD%E3%83%92%E3%83%A1%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"比較的近年（1998年）に記載された種であり、分布域の記述はウィキペディア記事に依拠する。県別の詳細な分布境界は一次資料未照会。\",\"habitat\":\"低山地の落葉広葉樹林の林床に生育する。花期は3〜4月で、暗褐色〜緑褐色の花をつけ、萼筒は狭く筒口の直径が4mm以下と非常に狭いのが特徴。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（新潟県〜富山県・日本海側北陸地方固有種のため）\",\"detail\":\"本種の分布は本州日本海側の新潟県西部から富山県東部（北陸地方）に限られ、兵庫県（近畿地方の日本海側は但馬地方が該当）とは数百キロメートル離れており、分布域は重ならない。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"ウィキペディア「クロヒメカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AD%E3%83%92%E3%83%A1%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布域が新潟県〜富山県という北陸地方に明確に限定される点は複数の資料で一致しており、兵庫県への分布拡張は考えにくい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に葉を2枚対生させる特異な形態を持つ点で、根茎から直接葉を出すクロヒメカンアオイとは大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"萼筒内部の縦じわの数や筒口の広さが異なるとされ、クロヒメカンアオイは筒口が直径4mm以下と極めて狭く、内壁に16〜24本の複雑な格子状の隆起がある点で区別される。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑性で葉表面がざらつき雲紋状の斑が入る点で、光沢のある明緑色の葉を持つクロヒメカンアオイとは異なる。\"}],\"source\":{\"name\":\"ウィキペディア「クロヒメカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AD%E3%83%92%E3%83%A1%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"萼筒の内部構造に関する記述は具体的で信頼度が高いが、フタバアオイ等3種との直接比較データではなく、一般的な属の特徴との対比を含む。\"}},{\"id\":\"nuphar-saikokuensis\",\"nameJa\":\"サイコクヒメコウホネ\",\"nameJaAlt\":[\"西国姫河骨\"],\"sciName\":\"Nuphar saikokuensis Shiga et Kadono\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"サイコクヒメコウホネ\",\"さいこくひめこうほね\",\"西国姫河骨\",\"Nuphar saikokuensis\",\"nuphar\",\"コウホネ\"],\"worldDistribution\":{\"summary\":\"2015年に志賀隆・角野康郎により新種記載された日本固有種。POWO等の主要データベースでは記載年が新しいため独立ページの整備が発展途上だが、複数の学術・行政資料で日本固有種として扱われている。\",\"source\":{\"name\":\"サイコクヒメコウホネ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%B5%E3%82%A4%E3%82%B3%E3%82%AF%E3%83%92%E3%83%A1%E3%82%B3%E3%82%A6%E3%83%9B%E3%83%8D\",\"type\":\"secondary\"},\"reliabilityNote\":\"2015年発表の比較的新しい種であり、POWO等の一次資料データベースでの単独ページ整備状況は今回確認できなかった。原記載論文（志賀・角野, 2015）を直接確認できればより確実である。\"},\"japanDistribution\":{\"summary\":\"本州（中部地方以南）、四国、九州に分布する日本固有種。従来「ヒメコウホネ（Nuphar subintegerrima）」として西日本各地から報告されてきた個体群の多くが、2015年の分類学的再検討により、東海地方（愛知・岐阜・三重）に分布域が限定される真のヒメコウホネとは別に、本種として独立して記載されたもの。コウホネ・ヒメコウホネ・オグラコウホネ等の複雑な交雑に由来する可能性も指摘されている。\",\"status\":\"自生（日本固有種）\",\"source\":{\"name\":\"手柄山温室植物園だより「姫路市と周辺に見られる絶滅危惧植物」（姫路市まちづくり振興機構）\",\"url\":\"https://himeji-machishin.jp/lib/files/z36-saikokuhimekouhone.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"姫路市の公的機関（まちづくり振興機構）発行の資料であり、地域の絶滅危惧植物を専門に扱った信頼性の高い二次資料に近い一次的資料として扱う。\",\"habitat\":\"ため池、河川、水路に生育する多年生水草。通常は浮葉植物として卵形〜広卵形（長さ10〜30cm、幅7〜20cm）の葉を水面に浮かべ、基部が矢じり形にへこむ。水深が浅くなると葉を立ち上げて抽水状態になることもある。6〜10月に直径3〜4cmの黄花をつける。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に分布記録あり（播磨地域に比較的多数の生育地）\",\"detail\":\"姫路市まちづくり振興機構発行の資料に「兵庫県では播磨地域に比較的多くの生育地があり、産地により個体の大小があるようです」と明記されている。兵庫県版レッドデータブックではCランク、環境省第4次レッドリストではVUランクに指定される希少種。旧来「ヒメコウホネ」として扱われてきた兵庫県内（三田市等）の記録の一部が、本種を指している可能性がある点に注意が必要（アプリ内「ヒメコウホネ」のページも参照）。\",\"volume\":null,\"page\":null,\"localities\":[\"播磨地域（姫路市周辺を中心に複数地点、産地により個体の大小あり）\"],\"source\":{\"name\":\"手柄山温室植物園だより「姫路市と周辺に見られる絶滅危惧植物」（姫路市まちづくり振興機構）\",\"url\":\"https://himeji-machishin.jp/lib/files/z36-saikokuhimekouhone.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"兵庫県産維管束植物本体での本種名（2015年命名のため目録刊行時期によっては未反映の可能性がある）での掲載有無は今回確認できていない。姫路市の資料は具体的な自治体名までは記載しておらず、より詳細な産地の特定にはさらなる一次資料の確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のコウホネ・ヒメコウホネ・オグラコウホネと極めてよく似ており、分布域と柱頭盤の形状等で区別する。特にヒメコウホネとは2015年まで同一種として扱われていた経緯があり、混同に注意が必要。\",\"items\":[{\"name\":\"ヒメコウホネ\",\"sciName\":\"Nuphar subintegerrima (Casp.) Makino\",\"distinguishingPoints\":\"2015年の分類学的再検討により、ヒメコウホネは東海地方（愛知・岐阜・三重）に分布が限定される種として再定義された。近畿地方（兵庫県・京都府等）で見られる同様の個体群は本種（サイコクヒメコウホネ）に該当する可能性が高い。\"},{\"name\":\"コウホネ\",\"sciName\":\"Nuphar japonica DC.\",\"distinguishingPoints\":\"コウホネは花が直径約5cmと大きく、水上に立ち上がる抽水葉をつける点で異なる。\"},{\"name\":\"オグラコウホネ\",\"sciName\":\"Nuphar oguraensis Miki\",\"distinguishingPoints\":\"オグラコウホネは葉柄が細く中空で、抽水葉をつくらない点で区別されるが、外見は近似する。\"}],\"source\":{\"name\":\"手柄山温室植物園だより／三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/himekouhone.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"コウホネ属の識別は専門的な形態比較を要し、特に本種とヒメコウホネの分布域による識別は近年の分類学的知見に基づくため、今後の研究で変更される可能性がある。\"}},{\"id\":\"nuphar-pumila-var-pumila\",\"nameJa\":\"ネムロコウホネ\",\"nameJaAlt\":[\"根室河骨\"],\"sciName\":\"Nuphar pumila (Timm) DC. var. pumila\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"ネムロコウホネ\",\"ねむろこうほね\",\"根室河骨\",\"Nuphar pumila\",\"nuphar\",\"コウホネ\"],\"worldDistribution\":{\"summary\":\"ユーラシア大陸北部の寒冷地（ヨーロッパ〜シベリア）に広く分布する周北極要素の水生植物で、日本はその分布の南東端にあたる。\",\"source\":{\"name\":\"ネムロコウホネ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8D%E3%83%A0%E3%83%AD%E3%82%B3%E3%82%A6%E3%83%9B%E3%83%8D\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"北海道から本州北部にかけて分布し、群馬県・福島県・新潟県付近が南限とされる寒冷地・高層湿原性の水生植物。名前は北海道根室地方に由来する。\",\"status\":\"自生\",\"source\":{\"name\":\"ネムロコウホネ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8D%E3%83%A0%E3%83%AD%E3%82%B3%E3%82%A6%E3%83%9B%E3%83%8D\",\"type\":\"secondary\"},\"habitat\":\"湖沼、湿原の池塘等の冷涼な止水域に生育する多年生水生植物。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（北海道〜本州北部が分布域のため）\",\"detail\":\"本種は北海道から本州北部（群馬県・福島県・新潟県付近が南限）にかけて分布する寒冷地・高層湿原性の種であり、兵庫県を含む近畿地方への分布記録は確認されなかった。分布の中心は北海道・東北地方であり、温暖な兵庫県内の池沼環境とは生育条件が大きく異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"ネムロコウホネ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8D%E3%83%A0%E3%83%AD%E3%82%B3%E3%82%A6%E3%83%9B%E3%83%8D\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaを主要な情報源として使用。兵庫県産維管束植物での明示的な「記録なし」の確認は行っていないが、分布域が地理的に遠く離れているため、記録がないことは自然分布上妥当と考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のコウホネ属の中でも特に小型で、変種オゼコウホネ（柱頭盤が赤色）と近縁。兵庫県内で見られるコウホネ属はコウホネ・サイコクヒメコウホネ・オグラコウホネのいずれかである可能性が高い。\",\"items\":[{\"name\":\"コウホネ\",\"sciName\":\"Nuphar japonica DC.\",\"distinguishingPoints\":\"コウホネは花・葉ともに本種よりも大型である。\"},{\"name\":\"オゼコウホネ\",\"sciName\":\"Nuphar pumila var. ozeensis (Miki) H.Hara\",\"distinguishingPoints\":\"本種の変種で、柱頭盤が赤色になる点で区別される。尾瀬など本州の高層湿原に局在する。\"}],\"source\":{\"name\":\"ネムロコウホネ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8D%E3%83%A0%E3%83%AD%E3%82%B3%E3%82%A6%E3%83%9B%E3%83%8D\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaの記述に基づく一般的な識別点。\"}},{\"id\":\"nuphar-pumila-var-ozeensis\",\"nameJa\":\"オゼコウホネ\",\"nameJaAlt\":[\"尾瀬河骨\"],\"sciName\":\"Nuphar pumila (Timm) DC. var. ozeensis (Miki) H.Hara\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"オゼコウホネ\",\"おぜこうほね\",\"尾瀬河骨\",\"Nuphar pumila var. ozeensis\",\"nuphar\",\"コウホネ\"],\"worldDistribution\":{\"summary\":\"ネムロコウホネ（Nuphar pumila）の変種で、日本国内の限られた高層湿原に局在する。基本種は周北極要素としてユーラシア北部に広く分布するが、本変種自体は日本に限定される。\",\"source\":{\"name\":\"植物Q&A オゼコウホネとネムロコウホネについて - 日本植物生理学会\",\"url\":\"https://jspp.org/hiroba/q_and_a/detail.html?id=6006\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"尾瀬（群馬県・福島県・新潟県境）、秋田県、北海道（雨竜沼湿原）などの高層湿原の池塘に局在する。基本変種ネムロコウホネとは柱頭盤が赤色になる点で区別される。\",\"status\":\"自生（局所分布）\",\"source\":{\"name\":\"植物Q&A オゼコウホネとネムロコウホネについて - 日本植物生理学会\",\"url\":\"https://jspp.org/hiroba/q_and_a/detail.html?id=6006\",\"type\":\"secondary\"},\"habitat\":\"高層湿原の池塘（水たまり）に生育する多年生水生植物。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（尾瀬・北海道等の高層湿原に局在するため）\",\"detail\":\"本変種は尾瀬（群馬・福島・新潟県境）や秋田県、北海道の雨竜沼湿原など、本州以北のごく限られた高層湿原の池塘にのみ分布することが知られており、兵庫県内に高層湿原そのものがほとんど存在しないこともあり、分布記録は確認されなかった。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"植物Q&A オゼコウホネとネムロコウホネについて - 日本植物生理学会\",\"url\":\"https://jspp.org/hiroba/q_and_a/detail.html?id=6006\",\"type\":\"secondary\"},\"reliabilityNote\":\"本変種は分布そのものが極めて局所的であり、兵庫県における高層湿原環境の少なさからも自生の可能性は低いと考えられるが、県内湿原の悉皆調査による明示的な「記録なし」の確認までは行っていない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"基本変種ネムロコウホネと非常に近縁で、柱頭盤の色（本変種は赤色、ネムロコウホネは黄色）で区別される。\",\"items\":[{\"name\":\"ネムロコウホネ\",\"sciName\":\"Nuphar pumila (Timm) DC. var. pumila\",\"distinguishingPoints\":\"基本変種。柱頭盤が黄色である点で本変種と区別される。\"}],\"source\":{\"name\":\"植物Q&A オゼコウホネとネムロコウホネについて - 日本植物生理学会\",\"url\":\"https://jspp.org/hiroba/q_and_a/detail.html?id=6006\",\"type\":\"secondary\"},\"reliabilityNote\":\"専門機関のQ&Aページに基づく識別点。\"}},{\"id\":\"nuphar-submersa\",\"nameJa\":\"シモツケコウホネ\",\"nameJaAlt\":[\"下野河骨\"],\"sciName\":\"Nuphar submersa Shiga et Kadono\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"シモツケコウホネ\",\"しもつけこうほね\",\"下野河骨\",\"Nuphar submersa\",\"nuphar\",\"コウホネ\"],\"worldDistribution\":{\"summary\":\"2007年に志賀隆・角野康郎により新種記載された日本固有種。世界的にも栃木県内の数か所でのみ知られる、きわめて分布の限られた種。\",\"source\":{\"name\":\"シモツケコウホネ - 日光植物園（東京大学）\",\"url\":\"https://nikko-bg.jp/nikko-old/5_jokyo/species/Nuphar_submersa.html\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"栃木県内の数か所の自生地でのみ確認されている絶滅危惧IA類（環境省レッドリスト）の希少種。沈水葉のみをつけ浮葉をほとんどつくらない特異な生活形を持つ。\",\"status\":\"自生（絶滅危惧IA類、栃木県固有的分布）\",\"source\":{\"name\":\"シモツケコウホネ - 日光植物園（東京大学）\",\"url\":\"https://nikko-bg.jp/nikko-old/5_jokyo/species/Nuphar_submersa.html\",\"type\":\"secondary\"},\"habitat\":\"河川や水路の流水中に沈水状態で生育し、浮葉をほとんど形成しない点が他のコウホネ属と大きく異なる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（栃木県のみの極めて限定的な分布のため）\",\"detail\":\"本種は栃木県内の自生地数か所でのみ知られる絶滅危惧IA類の希少種であり、兵庫県を含む他地域への分布は報告されていない。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"シモツケコウホネ - 日光植物園（東京大学）\",\"url\":\"https://nikko-bg.jp/nikko-old/5_jokyo/species/Nuphar_submersa.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布が栃木県に限定されることは複数資料で一致しており、兵庫県への分布の可能性はきわめて低いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"コウホネ属の中でも特異な、沈水葉のみをつける生活形を持つ。\",\"items\":[{\"name\":\"コウホネ\",\"sciName\":\"Nuphar japonica DC.\",\"distinguishingPoints\":\"コウホネは抽水葉・浮葉を通常につけるのに対し、本種はほぼ沈水葉のみで浮葉をつくらない点で大きく異なる。\"}],\"source\":{\"name\":\"シモツケコウホネ - 日光植物園（東京大学）\",\"url\":\"https://nikko-bg.jp/nikko-old/5_jokyo/species/Nuphar_submersa.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"大学植物園の解説ページに基づく識別点。\"}},{\"id\":\"kadsura-matsudae\",\"nameJa\":\"リュウキュウサネカズラ\",\"nameJaAlt\":[\"琉球実葛\"],\"sciName\":\"Kadsura matsudae Hayata\",\"family\":\"マツブサ科 Schisandraceae\",\"searchTerms\":[\"リュウキュウサネカズラ\",\"りゅうきゅうさねかずら\",\"琉球実葛\",\"Kadsura matsudae\",\"サネカズラ\"],\"worldDistribution\":{\"summary\":\"台湾原産で1920年に記載され、長らく既存種サネカズラ（Kadsura japonica）のシノニムとして扱われてきたが、2017年に神戸大学の研究グループにより花の形態的差異（雄しべの葯が隣接するか否か）が確認され、独立種として復活した。Kew POWOでもKadsura属の正名（accepted species）として掲載されている。\",\"source\":{\"name\":\"Kadsura Kaempf. ex Juss. - Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:25578-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"沖縄県・鹿児島県（南西諸島）に分布する。台湾にも分布し、日本国内では沖縄本島を中心とする琉球列島が分布域。2017年の神戸大学の研究（末次健司ほか）により、台湾産の型標本と沖縄・台湾産標本の精査から独立種として復活記載された。\",\"status\":\"自生（南西諸島）\",\"source\":{\"name\":\"リュウキュウサネカズラ Kadsura matsudae Hayata - 琉球の植物データベース（国立科学博物館）\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S5.html\",\"type\":\"primary\"},\"reliabilityNote\":\"国立科学博物館の公式データベースを一次資料として使用。分類学的経緯については神戸大学の研究発表・Phytotaxa掲載論文（Suetsugu et al. 2017）も参照した。\",\"habitat\":\"亜熱帯の森林に自生するつる性木本。既収録のサネカズラと外見は近似する。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（沖縄県・鹿児島県島嶼部が分布域のため）\",\"detail\":\"本種は亜熱帯の琉球列島（沖縄本島を中心とする沖縄県・鹿児島県島嶼部）に固有・限定分布する種であり、温帯である兵庫県には自生記録も生育可能な気候要因もない。既収録種のサネカズラ（Kadsura japonica）は本州（関東以西）〜琉球まで広く分布し兵庫県内にも自生するが、本種はそれとは別種で、より南方に分布が限定される。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"リュウキュウサネカズラ Kadsura matsudae Hayata - 琉球の植物データベース（国立科学博物館）\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S5.html\",\"type\":\"primary\"},\"reliabilityNote\":\"分布が南西諸島に限定されることは国立科学博物館の公式データベースおよび神戸大学の研究発表で一致しており、兵庫県への分布の可能性はない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"既収録のサネカズラ（Kadsura japonica）と外見が非常によく似ており、長らく同一種として混同されてきた。\",\"items\":[{\"name\":\"サネカズラ\",\"sciName\":\"Kadsura japonica (L.) Dunal\",\"distinguishingPoints\":\"隣接する雄しべの葯（花粉嚢）が「接する」点で本種（接しない）と区別される。分布域も、サネカズラは本州（関東以西）〜琉球まで広く分布するのに対し、本種は南西諸島に限定される。\"}],\"source\":{\"name\":\"100年前に台湾で報告されるも既知種とされていた植物を日本で再発見 - 神戸大学ニュースサイト\",\"url\":\"https://www.kobe-u.ac.jp/ja/news/article/2017_06_30_01/\",\"type\":\"secondary\"},\"reliabilityNote\":\"神戸大学の研究発表に基づく識別点であり、信頼性は高いと考えられる。\"}},{\"id\":\"aristolochia-shimadae\",\"nameJa\":\"アリマウマノスズクサ\",\"nameJaAlt\":[\"有馬馬の鈴草\"],\"sciName\":\"Aristolochia shimadae Hayata\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"アリマウマノスズクサ\",\"ありまうまのすずくさ\",\"有馬馬の鈴草\",\"Aristolochia shimadae\",\"Aristolochia onoei\",\"ウマノスズクサ\"],\"worldDistribution\":{\"summary\":\"日本固有種。近畿地方中西部（兵庫県六甲山地）に分布の中心があるとされる。学名は文献によって Aristolochia shimadae と旧来の Aristolochia onoei の表記揺れがある。\",\"source\":{\"name\":\"アリマウマノスズクサ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A2%E3%83%AA%E3%83%9E%E3%82%A6%E3%83%9E%E3%83%8E%E3%82%B9%E3%82%BA%E3%82%AF%E3%82%B5\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"兵庫県六甲山地とその周辺地域に分布することが、近畿地方中西部から瀬戸内地方東部を対象とした学術調査（日本植物分類学会誌掲載論文）で報告されている。既収録のオオバウマノスズクサ（大阪東部・南部〜淡路島・小豆島〜兵庫県西播磨〜岡山県南東部に分布）とは分布域が異なり、両種は花の色（本種は濃紫褐色で筒口内部が無紋、オオバウマノスズクサは黄緑色で赤紫〜濃紫の条紋あり）で区別される。和名は果実の形が馬につける鈴に似ており、兵庫県神戸市有馬で最初に発見されたことに由来する。\",\"status\":\"自生（日本固有種）\",\"source\":{\"name\":\"近畿地方中西部から瀬戸内地方東部におけるオオバウマノスズクサとアリマウマノスズクサ（ウマノスズクサ科）の分布について - 日本植物分類学会誌\",\"url\":\"https://www.jstage.jst.go.jp/article/jjapbot/99/2/99_ID0187/_article/-char/ja\",\"type\":\"primary\"},\"reliabilityNote\":\"査読付き学術誌（日本植物分類学会誌）掲載論文を一次資料として使用しており、信頼性は高い。\",\"habitat\":\"林縁の木に絡みついて生育するつる性木本。萼筒がU字形に曲がった特異な形の花を葉腋につけ、萼筒の先端は通常暗紫紅色を呈する。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に分布記録あり（六甲山地とその周辺地域）\",\"detail\":\"和名の由来である「有馬」は兵庫県神戸市北区の地名であり、査読付き学術誌（日本植物分類学会誌）掲載論文でも「兵庫県六甲山地とその周辺地域に分布」と明記されている。六甲山ビジターセンターの植物紹介や、六甲山での観察報告（登山レポート）も複数確認でき、六甲山系で実際に観察できる種であることが裏付けられる。\",\"volume\":null,\"page\":null,\"localities\":[\"六甲山地とその周辺地域（神戸市）\"],\"source\":{\"name\":\"近畿地方中西部から瀬戸内地方東部におけるオオバウマノスズクサとアリマウマノスズクサ（ウマノスズクサ科）の分布について - 日本植物分類学会誌\",\"url\":\"https://www.jstage.jst.go.jp/article/jjapbot/99/2/99_ID0187/_article/-char/ja\",\"type\":\"primary\"},\"reliabilityNote\":\"兵庫県産維管束植物本体（第3巻）での具体的な巻・ページ番号は今回確認できていないが、査読付き学術論文および六甲山ビジターセンター（公的機関）の情報が一致しており、兵庫県内（六甲山系）に分布することの信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"既収録のオオバウマノスズクサと外見が近似し、分布域も一部重なる可能性があるため注意が必要。\",\"items\":[{\"name\":\"オオバウマノスズクサ\",\"sciName\":\"Aristolochia kaempferi Willd.\",\"distinguishingPoints\":\"オオバウマノスズクサは花が黄緑色で赤紫〜濃紫の条紋があるのに対し、本種は花が濃紫褐色で筒口内部が無紋である点で区別される。分布域も、オオバウマノスズクサは大阪〜淡路島〜兵庫県西播磨〜岡山県南東部が中心であるのに対し、本種は兵庫県六甲山地とその周辺地域が中心とされる。\"},{\"name\":\"ウマノスズクサ\",\"sciName\":\"Aristolochia debilis Siebold & Zucc.\",\"distinguishingPoints\":\"ウマノスズクサは葉がより小さく細長い三角状心形で、草質のつるが冬に枯れる点で本種と異なる。\"}],\"source\":{\"name\":\"近畿地方中西部から瀬戸内地方東部におけるオオバウマノスズクサとアリマウマノスズクサ（ウマノスズクサ科）の分布について - 日本植物分類学会誌\",\"url\":\"https://www.jstage.jst.go.jp/article/jjapbot/99/2/99_ID0187/_article/-char/ja\",\"type\":\"primary\"},\"reliabilityNote\":\"査読付き学術誌に基づく識別点であり信頼性は高いが、葉緑体DNA解析による系統境界は形態的な分布境界とは異なることが同論文で示唆されており、両種の関係は今後の研究で更新される可能性がある。\"}},{\"id\":\"aristolochia-contorta\",\"nameJa\":\"マルバウマノスズクサ\",\"nameJaAlt\":[\"丸葉馬の鈴草\"],\"sciName\":\"Aristolochia contorta Bunge\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"マルバウマノスズクサ\",\"まるばうまのすずくさ\",\"丸葉馬の鈴草\",\"Aristolochia contorta\",\"ウマノスズクサ\"],\"worldDistribution\":{\"summary\":\"ロシア沿海州、朝鮮半島、中国、ベトナムなど東アジア大陸部に広く分布し、日本はその分布域の東端・南端にあたる。\",\"source\":{\"name\":\"マルバウマノスズクサ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%9E%E3%83%AB%E3%83%90%E3%82%A6%E3%83%9E%E3%83%8E%E3%82%B9%E3%82%BA%E3%82%AF%E3%82%B5\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"本州の日本海側（山形県〜島根県）を中心に、群馬県・長野県などにも点在する。全国的に希少で環境省レッドリストで絶滅危惧II類（VU）に指定されている。近隣の鳥取県では山地石灰岩地の山頂付近に局限し個体数が激減しているとされる。\",\"status\":\"自生（絶滅危惧II類）\",\"source\":{\"name\":\"マルバウマノスズクサ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%9E%E3%83%AB%E3%83%90%E3%82%A6%E3%83%9E%E3%83%8E%E3%82%B9%E3%82%BA%E3%82%AF%E3%82%B5\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaの記述では「本州の日本海側（山形県から島根県）」という広い範囲を示すのみで、
