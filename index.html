。石門地区に自生1株のみが確認されている状況で、絶滅危惧IA類（国内希少野生動植物種指定）とされる。\",\"status\":\"自生（絶滅危惧IA類、国内希少野生動植物種、小笠原諸島固有）\",\"source\":{\"name\":\"タイヨウフウトウカズラ | 自然環境・生物多様性 | 環境省\",\"url\":\"https://www.env.go.jp/nature/kisho/hogozoushoku/taiyoufutokazura.html\",\"type\":\"primary\"},\"habitat\":\"小笠原諸島の湿性林に生育するつる性植物。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（小笠原諸島母島に限定分布のため）\",\"detail\":\"本種は小笠原諸島母島の石門地区に自生1株のみが確認されている絶滅危惧IA類・国内希少野生動植物種であり、兵庫県を含む他地域への分布は一切報告されていない。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"タイヨウフウトウカズラ | 自然環境・生物多様性 | 環境省\",\"url\":\"https://www.env.go.jp/nature/kisho/hogozoushoku/taiyoufutokazura.html\",\"type\":\"primary\"},\"reliabilityNote\":\"環境省の公式資料（一次資料）に基づく確実な情報であり、分布に関する疑義はない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"既収録のフウトウカズラと同属で外見が近似する可能性がある。\",\"items\":[{\"name\":\"フウトウカズラ\",\"sciName\":\"Piper kadsura (Choisy) Ohwi\",\"distinguishingPoints\":\"フウトウカズラは関東以西の本州〜沖縄まで広く分布する普通種であるのに対し、本種は小笠原諸島母島にごく少数の個体が知られるのみのきわめて希少な固有種である点で大きく異なる。\"}],\"source\":{\"name\":\"タイヨウフウトウカズラ | 自然環境・生物多様性 | 環境省\",\"url\":\"https://www.env.go.jp/nature/kisho/hogozoushoku/taiyoufutokazura.html\",\"type\":\"primary\"},\"reliabilityNote\":\"環境省資料には詳細な形態比較の記載はなく、識別点の記述は一般的な分布情報からの推測を含む。\"}},{\"id\":\"abies-veitchii\",\"nameJa\":\"シラビソ\",\"nameJaAlt\":[\"シラベ\"],\"sciName\":\"Abies veitchii Lindl.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"シラビソ\",\"しらびそ\",\"シラベ\",\"しらべ\",\"Abies veitchii\",\"veitch's fir\",\"モミ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な自然分布は本州・四国のみに限られる。\",\"source\":{\"name\":\"Abies veitchii Lindl. - Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/261656-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan (Honshu, Shikoku).\\\"\"}},\"japanDistribution\":{\"summary\":\"本州中部の亜高山帯（八ヶ岳・南アルプス・北アルプス等、標高1,400〜2,800m）を分布の中心とし、北は山形・宮城県境の蔵王付近から、南は紀伊半島の大峰山系（奈良県、標高約1,900m級の弥山・八経ヶ岳周辺）まで達する。さらに海を越えて四国の石鎚山系・剣山系（標高約1,700m以上）にも隔離分布し、四国産は変種シコクシラベ（Abies veitchii var. reflexa）として区別されることがある。オオシラビソ（Abies mariesii）とは近縁で外見が似るが、積雪への耐性が低いため、太平洋側の少雪山岳でより優勢となる傾向がある。\",\"status\":\"自生（本州中部〜紀伊半島・四国の亜高山帯、日本固有種）\",\"source\":{\"name\":\"シラビソ - Wikipedia日本語版／Trees and Shrubs Online (International Dendrology Society)\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%B7%E3%83%A9%E3%83%93%E3%82%BD\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaおよび国際樹木学会系のデータベース（Trees and Shrubs Online）を組み合わせて確認。紀伊半島（奈良県大峰山系）の自生については、当該山域を扱うWikipedia記事（弥山・八経ヶ岳）でも「トウヒ・シラビソの原生林」との記載があり、複数資料で整合する。\",\"habitat\":\"標高1,400〜2,800mの亜高山帯に生育し、冷涼で湿潤な山地林を好む。コメツガ・トウヒ・オオシラビソ等とともに亜高山帯針葉樹林を構成し、太平洋側の少雪山岳で優勢となる傾向がある。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（近畿地方では奈良県大峰山系が分布南限のため）\",\"detail\":\"本種は近畿地方では奈良県の大峰山系（弥山・八経ヶ岳、標高約1,900m級）に隔離分布することが確認されており、この点は兵庫県と同じ近畿地方内での自生記録がある点で、他の多くの遠隔地固有種とは事情が異なる。ただし、兵庫県最高峰の氷ノ山（標高1,510m）を含む県内の山地は、本種が生育する標高帯（1,400m以上、典型的には1,500m以上）の下限付近かそれ以下にとどまり、亜高山帯針葉樹林そのものが成立しない。西日本における亜高山帯針葉樹林の分布は「四国の石鎚山・剣山周辺と紀伊半島の大峰・大台ヶ原一帯」に限定されるとする資料もあり、兵庫県内の山域（氷ノ山・扇ノ山等）は含まれない。したがって、標高条件から兵庫県内に自生しないと考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"シラビソ - Wikipedia日本語版／亜高山帯針葉樹林 - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E4%BA%9C%E9%AB%98%E5%B1%B1%E5%B8%AF%E9%87%9D%E8%91%89%E6%A8%B9%E6%9E%97\",\"type\":\"secondary\"},\"reliabilityNote\":\"【重要フラグ】本種は近畿地方の奈良県（大峰山系）に自然分布することが確認できた種であり、他の多くの遠隔地固有種とは事情が異なる。ただし奈良県の産地は大峰山系の標高1,900m級の山頂部であり、兵庫県最高峰の氷ノ山（1,510m）とは標高差が大きく、兵庫県内への分布は考えにくい。兵庫県産維管束植物 第2巻の本文でも「モミ」以外のモミ属の記載は確認されておらず（オオシラビソのデータ整備時に確認済み）、記録なしという結論を補強する。より確実な裏付けには、兵庫県版レッドデータブックや県域フロラ資料での明記の確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁のオオシラビソ（Abies mariesii）と外見が非常によく似ており、亜高山帯針葉樹林で混同されやすい。\",\"items\":[{\"name\":\"オオシラビソ\",\"sciName\":\"Abies mariesii Mast.\",\"distinguishingPoints\":\"球果の先端の形状で区別され、オオシラビソは先端が丸みを帯びるのに対し、本種は先端がやや尖る。分布域も一部重なるが、オオシラビソは日本海側の多雪山地に多いのに対し、本種は太平洋側の少雪山岳に多く、紀伊半島・四国まで分布が南下する点で異なる。\"},{\"name\":\"コメツガ\",\"sciName\":\"Tsuga diversifolia (Maxim.) Mast.\",\"distinguishingPoints\":\"同じ亜高山帯針葉樹林に混生することがあるが、ツガ属であり葉がより短く柔らかく、球果も小さいため区別できる。\"}],\"source\":{\"name\":\"シラビソ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%B7%E3%83%A9%E3%83%93%E3%82%BD\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料であり、より詳細な識別点は専門図鑑での確認が望ましい。\"}},{\"id\":\"magnolia-kobus\",\"nameJa\":\"コブシ\",\"nameJaAlt\":[\"拳\"],\"sciName\":\"Magnolia kobus DC.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"コブシ\",\"こぶし\",\"拳\",\"Magnolia kobus\",\"Magnolia praecocissima\",\"モクレン\"],\"worldDistribution\":{\"summary\":\"韓国済州島と日本を自生域とする。分布コードとして日本の北海道・本州・四国・九州、朝鮮半島北部が記録されている。北米東部にも記録があるが観賞用に植栽・逸出したものであり自然分布ではない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia kobus DC.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:332100-2\",\"type\":\"primary\",\"note\":\"taxonRemarksに\\\"Korea (Jejudo), Japan\\\"と記載。\"}},\"japanDistribution\":{\"summary\":\"北海道、本州（東海地方を除く）、九州（一部）、韓国済州島の温帯から暖帯上部に分布し、丘陵帯から山地帯のやや湿った場所に生育する。北海道～日本海側の個体群は葉がやや大型でキタコブシ（変種）とされることがあるが、両者の境界は葉形態的に北緯36度付近とされ、分類学的に区別しないことも多い。\",\"status\":\"自生\",\"source\":{\"name\":\"コブシ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/コブシ\",\"type\":\"secondary\"},\"habitat\":\"丘陵帯～山地帯のやや湿った場所、河畔林などに生育する落葉高木。早春、葉に先立って白い花を咲かせる。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県北部（但馬地方）に自生記録あり\",\"detail\":\"兵庫県立人と自然の博物館のGBIF標本データで、コブシの異名Magnolia praecocissimaの標本が124件確認され、うち豊岡市日高町長砂（2014・2016年）等の但馬地方の記録が含まれる。地域自然情報サイト「但馬情報特急」も、豊岡盆地周辺の円山川支流沿い（出石町長砂、日高町野々庄～西芝、神鍋）の河畔林に幹周り3m近い老木級のコブシが自生しており、「街路樹由来ではなく自生の可能性が高い」と評価している。一方、高橋晃(2011)「兵庫県三田市の植物」の目録にはコブシの記載がなく（三田市内の標本は公園由来とみられる）、県中南部では植栽由来の記録が中心と考えられる。\",\"volume\":null,\"page\":null,\"localities\":[\"豊岡市日高町長砂\",\"豊岡市出石町長砂\",\"豊岡市日高町野々庄～西芝、神鍋（但馬地方の河畔林）\"],\"source\":{\"name\":\"但馬情報特急「コブシ」／GBIF兵庫県立人と自然の博物館植物標本データ\",\"url\":\"https://www.tajima.or.jp/nature/plant/119139/\",\"type\":\"primary\"},\"reliabilityNote\":\"兵庫県産維管束植物本体での確認はできていない。三田市紀要に記載がない一方、但馬地方ではGBIF標本と地域資料が一致して自生を示唆しており、兵庫県内では北部（但馬）を中心に自生し、県中南部では植栽由来の個体が多い可能性がある。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のタムシバ・キタコブシ・シデコブシ・ホオノキと混同されやすい。\",\"items\":[{\"name\":\"タムシバ\",\"sciName\":\"Magnolia salicifolia (Siebold et Zucc.) Maxim.\",\"distinguishingPoints\":\"タムシバは葉のない状態で開花し、花のすぐ下に苞葉がつかない点でコブシ（葉の展開と同時に開花し花のすぐ下に小さな葉が1枚つく）と区別される。\"},{\"name\":\"ホオノキ\",\"sciName\":\"Magnolia obovata Thunb.\",\"distinguishingPoints\":\"ホオノキは葉が20〜40cmと著しく大型で、花も直径15cm前後と大きく容易に区別できる。\"},{\"name\":\"シデコブシ\",\"sciName\":\"Magnolia stellata (Siebold et Zucc.) Maxim.\",\"distinguishingPoints\":\"シデコブシは花被片が12〜30枚以上と細長く多数あるのに対し、コブシは花被片6枚前後で明確に区別される。\"}],\"source\":{\"name\":\"コブシ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/コブシ\",\"type\":\"secondary\"},\"reliabilityNote\":\"一般的な図鑑的識別点。\"}},{\"id\":\"magnolia-kobus-var-borealis\",\"nameJa\":\"キタコブシ\",\"nameJaAlt\":[\"北辛夷\"],\"sciName\":\"Magnolia kobus DC. var. borealis Sarg.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"キタコブシ\",\"きたこぶし\",\"北辛夷\",\"Magnolia kobus var. borealis\",\"コブシ\"],\"worldDistribution\":{\"summary\":\"POWOでは独立した分類群として登録されておらず、コブシ（Magnolia kobus）のヘテロタイプシノニム（異名）として扱われている。分布データは基本種コブシに含まれる。\",\"source\":{\"name\":\"Magnolia kobus var. borealis - Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77282834-1\",\"type\":\"primary\",\"note\":\"\\\"Magnolia kobus var. borealis Sarg. is a synonym of Magnolia kobus DC.\\\"\"}},\"japanDistribution\":{\"summary\":\"北海道と東日本の日本海側に分布する、コブシの寒冷地適応型とされる北方変異。葉がコブシよりやや大きく（長さ約15cm×幅約7cm）、花がやや紅色を帯びる点で区別されることがあるが、形態や性質はコブシとほぼ同じとされる。コブシの分布域の中で北緯36度付近に境界があるとされる。\",\"status\":\"自生（北方系変種、兵庫県は分布域外）\",\"source\":{\"name\":\"キタコブシ - 植木ペディア\",\"url\":\"https://www.uekipedia.jp/落葉広葉樹-カ行/キタコブシ/\",\"type\":\"secondary\"},\"reliabilityNote\":\"分類学的にはコブシの変種内変異として連続的に移行し、明瞭な分布境界を引くことは難しいとされる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（北方系変種で分布域は北海道～東日本日本海側のため）\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データを「borealis」で検索したが、Magnolia kobus var. borealisに該当する標本は確認できなかった。分布境界とされる北緯36度付近は兵庫県（北緯34.5～35.7度付近）よりも北に位置し、地理的にも兵庫県はキタコブシの主分布域（北海道～東日本日本海側）から外れる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"コブシとの形態的差異が連続的であるため、兵庫県内のコブシ個体群の一部が広義のキタコブシ的形質を示す可能性を完全には排除できないが、独立した分布記録としては確認できなかった。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"基本種コブシと形態的に連続し、明瞭な境界がない。\",\"items\":[{\"name\":\"コブシ\",\"sciName\":\"Magnolia kobus DC.\",\"distinguishingPoints\":\"コブシは兵庫県内（但馬地方）に自生記録がある基本種。キタコブシとの違いは葉の大きさ・花色の程度差であり明確な境界はない。\"}],\"source\":{\"name\":\"キタコブシ - 植木ペディア\",\"url\":\"https://www.uekipedia.jp/落葉広葉樹-カ行/キタコブシ/\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的記述に基づく。\"}},{\"id\":\"magnolia-obovata\",\"nameJa\":\"ホオノキ\",\"nameJaAlt\":[\"朴の木\"],\"sciName\":\"Magnolia obovata Thunb.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"ホオノキ\",\"ほおのき\",\"朴の木\",\"ホオ\",\"Magnolia obovata\",\"モクレン\"],\"worldDistribution\":{\"summary\":\"南千島列島から日本にかけて自生し、北海道・本州・四国・九州の日本全域に分布する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia obovata Thunb.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554784-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Kuril Is. to Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"北海道から九州まで日本列島のほぼ全域に分布する山地性の落葉高木で、標高のある冷温帯～山地帯のブナ帯周辺に多く見られる。コブシ属の中では最も分布が広く、標高の高い山地にも生育する。\",\"status\":\"自生\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554784-1\",\"type\":\"primary\"},\"habitat\":\"冷温帯～山地帯のブナ帯周辺に生育する落葉高木。葉は20〜40cmと大型で枝先に輪生状に集まってつき、花も直径15cm前後と大きく乳白色で強い芳香を持つ。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に自生記録あり（三田市ほか複数地域）\",\"detail\":\"高橋晃(2011)「兵庫県三田市の植物」紀要にモクレン科として明記され、採集地は乙原奥・上青野（標本番号 AT 4175; NK 17919）。GBIF兵庫県立人と自然の博物館の標本データでも336件がヒットし、兵庫県産標本が複数地点（標高100～550m）で確認された。\",\"volume\":null,\"page\":null,\"localities\":[\"三田市 乙原奥\",\"三田市 上青野\",\"その他県内複数地点（標高100〜550m、GBIF標本記録）\"],\"source\":{\"name\":\"高橋晃「兵庫県三田市の植物」人と自然 Humans and Nature 22: 101-146 (2011)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"紀要論文とGBIF標本データの両方が一致しており、兵庫県内での自生の信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"葉が著しく大型（20〜40cm）であるため、同属の他種とは容易に区別できる。\",\"items\":[{\"name\":\"コブシ\",\"sciName\":\"Magnolia kobus DC.\",\"distinguishingPoints\":\"コブシは葉が5〜15cm程度とホオノキよりはるかに小型である。\"},{\"name\":\"タムシバ\",\"sciName\":\"Magnolia salicifolia (Siebold et Zucc.) Maxim.\",\"distinguishingPoints\":\"タムシバも葉が細長く小型で、ホオノキの大型の葉とは容易に区別できる。\"}],\"source\":{\"name\":\"高橋晃「兵庫県三田市の植物」人と自然 22: 101-146 (2011)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-salicifolia\",\"nameJa\":\"タムシバ\",\"nameJaAlt\":[\"ニオイコブシ\"],\"sciName\":\"Magnolia salicifolia (Siebold et Zucc.) Maxim.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"タムシバ\",\"たむしば\",\"ニオイコブシ\",\"においこぶし\",\"Magnolia salicifolia\",\"モクレン\"],\"worldDistribution\":{\"summary\":\"日本固有種。中部～南日本（本州・四国・九州・北海道）に自生する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia salicifolia (Siebold et Zucc.) Maxim.\",\"url\":\"https://powo.science.kew.org/taxon/554831-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is C. & S. Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、本州・四国・九州の山地に広く分布し、ブナ帯下部～里山の尾根や乾いた斜面にコブシよりやや標高高めに生育する傾向がある。葉に芳香があることからニオイコブシとも呼ばれる。\",\"status\":\"自生（日本固有種）\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/554831-1\",\"type\":\"primary\"},\"habitat\":\"ブナ帯下部～里山の尾根や乾いた斜面に生育する落葉小高木。葉のない状態で早春に開花する。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に自生記録あり（三田市ほか）\",\"detail\":\"高橋晃(2011)「兵庫県三田市の植物」紀要に明記され、採集地は乙原奥・虚空蔵山・波田（標本番号 AT 4171; AT 1069; TF 6598）。GBIF兵庫県立人と自然の博物館の標本データでも170件がヒットし、兵庫県産標本が多数含まれる（三田市周辺、標高400～600m等）。\",\"volume\":null,\"page\":null,\"localities\":[\"三田市 乙原奥\",\"三田市 虚空蔵山\",\"三田市 波田\",\"その他県内複数地点（標高400〜600m、GBIF標本記録）\"],\"source\":{\"name\":\"高橋晃「兵庫県三田市の植物」人と自然 22: 101-146 (2011)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"紀要論文とGBIF標本データの両方が一致しており、兵庫県内での自生の信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"コブシと外見が近似し、混同されやすい。\",\"items\":[{\"name\":\"コブシ\",\"sciName\":\"Magnolia kobus DC.\",\"distinguishingPoints\":\"コブシは花と同時に葉が展開し花のすぐ下に小さな葉（苞葉）が1枚つくのに対し、タムシバは葉のない状態で開花し苞葉がつかない点で区別される。タムシバは葉裏が粉白色を帯び、揉むと強い芳香がする。\"},{\"name\":\"ホオノキ\",\"sciName\":\"Magnolia obovata Thunb.\",\"distinguishingPoints\":\"ホオノキは葉が20〜40cmと著しく大型で容易に区別できる。\"}],\"source\":{\"name\":\"高橋晃「兵庫県三田市の植物」人と自然 22: 101-146 (2011)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-stellata\",\"nameJa\":\"シデコブシ\",\"nameJaAlt\":[\"ヒメコブシ\"],\"sciName\":\"Magnolia stellata (Siebold et Zucc.) Maxim.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"シデコブシ\",\"しでこぶし\",\"ヒメコブシ\",\"ひめこぶし\",\"Magnolia stellata\",\"コブシ\"],\"worldDistribution\":{\"summary\":\"日本固有種で、POWOは自生域を本州中南部（SC. Honshu）に限定している。九州・四国・北海道や北米（イリノイ、オハイオ）にも記録があるが、これらは栽培・逸出由来でnative rangeには含まれない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia stellata (Siebold et Zucc.) Maxim.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554855-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan (SC. Honshu).\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、愛知県・岐阜県・三重県の一部（養老山地東麓の扇状地、東濃地域の木曽川・庄内川流域、渥美半島等）に分布する「東海丘陵要素」植物の代表種。東海地方以外はごく限られた場所に隔離分布する。湧水のある山裾や谷底の湿地・丘腹斜面の水路沿いといった特殊な湿地環境に生育する。IUCNレッドリストで絶滅危惧(EN)、環境省レッドリストで準絶滅危惧(NT)。\",\"status\":\"自生（東海地方固有・絶滅危惧種）\",\"source\":{\"name\":\"シデコブシ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/シデコブシ\",\"type\":\"secondary\"},\"habitat\":\"東海地方特有の砂礫質の丘陵湧水湿地に生育する落葉低木。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（愛知・岐阜・三重3県の東海地方固有のため）\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データでMagnolia stellataを検索すると2件のみヒットし、いずれも岐阜県（1987年）・三重県（1991年）産で、兵庫県産の標本は皆無であった。高橋(2011)三田市紀要にも記載がない。本種は最終間氷期以降の遺存的な「東海丘陵要素」植物群の一種で、東海地方特有の砂礫質の丘陵湧水湿地に強く依存しており、そのような特殊立地が近畿地方には十分に存在しないため、東海地方外への自然分布拡大がほぼ見られない。兵庫県内で見られる場合はすべて公園・庭園等への植栽由来と考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"分布が東海3県に限定されることはPOWO（本州中南部限定のnative range）とGBIF標本の両方で裏付けられており、兵庫県への自然分布の可能性はきわめて低い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"花被片が多数の細片からなる点で他のコブシ属と大きく異なる。\",\"items\":[{\"name\":\"コブシ\",\"sciName\":\"Magnolia kobus DC.\",\"distinguishingPoints\":\"コブシは花被片が6枚前後であるのに対し、シデコブシは花被片が12〜30枚以上と細長く多数あり星形に開く点で明確に区別される。樹高もシデコブシは低木でコブシより低い。\"}],\"source\":{\"name\":\"シデコブシ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/シデコブシ\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-compressa\",\"nameJa\":\"オガタマノキ\",\"nameJaAlt\":[\"招霊木\"],\"sciName\":\"Magnolia compressa Maxim.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"オガタマノキ\",\"おがたまのき\",\"招霊木\",\"Magnolia compressa\",\"Michelia compressa\",\"モクレン\"],\"worldDistribution\":{\"summary\":\"中国（東部・南雲南省）、日本（南西諸島を含む）、台湾に自生する。韓国には導入（帰化）されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia compressa Maxim.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554664-1\",\"type\":\"primary\",\"note\":\"Native to: China, Japan, Taiwan。シノニムとしてMichelia compressa (Maxim.) Sargなど14件。\"}},\"japanDistribution\":{\"summary\":\"本州（関東中南部＝千葉県以西）の太平洋岸、四国、九州、南西諸島に分布し、丘陵帯～山地帯下部の照葉樹林に生育する常緑高木。花は2〜3月、葉の展開と同時に葉腋に単生し、花被片基部は紫紅色を帯びる。神社の御神木としても各地に植栽される。\",\"status\":\"自生\",\"source\":{\"name\":\"オガタマノキ - 三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/ogatamanoki.htm\",\"type\":\"secondary\"},\"habitat\":\"丘陵帯～山地帯下部の照葉樹林に生育する常緑高木。暖地を好む。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内（淡路島）に分布記録あり\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データでMichelia compressaを検索すると7件がヒットし、うち2件が兵庫県洲本市（淡路島）で2012年3月・4月に採集されたものであった。淡路島は兵庫県内で最も温暖な地域であり、本種の分布南限的な性質と整合する。一方、高橋(2011)三田市紀要（内陸北部）には記載がなく、内陸寒冷地には分布しないことと符合する。\",\"volume\":null,\"page\":null,\"localities\":[\"洲本市（淡路島、2012年3月・4月採集標本）\"],\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"兵庫県産維管束植物本体での確認はできていない。県内では温暖な淡路島に限定される可能性が高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"常緑性で、落葉性のコブシ・タムシバとは区別しやすい。栽培種のカラタネオガタマ、および南西諸島固有のタイワンオガタマノキと混同されうる。\",\"items\":[{\"name\":\"タイワンオガタマノキ\",\"sciName\":\"Magnolia compressa Maxim. var. formosana (Kaneh.) C.F.Chen\",\"distinguishingPoints\":\"タイワンオガタマノキは花被片が全体黄白色で基部が紫色にならない点でオガタマノキ（花被片基部が紫紅色）と区別される。分布も八重山諸島・台湾に限られ、兵庫県には分布しない。\"},{\"name\":\"カラタネオガタマ\",\"sciName\":\"Magnolia figo (Lour.) DC.\",\"distinguishingPoints\":\"中国原産の栽培種で、低木性・花期が5〜6月とオガタマノキ（高木・花期2〜4月）より遅く、バナナ様の強い芳香を持つ点で区別される。\"}],\"source\":{\"name\":\"ざっそう屋「オガタマノキ」\",\"url\":\"https://zassou-ya.com/plants/ogatamanoki/\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-compressa-var-formosana\",\"nameJa\":\"タイワンオガタマノキ\",\"nameJaAlt\":[\"台湾招霊木\"],\"sciName\":\"Magnolia compressa Maxim. var. formosana (Kaneh.) C.F.Chen\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"タイワンオガタマノキ\",\"たいわんおがたまのき\",\"台湾招霊木\",\"Magnolia formosana\",\"Michelia formosana\",\"オガタマノキ\"],\"worldDistribution\":{\"summary\":\"POWOでは独立分類群として扱われず、広義のオガタマノキ（Magnolia compressa）のヘテロタイプシノニムとして統合されている。分布は八重山諸島（西表島・石垣島・竹富島など）と台湾（蘭嶼を含む）に限られる。\",\"source\":{\"name\":\"国立科学博物館「琉球の植物」データベース S33（タイワンオガタマノキ）\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S33.html\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"日本国内では八重山諸島（西表島・石垣島・竹富島など）にのみ分布し、沖縄本島以北の南西諸島や本土には自生しない。花被片は全体が黄白色で、基部が紫色にならない点でオガタマノキと区別される。\",\"status\":\"自生（八重山諸島固有的分布）\",\"source\":{\"name\":\"オガタマノキ - ざっそう屋（識別点の記述あり）\",\"url\":\"https://zassou-ya.com/plants/ogatamanoki/\",\"type\":\"secondary\"},\"habitat\":\"亜熱帯の照葉樹林に生育する常緑高木。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（八重山諸島・台湾に限定分布のため）\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データにMichelia compressa var. formosanaの標本が1件存在するが、採集地は沖縄県八重山郡竹富町（2000年）であり、同館が調査目的で所蔵する琉球産標本にすぎず、兵庫県内での採集ではない。亜熱帯性樹木であり、温帯の兵庫県には気候的にも自生しない。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"分布が八重山諸島・台湾に限定されることは国立科学博物館データベースで裏付けられており、兵庫県への分布の可能性はない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"オガタマノキと外見が非常によく似ており、長らく同一種の変種として扱われてきた。\",\"items\":[{\"name\":\"オガタマノキ\",\"sciName\":\"Magnolia compressa Maxim.\",\"distinguishingPoints\":\"オガタマノキは花被片基部が紫紅色を帯びる点で本種（黄白色で紫にならない）と区別される。分布域も、オガタマノキは本州（関東以西）〜琉球まで広く分布し兵庫県（淡路島）にも自生するが、本種は八重山諸島・台湾に限定される。\"}],\"source\":{\"name\":\"オガタマノキ - ざっそう屋\",\"url\":\"https://zassou-ya.com/plants/ogatamanoki/\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-pseudokobus\",\"nameJa\":\"コブシモドキ\",\"nameJaAlt\":[\"ハイコブシ\"],\"sciName\":\"Magnolia pseudokobus C.Abe et Akas.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"コブシモドキ\",\"こぶしもどき\",\"ハイコブシ\",\"はいこぶし\",\"Magnolia pseudokobus\",\"コブシ\"],\"worldDistribution\":{\"summary\":\"POWOではコブシ（Magnolia kobus）のシノニムとして扱われ、国際的な分類体系上は独立種として認められていない。実体としては徳島県那賀郡相生町（現・那賀町相生）で1948年に発見されたただ1個体に由来するクローンのみが現存する、世界的にきわめて特異な存在。\",\"source\":{\"name\":\"Magnolia pseudokobus - Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:985797-1\",\"type\":\"primary\",\"note\":\"\\\"This name is a synonym of Magnolia kobus.\\\"\"}},\"japanDistribution\":{\"summary\":\"1948年、阿部近一・赤沢時之の両氏により徳島県那賀郡相生町（現・那賀町相生）でただ1個体のみが発見された。四国にはコブシ自体の自生がなく、本種の起源は謎とされる。三倍体で結実せず種子繁殖ができないため、現存する個体はすべて発見株からの挿し木クローンで、相生森林美術館など数か所で保存栽培されているのみ。野生個体は現在確認されておらず、実質的に野生絶滅に近い状態。\",\"status\":\"自生（徳島県相生の一地点のみ、野生絶滅に近い状態）\",\"source\":{\"name\":\"物語を届けるしごと「徳島県相生町の1株だけのコブシモドキ」\",\"url\":\"https://yousakana.jp/kobushi-modoki/\",\"type\":\"secondary\"},\"reliabilityNote\":\"徳島県レッドデータブックでは県カテゴリー「絶滅危惧Ⅰ類」とされるが、環境省ランクの表記は資料により「絶滅危惧II類」「野生絶滅」等の揺れが見られる。\",\"habitat\":\"発見地の徳島県那賀町相生の林間に由来するが、現存個体はすべて保存栽培されたクローン株。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（徳島県那賀町相生の一地点のみに知られる特異な種のため）\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データを「コブシモドキ」「Magnolia pseudokobus」で検索したが該当標本は確認できなかった。本種は徳島県那賀町相生の一地点で発見された単一個体に由来するクローンのみが保存栽培される、世界でも類を見ない特異な分布を持つ種であり、兵庫県との地理的関連性はない。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"分布記録が徳島県の一地点に限定されることは複数資料で一致しており、兵庫県への分布の可能性はない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"コブシとの関係が深いが、分布・繁殖様式が特異な種。\",\"items\":[{\"name\":\"コブシ\",\"sciName\":\"Magnolia kobus DC.\",\"distinguishingPoints\":\"本種はコブシより花が大きく（径12〜15cm、コブシは6〜10cm程度）、開花がやや遅く（4月中旬）、葉が大きい（長さ20cm×幅8〜10cm）。枝が地面を這い接地部から発根する性質（別名ハイコブシ）を持つ点でも異なる。\"}],\"source\":{\"name\":\"物語を届けるしごと「徳島県相生町の1株だけのコブシモドキ」\",\"url\":\"https://yousakana.jp/kobushi-modoki/\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的記述に基づく。\"}},{\"id\":\"magnolia-sieboldii-subsp-japonica\",\"nameJa\":\"オオヤマレンゲ\",\"nameJaAlt\":[\"ミヤマレンゲ\"],\"sciName\":\"Magnolia sieboldii K.Koch subsp. japonica K.Ueda\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"オオヤマレンゲ\",\"おおやまれんげ\",\"ミヤマレンゲ\",\"みやまれんげ\",\"Magnolia sieboldii\",\"モクレン\"],\"worldDistribution\":{\"summary\":\"中部・南日本と中国（安徽省・広西チワン族自治区）を自生域とする。基本種Magnolia sieboldiiは中国・朝鮮半島・極東ロシア・日本を含む東アジアに広く分布する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia sieboldii subsp. japonica\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:886607-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this subspecies is Central & S. Japan, China (Anhui, Guangxi).\\\"\"}},\"japanDistribution\":{\"summary\":\"本州（谷川岳周辺が北東限）以西、四国、九州、屋久島に分布し、標高1000〜2000mの山地の痩せ尾根・岩場・林縁に生育する。奈良県大峰山系（八経ヶ岳・弥山・明星ヶ岳）が最も著名な自生地で1928年に天然記念物指定。森林総合研究所の研究により、本種は夏季の降水量が多い地域を好み、夏に雨が少ない気候を避けるという気候的な生育条件が明らかになっている。\",\"status\":\"自生（近畿地方では奈良県大峰山系が知られる）\",\"source\":{\"name\":\"森林総合研究所「オオヤマレンゲの分布の謎が明らかに」(2021)\",\"url\":\"https://www.ffpri.affrc.go.jp/research/saizensen/2021/20210205-01.html\",\"type\":\"primary\"},\"habitat\":\"標高1000〜2000mの山地の痩せ尾根・岩場・林縁に生育する落葉低木〜小高木。下向きの白色芳香花を初夏に咲かせる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（近畿地方では奈良県大峰山系のみが分布域のため）\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データでオオヤマレンゲを検索した結果、標本は2件のみで、いずれも奈良県（1957年）・広島県廿日市市吉和冠山（2013年）産であり、兵庫県内での採集標本は皆無であった。高橋(2011)三田市紀要にも記載がなく、GBIF日本国内全体集計（239件）でも兵庫県は上位に登場しない。本種は近畿地方では奈良県大峰山系のみに分布することが確認されており、これは兵庫県と同じ近畿地方内での自生記録がある点で他の遠隔地固有種とは事情が異なる。ただし兵庫県内の山地（氷ノ山・扇ノ山等の但馬・西播磨山地）は標高条件こそ該当し得るものの、紀伊半島大峰山系や四国山地のような夏季多雨の太平洋型気候とは異なる内陸性気候にあり、本種の気候的ニッチ（夏季多雨環境を好む）に合致しにくいと考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ／森林総合研究所研究成果\",\"url\":\"https://www.ffpri.affrc.go.jp/research/saizensen/2021/20210205-01.html\",\"type\":\"primary\"},\"reliabilityNote\":\"【重要フラグ】本種は近畿地方の奈良県（大峰山系）に自然分布することが確認できた種であり、他の多くの遠隔地固有種とは事情が異なる。ただし兵庫県内での自生記録は確認できず、気候的ニッチ（夏季多雨を好む）の違いがその理由として考えられる。より確実な裏付けには兵庫県版レッドデータブックや県域フロラ資料での明記の確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"落葉性で大きな白色芳香花を下向きに咲かせる点で他のコブシ属と大きく異なる。\",\"items\":[{\"name\":\"コブシ\",\"sciName\":\"Magnolia kobus DC.\",\"distinguishingPoints\":\"コブシは葉に先立って上向きの花を咲かせるのに対し、オオヤマレンゲは葉が展開したあと（5〜7月）に下向きの花を咲かせる点で大きく異なる。\"},{\"name\":\"ホオノキ\",\"sciName\":\"Magnolia obovata Thunb.\",\"distinguishingPoints\":\"ホオノキも大きな白色花を咲かせるが上向きに咲き、葉もオオヤマレンゲよりはるかに大型である。\"}],\"source\":{\"name\":\"オオヤマレンゲ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/オオヤマレンゲ\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"monoon-liukiuense\",\"nameJa\":\"クロボウモドキ\",\"nameJaAlt\":[],\"sciName\":\"Monoon liukiuense (Hatus.) B.Xue et R.M.K.Saunders\",\"family\":\"バンレイシ科 Annonaceae\",\"searchTerms\":[\"クロボウモドキ\",\"くろぼうもどき\",\"Monoon liukiuense\",\"Polyalthia liukiuensis\",\"バンレイシ\"],\"worldDistribution\":{\"summary\":\"南部南西諸島と台湾（蘭嶼）に自生する。基礎異名はPolyalthia liukiuensis Hatus.(1979)で、2012年にMonoon属に組み替えられた。\",\"source\":{\"name\":\"Monoon liukiuense - Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77123021-1\",\"type\":\"primary\",\"note\":\"\\\"S. Nansei-shotō, Taiwan (Lan Yü)\\\"\"}},\"japanDistribution\":{\"summary\":\"日本国内では沖縄県八重山郡竹富町の西表島・波照間島の2島のみに分布し、低地の石灰岩地に成立するごく限られた森林内にのみ生育する。波照間島の御嶽林には純林状の群落が存在するが、台風による風害等で生育環境の悪化が報告されている。分布はきわめて局所的で、沖縄本島や奄美諸島には分布しない。\",\"status\":\"自生（西表島・波照間島のみに分布）\",\"source\":{\"name\":\"国立科学博物館「琉球の植物」データベース S34（クロボウモドキ）\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S34.html\",\"type\":\"primary\"},\"habitat\":\"低地の石灰岩地に成立する亜熱帯林。御嶽林等に純林状の群落を形成することがある。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（西表島・波照間島のみの局所分布のため）\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データを「クロボウモドキ」「Monoon liukiuense」「Polyalthia liukiuensis」で検索したがいずれも該当標本は確認できなかった。低地亜熱帯石灰岩林という極めて特異な生育環境に限定された種であり、温帯性気候の兵庫県には全く分布しない。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"分布が西表島・波照間島に限定されることは国立科学博物館データベースで裏付けられており、兵庫県への分布の可能性はない。\"},\"similarSpecies\":{\"hasSimilar\":false,\"note\":\"バンレイシ科は日本では南西諸島南部を中心にごく少数の在来属・種しか分布せず、兵庫県内に自生する近縁種はない。\",\"source\":{\"name\":\"クロボウモドキ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/クロボウモドキ\",\"type\":\"secondary\"}}},{\"id\":\"magnolia-denudata\",\"nameJa\":\"ハクモクレン\",\"nameJaAlt\":[\"白木蓮\"],\"sciName\":\"Magnolia denudata Desr.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"ハクモクレン\",\"はくもくれん\",\"白木蓮\",\"Magnolia denudata\",\"モクレン\"],\"worldDistribution\":{\"summary\":\"中国東南部～南中部が原産地で、日本には自生しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia denudata Desr.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554678-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is E. & S. China.\\\"\"}},\"japanDistribution\":{\"summary\":\"中国東南部～西南部原産。日本を含む温帯域の世界各地で庭木や街路樹として植栽されている。学校の校庭や寺社の境内にもよく植えられ、早春（3月頃）に他の花に先駆けて開花する代表的な花木として、全国の公園・庭園で非常に広く見られる。\",\"status\":\"植栽のみ（自生・野生化の記録なし）\",\"source\":{\"name\":\"ハクモクレン - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/ハクモクレン\",\"type\":\"secondary\"},\"habitat\":\"公園・庭園・学校・寺社境内に植栽される落葉高木。早春に葉に先立って白色大輪の花を咲かせる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外、県内で植栽事例あり）\",\"detail\":\"兵庫県立明石公園の公式サイト「花の自然図鑑」に個別ページがあり、園内「緑の相談所東側」に植栽され、4月中旬～5月中旬が見頃と紹介されている。中国原産で日本への自生・野生化の記録がない明確な栽培・植栽樹であり、兵庫県産維管束植物（自生・野生化した個体のみを記録する目録）には記載がないと考えられるが、公園樹として県内でも広く見られる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県立明石公園「花の自然図鑑：ハクモクレン」\",\"url\":\"https://hyogo-akashipark.jp/zukan/ハクモクレン/\",\"type\":\"primary\"},\"reliabilityNote\":\"兵庫県立公園の公式資料で県内の具体的な植栽事例を確認できており、植栽記録としての信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じく栽培種のシモクレン・ソコベニハクモクレンと花色で区別する。\",\"items\":[{\"name\":\"シモクレン\",\"sciName\":\"Magnolia liliiflora Desr.\",\"distinguishingPoints\":\"シモクレンは花が紫紅色で完全には開かないのに対し、ハクモクレンは白色で花弁が広く開く点で区別される。開花もハクモクレンの方がシモクレンより半月ほど早い。\"},{\"name\":\"ソコベニハクモクレン（サラサモクレン）\",\"sciName\":\"Magnolia x soulangeana Soul.-Bod.\",\"distinguishingPoints\":\"ハクモクレンとシモクレンの交配種で、花色が両種の中間（桃色〜紅紫色）を示す点で区別される。\"}],\"source\":{\"name\":\"ハクモクレン - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/ハクモクレン\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-liliiflora\",\"nameJa\":\"シモクレン\",\"nameJaAlt\":[\"モクレン\",\"紫木蓮\"],\"sciName\":\"Magnolia liliiflora Desr.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"シモクレン\",\"しもくれん\",\"モクレン\",\"もくれん\",\"紫木蓮\",\"Magnolia liliiflora\"],\"worldDistribution\":{\"summary\":\"中国の湖北省・雲南省・湖南省・福建省を中心とする限定的な地域が原産地で、日本には自生しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia liliiflora Desr.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554759-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is China (Hubei, Yunnan, Hunan, Fujian).\\\"\"}},\"japanDistribution\":{\"summary\":\"中国南部（福建省、湖北省、湖南省、雲南省、陝西省、四川省）原産で、標高300〜1,600mの林縁に自生する。日本へは元来薬用植物として中国から持ち込まれ、その後庭木として定着し、現在は庭木や公園樹として世界各地で植栽されている。ハクモクレンと並び、古くから日本の庭園文化に取り入れられてきた代表的な花木の一つ。\",\"status\":\"植栽のみ（自生・野生化の記録なし）\",\"source\":{\"name\":\"モクレン - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/モクレン\",\"type\":\"secondary\"},\"habitat\":\"庭園・公園に植栽される落葉低木〜小高木。紫紅色の花を春に咲かせる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外）\",\"detail\":\"中国原産で日本への自生・野生化の記録がない明確な栽培・植栽樹である。県内の具体的な植栽事例（並木・特定公園での言及）はweb検索では明確には確認できなかったが、全国的にハクモクレンと並んで極めて普及度の高い庭木・公園樹であるため、兵庫県内でも寺社・公園・庭園で広く見られると考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"モクレン - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/モクレン\",\"type\":\"secondary\"},\"reliabilityNote\":\"県内の具体的な植栽事例は確認できておらず、全国的な普及度からの推測にとどまる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"ハクモクレン・ソコベニハクモクレンと花色で区別する。\",\"items\":[{\"name\":\"ハクモクレン\",\"sciName\":\"Magnolia denudata Desr.\",\"distinguishingPoints\":\"ハクモクレンは花が白色で大きく開くのに対し、シモクレンは紫紅色で花弁が完全には開かず「卵が並んだような」形状を保つ点で区別される。樹高もシモクレンの方が低木性（3〜6m）。\"},{\"name\":\"ソコベニハクモクレン（サラサモクレン）\",\"sciName\":\"Magnolia x soulangeana Soul.-Bod.\",\"distinguishingPoints\":\"ハクモクレンとシモクレンの交配種で、花色が両種の中間を示す。\"}],\"source\":{\"name\":\"植木ペディア「モクレン」\",\"url\":\"https://www.uekipedia.jp/落葉広葉樹-マ行/モクレン/\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-x-soulangeana\",\"nameJa\":\"ソコベニハクモクレン\",\"nameJaAlt\":[\"サラサモクレン\"],\"sciName\":\"Magnolia × soulangeana Soul.-Bod.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"ソコベニハクモクレン\",\"そこべにはくもくれん\",\"サラサモクレン\",\"さらさもくれん\",\"Magnolia soulangeana\",\"モクレン\"],\"worldDistribution\":{\"summary\":\"自生種ではなく、ハクモクレン（Magnolia denudata）とシモクレン（Magnolia liliiflora）の交配によって作出された園芸品種。1826年にフランスの育種家ソーランジュ・ボダン（Soulange-Bodin）により作出・発表されたとされる。\",\"source\":{\"name\":\"Magnolia × soulangeana - Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:60468302-2\",\"type\":\"primary\",\"note\":\"hybrid formula: \\\"M. denudata × M. liliiflora\\\"\"}},\"japanDistribution\":{\"summary\":\"ハクモクレンとシモクレンの中間的な性質（桃色の花、両種の中間の樹高）を持つ人気の園芸品種として、多くの園芸品種群が育成され、公園・庭園樹として全国的に植栽されている。\",\"status\":\"植栽のみ（園芸交配種）\",\"source\":{\"name\":\"神戸市立須磨離宮公園「花図鑑」\",\"url\":\"https://www.kobe-park.or.jp/cgi-bin/rikyu/zukan/index.cgi?file=zukan&mode=detail&select=1300788067\",\"type\":\"primary\"},\"habitat\":\"公園・庭園に植栽される落葉小高木。桃色〜紅紫色の花を春に咲かせる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（園芸交配種のため対象外、県内で植栽事例あり）\",\"detail\":\"神戸市立須磨離宮公園の公式「花図鑑」に個別ページがあり、梅園～アジサイ園エリアに植栽されていることが確認できる。同ページでは「シモクレンとハクモクレンの交雑種で、フランスの園芸家が最初に得て以来、多くの園芸品種が生まれた」と明記されている。園芸交配種であり自生・野生化の記録はないが、公園樹として県内でも見られる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"神戸市立須磨離宮公園「花図鑑」\",\"url\":\"https://www.kobe-park.or.jp/cgi-bin/rikyu/zukan/index.cgi?file=zukan&mode=detail&select=1300788067\",\"type\":\"primary\"},\"reliabilityNote\":\"神戸市立公園の公式資料で県内の具体的な植栽事例を確認できており、植栽記録としての信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"両親種であるハクモクレン・シモクレンと花色で区別する。\",\"items\":[{\"name\":\"ハクモクレン\",\"sciName\":\"Magnolia denudata Desr.\",\"distinguishingPoints\":\"ハクモクレンは花が白色であるのに対し、ソコベニハクモクレンは桃色〜紅紫色を呈し、両親種の中間的な特徴を示す。\"},{\"name\":\"シモクレン\",\"sciName\":\"Magnolia liliiflora Desr.\",\"distinguishingPoints\":\"シモクレンは花が濃い紫紅色であるのに対し、ソコベニハクモクレンはより淡い桃色を示すことが多い。\"}],\"source\":{\"name\":\"神戸市立須磨離宮公園「花図鑑」\",\"url\":\"https://www.kobe-park.or.jp/cgi-bin/rikyu/zukan/index.cgi?file=zukan&mode=detail&select=1300788067\",\"type\":\"primary\"},\"reliabilityNote\":\"図鑑的識別点。個体・品種によりばらつきが大きい。\"}},{\"id\":\"magnolia-grandiflora\",\"nameJa\":\"タイサンボク\",\"nameJaAlt\":[\"泰山木\",\"グラント玉蘭\"],\"sciName\":\"Magnolia grandiflora L.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"タイサンボク\",\"たいさんぼく\",\"泰山木\",\"グラント玉蘭\",\"Magnolia grandiflora\",\"モクレン\"],\"worldDistribution\":{\"summary\":\"アメリカ合衆国南東部（アラバマ・フロリダ・ジョージア・ルイジアナ・ミシシッピ・ノースカロライナ・サウスカロライナ・テキサスの各州）が原産地。日本を含む多くの地域には人為的に導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia grandiflora L.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554723-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is SE. U.S.A. to Texas.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本への導入は明治初年。第18代アメリカ大統領ユリシーズ・グラントが1879年に来日した際、夫人が上野公園に記念植樹したことから「グラント玉蘭」の別名も生まれた。現在は東北南部以南、四国、九州、沖縄まで各地の公園・庭園で植栽され、大型の常緑樹として存在感のあるシンボルツリーとして人気がある。\",\"status\":\"植栽のみ（自生・野生化の記録なし）\",\"source\":{\"name\":\"タイサンボク - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/タイサンボク\",\"type\":\"secondary\"},\"habitat\":\"公園・庭園のシンボルツリーとして植栽される常緑高木。革質の大きな光沢のある葉（葉裏に赤褐色の毛）を持ち、初夏に大輪の白花を咲かせる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外、県内で植栽事例あり）\",\"detail\":\"兵庫県立フラワーセンター公式サイトの花カレンダーに個別ページがあり、園内「かおりの森」「ツバキ園」で6月上旬～7月下旬に開花・観賞できると案内されている。アメリカ合衆国南東部原産で日本への自生・野生化の記録がない明確な栽培・植栽樹であるが、県立施設での明確な植栽記録が確認できる。神戸市の代表的街路樹リストには含まれておらず、街路樹としてよりも公園・庭園樹としての利用が中心と考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県立フラワーセンター「花カレンダー：タイサンボク」\",\"url\":\"https://flowercenter.jp/booth_event/4203\",\"type\":\"primary\"},\"reliabilityNote\":\"兵庫県立施設の公式資料で県内の具体的な植栽事例を確認できており、植栽記録としての信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"常緑性で大型の革質葉を持つ点で、日本産の落葉性モクレン科各種とは容易に区別できる。\",\"items\":[{\"name\":\"オガタマノキ\",\"sciName\":\"Magnolia compressa Maxim.\",\"distinguishingPoints\":\"オガタマノキも常緑性だが、タイサンボクより葉が小型で光沢が薄く、花期も2〜3月と早い（タイサンボクは6〜7月）点で区別される。\"}],\"source\":{\"name\":\"タイサンボク - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/タイサンボク\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-figo\",\"nameJa\":\"カラタネオガタマ\",\"nameJaAlt\":[\"トウオガタマ\",\"バナナツリー\"],\"sciName\":\"Magnolia figo (Lour.) DC.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"カラタネオガタマ\",\"からたねおがたま\",\"トウオガタマ\",\"バナナツリー\",\"Magnolia figo\",\"オガタマノキ\"],\"worldDistribution\":{\"summary\":\"現存する自生地は中国東南部。韓国済州島にも自生記録があるが、その個体群はすでに絶滅（extinct）と分類されている。日本には自生しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia figo (Lour.) DC.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554702-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is SE. China, Korea (Jejudo).\\\" 韓国個体群はextinctと記載。\"}},\"japanDistribution\":{\"summary\":\"原産地は中国南部（福建省・広東省）で、日本へは江戸時代中期～明治初期に伝来。当初は暖地の庭園・神社に植栽されたが、近縁のオガタマノキ（日本自生種）より管理しやすく花付きが良いことから、次第に一般家庭の庭木としても広まった。5〜6月に開花し、バナナのような甘い香りを放つ花が特徴で、香りの良い生垣としても利用される。\",\"status\":\"植栽のみ（自生・野生化の記録なし）\",\"source\":{\"name\":\"植木ペディア「カラタネオガタマ」\",\"url\":\"https://www.uekipedia.jp/常緑広葉樹-カ行/カラタネオガタマ/\",\"type\":\"secondary\"},\"habitat\":\"庭園・生垣として植栽される常緑低木〜小高木。バナナ様の芳香を持つ花を初夏に咲かせる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外）\",\"detail\":\"中国原産で日本への自生・野生化の記録がない明確な栽培・植栽樹である。県内の具体的な植栽事例（特定の並木・公園名）はweb検索では確認できなかったが、全国的に庭木・生垣として広く植栽される種であるため、兵庫県内の庭園・寺社・住宅地でも見られると考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"植木ペディア「カラタネオガタマ」\",\"url\":\"https://www.uekipedia.jp/常緑広葉樹-カ行/カラタネオガタマ/\",\"type\":\"secondary\"},\"reliabilityNote\":\"県内の具体的な植栽事例は確認できておらず、全国的な普及度からの推測にとどまる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"日本自生のオガタマノキとの識別が重要。\",\"items\":[{\"name\":\"オガタマノキ\",\"sciName\":\"Magnolia compressa Maxim.\",\"distinguishingPoints\":\"オガタマノキは高木になり花期は2〜4月とやや早く、香りも控えめであるのに対し、カラタネオガタマは低木〜小高木で花期は5〜6月、バナナ様の強い芳香を持つ点で区別される。\"}],\"source\":{\"name\":\"植木ペディア「カラタネオガタマ」\",\"url\":\"https://www.uekipedia.jp/常緑広葉樹-カ行/カラタネオガタマ/\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"liriodendron-tulipifera\",\"nameJa\":\"ユリノキ\",\"nameJaAlt\":[\"チューリップツリー\",\"ハンテンボク\"],\"sciName\":\"Liriodendron tulipifera L.\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"ユリノキ\",\"ゆりのき\",\"チューリップツリー\",\"ハンテンボク\",\"はんてんぼく\",\"Liriodendron tulipifera\"],\"worldDistribution\":{\"summary\":\"カナダ・オンタリオ州南部からアメリカ合衆国東部・中央部（25州）にかけて広く自生する。日本には自生しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Liriodendron tulipifera L.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:30197364-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Ontario to N. Central & E. U.S.A.\\\"\"}},\"japanDistribution\":{\"summary\":\"明治初期に渡来したとされ、東京国立博物館には明治8、9年頃渡来の種子由来の記念木の例が残る。萌芽力旺盛で成長が早く、樹形が美しいことから街路樹・公園樹として全国で植栽され、街路樹としては11万本以上が植えられ、特に関東・東北地方に多いとされる。\",\"status\":\"植栽のみ（自生・野生化の記録なし）\",\"source\":{\"name\":\"ユリノキ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/ユリノキ\",\"type\":\"secondary\"},\"habitat\":\"街路樹・公園樹として植栽される落葉高木。先端が浅く2裂した特異な形の葉（半纏型）を持ち、初夏にチューリップ形の黄緑色の花を咲かせる。しばしば30m近い大木になる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外、県内で街路樹として植栽事例あり）\",\"detail\":\"神戸市公式サイト「神戸市：街路樹に用いられる主な樹木」に、ユリノキが神戸市内の主要な高木街路樹の一つとして明記されており（「真っ直ぐに伸びる樹形が美しく、成長も早いため街路樹にも多く使われている」）、県内主要都市での街路樹としての利用が公式に確認できる。北米原産で日本への自生・野生化の記録がない明確な栽培・植栽樹である。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"神戸市「街路樹に用いられる主な樹木」\",\"url\":\"https://www.city.kobe.lg.jp/a10019/kurashi/machizukuri/flower/gairoju/omona.html\",\"type\":\"primary\"},\"reliabilityNote\":\"神戸市の公式資料で県内の具体的な植栽事例（街路樹）を確認できており、植栽記録としての信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"モクレン科の中でも特異な葉形を持ち、他種との誤認は少ない。\",\"items\":[{\"name\":\"ハクモクレン\",\"sciName\":\"Magnolia denudata Desr.\",\"distinguishingPoints\":\"ハクモクレンは葉が卵形で全縁であるのに対し、ユリノキは葉先が浅く2裂し全体が半纏型・軍配型を示す点で容易に区別できる。\"}],\"source\":{\"name\":\"ユリノキ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/ユリノキ\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"magnolia-officinalis\",\"nameJa\":\"コウボク\",\"nameJaAlt\":[\"厚朴\"],\"sciName\":\"Magnolia officinalis Rehder et E.H.Wilson\",\"family\":\"モクレン科 Magnoliaceae\",\"searchTerms\":[\"コウボク\",\"こうぼく\",\"厚朴\",\"Magnolia officinalis\",\"ホオノキ\"],\"worldDistribution\":{\"summary\":\"中国中北部から中南部・東南部、チベットにかけて分布する中国原産種。日本には自生しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Magnolia officinalis Rehder et E.H.Wilson\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554787-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is China.\\\" 詳細分布：China North-Central, China South-Central, China Southeast, Tibet。\"}},\"japanDistribution\":{\"summary\":\"樹皮を生薬「厚朴（コウボク）」として利用するため薬用植物として重要視され、全国の大学薬学部附属薬用植物園（京都薬用植物園、神戸薬科大学薬用植物園、熊本大学薬学部薬用植物園など）で栽培・展示されている例が多く確認できる。一般の公園樹・街路樹としての植栽はハクモクレンやタイサンボクほど普及しておらず、主に薬用植物園や専門の樹木園での栽培が中心。日本では近縁の日本自生種ホオノキ（Magnolia obovata）の樹皮も同様に「厚朴」として代用され、しばしば混同される。\",\"status\":\"植栽のみ（薬用植物園等での栽培、自生・野生化の記録なし）\",\"source\":{\"name\":\"神戸薬科大学薬用植物園\",\"url\":\"https://www.kobepharma-u.ac.jp/botanical-gardens/gallery/spring/post-22.html\",\"type\":\"secondary\"},\"habitat\":\"薬用植物園・樹木園に栽培される落葉高木。葉が大型（20〜40cm）で枝先に輪生状に集まる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外、県内薬用植物園に近縁種の植栽事例あり）\",\"detail\":\"中国原産で日本への自生・野生化の記録がない明確な栽培植物である。県内では神戸市の神戸薬科大学に薬用植物園があり、近縁種ホオノキの植栽記録が確認できるが、コウボク自体（Magnolia officinalis）の県内植栽事例は明確には確認できなかった。全国の薬用植物園で栽培される種であるため、県内の植物園・薬科系施設等で見られる可能性がある。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"神戸薬科大学薬用植物園\",\"url\":\"https://www.kobepharma-u.ac.jp/botanical-gardens/gallery/spring/post-22.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"コウボク自体の県内植栽事例は確認できておらず、近縁種ホオノキの県内植栽実績と全国的な薬用植物園での栽培状況からの推測にとどまる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"日本自生のホオノキと非常によく似ており、薬用樹皮としても混同される。\",\"items\":[{\"name\":\"ホオノキ\",\"sciName\":\"Magnolia obovata Thunb.\",\"distinguishingPoints\":\"コウボクは葉先がより丸みを帯び、花がやや小さめである点でホオノキと区別されるが、外見は非常に近似する。樹皮（厚朴として利用される部位）の性状で薬学的に区別される。\"}],\"source\":{\"name\":\"神戸薬科大学薬用植物園\",\"url\":\"https://www.kobepharma-u.ac.jp/botanical-gardens/gallery/spring/post-22.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"薬学的な識別点であり、野外での外見的識別には専門的な確認が望ましい。\"}},{\"id\":\"cinnamomum-camphora\",\"nameJa\":\"クスノキ\",\"nameJaAlt\":[\"樟\",\"楠\"],\"sciName\":\"Cinnamomum camphora (L.) J.Presl\",\"family\":\"クスノキ科 Lauraceae\",\"searchTerms\":[\"クスノキ\",\"くすのき\",\"樟\",\"楠\",\"Cinnamomum camphora\",\"camphor tree\"],\"worldDistribution\":{\"summary\":\"原産地は東アジア（韓国、ベトナム、カンボジア、中国、日本）とされ、その後アフリカ・カリブ海・中南米・オセアニア・オーストラリアなど世界中の熱帯～暖温帯に導入・帰化している。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cinnamomum camphora (L.) J.Presl\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:463336-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"関東以南の暖温帯～亜熱帯に分布する照葉樹林構成種だが、古来より社寺境内・街路樹・防風林として広く植栽されてきたため、個々の大木が自生由来か植栽由来かの判別が非常に難しい種として知られる。\",\"status\":\"自生・植栽・逸出が混在（判別困難）\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:463336-1\",\"type\":\"primary\"},\"reliabilityNote\":\"日本国内でのクスノキの自生・植栽区分は文献によって扱いが分かれる複雑な問題であり、断定を避け「混在」として扱う。\",\"habitat\":\"暖温帯の照葉樹林を構成する常緑高木。社寺の御神木・巨木として各地に多い。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に分布記録あり（自生・植栽・逸出が混在）\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データで学名該当38件中16件が兵庫県産（三田市、姫路市広峰山、西宮市など、1981～2008年採集）。ただし高橋晃(2011)「兵庫県三田市の植物」では福島大池産標本が「逸出」（植栽由来の逸出）と明記されており、少なくとも三田市では自生ではなく植栽起源とされる。県内の巨木・社寺のクスノキが真の自生かは資料からは判 ary\":\"汎熱帯・亜熱帯性の非常に広域分布種で、アフリカ・アジア太平洋（日本含む）・南北アメリカ・太平洋諸島など150以上の地域に自生する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cassytha filiformis L.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:463202-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"小笠原諸島、九州南部、南西諸島（屋久島～尖閣諸島）に分布し、近年高知県室戸市でも確認されている（分布拡大例）。日当たりのよい海岸砂浜でグンバイヒルガオ・ハマゴウ等に寄生する全寄生つる植物で、葉を持たず光合成をほとんど行わない。\",\"status\":\"自生（南西諸島中心、局所的に分布拡大例あり）\",\"source\":{\"name\":\"スナヅル - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/スナヅル\",\"type\":\"secondary\"},\"habitat\":\"日当たりのよい海岸砂浜に生育する全寄生つる植物。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（南西諸島・九州南部中心の分布のため）\",\"detail\":\"GBIF兵庫県立人と自然の博物館の標本データで兵庫県内は0件、全国的にも沖縄・台湾の標本のみ。兵庫県は自生域から大きく北に外れている。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"近年高知県室戸市への分布拡大例が報告されているが、瀬戸内海に面する兵庫県への拡大は今のところ確認されていない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"イトスナヅルと混同されうる。\",\"items\":[{\"name\":\"イトスナヅル\",\"sciName\":\"Cassytha pergracilis (Hatus.) Hatus.\",\"distinguishingPoints\":\"スナヅルはイトスナヅルより茎が太く（0.5～1mm程度）、分布域もより広い。\"}],\"source\":{\"name\":\"スナヅル - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/スナヅル\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"cassytha-pergracilis\",\"nameJa\":\"イトスナヅル\",\"nameJaAlt\":[],\"sciName\":\"Cassytha pergracilis (Hatus.) Hatus.\",\"family\":\"クスノキ科 Lauraceae\",\"searchTerms\":[\"イトスナヅル\",\"いとすなづる\",\"Cassytha pergracilis\",\"スナヅル\"],\"worldDistribution\":{\"summary\":\"自生地は南西諸島（Nansei-shoto）のみと極めて限定的。旧くはC. filiformis var. pergracilisとして扱われた経緯がある。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cassytha pergracilis (Hatus.) Hatus.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77221677-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"沖縄諸島の伊是名島・久米島のみで確認されている狭域分布種。日当たりのよい低木林等でオオマツバシバに寄生する。\",\"status\":\"自生（伊是名島・久米島のみ、希少）\",\"source\":{\"name\":\"イトスナヅル - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/イトスナヅル\",\"type\":\"secondary\"},\"habitat\":\"日当たりのよい低木林。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（伊是名島・久米島のみの局所分布のため）\",\"detail\":\"GBIF兵庫県立人と自然の博物館データに神戸市北区山田町淡河で2014年9月採集された標本1件が「Cassytha pergracilis」として登録されているが、同レコードには和名として本来ミミカキグサ科の別種を指す「イトタヌキモ」が付されており、データ入力上の誤りの可能性が疑われる。亜熱帯性の海浜寄生植物が温帯の神戸市内陸部で自然分布するとは考えにくく、本種の確実な自生地（伊是名島・久米島）とは地理的・生態的に大きく異なることから、この記録は誤登録である可能性が高いと判断し、兵庫県内に分布記録なしとして扱う。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"【重要フラグ】GBIF上に神戸市の標本記録が1件存在するが、和名の誤記（イトタヌキモ＝別科の植物）が疑われ、データ入力ミスの可能性が高いと判断した。本種の確実な自生地は伊是名島・久米島のみであり、生態的にも神戸市内陸部での自生は考えにくい。この記録の真偽については、原標本の再検証が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"スナヅルと外見が近似する。\",\"items\":[{\"name\":\"スナヅル\",\"sciName\":\"Cassytha filiformis L.\",\"distinguishingPoints\":\"イトスナヅルはスナヅルより茎が細い（0.3～0.5mm）点で区別される。\"}],\"source\":{\"name\":\"イトスナヅル - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/イトスナヅル\",\"type\":\"secondary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"litsea-coreana\",\"nameJa\":\"カゴノキ\",\"nameJaAlt\":[\"鹿子の木\"],\"sciName\":\"Litsea coreana H.Lév.\",\"family\":\"クスノキ科 Lauraceae\",\"searchTerms\":[\"カゴノキ\",\"かごのき\",\"鹿子の木\",\"Litsea coreana\"],\"worldDistribution\":{\"summary\":\"中国中南部・中国南東部・日本・韓国・台湾・ベトナムに自生する暖温帯～亜熱帯樹木。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Litsea coreana H.Lév.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:465614-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"本州（関東以西太平洋側・山口県）・四国・九州・沖縄の暖温帯照葉樹林域に分布する常緑高木。まだら状に樹皮が剥落する特徴的な樹皮（子鹿の模様に例えられ、名前の由来）を持つ。\",\"status\":\"自生\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:465614-1\",\"type\":\"primary\"},\"habitat\":\"暖温帯照葉樹林域。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に自生記録あり（三田市を含む内陸部でも確認）\",\"detail\":\"GBIF標本データで全国851件、うち県内サンプルも複数（1968～2001年）。高橋(2011)三田市植物目録にも「羽束山」での記録があり、内陸の三田市を含め県内で広く確認されている定着種。\",\"volume\":null,\"page\":null,\"localities\":[\"三田市 羽束山\"],\"source\":{\"name\":\"GBIF 兵庫県立人と自然の博物館 植物標本データ／高橋晃「兵庫県三田市の植物」人と自然 22: 101-146 (2011)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"標本データと紀要論文の両方が一致しており、信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"特徴的な樹皮で他のクスノキ科と容易に区別できる。\",\"items\":[{\"name\":\"タブノキ\",\"sciName\":\"Machilus thunbergii Siebold et Zucc.\",\"distinguishingPoints\":\"カゴノキはまだら状に剥落する樹皮（子鹿模様）が顕著で、平滑な樹皮のタブノキと容易に区別できる。\"}],\"source\":{\"name\":\"高橋晃「兵庫県三田市の植物」人と自然 22: 101-146 (2011)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"図鑑的識別点。\"}},{\"id\":\"litsea-cubeba\",\"nameJa\":\"アオモジ\",\"nameJaAlt\":[],\"sciName\":\"Litsea cubeba (Lour.) Pers.\",\"family\":\"クスノキ科 Lauraceae\",\"searchTerms\":[\"アオモジ\",\"あおもじ\",\"Litsea cubeba\"],\"worldDistribution\":{\"summary\":\"ネパールから南日本・西マレシアまで（Nepal to S. Japan and W. Malesia）と非常に広く、ネパール・東ヒマラヤ・中国南部・台湾・日本（南西諸島含む）・東南アジア島嶼部まで分布する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Litsea cubeba (Lour.) Pers.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:465621-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"主に九州南部・沖縄が中心で、暖地の山野に自生する。近年、人為移入により大阪府から京都市にかけて分布拡大が確認されている。\",\"status\":\"自生（九州南部・沖縄中心）／近畿地方の一部で分布拡大の報告あり\",\"source\":{\"name\":\"日本生態学会大会要旨（アオモジの分布拡大に関する報告）\",\"url\":\"https://www.jstage.jst.go.jp/article/esj/ESJ52/0/ESJ52_0_820/_article/-char/ja\",\"type\":\"secondary\"},\"habitat\":\"暖地の山野。葉はより細い披針形でレモン様の芳香がある。\"},\"hyogoRecord\":{\"recor n/77270253-1\"},\"japanDistribution\":{\"summary\":\"日本には自生せず、基本種ロウバイと同様に中国から渡来した園芸品種。花被内片まで黄色一色で斑紋がない品種として、現代の日本庭園では基本種以上に広く植栽されている。\",\"status\":\"非在来種（栽培のみ、園芸品種）\",\"source\":\"POWO; 各種園芸資料\",\"reliabilityNote\":\"POWOは本タクソンを独立種として扱わず基本種のシノニムとしているが、日本国内の園芸・植栽の現場では基本種と区別された品種名として広く定着しているため、本アプリでは基本種ロウバイとは別ページとして扱う。\",\"habitat\":\"庭園・公園などでの栽培\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に自生記録なし（栽培例あり）\",\"detail\":\"中国由来の非在来品種で、日本国内では自生せず栽培のみされている。兵庫県内では明石公園が公式花図鑑でソシンロウバイを掲載しており（正面入口花壇、1月中旬～2月下旬に開花）、栽培が確認できる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":\"明石公園 公式花図鑑 https://hyogo-akashipark.jp/zukan/ソシンロウバイ/\",\"reliabilityNote\":\"自生種ではなく栽培品としての記録であるため「分布記録なし」として扱う。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"花被内片の模様の有無で基本種ロウバイと区別できる。\",\"items\":[{\"name\":\"ロウバイ\",\"sciName\":\"Chimonanthus praecox\",\"distinguishingPoints\":\"ソシンロウバイは花被内片まで黄色一色で斑紋がないのに対し、基本種ロウバイは花被内片に紫赤色の斑紋がある。\"}],\"source\":\"POWO; 各種園芸資料\",\"reliabilityNote\":\"\"}},{\"id\":\"persea-americana\",\"nameJa\":\"アボカド\",\"nameJaAlt\":[],\"sciName\":\"Persea americana Mill.\",\"family\":\"クスノキ科\",\"searchTerms\":[\"あぼかど\",\"アボカド\",\"Persea americana\"],\"worldDistribution\":{\"summary\":\"中央メキシコからコスタリカにかけての中米原産。\",\"source\":\"POWO: https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:325643-2\"},\"japanDistribution\":{\"summary\":\"日本には自生せず、20世紀に導入された。近年の温暖化を背景に和歌山・愛媛・鹿児島・沖縄など一部地域で商業栽培の試みが進んでいるが、全国的に広く定着した栽培樹ではない。\",\"status\":\"非在来種（栽培のみ、20世紀導入）\",\"source\":\"POWO; 各種農業関連資料\",\"reliabilityNote\":\"\",\"habitat\":\"試験的な果樹園栽培\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内での栽培・自生いずれも確認できず（不明）\",\"detail\":\"兵庫県立フラワーセンター、明石公園、須磨離宮公園、神戸市立森林植物園など主要な公式植物園・公園のウェブサイトを確認したが、アボカドの植栽・展示記録は見当たらなかった。個人ブログで淡路島（洲本市）の住民が和歌山の農家から学んで露地栽培を試みているという記載が見つかったのみで、公的施設での栽培記録は確認できなかった。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":\"兵庫県立フラワーセンター・明石公園・須磨離宮公園・神戸市立森林植物園 公式サイト（該当なし）\",\"reliabilityNote\":\"公的機関・公式資料による兵庫県内での栽培記録は確認できず、個人による試験栽培の言及があるのみのため、信頼性の高い一次資料に基づく記録としては「不明」として扱う。\"},\"similarSpecies\":{\"hasSimilar\":false,\"note\":\"\",\"items\":[],\"source\":\"\",\"reliabilityNote\":\"\"}},{\"id\":\"acorus-calamus\",\"nameJa\":\"ショウブ\",\"nameJaAlt\":[\"アヤメグサ\"],\"sciName\":\"Acorus calamus L.\",\"family\":\"ショウブ科\",\"searchTerms\":[\"しょうぶ\",\"ショウブ\",\"菖蒲\",\"あやめぐさ\",\"アヤメグサ\",\"Acorus calamus\"],\"worldDistribution\":{\"summary\":\"日本語の標準的な文献（三河の植物観察、Wikipedia等）では、ユーラシア大陸から北米大陸にかけて北半球の温帯～暖帯に広く分布するとされ、具体的には日本、朝鮮半島、中国、モンゴル、ロシア極東・シベリア、マレーシア、インドシナ、インド、スリランカ、ヒマラヤ、北アメリカまで分布し、東アジア産は変種 A. calamus var. angustatus とされることがある。一方、POWO（Kew）は本種の自生（native）域を中央アジア（カザフスタン、イルティシュ川流域）のみとし、それ以外（韓国、中国、ヨーロッパ各国、北米各州など）はすべて『導入（introduced）』として扱っており、しかも導入地域リストにも日本は明記されていない。\",\"source\":\"https://ja.wikipedia.org/wiki/ショウブ ; https://mikawanoyasou.org/data/shoubu.htm ; https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:84009-1\"},\"japanDistribution\":{\"summary\":\"北海道から九州まで全国の池沼・水路・湿地などの水辺に群生して生育する。\",\"status\":\"在来種として扱われることが多いが、史前帰化植物（人が薬用・端午の節句の風習等のために古くから東アジア各地に持ち込み広めた可能性）とする見解もある\",\"source\":\"https://mikawanoyasou.org/data/shoubu.htm ; https://ja.wikipedia.org/wiki/ショウブ\",\"reliabilityNote\":\"在来／史前帰化の判断については情報源により見解が分かれる。YList系統の日本語文献・図鑑類は在来種として扱うことが多いが、POWO(Kew)は本種の自生域を中央アジアのみとし、東アジア（日本を含む）の分布はすべて『導入』区分としており、しかも日本を導入地域リストにすら明記していない点で大きく異なる。本種は東アジアでは稔性の低い倍数体として栄養繁殖主体で広がっているとする研究例があり、古代より薬用・儀礼用（端午の節句の菖蒲湯など）に人為的に運ばれ史前帰化した可能性を指摘する見解も存在するため、在来／帰化の判断は保留的に扱うべきである。なお本調査ではYList（ylist.info）へ直接アクセスを試みたが、プロキシ経由でSSL証明書検証エラー（Hostname mismatch）が発生し内容を確認できなかったため、POWO・Wikipedia・GBIF分類情報で代替・照合した。\",\"habitat\":\"池沼、水路、湿地などの止水～緩流域の水辺に群生する抽水植物。根茎は泥中を長く匍匐する。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に分布記録あり\",\"detail\":\"GBIF上で公開されている兵庫県立人と自然の博物館（HYO）標本データセットにおいて、Acorus calamusとして兵庫県内から22件の標本記録が確認できる（採集年1992～2020年）。産地として明石市（明石公園）、篠山市（現・丹波篠山市、栗柄）、旧美方郡（現・美方郡香美町/新温泉町、および豊岡市域）、旧城崎郡日高町大岡山（現・豊岡市）、川辺郡猪名川町、神戸市灘区、神戸市北区山田町（中大谷池）、宝塚市芝辻新田、相生市（Mt. Minou-san山中）などが記録され、県内に広く分布することが確認できる。なお兵庫県版レッドデータブック2020の維管束植物リストにはショウブ科の掲載が たため、POWO・三河の植物観察・GBIF分類情報で代替・照合した。\",\"habitat\":\"渓流沿いの岩上や水しぶきのかかる場所など、流水性の水辺に生育する常緑の抽水～湿生植物。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に分布記録あり\",\"detail\":\"GBIF上の兵庫県立人と自然の博物館（HYO）標本データセットにおいて、属名Acorus・種小名gramineusを含む検索（stateProvince=Hyogo）で計105件がヒットし、そのうち大半（81件）が『Acorus gramineus Sol.』の学名表記で記録されている（GBIF分類体系上はDOUBTFULなマッチとなっているが、標準のセキショウAcorus gramineus Aitonの異表記author citationとみられる）。産地は佐用町（旧佐用郡、船越山）、姫路市（増位山）、西宮市、三田市（下深田）、旧氷上郡（現・丹波市、稲塚）など県内各地に及ぶ。このほか変種ヒメセキショウ（var. pusillus）の記録が別途2件存在する（西宮市武田尾、加西市河内町・普光寺）。兵庫県版レッドデータブック2020の維管束植物リストにはショウブ科の掲載が確認できず、絶滅危惧種等の指定対象にはなっていないとみられる。\",\"volume\":null,\"page\":null,\"localities\":[\"佐用町\",\"姫路市\",\"西宮市\",\"三田市\",\"丹波市（旧氷上郡）\"],\"source\":\"GBIF Occurrence Search（datasetKey=8682e420-f762-11e1-a439-00145eb45e9a, q=Acorus gramineus, stateProvince=Hyogo） https://api.gbif.org/v1/occurrence/search?datasetKey=8682e420-f762-11e1-a439-00145eb45e9a&q=Acorus%20gramineus&stateProvince=Hyogo ; 兵庫県版レッドデータブック2020\",\"reliabilityNote\":\"GBIFの学名マッチングにおいて『Acorus gramineus Sol.』表記がDOUBTFULなtaxonKeyへ分離され、正式なAcorus gramineus Aiton（accepted taxonKey）とは別集計となる分類上のゆらぎが見られた。件数・産地はWebFetchによる複数回のJSONクエリで確認したが、原資料（標本ラベル）との直接照合はしていない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁種ショウブおよび変種ヒメセキショウとの識別が問題となる。\",\"items\":[{\"name\":\"ショウブ\",\"sciName\":\"Acorus calamus L.\",\"distinguishingPoints\":\"ショウブは全体に大型で葉幅0.7～2.5cmと広く中脈が高く目立ち、花期が5～7月と遅く、池沼など止水域に群生する。セキショウは葉幅3～5mm程度と狭く中脈が目立たず、花期が3～5月と早く、渓流沿いの岩上に生育する。\"},{\"name\":\"ヒメセキショウ\",\"sciName\":\"Acorus gramineus var. pusillus (Sieb. et Zucc.) Engl.\",\"distinguishingPoints\":\"ヒメセキショウはセキショウの矮小変種で、葉がより短く（草丈十数cm程度）、硬く光沢のある濃緑色を呈する点で区別される。生育地はセキショウと重なるがより局所的とみられる。\"}],\"source\":\"https://mikawanoyasou.org/data/shoubu.htm ; https://mikawanoyasou.org/data/sekishou.htm ; https://en.wikipedia.org/wiki/Acorus_gramineus\",\"reliabilityNote\":\"\"}},{\"id\":\"acorus-gramineus-var-pusillus\",\"nameJa\":\"ヒメセキショウ\",\"nameJaAlt\":[],\"sciName\":\"Acorus gramineus var. pusillus (Sieb. et Z ilar\":true,\"note\":\"同属のサジオモダカ、トウゴクヘラオモダカ、および兵庫県播磨地方を基準産地とする変種ホソバヘラオモダカとの識別が必要。花茎の分岐数や葉形、分布地域が識別の手がかりとなる。\",\"items\":[{\"name\":\"サジオモダカ\",\"sciName\":\"Alisma plantago-aquatica L. var. orientale Samuels.\",\"distinguishingPoints\":\"サジオモダカは主に北日本(北海道・東北等)の湖沼・ため池に分布し、西日本では稀で栽培逸出とされる例がある。ヘラオモダカ(A. canaliculatum)は全国の水田等に普通に見られ、葉身の変異が大きい。\"},{\"name\":\"トウゴクヘラオモダカ\",\"sciName\":\"Alisma rariflorum Samuelsson\",\"distinguishingPoints\":\"花茎の第一分岐数が2本であることでヘラオモダカ(分岐数がより多い)から区別される。本州の谷戸湿地など限られた産地のみに分布する希少種。\"},{\"name\":\"ホソバヘラオモダカ\",\"sciName\":\"Alisma canaliculatum var. harimense Makino\",\"distinguishingPoints\":\"ヘラオモダカの葉幅が特に細い地方変異型で、兵庫県播磨地方が基準産地。基本種との境界は連続的とされる。\"}],\"source\":\"日本語版Wikipedia「オモダカ科」https://ja.wikipedia.org/wiki/オモダカ科 ; J-STAGE論文抄録(トウゴクヘラオモダカ関連)\",\"reliabilityNote\":\"識別点は複数の二次資料の要約であり、専門的な検索表(例:大橋広好ほか編『改訂新版 日本の野生植物』)による裏付けが望ましい。\"}},{\"id\":\"saji-omodaka-alisma-orientale\",\"nameJa\":\"サジオモダカ\",\"nameJaAlt\":[\"エゾサジオモダカ\"],\"sciName\":\"Alisma plantago-aquatica L. var. orientale Samuels. (= Alisma orientale (Samuels.) Juz.)\",\"family\":\"オモダカ科\",\"searchTerms\":[\"さじおもだか\",\"サジオモダカ\",\"えぞさじおもだか\",\"Alisma orientale\",\"Alisma plantago-aquatica var. orientale\"],\"worldDistribution\":{\"summary\":\"広義のAlisma plantago-aquatica(北半球温帯に広く分布し、ヨーロッパ・北アフリカ・中央アジア・中国・朝鮮半島・日本等を含む)の東アジア型とされる。日本語文献では東アジア～中央アジアに分布するとされる。\",\"source\":\"POWO, Alisma plantago-aquatica, https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:30019518-2 ; 日本語版Wikipedia「サジオモダカ」https://ja.wikipedia.org/wiki/サジオモダカ\"},\"japanDistribution\":{\"summary\":\"主に北海道・東北など北日本の湖沼・ため池に分布する。西日本でも記録があるが、栽培個体の逸出とされる例がある。\",\"status\":\"在来種(一部地域では栽培逸出の可能性あり)\",\"source\":\"日本語版Wikipedia「サジオモダカ」\",\"reliabilityNote\":\"GBIF・POWOなど世界的分類データベースでは、本タキサは広義のAlisma plantago-aquaticaの一部(またはシノニム)として扱われ、東アジア型を独立に区別しない場合が多い。日本国内の伝統的な植物分類(YList等)では変種または独立種として扱われることが一般的である。\",\"habitat\":\"湖沼、ため池等の抽水～湿生環境\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布記録なし\",\"detail\":\"GBIF兵庫県立人と自然の博物館標本デ istribution\":{\"summary\":\"北米原産の観賞用水草(「ジャイアントサジタリア」の名で流通)が逸出したもので、1970年に京都市深泥池で日本国内初めて発見され、その後関東地方各地でも定着が報告されている帰化植物。\",\"status\":\"帰化種(北米原産)\",\"source\":\"日本語版Wikipedia「ナガバオモダカ」https://ja.wikipedia.org/wiki/ナガバオモダカ\",\"reliabilityNote\":\"POWOの「Introduced into」欄には日本が明記されていないが、日本語文献(Wikipedia)には1970年の京都府深泥池での発見以降の定着事例が具体的に記載されており、日本国内での帰化・定着は複数の一次的観察に基づき事実と判断した。学名についても、しばしば使用される「Sagittaria weatherbiana」はGBIF分類体系上Sagittaria gramineaのシノニムとして扱われている。\",\"habitat\":\"池沼、水路等の抽水～浮葉環境\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布記録なし\",\"detail\":\"GBIF全世界データ(country=JP)で学名Sagittaria weatherbianaを検索すると7件が該当したが、その内訳は京都市深泥池(1970年代～1980年代、日本国内初発見地を含む)、東京都(小石川植物園を含み栽培由来の可能性がある)、岡山市であり、兵庫県内からの記録は確認できなかった。兵庫県立人と自然の博物館標本データセットを対象とした検索でも該当0件であった。兵庫県版レッドデータブック2020の外来種関連リスト等での言及も今回は確認できていない。\",\"locality\":null,\"source\":\"GBIF Occurrence API検索結果(2026年8月時点); 日本語版Wikipedia「ナガバオモダカ」\",\"reliabilityNote\":\"観賞用水草として流通しているため、アクアリウムからの逸出により未報告の個体群が兵庫県内に存在する可能性は否定できない。今回の調査で確認できた範囲では兵庫県内での記録は見つからなかった。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"在来のオモダカ属各種と葉形が類似するため、水草として流通する帰化種であることに注意が必要。\",\"items\":[{\"name\":\"オモダカ\",\"sciName\":\"Sagittaria trifolia L.\",\"distinguishingPoints\":\"ナガバオモダカは名の通り葉が細長い線形～披針形であるのに対し、在来のオモダカは矢じり形の葉を形成する点で区別される。\"}],\"source\":\"日本語版Wikipedia「ナガバオモダカ」\",\"reliabilityNote\":\"\"}},{\"id\":\"zostera-marina\",\"nameJa\":\"アマモ\",\"nameJaAlt\":[],\"sciName\":\"Zostera marina L.\",\"family\":\"アマモ科\",\"searchTerms\":[\"あまも\",\"アマモ\",\"Zostera marina\"],\"worldDistribution\":{\"summary\":\"北半球の温帯から亜寒帯にかけての北大西洋・北太平洋沿岸域(北米・ユーラシア大陸沿岸)に広く分布する海産沈水植物。分布南限では夏季高水温期に衰退する個体群も知られる。\",\"source\":\"https://en.wikipedia.org/wiki/Zostera_marina ; https://api.gbif.org/v1/species/match?name=Zostera%20marina\"},\"japanDistribution\":{\"summary\":\"北海道から九州にかけて日本各地の沿岸に分布し、大規模な「アマモ場」を形成する日本で最も代表的な海草。\",\"status\":\"在来種\",\"source\":\"https://ja.wikipedia.org/wiki/アマモ ; GBIF occurrence records (兵庫県立人と自然の博物館)\",\"reliabilityNote\":\"YList未確認(直接アクセス不可)のため は分類学的地位が「doubtful(疑わしい)」とされている。\",\"source\":\"https://api.gbif.org/v1/species/search?q=%E3%83%92%E3%83%A1%E3%82%B9%E3%82%AC%E3%83%A2\"},\"japanDistribution\":{\"summary\":\"千葉県銚子(choshiensisの由来)を模式産地とする自然雑種で、両親種(スガモ・エビアマモ)が共存する太平洋岸の一部岩礁海岸から局所的に知られる。\",\"status\":\"在来種(自然雑種)\",\"source\":\"https://api.gbif.org/v1/species/search?q=%E3%83%92%E3%83%A1%E3%82%B9%E3%82%AC%E3%83%A2\",\"reliabilityNote\":\"YList未確認。分布地点の詳細(千葉県以外の産地の有無等)を示す一次資料に本環境からアクセスできず、種小名(choshiensis=銚子)から模式産地を推定した。\",\"habitat\":\"岩礁潮間帯、両親種であるスガモとエビアマモが同所的に生育する環境。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布記録なし\",\"detail\":\"GBIF occurrence検索(国内全体)でも本種(Phyllospadix choshiensis)の標本記録は確認できず、兵庫県立人と自然の博物館データセットにも該当なし。兵庫県版レッドリスト2020にも掲載なし。極めて局所的な自然雑種であり、かつ両親種自体が兵庫県沿岸(瀬戸内海側)に記録がないため、兵庫県内での分布は考えにくい。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":\"https://api.gbif.org/v1/occurrence/search?scientificName=Phyllospadix%20choshiensis&country=JP ; https://api.gbif.org/v1/occurrence/search?datasetKey=8682e420-f762-11e1-a439-00145eb45e9a&scientificName=Phyllospadix\",\"reliabilityNote\":\"GBIF occurrence検索で該当0件だったことのみを根拠としており、標本の未登録による見かけ上のゼロの可能性もある。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"両親種であるスガモとエビアマモの中間的な形質を示すとされる自然雑種。\",\"items\":[{\"name\":\"スガモ\",\"sciName\":\"Phyllospadix iwatensis Makino\",\"distinguishingPoints\":\"片親。ヒメスガモより葉が広い。\"},{\"name\":\"エビアマモ\",\"sciName\":\"Phyllospadix japonicus Makino\",\"distinguishingPoints\":\"片親。ヒメスガモより葉が細い。\"}],\"source\":\"https://api.gbif.org/v1/species/search?q=%E3%83%92%E3%83%A1%E3%82%B9%E3%82%AC%E3%83%A2\",\"reliabilityNote\":\"詳細な識別形質はYList等の一次資料で確認できていない。\"}},{\"id\":\"ruppia-maritima\",\"nameJa\":\"カワツルモ\",\"nameJaAlt\":[],\"sciName\":\"Ruppia maritima L.\",\"family\":\"カワツルモ科\",\"searchTerms\":[\"かわつるも\",\"カワツルモ\",\"Ruppia maritima\",\"Ruppia rostellata\"],\"worldDistribution\":{\"summary\":\"南極を除く世界各地の沿岸の汽水・塩水域に広く分布する汎存種(コスモポリタン)。分子系統解析では「R. maritima複合体」として複数系統が識別されている。POWO/GBIFでは Ruppia rostellata W.D.J.Koch ex Rchb. を本種のシノニムとして扱う。\",\"source\":\"https://en.wikipedia.org/wiki/Ruppia_maritima ; https://powo.science.kew.org/api/2/search?q=Ruppia+rostellata ; https://api.gbif.org/v1/species/match?name=Ruppia%20rostellata&verbose=true\"},\"japanDistribution\":{\"summary\":\"日本各地の海岸汽水域(河口・干潟の後背湿地など)に点在するが、生育適地の限られる希少な沈水植物。なお和名「リュウノヒゲモ」は本種やRuppia属ではなく、ヒルムシロ科の Stuckenia pectinata (旧 Potamogeton pectinatus) を指す標準和名であり、混同に注意が必要。\",\"status\":\"在来種\",\"source\":\"https://ja.wikipedia.org/wiki/リュウノヒゲモ(Stuckenia pectinataの記事) ; https://api.gbif.org/v1/species/search?q=%E3%83%AA%E3%83%A5%E3%82%A6%E3%83%8E%E3%83%92%E3%82%B2%E3%83%A2\",\"reliabilityNote\":\"「リュウノヒゲモ=Ruppia rostellata」という対応関係は本調査で確認できず、GBIF・日本語版Wikipediaのいずれも「リュウノヒゲモ」をStuckenia pectinata(ヒルムシロ科)に同定していた。ユーザー提示の想定に誤りがある可能性が高いため、別種として扱わずカワツルモの項目内に注記した。\",\"habitat\":\"塩性湿地・汽水域の浅瀬に生育する多年草。沈水性で茎葉は細い。濁った水や低酸素の底質では生育しにくい。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に分布記録あり\",\"detail\":\"兵庫県版レッドリスト2020(維管束植物・被子植物)にAランクで掲載され、環境省カテゴリはNT(準絶滅危惧)。個票によれば県内分布は「東播磨、西播磨、但馬」の3地域で、県内4ヶ所で知られていたがそのほとんどで消失したとされる。GBIF公開の兵庫県立人と自然の博物館標本データ(stateProvince=Hyogoで絞込)では5件確認でき、うち2件は加古川市(東播磨)産(2000年9月9日採集)。ほかに1994・1928年採集の記録もある。\",\"volume\":null,\"page\":null,\"localities\":[\"東播磨地域\",\"西播磨地域\",\"但馬地域\",\"加古川市\"],\"source\":\"https://www.kankyo.pref.hyogo.lg.jp/download_file/view/14712/20725 ; https://www.kankyo.pref.hyogo.lg.jp/download_file/view/14594/21665 ; https://api.gbif.org/v1/occurrence/search?datasetKey=8682e420-f762-11e1-a439-00145eb45e9a&scientificName=Ruppia%20maritima&stateProvince=Hyogo\",\"reliabilityNote\":\"個票の「東播磨・西播磨・但馬」は郡・地域単位の記載で市町村名までは特定できていない(加古川市はGBIF標本データからの補完)。個票には選定理由・類似種の記載なし。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"細い線形の沈水葉を持つ点で、外見上ヒルムシロ科のリュウノヒゲモ(Stuckenia pectinata)と混同されやすいが、科レベルで系統が異なる(カワツルモ科 vs ヒルムシロ科)。同属の自然雑種ヤハズカワツルモとは花序・果実の形態で区別される。\",\"items\":[{\"name\":\"リュウノヒゲモ\",\"sciName\":\"Stuckenia pectinata (L.) Börner\",\"distinguishingPoints\":\"ヒルムシロ科の別属で、同様に細い沈水葉を持つが花序構造が異なる。名称が類似するため混同に注意。\"},{\"name\":\"ヤハズカワツルモ\",\"sciName\":\"Ruppia ×truncatifolia Miki\",\"distinguishingPoints\":\"カワツルモとRuppia cirrhosaの自然雑種とされ、果実の形状(果柄先端が截形)などで区別される。\"}],\"source\":\"https://en.wikipedia.org/wiki/Ruppia_maritima ; https://ja.wikipedia.org/wiki/リュウノヒゲモ\",\"reliabilityNote\":\"リュウノヒゲモとの識別点はヒルムシロ科水生植物との一般的な形態比較に基づくもので、一次資料での厳密確認はできていない。\"}},{\"id\":\"ruppia-x-truncatifolia\",\"nameJa\":\"ヤハズカワツルモ\",\"nameJaAlt\":[],\"sciName\":\"Ruppia ×truncatifolia Miki\",\"family\":\"カワツルモ科\",\"searchTerms\":[\"やはずかわつるも\",\"ヤハズカワツルモ\",\"Ruppia truncatifolia\",\"Ruppia cirrhosa\"],\"worldDistribution\":{\"summary\":\"三木茂(1934)によりカワツルモ(Ruppia maritima)とRuppia cirrhosaの自然雑種として日本から記載された分類群。ただしGBIF Backbone Taxonomy及びPOWOでは現在、独立の雑種としてではなくRuppia cirrhosa (Petagna) Grandeのシノニムとして扱われており、分類学的位置づけに議論がある。広義のRuppia cirrhosaは温帯のヨーロッパ・アジア・アフリカ・北米・西インド諸島・アルゼンチンに分布する。\",\"source\":\"https://api.gbif.org/v1/species/match?name=Ruppia%20truncatifolia&verbose=true ; https://en.wikipedia.org/wiki/Ruppiaceae\"},\"japanDistribution\":{\"summary\":\"北海道(涛沸湖、クッチャロ湖、シブノツナイ湖など汽水湖)、新潟県(加茂湖)、三重県、岩手県など、汽水湖沼から局所的に知られる。GBIF occurrence検索(Ruppia cirrhosaで検索、シノニムのRuppia truncatifoliaを含む)では日本国内16件の記録が北海道・新潟・三重・岩手に限られ、兵庫県での記録は確認できなかった。\",\"status\":\"在来種(自然雑種、または広義のRuppia cirrhosaのシノニム)\",\"source\":\"https://api.gbif.org/v1/occurrence/search?scientificName=Ruppia%20cirrhosa&country=JP\",\"reliabilityNote\":\"YList未確認。「自然雑種」としての分類学的独立性自体が資料により異なり(GBIF/POWOはRuppia cirrhosaの単純なシノニムとして扱う)、YList原典での位置づけを確認できていない。\",\"habitat\":\"汽水湖沼の浅水域に生育する沈水植物。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布記録なし\",\"detail\":\"GBIF occurrence検索(Ruppia truncatifolia及びRuppia cirrhosaの学名で検索)では兵庫県産の記録は確認できなかった。兵庫県立人と自然の博物館標本データセット内にも該当種は見当たらない。兵庫県版レッドリスト2020にも掲載なし。既知の国内産地(北海道・新潟・三重・岩手の汽水湖)のような大規模汽水湖が兵庫県には少ないことが、記録がない一因と考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":\"https://api.gbif.org/v1/occurrence/search?datasetKey=8682e420-f762-11e1-a439-00145eb45e9a&scientificName=Ruppia%20truncatifolia ; https e9a&scientificName=Najas%20guadalupensis&stateProvince=Hyogo\",\"reliabilityNote\":\"帰化種は一般にRDB評価対象に含まれないため、兵庫県内に分布記録がないことが「未定着」を意味するとは限らない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"ホッスモに似た線形葉をもつ沈水性水草だが、葉幅がより広く、原産地・帰化植物である点で区別される。\",\"items\":[{\"name\":\"ホッスモ\",\"sciName\":\"Najas graminea Delile\",\"distinguishingPoints\":\"ホッスモは葉がより細く、葉鞘が耳状にとがる。ヒロハホッスモは葉幅がより広い。\"}],\"source\":\"和名「ヒロハ（広葉）」が示す形質差に基づく一般的整理\",\"reliabilityNote\":\"詳細な識別形質の一次資料での確認は完了できていない。\"}},{\"id\":\"enhalus-acoroides\",\"nameJa\":\"ウミショウブ\",\"nameJaAlt\":[],\"sciName\":\"Enhalus acoroides (L.f.) Royle\",\"family\":\"トチカガミ科\",\"searchTerms\":[\"うみしょうぶ\",\"ウミショウブ\",\"Enhalus acoroides\"],\"worldDistribution\":{\"summary\":\"インド洋から西太平洋にかけての熱帯・亜熱帯域に広く分布する大型海草。アフリカ東岸(ソマリア~モザンビーク)、アラビア半島南西部、インド洋沿岸諸国、東南アジア、オーストラリア北部、ミクロネシアなどに記録がある。トチカガミ科海産属の中で最大型。\",\"source\":\"POWO https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:160634-3\"},\"japanDistribution\":{\"summary\":\"日本では沖縄県八重山諸島の西表島・石垣島とその周辺海域にのみ分布し、本種の分布の北限となっている。国内最大の生育地は西表島。\",\"status\":\"日本産(在来種、南西諸島限定分布)\",\"source\":\"ja.wikipedia.org/wiki/ウミショウブ; POWO (native range に Nansei-shoto を含む)\",\"reliabilityNote\":\"YList(ylist.info)は本セッションからSSL証明書エラーのため直接アクセス不可であったため、Wikipedia・POWO・GBIFでクロスチェックした。\",\"habitat\":\"サンゴ礁背後の潮間帯~潮下帯の砂質海底\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布記録なし\",\"detail\":\"熱帯性の大型海草で分布北限が沖縄県八重山諸島にとどまり、瀬戸内海・日本海に面する兵庫県の水温条件とは大きく乖離する。GBIF上の兵庫県立人と自然の博物館標本データセット(datasetKey: 8682e420-f762-11e1-a439-00145eb45e9a)を検索したところ、Enhalus acoroidesの標本は1件のみでいずれも採集地は沖縄県であり、兵庫県内での採集記録は確認できない。また兵庫県版レッドデータブック2020の維管束植物リスト(トチカガミ科131~144番、全14種)にも本種は掲載されていない。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":\"GBIF occurrence API (datasetKey=8682e420-f762-11e1-a439-00145eb45e9a, stateProvince=Hyogo, count=0); 兵庫県版レッドデータブック2020 https://www.kankyo.pref.hyogo.lg.jp/!drafts/leg_8362\",\"reliabilityNote\":\"地理的分布(南西諸島限定)からも整合的な「記録なし」と判断できる。GBIF検索はWebFetch要約経由のため、厳密な再検証には生JSONの直接確認が望ましい。\"},\"similarSpecies\" ote\":\"一般的な分類形質に基づく記述。\"}},{\"id\":\"halophila-tanabensis\",\"nameJa\":\"タナベウミヒルモ\",\"nameJaAlt\":[],\"sciName\":\"Halophila × tanabensis Ohba & Miyata\",\"family\":\"トチカガミ科\",\"searchTerms\":[\"たなべうみひるも\",\"タナベウミヒルモ\",\"Halophila tanabensis\",\"Halophila x tanabensis\"],\"worldDistribution\":{\"summary\":\"日本固有の自然雑種とされ、世界的にも和歌山県田辺市(基準産地)を中心とするごく限られた地点からのみ知られる。ウミヒルモ(Halophila ovalis)とヒメウミヒルモ(Halophila minor)の自然交雑由来と推定されている。2007年刊行の『Seagrasses in Japan』でOhba & Miyataによりラテン語記載を伴わない名称として発表され、POWOでは「unplaced name」として扱われる(GBIF backboneでもDOUBTFUL)。\",\"source\":\"POWO https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77118271-1 ; GBIF species/match API\"},\"japanDistribution\":{\"summary\":\"基準産地は和歌山県田辺市(紀伊水道沿岸、旧西牟婁郡田辺町)。POWOのnative rangeも「Japan」のみで、国外からの報告はない。ウミヒルモ・ヒメウミヒルモ双方の分布域が重なる地点で稀に生じる自然雑種と考えられており、確認例は極めて少ない。\",\"status\":\"日本固有の自然雑種(希少)\",\"source\":\"POWO; GBIF species/match API(status: DOUBTFUL)\",\"reliabilityNote\":\"分類学的位置づけ自体が未確定(POWO: unplaced name、GBIF: doubtful)であり、雑種起源や分布範囲についての知見は限定的。YList直接アクセス不可のためPOWO・GBIFでクロスチェックした。\",\"habitat\":\"内湾・水道沿岸の砂質海底(推定親種と同様の環境)\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布記録なし\",\"detail\":\"基準産地である和歌山県田辺市(紀伊水道沿岸)以外での確認例が乏しい極めて稀な自然雑種であり、兵庫県からの記録は確認されない。播磨灘を挟んで紀伊水道に近い淡路島南部などは、親種の一つであるウミヒルモが確認されている地域でもあり探索の余地はあるが、現時点で記録はない。兵庫県版レッドデータブック2020のトチカガミ科リストにも掲載されていない。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":\"GBIF occurrence API (q=Halophila tanabensis, 兵庫県関連のヒットなし); 兵庫県版レッドデータブック2020\",\"reliabilityNote\":\"情報が極めて限られる分類群であり、「記録なし」は現時点の既知情報に基づく暫定的な評価である。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"推定される両親種であるウミヒルモ・ヒメウミヒルモとの識別が課題となる。\",\"items\":[{\"name\":\"ウミヒルモ\",\"sciName\":\"Halophila ovalis\",\"distinguishingPoints\":\"タナベウミヒルモはウミヒルモとヒメウミヒルモの中間的な葉サイズ・側脈数を示すとされる。\"},{\"name\":\"ヒメウミヒルモ\",\"sciName\":\"Halophila minor\",\"distinguishingPoints\":\"タナベウミヒルモはヒメウミヒルモよりやや大型で、ウミヒルモより小型という中間的特徴を持つ。\"}],\"source\":\"Ohba & Miyata (2007)『Seagrasses in Japan』の記載概要(POWO経由)\",\"reliabilityNote\":\"原記載文献(Seagrasses in Japan, 2007)への直接アクセスはできておらず、POWO・GBIFの要約情報に基づく。\"}}],\"familyNotes\":[{\"family\":\"ザミア科 Zamiaceae\",\"note\":\"ザミア科は北米・中南米・アフリカ・オセアニアに分布する科であり、日本に自生種はない。ユーザー提供のYList（日本産維管束植物目録）由来データを確認したところ、日本国内で認識されている本科の標準種はすべて生態欄が「栽（栽培）」であり、代表的なものにナガバツノザミア（Ceratozamia mexicana）、アルテンスタインオニソテツ・スナオニソテツ・ヒメオニソテツ（Encephalartos属）、オオバシダソテツ（Stangeria eriopus）、ウスバザミア・ヒロハザミア・ホソバザミア・ナガバザミア（Zamia属各種）がある。いずれも温室・植物園等で観賞用に栽培される例のみで、自生・野生化の記録はない。兵庫県産維管束植物 第2巻にもザミア科・該当属の記載は見当たらない。\",\"source\":{\"name\":\"YList（日本産維管束植物目録）由来データ（ユーザー提供Excelファイル）および Zamiaceae - Wikipedia (English)\",\"url\":\"https://en.wikipedia.org/wiki/Zamiaceae\",\"type\":\"secondary\"},\"reliabilityNote\":\"YListの当該科データはユーザー提供のExcelファイル（YList_裸子植物_語源.xlsx）を直接確認したもので、全9標準種すべてが「栽」ステータスであることを確認済み。ただしYList自体は二次的に整理された目録であり、原資料（各栽培記録の一次文献）までは遡っていない。\",\"searchTerms\":[\"ザミア\",\"ざみあ\",\"Zamiaceae\",\"zamia\"]},{\"family\":\"ナンヨウスギ科 Araucariaceae\",\"note\":\"ナンヨウスギ科は南半球（南米、オーストラリア、ニューギニア、ニューカレドニア、ノーフォーク島、ニュージーランド）に分布する科であり、日本に自生種はない。国内ではナンヨウスギ属（Araucaria）のうち、ナンヨウスギ（A. cunninghamii）やシマナンヨウスギ／ノーフォークマツ（A. heterophylla）などが独特な樹形を持つ観賞用・記念樹として公園・植物園・庭園等に植栽される例が見られる（九州・沖縄など温暖地に多い）が、YList等の分布情報でも本科は「栽（植栽）」または「外（外来・逸出的植栽）」の扱いにとどまり、自立した野生化・帰化集団の記録は確認できなかった。兵庫県産維管束植物 第2巻にも「ナンヨウスギ科」「ナンヨウスギ」「Araucaria」の語は一度も登場せず、これも植栽のみで自生・野生化記録がないことと整合する。\",\"source\":{\"name\":\"Wikipedia日本語版「ナンヨウスギ科」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8A%E3%83%B3%E3%83%A8%E3%82%A6%E3%82%B9%E3%82%AE%E7%A7%91\",\"type\":\"secondary\"},\"reliabilityNote\":\"科レベルの自生範囲および利用状況はWikipedia日本語版（二次資料）に基づく。YListでの科全体のステータス（栽・外のみで自生記録なし）は一般的な理解として記載しており、YListデータベースを直接照会して全種を確認したものではない。兵庫県産維管束植物 第2巻についても「記載がない＝記録なし」という消去法的確認であり、PDFはAIによる要約結果を介している。\",\"searchTerms\":[\"ナンヨウスギ科\",\"なんようすぎか\",\"Araucariaceae\",\"araucariaceae\"]},{\"family\":\"ウェルウィッチア科 Welwitschiaceae\",\"note\":\"単型科（1属1種、Welwitschia mirabilisのみ）で、確実な自生地はナミビア南西部からアンゴラ南西部にかけてのナミブ砂漠沿岸地域に限られる。発芽・育成が極めて難しく成長も非常に遅いため、日本国内では鳥取大学乾燥地研究センターなど、ごく一部の専門施設・植物園の温室で栽培例が知られるのみの特殊な植物であり、一般の庭園・公園樹とはなり得ない。日本国内での野生化・自生の記録はない。兵庫県産維管束植物 第2巻の本文にも「ウェルウィッチア」「Welwitschia」の語は一度も登場しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Welwitschia mirabilis Hook.f.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:383591-1\",\"type\":\"primary\",\"note\":\"\\\"SW. Angola to NW. & W. Central Namibia\\\"; \\\"restricted to the Namib Desert of Namibia and Angola\\\", \\\"usually found within a few hundred kilometres of the coast\\\"\"},\"reliabilityNote\":\"日本国内での栽培状況は鳥取大学乾燥地植物資源バンク室等のウェブサイトを参考にした限定的な確認であり、網羅的な栽培実態調査ではない。兵庫県産維管束植物 第2巻については全文検索により該当語が見当たらないことを確認した（消去法的確認）。\",\"searchTerms\":[\"ウェルウィッチア\",\"うぇるうぃっちあ\",\"Welwitschiaceae\",\"welwitschia\"]},{\"family\":\"グネツム科 Gnetaceae\",\"note\":\"グネツム属（Gnetum）約30〜40種からなる科で、代表種グネモンノキ（Gnetum gnemon）はチベット東南部から西太平洋にかけての熱帯アジア・太平洋島嶼域が原産。種子・若葉が食用（インドネシア料理等）とされる有用植物だが日本は自生域外であり、国内では小石川植物園など一部の植物園の温室で栽培される程度にとどまる、一般には流通・栽培されない特殊な植物である。日本国内での野生化・自生の記録は確認できない。兵庫県産維管束植物 第2巻の本文にも「グネツム」「グネモン」「Gnetum」の語は見当たらない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Gnetum gnemon L.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:383520-1\",\"type\":\"primary\",\"note\":\"\\\"SE. Tibet to W. Pacific\\\"\"},\"reliabilityNote\":\"日本国内の栽培状況は小石川植物園に関する情報等を参考にしており、公式な網羅調査ではない。兵庫県産維管束植物 第2巻については全文検索により該当語が見当たらないことを確認した（消去法的確認）。\",\"searchTerms\":[\"グネツム\",\"ぐねつむ\",\"グネモン\",\"ぐねもん\",\"Gnetaceae\",\"gnetum\"]},{\"family\":\"マオウ科 Ephedraceae\",\"note\":\"マオウ属（Ephedra）約50種からなる科で、ユーラシア（中国から地中海沿岸）、北アフリカ、南北アメリカ大陸の乾燥地に分布する。代表種シナマオウ（Ephedra sinica）はシベリア南部から中国北部・東北部が原産。日本には自生種がなく、生薬「麻黄」の原料植物として東邦大学薬学部付属薬用植物園など一部の薬用植物園・大学植物園で栽培される例が知られるのみで、庭園樹・一般園芸植物として普及してはいない。日本国内での野生化・自生の記録はない。兵庫県産維管束植物 第2巻の本文にも「マオウ」「Ephedra」の語は見当たらない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Ephedra sinica Stapf\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:383460-1\",\"type\":\"primary\",\"note\":\"\\\"S. Siberia to N. & NE. China\\\"\"},\"reliabilityNote\":\"日本国内の栽培状況は東邦大学薬学部付属薬用植物園のウェブサイト等を参考にした限定的な確認であり、網羅的な調査ではない。マオウ属の日本語版Wikipediaにも日本国内での自生・帰化についての記述はなかった。兵庫県産維管束植物 第2巻については全文検索により該当語が見当たらないことを確認した（消去法的確認）。\",\"searchTerms\":[\"マオウ\",\"まおう\",\"麻黄\",\"Ephedraceae\",\"ephedra\"]},{\"family\":\"アンボレラ科 Amborellaceae\",\"note\":\"アンボレラ目唯一の科であり、現生種はアンボレラ（Amborella trichopoda）1種のみからなる。全被子植物の中で最も早く分岐した系統とされ「生きた化石」的な位置づけで知られるが、自生地はニューカレドニア島に限定される。日本国内では鳥取大学乾燥地研究センター等ごく一部の専門施設・研究機関で栽培・研究例があるのみで、一般の植物園・庭園でも見る機会はほとんどなく、自生・野生化の記録はない。兵庫県産維管束植物のいずれの巻にも「アンボレラ」「Amborella」の語は登場しない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Amborella trichopoda Baill.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:2409-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is New Caledonia.\\\"\"},\"reliabilityNote\":\"国内での研究栽培例は科研費データベース（KAKEN）等を参考にした限定的な確認であり、網羅的な栽培実態調査ではない。兵庫県産維管束植物については目録の性質上（野外自生種のカタログ）該当語が見当たらないことを確認した消去法的な確認である。\",\"searchTerms\":[\"アンボレラ\",\"あんぼれら\",\"Amborella\",\"amborellaceae\",\"アンボレラ目\"]},{\"family\":\"カネラ科 Canellaceae\",\"note\":\"カネラ目を構成する2科のうちの1つで、西アフリカ・マダガスカル、カリブ海地域を中心に分布する常緑木本の科（代表属Canella、Cinnamodendron等）。日本には自生種がなく、庭園樹・観賞用としての栽培例もほとんど知られていない、日本の植物相とは縁の薄い科である。兵庫県産維管束植物のいずれの巻にも該当する科・属名は登場しない。\",\"source\":{\"name\":\"Canellaceae — Wikipedia (English)\",\"url\":\"https://en.wikipedia.org/wiki/Canellaceae\",\"type\":\"secondary\",\"note\":\"\\\"Canellaceae... a family of flowering plants native to tropical and subtropical regions of Africa, Madagascar and the New World.\\\"\"},\"reliabilityNote\":\"英語版Wikipediaを二次資料として使用。より詳細な一次資料（POWO科レベルページ等）による裏付けは今後の課題。兵庫県産維管束植物については目録の性質上、該当語が見当たらないことを確認した消去法的な確認である。\",\"searchTerms\":[\"カネラ\",\"かねら\",\"Canellaceae\",\"カネラ目\",\"Canellales\"]},{\"family\":\"シキミモドキ科 Winteraceae\",\"note\":\"カネラ目を構成するもう1つの科で、オーストラリア・ニューギニア・マレシア地域、中南米、マダガスカルにまたがる隔離分布を示す常緑木本の科（代表属Drimys、Tasmannia等）。維管束に道管を欠き仮道管のみで構成される原始的な木部構造を持つことで知られる被子植物の初期分岐群の一つだが、日本には自生種がなく、国内での栽培例もごくわずかな専門植物園に限られるとみられる。兵庫県産維管束植物のいずれの巻にも該当する科・属名は登場しない。\",\"source\":{\"name\":\"Winteraceae — Wikipedia (English)\",\"url\":\"https://en.wikipedia.org/wiki/Winteraceae\",\"type\":\"secondary\",\"note\":\"\\\"Winteraceae... a basal family of flowering plants... distributed in Malesia, eastern Australia and eastern states in Australia, New Guinea, New Caledonia, New Zealand, Madagascar and Central and South America.\\\"\"},\"reliabilityNote\":\"英語版Wikipediaを二次資料として使用。日本国内での栽培状況についての網羅的な確認はできていない。兵庫県産維管束植物については目録の性質上、該当語が見当たらないことを確認した消去法的な確認である。\",\"searchTerms\":[\"シキミモドキ\",\"しきみもどき\",\"ウィンテラ\",\"Winteraceae\",\"カネラ目\",\"Canellales\"]},{\"family\":\"デゲネリア科 Degeneriaceae\",\"note\":\"モクレン目を構成する科の一つで、現生種はデゲネリア（Degeneria vitiensis）1種のみからなる単型科。フィジー諸島（ヴィティレブ島・タヴェウニ島）に固有分布し、日本には自生・栽培例ともにほぼ皆無である。\",\"source\":{\"name\":\"デゲネリア科 - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/デゲネリア科\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaを情報源として使用。フィジー固有の希少な単型科であり、日本国内での栽培記録も確認できなかった。\",\"searchTerms\":[\"デゲネリア科\",\"でげねりあか\",\"Degeneriaceae\",\"デゲネリア\"]},{\"family\":\"ニクズク科 Myristicaceae\",\"note\":\"モクレン目を構成する科の一つで、代表種はナツメグ（肉荳蔲）の原料として知られるニクズク（Myristica fragrans、熱帯原産）。日本には自生せず、国内での野外栽培例もほぼ皆無で、温室・植物園での栽培に限られる。兵庫県内の野外で出会う機会はないと考えられる。\",\"source\":{\"name\":\"ニクズク科 - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/ニクズク科\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaを情報源として使用。熱帯原産で日本国内では温室等での限定的な栽培にとどまり、野外観察の対象とはなりにくい。\",\"searchTerms\":[\"ニクズク科\",\"にくずくか\",\"Myristicaceae\",\"ニクズク\",\"ナツメグ\"]}]}");
// ============ HELPERS ============
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function sourceBlock(src){
  if(!src) return "";
  const tagClass = src.type === "primary" ? "primary" : "secondary";
  const tagLabel = src.type === "primary" ? "一次資料" : "二次資料";
  return `
    <div class="source">
      <span class="tag ${tagClass}">${tagLabel}</span>${esc(src.name)}
      ${src.url ? `<br><a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.url)}</a>` : ""}
      ${src.note ? `<div style="margin-top:6px;">${esc(src.note)}</div>` : ""}
    </div>
  `;
}
function reliabilityBlock(note){
  if(!note) return "";
  return `<div class="reliability-note">⚠️ ${esc(note)}</div>`;
}
// ---- Build a lookup so "similar species" cards can link to an in-app species page when one exists ----
function normSci(s){
  if(!s) return "";
  // take first two whitespace-separated tokens (genus + specific epithet), strip punctuation, lowercase
  const tokens = s.trim().split(/\s+/).slice(0,2).map(t => t.replace(/[^a-zA-Z-]/g, "").toLowerCase());
  return tokens.join(" ");
}
const nameJaIndex = new Map();
const sciIndex = new Map(); // genus+epithet -> array of ids (may be ambiguous across varieties)
PLANT_DATA.species.forEach(s => {
  nameJaIndex.set(s.nameJa, s.id);
  (s.nameJaAlt||[]).forEach(alt => { if(!nameJaIndex.has(alt)) nameJaIndex.set(alt, s.id); });
  const key = normSci(s.sciName);
  if(key){
    if(!sciIndex.has(key)) sciIndex.set(key, []);
    sciIndex.get(key).push(s.id);
  }
});
function findSpeciesIdFor(item){
  if(item.name){
    if(nameJaIndex.has(item.name)) return nameJaIndex.get(item.name);
    // strip a trailing parenthetical alt-name, e.g. "イブキ（ビャクシン）" -> "イブキ"
    const stripped = item.name.replace(/[（(][^）)]*[）)]\s*$/, "").trim();
    if(stripped && nameJaIndex.has(stripped)) return nameJaIndex.get(stripped);
    // split combined labels like "イチイ／キャラボク" and try each candidate (first match wins)
    const candidates = item.name.split(/[／/・、]/).map(c => c.replace(/[（(][^）)]*[）)]\s*$/, "").trim()).filter(Boolean);
    for(const c of candidates){
      if(nameJaIndex.has(c)) return nameJaIndex.get(c);
    }
  }
  if(item.sciName){
    const ids = sciIndex.get(normSci(item.sciName));
    if(ids && ids.length === 1) return ids[0]; // only auto-link when unambiguous
  }
  return null;
}

function simSpeciesBlock(ss){
  if(!ss) return "";
  if(!ss.hasSimilar){
    return `
      <div class="section">
        <h2><span class="ico">🔍</span>類似種との識別点</h2>
        <div class="status-pill no">— 特に紛らわしい類似種なし</div>
        <p class="summary">${esc(ss.note)}</p>
        ${sourceBlock(ss.source)}
        ${reliabilityBlock(ss.reliabilityNote)}
      </div>
    `;
  }
  return `
    <div class="section">
      <h2><span class="ico">🔍</span>類似種との識別点</h2>
      <div class="status-pill info">⚠ 紛らわしい類似種あり（${(ss.items||[]).length}種）</div>
      ${ss.note ? `<p class="summary">${esc(ss.note)}</p>` : ""}
      <div class="similar-list">
        ${(ss.items||[]).map(it => {
          const targetId = findSpeciesIdFor(it);
          return `
            <div class="similar-item${targetId ? " linkable" : ""}" ${targetId ? `data-target-id="${esc(targetId)}" role="button" tabindex="0"` : ""}>
              <div class="similar-name">
                ${esc(it.name)}${it.sciName ? `<span class="similar-sci">${esc(it.sciName)}</span>` : ""}
                ${targetId ? `<span class="similar-chev">›</span>` : `<span class="similar-unavail">このアプリ未収録</span>`}
              </div>
              <div class="similar-points">${esc(it.distinguishingPoints)}</div>
            </div>
          `;
        }).join("")}
      </div>
      ${sourceBlock(ss.source)}
      ${reliabilityBlock(ss.reliabilityNote)}
    </div>
  `;
}
