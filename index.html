Ja\":\"フタリシズカ\",\"nameJaAlt\":[\"二人静\"],\"sciName\":\"Chloranthus serratus (Thunb.) Roem. & Schult.\",\"family\":\"センリョウ科 Chloranthaceae\",\"searchTerms\":[\"フタリシズカ\",\"ふたりしずか\",\"二人静\",\"chloranthus\",\"Chloranthus serratus\",\"futarishizuka\",\"センリョウ科\"],\"worldDistribution\":{\"summary\":\"中国南部（中南部・南東部・海南島）からベトナム、朝鮮半島南部、南千島列島を経て日本の中部・南部にかけて分布する多年草。POWOの分類ではChloranthus japonicus Sieboldはこの種の異名（heterotypic synonym）として扱われている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Chloranthus serratus\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:167822-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"南千島列島、北海道から本州、四国、九州まで広く分布する。低山・丘陵地の林床にヒトリシズカよりもやや標高の低い場所を好んで生育する傾向がある。\",\"status\":\"自生\",\"source\":{\"name\":\"フタリシズカ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%95%E3%82%BF%E3%83%AA%E3%82%B7%E3%82%BA%E3%82%AB\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの分布記述を基本とした。国内の詳細分布（都道府県別の在・不在）についてはさらに一次資料（各地のフロラ調査）による裏付けが望ましいが、兵庫県については三田市の学術フロラ調査で複数地点の記録を確認できた（下記hyogoRecord参照）。\",\"habitat\":\"低山・丘陵地の林床（落葉広葉樹林・竹林周辺などのやや湿った半日陰地）\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"三田市内の複数地点で記録あり\",\"detail\":\"一次資料である『兵庫県産維管束植物』第3巻を直接参照しようとしたが、同PDFはタデ科の途中でテキスト抽出が打ち切られる既知の技術的制約があり、センリョウ科の該当箇所を確認できなかった。代替として、同じ兵庫県立人と自然の博物館が発行する紀要『人と自然 Humans and Nature』第22号に掲載された高橋晃（2011）「兵庫県三田市の植物」を参照したところ、フタリシズカ（Chloranthus serratus）の標本記録が母子大池、青野川渓谷、虚空蔵山、上内神の4地点で確認できた（それぞれ採集者イニシャルと標本番号付き）。フタリシズカは近畿地方の丘陵・里山に広く分布する種であり、三田市以外の兵庫県内各地（六甲山系、播磨、但馬、淡路島など）にも記録がある可能性が高いが、今回はこれ以上の地点情報の裏付けは取れていない。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市 母子大池\",\"三田市 青野川渓谷\",\"三田市 虚空蔵山\",\"三田市 上内神\"],\"source\":{\"name\":\"高橋晃(2011)「兵庫県三田市の植物」『人と自然 Humans and Nature』22: 101-146, 兵庫県立人と自然の博物館\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\",\"note\":\"同館発行の学術紀要に掲載された地域フロラ調査。標本番号付きで採集地点が記載されており、信頼性は高い。\"}},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のヒトリシズカ、キビヒトリシズカと外見が似ており、花序の本数や葉のつき方で識別する。\",\"items\":[{\"name\":\"ヒトリシズカ\",\"sciName\":\"Chloranthus quadrifolius (A.Gray) H.Ohba & S.Akiyama\",\"distinguishingPoints\":\"ヒトリシズカは花序が1本のみで、茎頂に4枚の葉が輪生状に集まってつく点で、花序がふつう2本でやや大きな葉が2〜3対つくフタリシズカと区別できる。\"},{\"name\":\"キビヒトリシズカ\",\"sciName\":\"Chloranthus fortunei (A.Gray) Solms\",\"distinguishingPoints\":\"キビヒトリシズカはふつう花序が1本でヒトリシズカに似た草姿だが、雄しべの葯隔が8〜12mmと長い。フタリシズカとは花序数（1本 vs 2本）や、雌しべを包む雄しべの形態で区別できる。\"}],\"source\":{\"name\":\"フタリシズカ - Wikipedia（日本語版）／キビヒトリシズカ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%95%E3%82%BF%E3%83%AA%E3%82%B7%E3%82%BA%E3%82%AB\",\"type\":\"secondary\"},\"reliabilityNote\":\"識別点は日本語版Wikipediaの各種項目の記載を基にした。花序数は個体差があり例外もあるため、複数個体を観察して判断することが望ましい。\"}},{\"id\":\"chloranthus-fortunei\",\"nameJa\":\"キビヒトリシズカ\",\"nameJaAlt\":[\"チョウセンヒトリシズカ\",\"朝鮮ヒトリシズカ\"],\"sciName\":\"Chloranthus fortunei (A.Gray) Solms\",\"family\":\"センリョウ科 Chloranthaceae\",\"searchTerms\":[\"キビヒトリシズカ\",\"きびひとりしずか\",\"チョウセンヒトリシズカ\",\"ちょうせんひとりしずか\",\"chloranthus\",\"Chloranthus fortunei\",\"kibihitorishizuka\",\"センリョウ科\"],\"worldDistribution\":{\"summary\":\"中国南部・東部（中北部・中南部・南東部・海南島）から朝鮮半島、日本の本州西部・四国・九州、台湾にかけて分布する多年草。ヒトリシズカ（C. quadrifolius）に比べて分布域が南寄りで、より限定的。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Chloranthus fortunei\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:167791-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"日本国内では本州の近畿地方以西、四国、九州に局地的に分布し、ヒトリシズカに比べてまれで分布が限られる。和名は本種が最初に発見された岡山県（吉備国）に由来する。生育環境の破壊や園芸目的の乱獲により各地で減少しており、環境省レッドリストでは絶滅危惧II類（VU）に指定されている。\",\"status\":\"自生\",\"source\":{\"name\":\"キビヒトリシズカ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AD%E3%83%93%E3%83%92%E3%83%88%E3%83%AA%E3%82%B7%E3%82%BA%E3%82%AB\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述に加え、兵庫県が公式に評価した兵庫県版レッドデータブック2020の個票（下記hyogoRecord参照）と照合しており、信頼性は比較的高い。\",\"habitat\":\"丘陵・低山の落葉広葉樹林・照葉樹林下の林床\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県版レッドデータブック2020 Bランク（環境省カテゴリVU相当）\",\"detail\":\"一次資料である『兵庫県産維管束植物』第3巻を直接参照しようとしたが、同PDFはタデ科の途中でテキスト抽出が打ち切られる既知の技術的制約があり、センリョウ科の該当箇所を確認できなかった。代替として兵庫県が公式に公表する『兵庫県版レッドデータブック2020（植物・植物群落）』の種別個票を確認したところ、キビヒトリシズカはBランクに選定されており、県内の分布地として姫路市、洲本市、南あわじ市が記載されていた。特に淡路島南部（洲本市・南あわじ市）では点々と自生地が見つかっている状況とされる。選定理由として、分布の限界地域にあたること、生育環境の破壊、観賞用の採取圧などが挙げられている。\",\"volume\":3,\"page\":null,\"localities\":[\"姫路市\",\"洲本市（淡路島）\",\"南あわじ市（淡路島）\"],\"source\":{\"name\":\"兵庫県「兵庫県版レッドデータブック2020」植物・植物群落 種別個票 キビヒトリシズカ\",\"url\":\"http://www.kankyo.pref.hyogo.lg.jp/download_file/view/13573/21665\",\"type\":\"primary\",\"note\":\"兵庫県が公式に編纂・公表する絶滅危惧種評価資料であり、信頼性は高い。\"}},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"ヒトリシズカと非常によく似ており、雄しべの形態で識別する。フタリシズカとは花序の本数で区別できる。\",\"items\":[{\"name\":\"ヒトリシズカ\",\"sciName\":\"Chloranthus quadrifolius (A.Gray) H.Ohba & S.Akiyama\",\"distinguishingPoints\":\"ヒトリシズカは雄しべの葯隔が3〜5mmと短く中央の葯を欠くことが多いのに対し、キビヒトリシズカは葯隔が8〜12mmと長い。ヒトリシズカは日本全国に広く分布する普通種だが、キビヒトリシズカは近畿地方以西に限られる希少種である点も異なる。\"},{\"name\":\"フタリシズカ\",\"sciName\":\"Chloranthus serratus (Thunb.) Roem. & Schult.\",\"distinguishingPoints\":\"フタリシズカは花序がふつう2本出るのに対し、キビヒトリシズカはヒトリシズカと同様ふつう1本のみ。フタリシズカのほうが草丈・葉ともにやや大きい傾向がある。\"}],\"source\":{\"name\":\"キビヒトリシズカ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AD%E3%83%93%E3%83%92%E3%83%88%E3%83%AA%E3%82%B7%E3%82%BA%E3%82%AB\",\"type\":\"secondary\"},\"reliabilityNote\":\"識別点（葯隔長3〜5mm vs 8〜12mm）は日本語版Wikipediaの記載に基づく。現地での識別には花のルーペ観察が必要な場合がある。\"}},{\"id\":\"sarcandra-glabra\",\"nameJa\":\"センリョウ\",\"nameJaAlt\":[\"千両\"],\"sciName\":\"Sarcandra glabra (Thunb.) Nakai\",\"family\":\"センリョウ科 Chloranthaceae\",\"searchTerms\":[\"センリョウ\",\"せんりょう\",\"千両\",\"sarcandra\",\"Sarcandra glabra\",\"senryo\",\"senryou\",\"正月 縁起物\",\"センリョウ科\"],\"worldDistribution\":{\"summary\":\"熱帯・亜熱帯アジアから日本にかけて非常に広く分布する常緑小低木。インド、スリランカ、バングラデシュ、ミャンマー、タイ、ラオス、カンボジア、ベトナム、マレー半島、スマトラ、ジャワ、小スンダ列島、ボルネオ、ニューギニア、フィリピン、中国南部（中南部・南東部・海南島）、台湾、朝鮮半島、南西諸島を含む日本まで広範囲に自生する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Sarcandra glabra\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:167899-1\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"本州（関東地方南西部、東海地方、紀伊半島）、四国、九州、南西諸島に自生する。常緑広葉樹林の林床に群生し、暖地の半日陰を好む。正月の縁起物（「千両」の名は赤い実を金運に見立てたもの）として全国的に鉢植え・庭木として広く植栽されるため、自生域を超えて栽培・逸出した個体が見られることも多い。\",\"status\":\"自生\",\"source\":{\"name\":\"センリョウ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%BB%E3%83%B3%E3%83%AA%E3%83%A7%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの分布記述を基本とし、兵庫県公式のレッドデータブック個票の記載（下記hyogoRecord参照）とも整合的であることを確認した。\",\"habitat\":\"常緑広葉樹林の林床（暖地の半日陰、腐植質に富む湿った場所）\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県版レッドデータブック2020 Cランク\",\"detail\":\"一次資料である『兵庫県産維管束植物』第3巻を直接参照しようとしたが、同PDFはタデ科の途中でテキスト抽出が打ち切られる既知の技術的制約があり、センリョウ科の該当箇所を確認できなかった。代替として兵庫県が公式に公表する『兵庫県版レッドデータブック2020（植物・植物群落）』の種別個票を確認したところ、センリョウはCランクに選定されており、県内の分布地として神戸市、西宮市、加古川市、三木市、姫路市、赤穂市、たつの市、上郡町、洲本市、南あわじ市が記載されていた。ただし同個票には、庭園などからの逸出個体との区別が難しい場合があるとの注記があり、記録の一部には植栽由来・逸出由来の個体が混じっている可能性が示唆されている。\",\"volume\":3,\"page\":null,\"localities\":[\"神戸市\",\"西宮市\",\"加古川市\",\"三木市\",\"姫路市\",\"赤穂市\",\"たつの市\",\"上郡町\",\"洲本市（淡路島）\",\"南あわじ市（淡路島）\"],\"source\":{\"name\":\"兵庫県「兵庫県版レッドデータブック2020」植物・植物群落 種別個票 センリョウ\",\"url\":\"http://www.kankyo.pref.hyogo.lg.jp/download_file/view/14307/21665\",\"type\":\"primary\",\"note\":\"兵庫県が公式に編纂・公表する評価資料であり信頼性は高いが、自生か逸出かの判別が難しい点が個票内でも言及されている。\"}},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同種の品種であるキミノセンリョウとは果実の色のみで区別される。なお、正月の縁起物として一緒に飾られることが多いマンリョウ（ヤブコウジ科）やカラタチバナなどはセンリョウ科とは全く異なる科に属し、葉の鋸歯や果実のつき方などで容易に区別できるが、これらは本データセットの対象種ではないため詳細は割愛する。\",\"items\":[{\"name\":\"キミノセンリョウ\",\"sciName\":\"Sarcandra glabra f. flava (Makino) T.Mizushima\",\"distinguishingPoints\":\"キミノセンリョウはセンリョウの品種で、果実が赤色ではなく黄色になる点のみが異なり、葉・花・草姿などその他の形態的特徴はセンリョウと同一。\"}],\"source\":{\"name\":\"センリョウ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%BB%E3%83%B3%E3%83%AA%E3%83%A7%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"果実色以外に外部形態の差異がないという記述は複数の植物図鑑サイトで一致しており、信頼性は比較的高い。\"}},{\"id\":\"sarcandra-glabra-f-flava\",\"nameJa\":\"キミノセンリョウ\",\"nameJaAlt\":[\"黄実の千両\"],\"sciName\":\"Sarcandra glabra f. flava (Makino) T.Mizushima\",\"family\":\"センリョウ科 Chloranthaceae\",\"searchTerms\":[\"キミノセンリョウ\",\"きみのせんりょう\",\"黄実の千両\",\"sarcandra\",\"Sarcandra glabra f. flava\",\"kiminosenryo\",\"yellow senryo\",\"センリョウ科\"],\"worldDistribution\":{\"summary\":\"母種であるセンリョウ（Sarcandra glabra）と同じ熱帯・亜熱帯アジア〜日本の広い分布域の中に、まれに出現する黄色い果実をつける自然変異（品種）。POWOはこの品種階級のタクソンを種内で独立に扱っておらず、母種Sarcandra glabraのページに包含されている。日本国内では東海地方〜紀伊半島、四国、九州、沖縄などから黄実型の記録が知られているが、赤実型（基本品種）に比べて出現頻度は低い。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Sarcandra glabra（母種のページ。品種flavaは種内に包含され独立掲載なし）\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:167899-1\",\"type\":\"primary\",\"note\":\"POWOは品種（forma）階級のタクソンを網羅的には扱っておらず、キミノセンリョウの独立ページは確認できなかったため、母種のデータを分布域の参考とした。\"}},\"japanDistribution\":{\"summary\":\"母種センリョウと同様、本州の東海地方〜紀伊半島、四国、九州、沖縄に自生するとされるが、赤実型に比べてはるかに稀な自然の色彩変異であり、局地的にしか見られない。生育環境は母種と同じく山地の常緑広葉樹林の林内。\",\"status\":\"自生\",\"source\":{\"name\":\"キミノセンリョウ - 三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/kiminosenryou.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"植物観察サイト「三河の植物観察」の記載（東海地方・紀伊半島・四国・九州・沖縄に自生、海外では朝鮮・中国・台湾・インド・スリランカなどに分布）を用いた。学術的な分布地図による裏付けは今回確認できていない。\",\"habitat\":\"山地の常緑広葉樹林の林内（母種センリョウと同様の環境）\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内での確認記録なし（未確認であり、絶対的な不在が確証されているわけではない）\",\"detail\":\"母種であるセンリョウ（赤実型）は兵庫県版レッドデータブック2020にCランクとして掲載され、神戸市・西宮市・加古川市・三木市・姫路市・赤穂市・たつの市・上郡町・洲本市・南あわじ市など複数の産地が記録されている。しかし黄色い果実をつける品種キミノセンリョウ（f. flava）については、同レッドデータブックの種別個票一覧、代替一次資料として参照した兵庫県立人と自然の博物館発行の三田市フロラ調査（高橋晃 2011）、その他の一般的なウェブ資料のいずれにおいても、兵庫県内での具体的な記録を見つけることができなかった。一次資料である『兵庫県産維管束植物』第3巻もPDF抽出の技術的制約により直接確認できていない。キミノセンリョウは赤実型の個体群の中にまれに出現する自然変異であるため、赤実型のセンリョウが自生する兵庫県内の各地（特に淡路島南部など）で理論上出現しうるが、今回の調査では兵庫県内での確認記録を見つけられなかった。したがって本項目は「記録が確認できなかった」という位置づけであり、「兵庫県内に存在しないことが確認されている」わけではない点に留意されたい。\",\"volume\":3,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県「兵庫県版レッドデータブック2020」種リスト（センリョウ科関連種の掲載状況確認）\",\"url\":\"https://www.kankyo.pref.hyogo.lg.jp/%21drafts/leg_8362\",\"type\":\"primary\",\"note\":\"県公式のレッドデータブック掲載種一覧を確認したが、キミノセンリョウ（f. flava）としての独立掲載は見当たらなかった。\"}},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"母種センリョウとは果実の色のみで区別される。\",\"items\":[{\"name\":\"センリョウ\",\"sciName\":\"Sarcandra glabra (Thunb.) Nakai\",\"distinguishingPoints\":\"キミノセンリョウは黄色い果実をつける点のみが基本品種であるセンリョウ（赤色の果実）と異なり、葉・花・草姿など他の形態的特徴は同一。\"}],\"source\":{\"name\":\"センリョウ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%BB%E3%83%B3%E3%83%AA%E3%83%A7%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"果実色以外に外部形態の差異がないという記述は複数の植物図鑑サイトで一致しており、信頼性は比較的高い。\"}},{\"id\":\"chloranthus-spicatus\",\"nameJa\":\"チャラン\",\"nameJaAlt\":[\"茶蘭\",\"クロランツス・スピカツス\"],\"sciName\":\"Chloranthus spicatus (Thunb.) Makino\",\"family\":\"センリョウ科 Chloranthaceae\",\"searchTerms\":[\"チャラン\",\"ちゃらん\",\"茶蘭\",\"chloranthus\",\"Chloranthus spicatus\",\"charan\",\"香りの花木\",\"センリョウ科\"],\"worldDistribution\":{\"summary\":\"中国南部（中南部・南東部）原産の常緑小低木。POWOでは中国南部のみが自生域とされ、日本を含む他地域には『導入（Introduced）』分布として扱われている。すなわち日本での分布は自生ではなく、人為的な栽培・移入に由来する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Chloranthus spicatus\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:167824-1\",\"type\":\"primary\",\"note\":\"「Introduced into: ... Japan」として日本が自生域ではなく導入分布域に分類されていることを確認した。\"}},\"japanDistribution\":{\"summary\":\"中国南部原産で、江戸時代に日本へ渡来し、強い芳香を持つ花を観賞する目的や茶の着香（ジャスミン茶に似た花茶）用として古くから栽培されてきた。沖縄など温暖な地域では栽培品が逸出し、人里近くの雑木林で野生化している例が知られているが、本州以北では主に鉢植え・温室・庭植えでの栽培にとどまり、野外での定着・帰化は一般的ではない。\",\"status\":\"帰化（一部地域）／栽培\",\"source\":{\"name\":\"チャラン (植物) - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%81%E3%83%A3%E3%83%A9%E3%83%B3_(%E6%A4%8D%E7%89%A9)\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述（沖縄での逸出・野生化事例を含む）を用いた。逸出・野生化が確認されているのは主に沖縄など亜熱帯地域であり、本州以北での野生化事例については明確な記載がなかった。\",\"habitat\":\"（自生地の中国南部では）常緑樹林の林縁など。日本国内では主に庭園・鉢植えでの栽培環境、沖縄では逸出後の人里近くの雑木林。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"栽培のみで野生化・帰化の記録なし\",\"detail\":\"チャランは中国南部原産で、江戸時代に日本へ渡来し、香りを楽しむ観賞用・茶の着香用として栽培されてきた。POWOでは日本を『導入分布域（Introduced）』として扱っており、自生地とはみなされていない。日本国内では沖縄など温暖な地域で栽培品が逸出し人里近くの雑木林で野生化する例が知られているが、兵庫県内での逸出・野生化の記録は、一次資料『兵庫県産維管束植物』第3巻（PDF抽出の制約により未確認）、兵庫県版レッドデータブック種別個票一覧、その他今回参照したウェブ資料のいずれからも見つからなかった。兵庫県の気候は瀬戸内海式・日本海式のいずれも冬季の低温があり、原産地の中国南部や沖縄のような亜熱帯気候とは異なるため、野外での定着・帰化の可能性は低いと考えられる。したがって兵庫県内では鉢植え・温室等での栽培にとどまり、野生化の記録はないものとして扱う（フサジュンサイ/ハゴロモモ Cabomba carolinianaなど、本データセットの他の帰化・栽培種と同様の扱い）。\",\"volume\":3,\"page\":null,\"locality\":null,\"source\":{\"name\":\"Plants of the World Online (Kew) - Chloranthus spicatus（日本を『導入』として記載）／兵庫県「兵庫県版レッドデータブック2020」種リスト\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:167824-1\",\"type\":\"primary\",\"note\":\"Kewの公式データベースで日本が自生域ではなく導入分布域として扱われていることを確認。兵庫県版レッドデータブックの種リストにもチャランは掲載されていない（野生化した個体群として認識されていないことを示唆）。\"}},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同科同目のヒトリシズカ・フタリシズカ・センリョウとは生活形（多年草 vs 常緑低木）や香りの強さで区別しやすいが、分類上のつながりを知っておくと理解の助けになる。\",\"items\":[{\"name\":\"ヒトリシズカ\",\"sciName\":\"Chloranthus quadrifolius (A.Gray) H.Ohba & S.Akiyama\",\"distinguishingPoints\":\"同じチャラン属だが、ヒトリシズカは多年草の草本で早春に開花し森林の林床に生えるのに対し、チャランは常緑小低木で温暖な地域の庭園などに植栽され、花期も4〜7月と長い。\"},{\"name\":\"フタリシズカ\",\"sciName\":\"Chloranthus serratus (Thunb.) Roem. & Schult.\",\"distinguishingPoints\":\"チャランとは生活形（低木 vs 多年草）や花の香りの強さ（チャランは強い芳香を持つ）で明確に区別できる。\"},{\"name\":\"センリョウ\",\"sciName\":\"Sarcandra glabra (Thunb.) Nakai\",\"distinguishingPoints\":\"センリョウも常緑小低木でチャランと草姿が似るが、属が異なる（Sarcandra vs Chloranthus）。センリョウは短い穂状花序に赤い液果をつけるのに対し、チャランは分枝した円錐状の花序をつけ、果実よりも花の強い芳香で観賞・利用される点が異なる。\"}],\"source\":{\"name\":\"チャラン (植物) - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%81%E3%83%A3%E3%83%A9%E3%83%B3_(%E6%A4%8D%E7%89%A9)\",\"type\":\"secondary\"},\"reliabilityNote\":\"属レベルの分類的つながりはPOWO・日本語版Wikipediaの双方で確認済み。現地での識別は生活形（木本か草本か）を見れば容易であり、誤同定のリスクは低い。\"}},{\"id\":\"aristolochia-debilis\",\"nameJa\":\"ウマノスズクサ\",\"nameJaAlt\":[\"馬の鈴草\"],\"sciName\":\"Aristolochia debilis Siebold & Zucc.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ウマノスズクサ\",\"うまのすずくさ\",\"馬の鈴草\",\"aristolochia\",\"Aristolochia debilis\",\"Dutchman's pipe\",\"Chinese birthwort\",\"ジャコウアゲハ\"],\"worldDistribution\":{\"summary\":\"中国（中北部・中南部・南東部）から日本の中部～南部にかけてが原産地とされる。POWOでは「China to S. Central & S. Japan」と記載。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:92883-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to）を参照\"}},\"japanDistribution\":{\"summary\":\"本州（東北南部以西）、四国、九州、奄美大島などに分布。日当たりの良い河川の土手、畑の周辺、林縁など人里に近い開けた場所に生育するつる性の多年草。\",\"status\":\"自生\",\"source\":{\"name\":\"ウマノスズクサ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A6%E3%83%9E%E3%83%8E%E3%82%B9%E3%82%BA%E3%82%AF%E3%82%B5\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaおよび複数の植物観察サイトで内容が一致しており、広く知られた普通種として信頼性は高い。\",\"habitat\":\"日当たりの良い河川堤防、畑地周辺、林縁\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"県内に広く分布記録あり（播磨・丹波・淡路など）\",\"detail\":\"対象PDF（兵庫県産維管束植物 第3巻）本体は技術的制約により該当ページを直接確認できなかったため、同館（兵庫県立人と自然の博物館）が公開する植物標本データ（GBIF経由）を代替の一次資料として用いた。同館所蔵標本には1935～2002年にかけて赤穂市高雄、姫路市野里、洲本市上田原（淡路島）、氷上郡氷上町（現・丹波市）、加古川市北在家（鶴林寺付近）など播磨・丹波・淡路の広範囲からの採集記録があり、県内に安定して分布することが確認できる。ジャコウアゲハの食草としても兵庫県内の里山で保全活動の対象となっている。\",\"volume\":3,\"page\":null,\"localities\":[\"赤穂市高雄\",\"姫路市野里\",\"洲本市上田原（淡路島）\",\"旧氷上郡氷上町（現・丹波市）\",\"加古川市北在家（鶴林寺付近）\"],\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF: Herbarium Specimens of Museum of Nature and Human Activities, Hyogo）\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"原典の兵庫県産維管束植物（第3巻PDF）はWebFetchでの直接検証がタデ科付近で毎回打ち切られるため参照できず、同一機関（ひとはく）が公開する標本データベースを代替一次資料とした。標本記録は具体的な地名・採集年を伴い信頼性は高いが、原著PDFの巻・ページ番号そのものは未確認。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のオオバウマノスズクサと混同されやすい。花の基本構造（パイプ状に湾曲した花被）は共通するが、葉の大きさ・形、生育環境、分布域が異なる。\",\"items\":[{\"name\":\"オオバウマノスズクサ\",\"sciName\":\"Aristolochia kaempferi Willd.\",\"distinguishingPoints\":\"オオバウマノスズクサは名前の通り葉がより大きく丸みを帯びた心形で、半木質のつるになる。ウマノスズクサは葉がやや細長い三角状心形で、草質のつるが冬に枯れる点が異なる。オオバウマノスズクサは早春（5月頃）に他のつる植物より先に展葉するため、その時期は識別しやすい。分布も、オオバウマノスズクサは淡路島・西播磨など沿岸～瀬戸内側に偏る傾向がある。\"}],\"source\":{\"name\":\"オオバウマノスズクサ - mirusiru.jp / zassou-ya.com\",\"url\":\"https://mirusiru.jp/nature/flower/oobaumanosuzukusa\",\"type\":\"secondary\"},\"reliabilityNote\":\"野草観察サイトの記述に基づく一般的な識別点。学術的な形態比較（萼筒形状の詳細など）は別途専門文献での確認が望ましい。\"}},{\"id\":\"aristolochia-kaempferi\",\"nameJa\":\"オオバウマノスズクサ\",\"nameJaAlt\":[\"大葉馬の鈴草\"],\"sciName\":\"Aristolochia kaempferi Willd.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"オオバウマノスズクサ\",\"おおばうまのすずくさ\",\"大葉馬の鈴草\",\"Aristolochia kaempferi\",\"Isotrema kaempferi\"],\"worldDistribution\":{\"summary\":\"POWOでは中国南中部（S. Central China）と日本の中南部（S. Central & S. Japan）を原産地とする。中国産集団を別種として扱う説もあり、その場合は日本固有種とされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93038-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to）を参照\"}},\"japanDistribution\":{\"summary\":\"関東地方以西の太平洋沿岸を中心に、四国、九州、沖縄に分布するとされる（日本語版Wikipedia）。一方、近畿地方中西部から瀬戸内地方東部を対象とした学術調査（J-STAGE掲載論文）では、大阪東部・南部から淡路島・小豆島を経て兵庫県西播磨地域、岡山県南東部にかけて分布することが具体的に報告されている。海岸沿いの林縁やミカン園の周辺などに生育する半木質のつる植物。\",\"status\":\"自生\",\"source\":{\"name\":\"オオバウマノスズクサ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AA%E3%82%AA%E3%83%90%E3%82%A6%E3%83%9E%E3%83%8E%E3%82%B9%E3%82%BA%E3%82%AF%E3%82%B5\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaの分布記述（関東以西）と、より地域を絞った学術論文（近畿中西部～瀬戸内東部）の記述には範囲の粒度に差があるが、矛盾はしない。後者の方が兵庫県内の分布検証には有用。\",\"habitat\":\"海岸に近い林縁、ミカン園周辺\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"県内（神戸市・姫路市・淡路島・西播磨）に分布記録あり\",\"detail\":\"対象PDF（兵庫県産維管束植物 第3巻）は技術的制約により直接確認できなかった。代替として、兵庫県立人と自然の博物館の植物標本データ（GBIF経由）には1971～1999年にかけての県内標本が多数あり、具体的には姫路市野里（2007年）、神戸市北区山田町（1990年）などの記録がある。さらに日本植物分類学会誌掲載の学術論文『近畿地方中西部から瀬戸内地方東部におけるオオバウマノスズクサとアリマウマノスズクサ（ウマノスズクサ科）の分布について』では、大阪東部・南部から淡路島・小豆島を経て兵庫県西播磨地域、岡山県南東部にかけて連続的に分布すると明記されており、兵庫県（特に淡路島・西播磨・神戸市域）が本種の分布域の中核に含まれることが裏付けられる。\",\"volume\":3,\"page\":null,\"localities\":[\"姫路市野里\",\"神戸市北区山田町\",\"淡路島（洲本市ほか）\",\"西播磨地域一帯\"],\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF）／日本植物分類学会誌 掲載論文\",\"url\":\"https://www.jstage.jst.go.jp/article/jjapbot/99/2/99_ID0187/_article/-char/ja\",\"type\":\"primary\"},\"reliabilityNote\":\"原典PDF（兵庫県産維管束植物 第3巻）は直接検証不能だったため、同一機関の標本データベースおよび査読付き学術論文（近畿・瀬戸内域の分布を専門的に調査したもの）を組み合わせて代替根拠とした。両者は独立の情報源でありながら結論が一致するため、信頼性は高いと判断する。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁のウマノスズクサと混同されやすい。\",\"items\":[{\"name\":\"ウマノスズクサ\",\"sciName\":\"Aristolochia debilis Siebold & Zucc.\",\"distinguishingPoints\":\"ウマノスズクサは葉がより小さく細長い三角状心形で、草質のつるが冬に枯れる。オオバウマノスズクサは葉が大きく丸みを帯び、半木質のつるで、早春に他のつる植物に先駆けて展葉する点で見分けられる。生育地も、ウマノスズクサは日当たりの良い河川敷や畑地周辺の内陸的な環境に多く、オオバウマノスズクサは淡路島など海岸に近い暖かい林縁に多い傾向がある。\"}],\"source\":{\"name\":\"オオバウマノスズクサ - mirusiru.jp\",\"url\":\"https://mirusiru.jp/nature/flower/oobaumanosuzukusa\",\"type\":\"secondary\"},\"reliabilityNote\":\"野草観察サイトの記述に基づく一般的な識別点。\"}},{\"id\":\"asarum-caulescens\",\"nameJa\":\"フタバアオイ\",\"nameJaAlt\":[\"双葉葵\",\"二葉葵\",\"賀茂葵\"],\"sciName\":\"Asarum caulescens Maxim.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"フタバアオイ\",\"ふたばあおい\",\"双葉葵\",\"二葉葵\",\"賀茂葵\",\"Asarum caulescens\",\"徳川家紋\",\"葵の御紋\"],\"worldDistribution\":{\"summary\":\"POWOでは中国中北部・中南部と日本の中部～南部（Central China, Central & S. Japan）を原産地とする。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93473-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to）を参照\"}},\"japanDistribution\":{\"summary\":\"福島県以南の本州から九州にかけて分布する日本固有種とされる（一部資料では中国にも産するとする）。落葉広葉樹林や針広混交林の暗い林床に生育し、他の春植物が育ちにくい日陰でも生存できる。徳川家の家紋「三つ葉葵」のモチーフとして知られるが、実際の植物は対生する2枚の葉（双葉）を持つ。京都・賀茂神社の葵祭にも用いられる。\",\"status\":\"自生\",\"source\":{\"name\":\"フタバアオイ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%95%E3%82%BF%E3%83%90%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述で、文化的背景を含め広く知られた内容と一致する。\",\"habitat\":\"落葉広葉樹林・針広混交林の暗い林床\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"県内に分布記録あり\",\"detail\":\"対象PDF（兵庫県産維管束植物 第3巻）は技術的制約により直接確認できなかった。代替として兵庫県立人と自然の博物館の植物標本データ（GBIF経由）を参照したところ、1955～1997年にかけて県内各地からの標本記録が複数存在し、具体的には姫路市野里（2007年）、神戸市北区山田町（1990年）などが確認できた。多くの標本は都道府県レベルの産地情報にとどまるが、複数年・複数地点にわたる継続的な採集記録があることから、県内に安定して分布していると判断できる。\",\"volume\":3,\"page\":null,\"localities\":[\"姫路市野里\",\"神戸市北区山田町\",\"県内広域（複数標本あり、詳細地名データは限定的）\"],\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF: Herbarium Specimens of Museum of Nature and Human Activities, Hyogo）\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"原典PDF（兵庫県産維管束植物 第3巻）は直接検証不能だったため、同一機関の標本データベースを代替一次資料とした。標本記録自体は信頼性が高いが、原著PDFの巻・ページ番号や詳細な産地注記は未確認。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じウマノスズクサ科カンアオイ属のウスバサイシン、ミヤコアオイと非常によく似た心形の葉を持ち、地面近くに目立たない花をつけるため、現地での識別が難しいグループとして知られる。\",\"items\":[{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"フタバアオイは葉が小さく丸みが強く光沢が目立つのに対し、ウスバサイシンは葉がやや大きく先端が尖った薄い紙質（「薄葉」の名の由来）。両種とも落葉性で毎年2枚一対の葉を出す点は共通するが、萼筒の形が異なり、フタバアオイは3枚の萼片がほぼ離生して不完全な筒状にしかならない（この特徴を持つ国内種はフタバアオイ亜属のみで、カンアオイ亜属のウスバサイシン・ミヤコアオイとは大きく異なる）。ウスバサイシンは根茎が強い香りを持ち、生薬「細辛」として利用される。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"ミヤコアオイはカンアオイ亜属に属し、常緑で1枚ずつ葉をつける点でフタバアオイ（落葉・対の2枚葉）と大きく異なる。葉も厚く革質。萼筒は台形状で上部が急にすぼまり、内側に格子状の隆起がある特徴的な形をしている。\"}],\"source\":{\"name\":\"フタバアオイ / ウスバサイシン - ざっそう屋\",\"url\":\"https://zassou-ya.com/plants/futabaaoi/\",\"type\":\"secondary\"},\"reliabilityNote\":\"野草専門サイトの形態記載に基づく。カンアオイ属は変異が大きく地域個体差もあるため、確実な同定には萼筒内部構造の確認が推奨される。\"}},{\"id\":\"asarum-sieboldii\",\"nameJa\":\"ウスバサイシン\",\"nameJaAlt\":[\"薄葉細辛\"],\"sciName\":\"Asarum sieboldii Miq.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ウスバサイシン\",\"うすばさいしん\",\"薄葉細辛\",\"Asarum sieboldii\",\"Asiasarum sieboldii\",\"ギフチョウ\",\"細辛\"],\"worldDistribution\":{\"summary\":\"POWOではロシア極東南部（プリモリエ）から朝鮮半島、日本の中部～南部（S. Russian Far East to Korea, Central & S. Japan）を原産地とする。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93573-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to）を参照\"}},\"japanDistribution\":{\"summary\":\"本州の中部地方、関東地方から中国地方にかけて広く分布し、山地のやや湿った林下に生育する。ギフチョウ（Luehdorfia japonica）の幼虫の主要な食草としてよく知られ、種子はアリによって散布される（アリ散布植物）。\",\"status\":\"自生\",\"source\":{\"name\":\"ウスバサイシン - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A6%E3%82%B9%E3%83%90%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述に基づく。ギフチョウとの食草関係は複数の専門サイト（蝶類の生態解説）でも広く確認できる一般的な知識である。\",\"habitat\":\"山地のやや湿った林床\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"県内（但馬・北播磨地域）に分布記録あり\",\"detail\":\"対象PDF（兵庫県産維管束植物 第3巻）は技術的制約により直接確認できなかった。代替として、兵庫県立人と自然の博物館の植物標本データ（GBIF経由）を参照したところ、美方郡香美町、美方郡香美町村岡区（旧村岡町）、美方郡新温泉町温泉（旧温泉町）、美方郡新温泉町（旧新温泉町）、多可郡多可町八千代区（旧八千代町）など但馬・北播磨地域を中心に1967～2010年にわたる複数の標本記録が確認できた。この分布は、但馬地域にギフチョウの安定した個体群が生息するという記録（但馬情報特急による地域情報）とも整合的である。\",\"volume\":3,\"page\":null,\"localities\":[\"美方郡香美町\",\"美方郡香美町村岡区（旧村岡町）\",\"美方郡新温泉町温泉（旧温泉町）\",\"美方郡新温泉町（旧新温泉町）\",\"多可郡多可町八千代区（旧八千代町）\"],\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF: Herbarium Specimens of Museum of Nature and Human Activities, Hyogo）\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"原典PDF（兵庫県産維管束植物 第3巻）は直接検証不能だったため、同一機関の標本データベースを代替一次資料とした。地名は美方郡・多可郡の旧町名で記録されており、行政区画の変遷（2005年前後の合併）に留意する必要がある。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"フタバアオイ、ミヤコアオイと非常によく似た心形の葉を持ち、識別が難しいグループ。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"ウスバサイシンは葉がやや大きく先端が尖り薄い紙質であるのに対し、フタバアオイは葉が小さく丸みが強く光沢がある。両種とも毎年2枚一対の葉を落葉性に出す点は共通するが、ウスバサイシンは萼筒が完全に筒状に癒合するのに対し、フタバアオイは萼片がほぼ離生し不完全な筒にしかならない点で区別できる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"ミヤコアオイはカンアオイ亜属に属し常緑で1枚ずつ葉をつけるのに対し、ウスバサイシンは落葉性で2枚一対の葉をつける点が最も分かりやすい違い。また分布域もウスバサイシンは中部地方～中国地方まで広く分布するのに対し、ミヤコアオイは近畿地方以西に限られる。\"}],\"source\":{\"name\":\"ウスバサイシン - ざっそう屋 / フタバアオイ - Wikipedia\",\"url\":\"https://zassou-ya.com/plants/usubasaishin/\",\"type\":\"secondary\"},\"reliabilityNote\":\"野草専門サイトの形態記載に基づく一般的な識別点。\"}},{\"id\":\"asarum-asperum\",\"nameJa\":\"ミヤコアオイ\",\"nameJaAlt\":[\"都葵\",\"チョウジャノカマ\"],\"sciName\":\"Asarum asperum F.Maek.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ミヤコアオイ\",\"みやこあおい\",\"都葵\",\"チョウジャノカマ\",\"Asarum asperum\",\"Heterotropa aspera\"],\"worldDistribution\":{\"summary\":\"POWOでは日本固有種とし、原産地を「W. Honshu, Shikoku」（本州西部・四国）と記載している。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93462-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to）を参照\"}},\"japanDistribution\":{\"summary\":\"本州の近畿地方以西から島根県、四国西部、九州（福岡県、大分県、熊本県）にかけて分布する日本固有種。低山地の広葉樹林下に生育する。和名の「都（ミヤコ）」は京都・近畿を指すとみられ、近畿地方が分布の東限に近い。\",\"status\":\"自生\",\"source\":{\"name\":\"ミヤコアオイ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%9F%E3%83%A4%E3%82%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述に基づく。分布の東限が近畿地方とされており、兵庫県はこの分布域にちょうど含まれる位置にある点は留意すべきだが、POWOの「本州西部」という表現とも矛盾しない。\",\"habitat\":\"低山地の広葉樹林下\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"県内に分布記録あり（分布の東端付近にあたる近畿地方に含まれる）\",\"detail\":\"対象PDF（兵庫県産維管束植物 第3巻）は技術的制約により直接確認できなかった。代替として、兵庫県立人と自然の博物館の植物標本データ（GBIF経由、旧学名Heterotropa asperaでも登録）を参照したところ、1927～2016年にわたる多数の県内標本があり、具体的には神崎郡市川町上牛尾・岩戸神社（2016年）の記録が確認できた。さらに三田市の植物相調査（高橋晃 2011「兵庫県三田市の植物」人と自然22号）でも小柿、母子大池、天神の各地点で採集記録があり、複数の独立した情報源から兵庫県内（北播磨地域を中心に）に安定して分布することが裏付けられる。名称の「都」からイメージされる分布域と実際の記録がよく一致している。\",\"volume\":3,\"page\":null,\"localities\":[\"神崎郡市川町上牛尾（岩戸神社）\",\"三田市小柿\",\"三田市母子大池\",\"三田市天神\",\"県内広域（標本記録複数）\"],\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF）／高橋晃(2011)「兵庫県三田市の植物」人と自然22\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"原典PDF（兵庫県産維管束植物 第3巻）は直接検証不能だったため、同一機関の標本データベースと、同機関発行の三田市植物相調査論文の2つの独立資料を組み合わせて代替根拠とした。両者が同じ結論（県内に確実に分布）を示しており、信頼性は高いと判断する。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"フタバアオイ、ウスバサイシンと同様に地面近くに心形の葉と目立たない花をつけ、現地での識別が難しいグループ。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"ミヤコアオイは常緑・単葉（1枚ずつ）のカンアオイ亜属であるのに対し、フタバアオイは落葉性で2枚一対の葉を出すフタバアオイ亜属である点が最大の違い。葉の質感もミヤコアオイは厚い革質、フタバアオイは薄く光沢のある葉。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"ミヤコアオイは常緑・単葉でカンアオイ亜属に属するのに対し、ウスバサイシンは落葉性で2枚一対の葉を出す点で区別できる。花の萼筒も、ミヤコアオイは上部が急にすぼまる台形状で内側に格子状の隆起が発達するのに対し、ウスバサイシンは筒状に均等に癒合する点が異なる。\"}],\"source\":{\"name\":\"ミヤコアオイ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%9F%E3%83%A4%E3%82%B3%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaの萼筒構造の詳細記載に基づく。カンアオイ属は近縁種間の変異が大きいため、確実な同定には専門家による確認が望ましい。\"}},{\"id\":\"piper-nigrum\",\"nameJa\":\"コショウ\",\"nameJaAlt\":[\"胡椒\"],\"sciName\":\"Piper nigrum L.\",\"family\":\"コショウ科 Piperaceae\",\"searchTerms\":[\"コショウ\",\"こしょう\",\"胡椒\",\"Piper nigrum\",\"black pepper\",\"pepper vine\"],\"worldDistribution\":{\"summary\":\"POWOでは原産地をスリランカ（Sri Lanka）のみと記載しているが、香辛料として熱帯全域（東南アジア、インド、アフリカ、中南米、太平洋島嶼）に広く導入・栽培されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:682369-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to / Introduced into）を参照\"}},\"japanDistribution\":{\"summary\":\"熱帯性のつる植物で日本の気候では露地・野外での商業栽培は行えない。江戸時代には中国船・オランダ船を通じて輸入香辛料として利用された記録がある。現代では沖縄県（名護市の「やんばるペッパー」プロジェクトなど）で試験的・小規模な栽培例があるほか、近縁種のヒハツモドキ（島胡椒）が沖縄で栽培されている。本州では温室・鉢植えでの観賞・趣味栽培にとどまる。\",\"status\":\"栽\",\"source\":{\"name\":\"コショウ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%B3%E3%82%B7%E3%83%A7%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaおよび沖縄での栽培プロジェクトに関する報道記事の内容が一致しており、熱帯性で日本の露地栽培には適さないという点は確実性が高い。\",\"habitat\":\"熱帯地域の森林（原産地）／日本国内では温室・鉢植え栽培のみ\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"野生記録なし（熱帯性のため栽培のみ、県内での定着・野生化は確認されていない）\",\"detail\":\"コショウは熱帯原産の非耐寒性つる植物であり、兵庫県のような温帯気候下では露地での越冬・定着が事実上不可能である。兵庫県立人と自然の博物館の植物標本データ（GBIF経由）で「Piper nigrum」を検索しても、該当するのは近縁の在来種フウトウカズラ（Piper kadsura）の誤マッチであり、コショウ自体の県内野生標本は確認できなかった。兵庫県産維管束植物（第3巻PDF）も技術的制約により直接確認できなかったが、本種の生態（熱帯性・非耐寒性）から見て、野外での自然分布・逸出定着の記録が存在する可能性は極めて低いと判断する。シキミ目のトウシキミ（Illicium verum）と同様、人為的利用のある栽培専用種として扱う。\",\"volume\":3,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF）検索結果（該当なし）\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"「記録なし」の結論は、原典PDFを直接確認できなかったための消極的根拠（該当データベースでの非検出）と、本種の生態的知見（熱帯性で日本の温帯地域では露地生育不可）を組み合わせた推論に基づく。将来的に原典PDFが直接参照できれば再確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属で兵庫県に自生するフウトウカズラと比較すると、コショウ属（Piper属）の熱帯種と温帯種の違いがよくわかる好例。\",\"items\":[{\"name\":\"フウトウカズラ\",\"sciName\":\"Piper kadsura (Choisy) Ohwi\",\"distinguishingPoints\":\"コショウは熱帯原産で非耐寒性、日本では温室栽培のみ可能。果実（コショウの実）は密な穂状に多数つき乾燥・粉砕して香辛料に利用する。一方フウトウカズラは日本（関東以西の太平洋側～九州・南西諸島）に自生する近縁の温帯種で、常緑の木質つるとして海岸近くの林縁に生育し、耐寒性がありそのまま野外で越冬できる点が大きく異なる。葉の質感や気根で這い上がる性質は両種で似ている。\"}],\"source\":{\"name\":\"本土唯一のコショウの仲間・フウトウカズラを食べてみた\",\"url\":\"https://www.outdoorfoodgathering.jp/related-species/fuutoukazura/\",\"type\":\"secondary\"},\"reliabilityNote\":\"一般向け解説記事に基づく比較。学術的な形態比較ではないが、両種の生態的な違い（熱帯性か温帯性か）は明確で信頼できる。\"}},{\"id\":\"piper-kadsura\",\"nameJa\":\"フウトウカズラ\",\"nameJaAlt\":[\"風藤葛\",\"オオバフウトウカズラ\"],\"sciName\":\"Piper kadsura (Choisy) Ohwi\",\"family\":\"コショウ科 Piperaceae\",\"searchTerms\":[\"フウトウカズラ\",\"ふうとうかずら\",\"風藤葛\",\"オオバフウトウカズラ\",\"Piper kadsura\",\"本土唯一のコショウの仲間\"],\"worldDistribution\":{\"summary\":\"POWOでは「Temp. E. Asia」（東アジア温帯域）を原産地とし、具体的には日本、韓国、台湾、南西諸島、火山列島、小笠原諸島に分布するとされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:681817-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to）を参照\"}},\"japanDistribution\":{\"summary\":\"関東地方以西の本州太平洋側から四国、九州、南西諸島、伊豆諸島、小笠原諸島にかけて分布する常緑つる性木本。海岸に近い林内・林縁に生育し、気根を出して岩や樹幹を這い上がる。奄美地方などでは生垣にもよく利用される。\",\"status\":\"自生\",\"source\":{\"name\":\"フウトウカズラ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%95%E3%82%A6%E3%83%88%E3%82%A6%E3%82%AB%E3%82%BA%E3%83%A9\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述では兵庫県への言及はないが、「関東以西」という広い分布域の中に兵庫県は含まれるため、県内での分布は妥当性が高い。\",\"habitat\":\"海岸に近い林内・林縁\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"県内（淡路島）に分布記録あり\",\"detail\":\"対象PDF（兵庫県産維管束植物 第3巻）は技術的制約により直接確認できなかった。代替として、兵庫県立人と自然の博物館の植物標本データ（GBIF経由）を参照したところ、洲本市灘、淡路市（旧北淡町域）、南あわじ市（旧三原郡南淡町灘地区）、沼島など、1971～2006年にわたり淡路島内から複数の標本記録が確認できた。さらに兵庫植物同好会による2018年5月の観察会記録（洲本市上灘地区畑田組）でも本種が観察されており、「このあたりに来ないと見られない植物」として紹介されている。以上より、兵庫県内での自生は淡路島の温暖な沿岸部にほぼ限られると考えられる。\",\"volume\":3,\"page\":null,\"localities\":[\"洲本市灘\",\"南あわじ市灘地区（旧三原郡南淡町）\",\"南あわじ市沼島\",\"洲本市上灘地区畑田組\"],\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF）／兵庫植物同好会 観察会記録\",\"url\":\"https://hyogoshokubutu.seesaa.net/article/201803article_1.html\",\"type\":\"primary\"},\"reliabilityNote\":\"原典PDF（兵庫県産維管束植物 第3巻）は直接検証不能だったため、同一機関の標本データベースと、地域の植物愛好会による最近（2018年）の実地観察記録を組み合わせて代替根拠とした。いずれも産地が淡路島に集中しており、県内での分布が沿岸温暖域に限定されるという生態的予測とも整合的である。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属の栽培種コショウとの対比が興味深い。日本本土に自生する唯一のコショウ属野生種として紹介されることが多い。\",\"items\":[{\"name\":\"コショウ\",\"sciName\":\"Piper nigrum L.\",\"distinguishingPoints\":\"フウトウカズラは日本（本州以南）に自生する耐寒性のある常緑つる性木本で、淡路島など兵庫県内の温暖な沿岸部でも野外で自生できる。一方コショウは熱帯原産で耐寒性がなく、日本では温室・鉢植えでしか育てられない。果実（穂状の集合果）はどちらも赤く熟すが、フウトウカズラの果実は香辛料としては一般に利用されない（食用例はあるが商業利用はされない）のに対し、コショウの果実は世界的な香辛料として利用される。\"}],\"source\":{\"name\":\"本土唯一のコショウの仲間・フウトウカズラを食べてみた\",\"url\":\"https://www.outdoorfoodgathering.jp/related-species/fuutoukazura/\",\"type\":\"secondary\"},\"reliabilityNote\":\"一般向け解説記事に基づく比較。\"}},{\"id\":\"houttuynia-cordata\",\"nameJa\":\"ドクダミ\",\"nameJaAlt\":[\"蕺草\",\"十薬\"],\"sciName\":\"Houttuynia cordata Thunb.\",\"family\":\"ドクダミ科 Saururaceae\",\"searchTerms\":[\"ドクダミ\",\"どくだみ\",\"蕺草\",\"十薬\",\"じゅうやく\",\"Houttuynia cordata\",\"fish mint\",\"chameleon plant\"],\"worldDistribution\":{\"summary\":\"POWOによればヒマラヤ地域（東西ヒマラヤ、ネパール、チベット）から中国各地、朝鮮半島、日本、台湾、東南アジア（ミャンマー、タイ、ベトナム、カンボジア）、小笠原諸島まで広く分布する。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:927252-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to）を参照\"}},\"japanDistribution\":{\"summary\":\"北海道（本州からの近年の移入とされる）から九州にかけて全国的に分布する、湿った半日陰を好む多年草。庭先、空き地、生垣周辺、山野の林内など極めて身近な環境に群生し、独特のアルデヒド系の臭気を持つ。地下茎による栄養繁殖力が強く、しばしば強害雑草として扱われる一方、乾燥した地上部は生薬「十薬（重薬）」として胃腸炎・便秘・利尿などの民間療法に古くから利用されてきた。\",\"status\":\"自生\",\"source\":{\"name\":\"ドクダミ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%89%E3%82%AF%E3%83%80%E3%83%9F\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本全国に極めて普通に見られる種であり、Wikipediaの記述内容は他の多数の植物図鑑・薬草解説サイトとも一致する。信頼性は非常に高い。\",\"habitat\":\"湿った半日陰地（庭先、空き地、林縁、生垣周辺）\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"県内全域に分布（ごく普通種）\",\"detail\":\"対象PDF（兵庫県産維管束植物 第3巻）は技術的制約により直接確認できなかったが、本種は全国的にごく普通に見られる雑草的種であり、兵庫県内での分布は疑いようがない。代替として、兵庫県立人と自然の博物館の植物標本データ（GBIF経由）を参照したところ、美方郡新温泉町浜坂（但馬）、赤穂郡上郡町（西播磨）、姫路市野里など県内各地から1990～2006年の標本記録が多数確認でき、また三田市の植物相調査（高橋晃 2011）でも大川瀬・天神・弥生が丘の各地点で記録されている。これらは県内で極めて普通に見られる本種の性質を裏付ける補強証拠であり、特定の記録がないことをもって「記録なし」と結論すべきではない典型例である。\",\"volume\":3,\"page\":null,\"localities\":[\"美方郡新温泉町浜坂\",\"赤穂郡上郡町\",\"姫路市野里\",\"三田市大川瀬\",\"三田市天神\",\"三田市弥生が丘\"],\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF）／高橋晃(2011)「兵庫県三田市の植物」人と自然22\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"原典PDF（兵庫県産維管束植物 第3巻）は直接検証不能だったが、本種は全国的な普通種であることに加え、独立した2つの資料（博物館標本データベースと三田市植物相調査）で県内の具体的な生育地が確認できるため、「記録あり」の結論の信頼性は極めて高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"ハンゲショウとは同じドクダミ科（世界的にも数属数種のみの小さな科）に属するが、見た目は大きく異なる。両種は近縁ながら生育環境や姿形の違いが大きい好対照の例として紹介できる。\",\"items\":[{\"name\":\"ハンゲショウ\",\"sciName\":\"Saururus chinensis (Lour.) Baill.\",\"distinguishingPoints\":\"ドクダミは丈が低く（20～50cm程度）、独特の臭気を持ち、白い4枚の総苞片と中心の穂状花序からなる花を庭先や林縁など陰湿な半日陰地でごく普通に見せる。一方ハンゲショウは丈が高く（30～100cm）、池沼や水辺の湿地に群生し、開花期に上部の葉が白く変化する特徴的な生態を持つ点で大きく異なる。両種とも花に花弁がなく、微小な花が穂状に集まる点はドクダミ科としての共通点。\"}],\"source\":{\"name\":\"ドクダミ - Wikipedia／ハンゲショウ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%83%B3%E3%82%B2%E3%82%B7%E3%83%A7%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"両種のWikipedia記述に基づく一般的な比較。\"}},{\"id\":\"saururus-chinensis\",\"nameJa\":\"ハンゲショウ\",\"nameJaAlt\":[\"半夏生\",\"半化粧\",\"片白草\",\"カタシログサ\"],\"sciName\":\"Saururus chinensis (Lour.) Baill.\",\"family\":\"ドクダミ科 Saururaceae\",\"searchTerms\":[\"ハンゲショウ\",\"はんげしょう\",\"半夏生\",\"半化粧\",\"片白草\",\"カタシログサ\",\"Saururus chinensis\",\"lizard's tail\"],\"worldDistribution\":{\"summary\":\"POWOでは中国（中北部・中南部・南東部・海南島・青海省）、朝鮮半島、日本、台湾、南西諸島、フィリピン、ベトナムにかけて分布するとされ、東アジア～インドシナの温帯域に広がる。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:684080-1\",\"type\":\"primary\",\"note\":\"分布欄（Native to）を参照\"}},\"japanDistribution\":{\"summary\":\"本州（青森県以南）、四国、九州、沖縄にかけて分布する水辺・湿地性の多年草。池沼のほとり、水路、休耕田周辺など水湿地に群生し、地下茎で横に広がりながら茎を直立させる。開花期（6～8月）に花序に近い上部の葉数枚が花弁の代わりに白く変色し、送粉者を誘引すると考えられている（和名「半夏生（暦の雑節）」または「半化粧」に由来するという2説がある）。\",\"status\":\"自生\",\"source\":{\"name\":\"ハンゲショウ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%83%B3%E3%82%B2%E3%82%B7%E3%83%A7%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述に基づく。各地の植物園・公園のハンゲショウ紹介記事とも内容が一致しており信頼性は高い。\",\"habitat\":\"池沼のほとり、水路周辺、湿地\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"県内各地に分布記録あり（湿地・ため池周辺）\",\"detail\":\"対象PDF（兵庫県産維管束植物 第3巻）は技術的制約により直接確認できなかった。代替として、兵庫県立人と自然の博物館の植物標本データ（GBIF経由）を参照したところ、姫路市、洲本市（淡路島）、西宮市、明石市、美方郡新温泉町浜坂（但馬）、旧城崎郡香住町鎧（現・香美町香住区、山陰海岸沿い）など、1993～2014年にわたり播磨・阪神・但馬・淡路の各地域から広く標本記録が確認できた。ため池の多い兵庫県内では、水辺の管理された環境（庭園を含む）でも見られ、神戸市立須磨離宮公園など公園緑地での植栽事例もある。\",\"volume\":3,\"page\":null,\"localities\":[\"姫路市\",\"洲本市（淡路島）\",\"西宮市\",\"明石市\",\"美方郡新温泉町浜坂\",\"旧城崎郡香住町鎧（現・美方郡香美町）\"],\"source\":{\"name\":\"兵庫県立人と自然の博物館 植物標本データ（GBIF: Herbarium Specimens of Museum of Nature and Human Activities, Hyogo）\",\"url\":\"https://www.gbif.org/dataset/8682e420-f762-11e1-a439-00145eb45e9a\",\"type\":\"primary\"},\"reliabilityNote\":\"原典PDF（兵庫県産維管束植物 第3巻）は直接検証不能だったため、同一機関の標本データベースを代替一次資料とした。県内の播磨・阪神・但馬・淡路という広範囲かつ複数年にわたる記録があり、信頼性は高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じドクダミ科に属するドクダミとは近縁だが、生育環境・草姿は大きく異なる。\",\"items\":[{\"name\":\"ドクダミ\",\"sciName\":\"Houttuynia cordata Thunb.\",\"distinguishingPoints\":\"ハンゲショウは水辺・湿地に群生する丈の高い（30～100cm）植物で、開花期に上部の葉が白変する点が最大の特徴。ドクダミは陰湿な半日陰地（庭先や林縁など水辺に限らない環境）に生育する丈の低い（20～50cm）植物で、独特の臭気と、白い総苞片を持つ穂状花序を特徴とする。両種とも花弁を欠く微小な花が穂状に集まるドクダミ科共通の花の構造を持つが、全体の草姿・生育環境は大きく異なるため、混同されることは少ない。\"}],\"source\":{\"name\":\"ハンゲショウ - Wikipedia／ドクダミ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%83%B3%E3%82%B2%E3%82%B7%E3%83%A7%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"両種のWikipedia記述に基づく一般的な比較。\"}},{\"id\":\"asarum-asaroides\",\"nameJa\":\"タイリンアオイ\",\"nameJaAlt\":[\"大輪葵\"],\"sciName\":\"Asarum asaroides (C.Morren et Decne.) Makino\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"タイリンアオイ\",\"たいりんあおい\",\"大輪葵\",\"Asarum asaroides\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な分布は日本国内（本州西部・九州北部）に限られる。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93461-1/general-information\",\"type\":\"primary\",\"note\":\"分布欄に「Japan (W. Honshu, N. Kyushu)」と記載。\"}},\"japanDistribution\":{\"summary\":\"本州西部（中国地方西部）から九州（熊本県・大分県・宮崎県・鹿児島県）にかけて分布する。大分県内では由布・鶴見火山群、九重火山群、耶馬日田英彦山周辺など複数の産地が知られ、県内では比較的広い分布域を持つとされる。\",\"status\":\"自生\",\"source\":{\"name\":\"大分県レッドデータブック2022・大分県ホームページ\",\"url\":\"https://www.rdb-oita.jp/data/16523/\",\"type\":\"secondary\"},\"reliabilityNote\":\"九州側（大分県）の記録は複数の行政資料で確認できるが、近畿地方・兵庫県に関する分布記録は検索した範囲では見当たらなかった。\",\"habitat\":\"低地から低山地の林床に生育する常緑の多年草。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（中国地方西部～九州固有種のため）\",\"detail\":\"本種の分布は本州西部（中国地方西部）から九州にかけての地域に限られ、近畿地方・兵庫県は分布域に含まれない。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"大分県レッドデータブック2022 ほか九州側自治体資料\",\"url\":\"https://www.rdb-oita.jp/data/16523/\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県産維管束植物に関する資料に本種の記載は見当たらず、分布域から見ても兵庫県への自然分布は考えにくい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉を対状につける点が特徴的で、タイリンアオイのような無茎の株立ちとは印象が異なる。花は鐘形で萼裂片が平開する。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"葉が薄く、冬に枯れる落葉性。萼筒は短く紫褐色で、タイリンアオイの厚い葉・大型の花とは質感が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑で葉に淡い斑が入ることが多く、萼筒はつぼ形でくびれる。タイリンアオイは近縁だが分布域が全く異なる。\"}],\"source\":{\"name\":\"一般的なカンアオイ属識別情報（三河の植物観察 ほか）\",\"url\":\"https://mikawanoyasou.org/data/hutabaaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"タイリンアオイとフタバアオイ等3種との詳細な形態比較データは十分に得られなかったため、識別点は一般的なカンアオイ属の傾向に基づく概略である。\"}},{\"id\":\"asarum-asperum-var-geaster\",\"nameJa\":\"ツチグリカンアオイ\",\"nameJaAlt\":[\"シシクイカンアオイ\",\"土栗寒葵\"],\"sciName\":\"Asarum asperum F.Maek. var. geaster (F.Maek. ex Akasawa) T.Sugaw.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ツチグリカンアオイ\",\"つちぐりかんあおい\",\"シシクイカンアオイ\",\"ししくいかんあおい\",\"Asarum asperum geaster\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有の変種（ミヤコアオイ Asarum asperum の変種）。世界的な分布は日本国内に限られる。\",\"source\":{\"name\":\"Wikispecies / 分類学的資料\",\"url\":\"https://species.wikimedia.org/wiki/Asarum_asperum\",\"type\":\"secondary\",\"note\":\"ミヤコアオイの変種として var. geaster（シノニム Heterotropa geaster）が扱われている。\"}},\"japanDistribution\":{\"summary\":\"別名「シシクイカンアオイ」は徳島県南部の旧宍喰町（現・海陽町、高知県境に近い四国南東部）に由来するとみられ、四国南部（徳島県・高知県境付近）を中心に分布するとされる。基本種のミヤコアオイは近畿・中国・四国に分布するが、本変種は四国南部の限られた産地の個体群を指すとみられる。\",\"status\":\"自生（変種として四国に限定的に分布）\",\"source\":{\"name\":\"分類学的資料・カンアオイ愛好家サイト等\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4%E5%B1%9E\",\"type\":\"secondary\"},\"reliabilityNote\":\"本変種は情報が非常に少なく、詳細な分布域（府県単位での確実な記録）を明確に示す一次資料は今回確認できなかった。和名の由来（宍喰＝徳島県）から四国南部に限定される変種と考えられるが、確度は高くない。\",\"habitat\":\"他のカンアオイ属と同様、常緑～半常緑の林床に生育する多年草とみられる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（四国南部の限定的な変種のため）\",\"detail\":\"本変種は四国南部（徳島県・高知県境付近）に限定されるとみられ、近畿地方・兵庫県は分布域に含まれない。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイ（基本種）とは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"和名由来および分類学的資料に基づく推定\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4%E5%B1%9E\",\"type\":\"secondary\"},\"reliabilityNote\":\"本変種そのものの兵庫県における記録は確認されなかった。基本種のミヤコアオイは兵庫県内に分布記録があるが、本変種（geaster）はそれとは別個体群として四国に限定されるとみられるため、兵庫県内での本変種の存在は考えにくい。情報の少なさゆえ、断定的な結論というより推定である点に留意されたい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種・変種レベルの識別には専門的な観察が必要とされる。兵庫県内で本種に似た株を見た場合、基本種であるミヤコアオイ（またはフタバアオイ・ウスバサイシン）である可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉を対状につける点が明確に異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉が薄く、萼筒が短い点が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"本変種の基本種にあたり、萼筒の形状や表皮の質感（geasterは萼裂片基部がより肥厚するとされる）で区別されるが、詳細な形態差は資料が乏しく確認しきれなかった。\"}],\"source\":{\"name\":\"一般的なカンアオイ属識別情報\",\"url\":\"https://zassou-ya.com/plants/miyakoaoi/\",\"type\":\"secondary\"},\"reliabilityNote\":\"本変種特有の詳細な識別形質については十分な資料が得られなかったため、記述は概略にとどまる。\"}},{\"id\":\"asarum-blumei\",\"nameJa\":\"ランヨウアオイ\",\"nameJaAlt\":[\"蘭様葵\"],\"sciName\":\"Asarum blumei Duch.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ランヨウアオイ\",\"らんようあおい\",\"蘭様葵\",\"Asarum blumei\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な分布は日本国内（関東地方南西部～中部地方東部の太平洋側）に限られる。\",\"source\":{\"name\":\"日本語版Wikipedia「ランヨウアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%A9%E3%83%B3%E3%83%A8%E3%82%A6%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"関東地方南西部から静岡県東部・山梨県南部にかけての太平洋側に分布する。東京都南多摩の丘陵帯、神奈川県丹沢山地東部・箱根芦ノ湖南岸から愛鷹山・伊豆にかけて、静岡県・山梨県の南東部などに局所的に見られる。\",\"status\":\"自生\",\"source\":{\"name\":\"日本語版Wikipedia「ランヨウアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%A9%E3%83%B3%E3%83%A8%E3%82%A6%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"関東・東海の各都県のレッドデータ資料で分布が確認できるが、近畿地方・兵庫県での記録は確認されなかった。\",\"habitat\":\"丘陵地から山地のブナ林や雑木林など落葉樹林の林床に生育する。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（関東南西部～中部地方東部太平洋側固有種のため）\",\"detail\":\"本種の分布は東京都・神奈川県・静岡県・山梨県など関東地方南西部から中部地方東部の太平洋側に限られ、近畿地方・兵庫県は分布域から大きく離れている。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"日本語版Wikipedia「ランヨウアオイ」ほか関東・東海のレッドデータ資料\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%A9%E3%83%B3%E3%83%A8%E3%82%A6%E3%82%A2%E3%82%AA%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県産維管束植物に関する資料に本種の記載は見当たらず、分布域（関東～中部東部）から見ても兵庫県への自然分布は考えにくい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉を対状につける点が明確に異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉が薄く、萼筒が短く紫褐色。ランヨウアオイの丸みを帯びた常緑葉とは印象が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑で萼筒がつぼ形にくびれる点は類似するが、分布域が全く重ならない。\"}],\"source\":{\"name\":\"一般的なカンアオイ属識別情報\",\"url\":\"https://www.botanic.jp/plants-ra/ranaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"詳細な形態比較データは限定的であり、記述は既存資料に基づく概略である。\"}},{\"id\":\"asarum-caudigerum\",\"nameJa\":\"オナガサイシン\",\"nameJaAlt\":[\"カツウダケカンアオイ\",\"尾長細辛\"],\"sciName\":\"Asarum caudigerum Hance\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"オナガサイシン\",\"おながさいしん\",\"カツウダケカンアオイ\",\"かつうだけかんあおい\",\"Asarum caudigerum\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"中国南部から東南アジア北部にかけて広く分布し、その一部が日本の南西諸島（南西諸島＝奄美・沖縄方面）にも及ぶ。POWO（Kew）は「S. China to Vietnam, Nansei-shoto to Taiwan」を自然分布域とする。\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93472-1\",\"type\":\"primary\",\"note\":\"中国南部・南部中国、ベトナム、南西諸島、台湾を自然分布域として記載。\"}},\"japanDistribution\":{\"summary\":\"日本国内では沖縄島北部（勝連岳・安波岳周辺など、通称「カツウダケ」に由来）に限られる、極めて限定的な分布を持つ。石灰岩地を好む山地の常緑広葉樹林の林床に生育する。\",\"status\":\"自生（沖縄島北部のみの極めて限定的な分布）\",\"source\":{\"name\":\"日本語版Wikipedia「オナガサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AA%E3%83%8A%E3%82%AC%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"国立科学博物館の琉球列島ホットスポット調査データベースにも掲載されており、沖縄島北部への限定分布は複数資料で裏付けられる。2017年に絶滅危惧IA類・国内希少野生動植物種に指定。\",\"habitat\":\"山地の常緑広葉樹林、特に石灰岩地の林床に生育する多年草。萼裂片の先端が尾状に伸びるのが特徴。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（沖縄島北部固有種のため）\",\"detail\":\"本種の日本国内での自然分布は沖縄島北部の勝連岳・安波岳周辺に限られ、本州・近畿地方・兵庫県からは大きく離れた南西諸島の固有分布である。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"国立科学博物館 琉球列島ホットスポットデータベース\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S14.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"沖縄島北部固有種であることは複数資料で一致しており、兵庫県への自然分布は地理的にありえない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ているが、本種は萼裂片先端が尾状に伸びる特徴的な花を持つ。分布域が兵庫県のフタバアオイ・ウスバサイシン・ミヤコアオイとは全く重ならないため、兵庫県内で本種のような花を見ることはない。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で萼裂片は尾状に伸びず、平開する鐘形の花を持つ点が大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で萼裂片が尾状に伸びない点が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑だが萼裂片は尾状に伸びず、つぼ形の萼筒を持つ点が異なる。\"}],\"source\":{\"name\":\"日本語版Wikipedia「オナガサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AA%E3%83%8A%E3%82%AC%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"萼裂片が尾状に伸びる点は明確な識別形質として資料に記載されている。\"}},{\"id\":\"asarum-celsum\",\"nameJa\":\"ミヤビカンアオイ\",\"nameJaAlt\":[\"雅寒葵\"],\"sciName\":\"Asarum celsum F.Maek. ex Hatus. et Yamahata\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ミヤビカンアオイ\",\"みやびかんあおい\",\"雅寒葵\",\"Asarum celsum\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種で、世界的な分布は奄美大島（鹿児島県）に限られるとみられる。\",\"source\":{\"name\":\"分類学的資料・愛好家サイト\",\"url\":\"https://ameblo.jp/aoinishiki/entry-12484474970.html\",\"type\":\"secondary\",\"note\":\"POWO等の一次データベースには明確な個別ページが確認できなかった。\"}},\"japanDistribution\":{\"summary\":\"鹿児島県奄美大島に分布する。同島にはミヤビカンアオイのほか、ナゼカンアオイなど近縁の固有カンアオイ類が複数知られ、狭い範囲に多様な近縁種が分化している地域として知られる。\",\"status\":\"自生（奄美大島固有）\",\"source\":{\"name\":\"奄美大島のカンアオイ類に関する分類学的資料\",\"url\":\"https://jglobal.jst.go.jp/detail?JGLOBAL_ID=201302213155958896\",\"type\":\"secondary\"},\"reliabilityNote\":\"奄美大島産カンアオイ類の分類研究（J-GLOBAL収録論文）で言及されているが、詳細な生育地情報や個体数等の一次データは限定的である。花期は1～3月とされる。\",\"habitat\":\"常緑広葉樹林の林床に生育する多年草とみられる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（奄美大島固有種のため）\",\"detail\":\"本種の分布は鹿児島県奄美大島に限られ、本州・近畿地方・兵庫県からは大きく離れた南西諸島の固有種である。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"奄美大島産カンアオイ類の分類学的資料\",\"url\":\"https://jglobal.jst.go.jp/detail?JGLOBAL_ID=201302213155958896\",\"type\":\"secondary\"},\"reliabilityNote\":\"奄美大島固有種であることは複数資料で一致しており、兵庫県への自然分布は地理的にありえない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、奄美大島には特に近縁種が多く分化している。分布域が兵庫県のフタバアオイ・ウスバサイシン・ミヤコアオイとは全く重ならないため、兵庫県内で本種のような株を見ることはない。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉を対状につける点が大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉が薄い点が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑である点は共通するが、分布域が全く重ならない別種。\"}],\"source\":{\"name\":\"一般的なカンアオイ属識別情報\",\"url\":\"https://ameblo.jp/aoinishiki/entry-12484474970.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種特有の詳細な形態識別データは資料が乏しく、記述は概略にとどまる。\"}},{\"id\":\"asarum-costatum\",\"nameJa\":\"トサノアオイ\",\"nameJaAlt\":[\"土佐の葵\"],\"sciName\":\"Asarum costatum (F.Maek.) F.Maek.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"トサノアオイ\",\"とさのあおい\",\"土佐の葵\",\"Asarum costatum\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な分布は日本国内（四国）に限られる。\",\"source\":{\"name\":\"コトバンク（世界大百科事典等）\",\"url\":\"https://kotobank.jp/word/%E3%83%88%E3%82%B5%E3%83%8E%E3%82%A2%E3%82%AA%E3%82%A4-1378697\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"和名が示す通り、土佐（高知県の旧国名）を含む四国に分布する固有種とされる。海外の山野草流通資料でも「Shikoku, Japan」原産として扱われている。\",\"status\":\"自生（四国固有）\",\"source\":{\"name\":\"コトバンク／観葉植物図鑑資料\",\"url\":\"https://kotobank.jp/word/%E3%83%88%E3%82%B5%E3%83%8E%E3%82%A2%E3%82%AA%E3%82%A4-1378697\",\"type\":\"secondary\"},\"reliabilityNote\":\"府県単位までの詳細な分布記録は今回確認できず、「四国に分布する」という記述にとどまる資料が中心であった。\",\"habitat\":\"山地の常緑樹林の林床に生育する多年草で、光沢のある大きな葉を持つ観賞価値の高い種として山野草愛好家に知られる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\" 深い種。\",\"status\":\"自生（三重県固有）\",\"source\":{\"name\":\"hanazukan 植物図鑑資料\",\"url\":\"https://jusa.sakura.ne.jp/zukan/suehiroaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"三重県内での詳細な産地（山域名等）までは今回の調査では特定できず、「三重県特産」という記述にとどまる資料が中心であった。\",\"habitat\":\"林床に生育する多年草で、他種に比べやや小型で萼裂片が深い皿状に開く花を持つとされる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（三重県固有種のため）\",\"detail\":\"本種は三重県に特産する固有種であり、兵庫県には分布しない。なお三重県は近畿地方の一部として扱われる場合があるが、兵庫県とは県境を接しておらず、本種が兵庫県まで分布を広げている記録は確認されなかった。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"hanazukan 植物図鑑資料\",\"url\":\"https://jusa.sakura.ne.jp/zukan/suehiroaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"三重県は近畿地方に含められることもある地理的注意点があるが、兵庫県とは離れており（両県は接していない）、本種が兵庫県内に産する記録は確認されなかった。ここは念のため明記しておく。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、本種は萼裂片が深い皿状に開く点が特徴とされる。分布域が兵庫県のフタバアオイ・ウスバサイシン・ミヤコアオイとは重ならないため、兵庫県内で本種のような株を見ることはない。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉を対状につける点が大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉が薄く、萼筒が短い点が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"常緑である点は共通するが、萼裂片の開き方や分布域が異なる別種。\"}],\"source\":{\"name\":\"hanazukan 植物図鑑資料\",\"url\":\"https://jusa.sakura.ne.jp/zukan/suehiroaoi.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"詳細な形態比較データは限定的であり、記述は既存資料に基づく概略である。\"}},{\"id\":\"asarum-dimidiatum\",\"nameJa\":\"クロフネサイシン\",\"nameJaAlt\":[\"黒船細辛\"],\"sciName\":\"Asarum dimidiatum F.Maek.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"クロフネサイシン\",\"くろふねさいしん\",\"黒船細辛\",\"Asarum dimidiatum\",\"Asiasarum dimidiatum\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的な分布は日本国内（本州の紀伊半島中部・広島県、四国、九州中部）に限られる。\",\"source\":{\"name\":\"日本語版Wikipedia「クロフネサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AD%E3%83%95%E3%83%8D%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"従来、紀伊半島中部（奈良県の山間部が中心）から四国、九州中部にかけて分布が知られており、近年になって広島県での分布も確認された。落葉広葉樹林・針葉樹林・混交林の林床や林縁に生育し、九州中部では近縁のウスバサイシンとの中間的な個体群も見られるとされる。\",\"status\":\"自生\",\"source\":{\"name\":\"広島大学デジタル博物館／日本語版Wikipedia\",\"url\":\"https://www.digital-museum.hiroshima-u.ac.jp/~main/index.php/%E3%82%AF%E3%83%AD%E3%83%95%E3%83%8D%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"「紀伊半島中部」という表現は奈良県南部の山地（大峰山系方面）を指すとみられるが、県内の具体的な産地までは今回の調査では特定できなかった。\",\"habitat\":\"落葉広葉樹林・針葉樹林・混交林の林床や林縁に生育する多年草。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（紀伊半島中部～四国・九州中部が分布域のため）\",\"detail\":\"本種は本州では奈良県（紀伊半島中部の山地）と広島県、そして四国・九州中部に分布が知られる。奈良県は近畿地方に含まれ、兵庫県と同じ近畿地方内での分布記録があるという点は他の近畿圏外固有種とは事情が異なるため、ここで明確にフラグを立てておく。ただし奈良県の産地は紀伊半島中部の山地（大峰山系方面とみられる）であり、兵庫県とは県境を接しておらず、兵庫県内での自然分布記録は確認されなかった。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは状況が異なり、注意を要する。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"広島大学デジタル博物館「クロフネサイシン」\",\"url\":\"https://www.digital-museum.hiroshima-u.ac.jp/~main/index.php/%E3%82%AF%E3%83%AD%E3%83%95%E3%83%8D%E3%82%B5%E3%82%A4%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"【重要フラグ】本種は近畿地方の奈良県に自然分布することが複数資料（日本語版Wikipedia、広島大学デジタル博物館）で確認された唯一の種であり、他の9種のような遠隔地固有種とは異なる。ただし奈良県内の産地は紀伊半島中部の山地とみられ、兵庫県とは地理的に離れている（両県は接しておらず、間に大阪府・京都府等が介在する）。兵庫県産維管束植物目録等の一次資料までは確認できておらず、兵庫県内での記録がないと断定するにはより詳細な確認が望ましい。近畿地方内での分布拡大の可能性がゼロとは言い切れない点に留意されたい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、特に本種はウスバサイシンと近縁で、九州中部では中間的な個体群も報告されている。兵庫県内で本種に似た株を見た場合、フタバアオイ・ウスバサイシン・ミヤコアオイのいずれかである可能性が高いが、本種は近畿地方（奈良県）に分布実績があるため、今後の調査状況によっては注意深い確認が必要である。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉を対状につける点が大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"クロ られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉をつける点でオモロカンアオイなど常緑性のカンアオイ類と大きく異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉質が薄く、常緑・革質の葉を持つオモロカンアオイとは葉の質感が明確に異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿地方に分布する落葉性の種で、南西諸島固有の常緑性であるオモロカンアオイとは生育地・分布域が全く異なる。\"}],\"source\":{\"name\":\"三河の植物観察「カンアオイ属」\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"オモロカンアオイ自体の詳細な形態比較データは確認できた資料内では限定的であり、分布域の非重複を識別の主な手がかりとしている。\"}},{\"id\":\"asarum-fauriei-var-fauriei\",\"nameJa\":\"ミチノクサイシン\",\"nameJaAlt\":[\"ミヤマカンアオイ\"],\"sciName\":\"Asarum fauriei Franch. var. fauriei\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ミチノクサイシン\",\"みちのくさいしん\",\"ミヤマカンアオイ\",\"Asarum fauriei\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種（基本変種）。POWOでは種全体（Asarum fauriei）として本州・四国に分布するとされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Asarum fauriei\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:93489-1\",\"type\":\"primary\",\"note\":\"POWOは変種を区別せず種全体の分布（本州・四国）を記載。基本変種（var. fauriei）自体の分布はより限定的とされる（日本語版Wikipedia等）。\"}},\"japanDistribution\":{\"summary\":\"基本変種は本州の東北地方、新潟県、栃木県に分布し、低山地から山地の広葉樹林・針葉樹林内の湿った林床に生育する。\",\"status\":\"自生\",\"source\":{\"name\":\"日本語版Wikipedia「ミチノクサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/ミチノクサイシン\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述に基づく。都道府県別の詳細な分布境界については学術論文での追加確認が望ましい。\",\"habitat\":\"低山地から山地の広葉樹林・針葉樹林内の湿った林床に生育する多年草。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（東北地方・新潟県・栃木県に限られる基本変種のため）\",\"detail\":\"本種（基本変種）の分布は東北地方・新潟県・栃木県に限られ、兵庫県・近畿地方は含まれない。兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは、本種が東日本の限られた地域に分布する点で大きく異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"na ",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"aoinisikiのブログ「シシキカンアオイ」\",\"url\":\"https://ameblo.jp/aoinisiki0190/entry-12961268740.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"情報源が限定的であるものの、九州北西部の一山域に固有という記述は一貫しており、兵庫県内への自然分布は考えにくい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉をつける独特の草姿を持ち、常緑性とみられるシシキカンアオイとは葉の構成が異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で本州～九州の広い範囲に分布し、長崎県の一山域に限られるシシキカンアオイとは分布域の広さが大きく異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿地方固有の落葉性の種であり、九州北西部固有種であるシシキカンアオイとは分布域が全く異なる。\"}],\"source\":{\"name\":\"三河の植物観察「カンアオイ属」\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"本変種自体の詳細な形態記載資料は乏しく、分布域の非重複を識別の主な手がかりとしている。\"}},{\"id\":\"asarum-hexalobum-var-hexalobum\",\"nameJa\":\"サンヨウアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum hexalobum F.Maek. var. hexalobum\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"サンヨウアオイ\",\"さんようあおい\",\"Asarum hexalobum\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有変種（基本変種）。本州中国地方西部（山陽地方西部）、四国、九州北部に分布する。\",\"source\":{\"name\":\"大分県レッドデータブック2011「サンヨウアオイ」\",\"url\":\"https://www.pref.oita.jp/10550/reddata2011/02/ss282.html\",\"type\":\"secondary\",\"note\":\"大分県内の分布として「大分川・大野川丘陵地、豊後水道域、豊後水道後背地域」等を記載し、本州の分布を「中国地方西部」とする。\"}},\"japanDistribution\":{\"summary\":\"本州では中国地方西部（山口県・広島県を中心とする山陽地方西部）、四国、九州北部（福岡・佐賀・熊本・大分・宮崎・鹿児島）に分布する。広島県熊野町では県内南西部に限られると報告されている。\",\"status\":\"自生\",\"source\":{\"name\":\"熊野町（広島県）「サンヨウアオイ」\",\"url\":\"https://www.town.kumano.hiroshima.jp/www/contents/1332291715469/index.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"複数の独立した情報源（大分県レッドデータブック、広島県熊野町の解説、山野草愛好家サイト）が「中国地方西部」「山陽地方西部」という表現で一致しており、信頼性は比較的高い。ただし兵庫県（播磨地方）を含む中国地方東部での詳細な分布調査データは確認できていない。\",\"habitat\":\"丘陵地から山地の広葉樹林内の林床に生育する多年草。和名は主分布域である山陽地方（西部）に由来する。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布記録なし（現時点の資料では中国地方西部・山陽地方西部に限られるとされる）\",\"detail\":\"本種の分布は複数の資料（大分県レッドデータブック、広島県熊野町の解説等）で「本州中国地方西部」「山陽地方西部（主に山口県・広島県）」とされており、広島県内でも「県内南西部に限られる」と報告されている。和名「サンヨウアオイ」は歴史的な山陽道（播磨国を含む旧国名）に由来するが、現代の分布記録が示す実際の自生範囲は山陽地方の西寄りの地域にとどまり、兵庫県（播磨地方）を含む中国地方東部側での自生記録は確認できなかった。兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは、現時点では分布域が重ならないと考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"熊野町（広島県）「サンヨウアオイ」\",\"url\":\"https://www.town.kumano.hiroshima.jp/www/contents/1332291715469/index.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"「兵庫県 サンヨウアオイ」「播磨 カンアオイ サンヨウアオイ」等のキーワードでも兵庫県内での記録を示す資料は見つからなかった。ただし本種の主分布域（山陽地方西部）は兵庫県播磨地方と地理的に隣接しており、山陽本線沿いに東進する形で岡山県東部～兵庫県境付近まで断続的に分布が及ぶ可能性を完全には否定できない。兵庫県産維管束植物目録等の一次資料による確認は本タスクの範囲では行っておらず、将来的な追加調査が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種の主分布域は兵庫県に地理的に近接する山陽地方西部であるため、他の9種と比べると識別の重要性がより高い。兵庫県内で本種に似た株を見た場合、現時点の分布記録に基づけばフタバアオイ・ウスバサイシン・ミヤコアオイのいずれかである可能性が高いが、播磨地方西部など岡山県境に近い地域で観察した場合は識別に特に注意し、専門家への相談が推奨される。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で地上茎の先に2枚の葉をつける独特の草姿を持ち、常緑性とみられるサンヨウアオイとは葉の構成が異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で薄い葉質を持つ。サンヨウアオイは山陽地方西部を中心に分布するとされ、兵庫県内で見られる本種とは基本的に分布域が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿地方固有の落葉性の種。サンヨウアオイとは分布の中心域（近畿地方 vs 山陽地方西部～九州北部）が異なる。\"}],\"source\":{\"name\":\"三河の植物観察「カンアオイ属」\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"サンヨウアオイと兵庫県産3種との詳細な形態比較データ（萼裂片の形状等）は確認できた資料内では限定的であり、現時点では分布域の違いを主な識別根拠としている。\"}},{\"id\":\"asarum-hexalobum-var-perfectum\",\"nameJa\":\"キンチャクアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum hexalobum F.Maek. var. perfectum F.Maek.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"キンチャクアオイ\",\"きんちゃくあおい\",\"Asarum hexalobum perfectum\",\"サンヨウアオイ\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有。カンアオイ属（Asarum sect. Heterotropa）は日本産50種のうち49種が日本以外に分布しない極めて地域固有性の高いグループであり、本変種もその一つとして九州に限定分布する。\",\"source\":{\"name\":\"国立科学博物館プレスリリース（PR TIMES転載）「日本の植物多様性を代表するカンアオイ類ほぼ全種の進化の道筋を解明」\",\"url\":\"https://prtimes.jp/main/html/rd/p/000000083.000047048.html\",\"type\":\"secondary\",\"note\":\"ddRAD-seqによる分子系統研究の報道発表。個々の変種の分布地までは踏み込んでいないが、カンアオイ属全体の狭域固有性の裏付けとして参照。\"}},\"japanDistribution\":{\"summary\":\"九州南部（宮崎県・熊本県・鹿児島県）に分布するサンヨウアオイ（Asarum hexalobum）の変種。基準変種を含むhexalobum系列は九州各地に細分化した地域集団（変種・品種）を持つことで知られ、近縁のシシキカンアオイ（var. controversum）は長崎県平戸市の志々伎山周辺のみに固有というように、変種単位でも極めて狭い産地に限定される傾向がある。\",\"status\":\"自生\",\"source\":{\"name\":\"kulifブログ「斑入り キンチャクアオイ「千姫」の花」\",\"url\":\"https://ameblo.jp/kulif-blog/entry-12802109207.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種を専門に扱う学術的な分布資料は確認できず、山野草愛好家サイトの記述に依拠している。神戸での観察記録を示すブログ（四季の山野草）もあるが、これは栽培株の観察記事であり野生分布を示すものではないため、天然分布地の判断には用いていない。\",\"habitat\":\"常緑性の多年草で、山地の林床・林縁の半日陰に生育する。カンアオイ属に共通する地際に隠れるように咲く壺形の花をつける。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（九州南部固有変種のため）\",\"detail\":\"本変種の分布は宮崎県・熊本県・鹿児島県など九州南部に限られ、兵庫県・近畿地方は分布域に含まれない。栽培・園芸目的で本州各地の山野草愛好家に育てられている例はあるが、それは野生分布とは別である。この点で兵庫県内に自生記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が根本的に異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"kulifブログ「斑入り キンチャクアオイ「千姫」の花」\",\"url\":\"https://ameblo.jp/kulif-blog/entry-12802109207.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県のレッドデータブックや県産維管束植物目録にも本変種の記載は見当たらず、九州固有種であることと矛盾しない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"地上に伸びる茎の先に2枚の葉が対になってつく落葉性の草本で、カンアオイ属の中でも地際からいきなり葉が出るキンチャクアオイとは草姿が明確に異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"葉が薄く柔らかい落葉性で、早春に葉の展開前後に淡緑褐色の花をつける。キンチャクアオイのような厚く光沢のある常緑葉を持たない。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿地方に限定される常緑性のカンアオイで、葉に斑紋が入ることが多い。分布域が近畿に限られる点で九州固有のキンチャクアオイとは明確に区別される。\"}],\"source\":{\"name\":\"kulifブログ「斑入り キンチャクアオイ「千姫」の花」\",\"url\":\"https://ameblo.jp/kulif-blog/entry-12802109207.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"詳細な形態比較データ（萼筒内部の稜の数など）は入手できておらず、生育域と葉質の一般的な違いにとどまる。\"}},{\"id\":\"asarum-ikegamii-var-fujimakii\",\"nameJa\":\"アラカワカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum ikegamii (F.Maek. ex Y.Maek.) T.Sugaw. var. fujimakii T.Sugaw.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"アラカワカンアオイ\",\"あらかわかんあおい\",\"Asarum ikegamii fujimakii\",\"荒川カンアオイ\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有。カンアオイ属（Asarum sect. Heterotropa）は日本産50種のうち49種が日本国外に分布せず、本変種のように河川流域単位の極小地域にしか自生しない例が多い。\",\"source\":{\"name\":\"国立科学博物館プレスリリース（PR TIMES転載）「日本の植物多様性を代表するカンアオイ類ほぼ全種の進化の道筋を解明」\",\"url\":\"https://prtimes.jp/main/html/rd/p/000000083.000047048.html\",\"type\":\"secondary\",\"note\":\"属全体の狭域固有性を示す一般的裏付けとして参照。\"}},\"japanDistribution\":{\"summary\":\"山形県南西部から新潟県北部にかけて荒川（山形・新潟県境を流れる川）の中流域のごく限られた範囲にのみ分布する。ユキグニカンアオイ（Asarum ikegamii var. ikegamii）の変種で、同種より花が大きいことで区別される。\",\"status\":\"自生\",\"source\":{\"name\":\"山形県立自然博物園（やまがた植物園）アラカワカンアオイ紹介ページ\",\"url\":\"https://yasouensearch.jp/flower_name/%E3%82%A2%E3%83%A9%E3%82%AB%E3%83%AF%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4/\",\"type\":\"secondary\"},\"reliabilityNote\":\"植物園・愛好家サイトの記述が中心だが、複数の独立したソース（やまがた植物園、地元山野草ブログ）で「荒川流域限定」という分布記述が一致しており、信頼性は比較的高いと考えられる。\",\"habitat\":\"落葉広葉樹林の林床に生育する多年草。草丈30cm未満で、4月頃から黄緑色〜緑色の花をつける。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（山形・新潟県境の荒川流域固有変種のため）\",\"detail\":\"本変種の分布は山形県南西部から新潟県北部にかけての荒川中流域という東北・北陸境界の極めて狭い範囲に限られ、兵庫県・近畿地方からは遠く離れている。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"山形県立自然博物園（やまがた植物園）アラカワカンアオイ紹介ページ\",\"url\":\"https://yasouensearch.jp/flower_name/%E3%82%A2%E3%83%A9%E3%82%AB%E3%83%AF%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4/\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県産維管束植物目録等にも本変種の記載は確認できず、東北・北陸地方固有であることと矛盾しない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"地上茎の先に対生する2枚の葉をつける落葉性草本で、根際から直接葉が出るアラカワカンアオイとは草姿が異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"薄く柔らかい落葉性の葉を持ち、早春に葉の展開とともに開花する。アラカワカンアオイの厚みのある葉とは質感が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿地方（京都・兵庫など）に限られる常緑性カンアオイで、東北日本海側の荒川流域に固有のアラカワカンアオイとは分布域が全く異なる。\"}],\"source\":{\"name\":\"やまがた植物園アラカワカンアオイ紹介ページ\",\"url\":\"https://yasouensearch.jp/flower_name/%E3%82%A2%E3%83%A9%E3%82%AB%E3%83%AF%E3%82%AB%E3%83%B3%E3%82%A2%E3%82%AA%E3%82%A4/\",\"type\":\"secondary\"},\"reliabilityNote\":\"詳細な萼筒内部形態の比較データは入手できておらず、生育域と花の大きさなど一般的特徴の違いにとどまる。\"}},{\"id\":\"asarum-ikegamii-var-ikegamii\",\"nameJa\":\"ユキグニカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum ikegamii (F.Maek. ex Y.Maek.) T.Sugaw. var. ikegamii\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"ユキグニカンアオイ\",\"ゆきぐにかんあおい\",\"Asarum ikegamii\",\"雪国寒葵\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有。生育地の寒冷な気候にちなみ、Plant Delights社（米国の山野草専門ナーセリー）の解説でも「日本の寒冷な北部地域原産」と紹介されるなど、本州日本海側の寒冷な豪雪地帯に限定される種として認識されている。\",\"source\":{\"name\":\"Plant Delights Nursery, \\\"Asarum ikegamii | Japanese Wild Ginger\\\"\",\"url\":\"https://www.plantdelights.com/products/asarum-ikegamii\",\"type\":\"secondary\", 常緑性の多年草で、山地の林床に生育する。葉は長さ6〜10cmの長楕円形で基部が深い心形。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（九州北部固有種のため）\",\"detail\":\"本種の分布は九州北部（福岡県・佐賀県周辺の旧筑紫地方）を中心とする地域に限られ、兵庫県・近畿地方は分布域に含まれない。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が根本的に異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"「佐賀路花散歩（ヒレフリカラマツ、アケボノアオイ）」ブログ記事\",\"url\":\"https://kabuto1952.exblog.jp/38584190\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県産維管束植物目録にも本種の記載は確認できず、九州北部固有種であることと矛盾しない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"地上茎の先に2枚の葉が対生する落葉性草本で、根際から葉が直接出るツクシアオイとは草姿が異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"薄く柔らかい落葉性の葉を持ち、ツクシアオイの厚みのある常緑葉とは質感が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿地方に限定分布する常緑性カンアオイで、九州北部に固有のツクシアオイとは分布域が大きく離れている。\"}],\"source\":{\"name\":\"「佐賀路花散歩」ブログ記事\",\"url\":\"https://kabuto1952.exblog.jp/38584190\",\"type\":\"secondary\"},\"reliabilityNote\":\"詳細な萼筒内部の形態比較データは入手できておらず、生育域と葉質の一般的な違いにとどまる。\"}},{\"id\":\"asarum-kooyanum\",\"nameJa\":\"コウヤカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum kooyanum Makino\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"コウヤカンアオイ\",\"こうやかんあおい\",\"Asarum kooyanum\",\"高野寒葵\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有。基準産地は和歌山県の高野山で、カンアオイ属の中でも紀伊半島に限定される地域固有種の一つとされる。\",\"source\":{\"name\":\"三河の植物観察「カンアオイ Asarum nipponicum var. nipponicum」\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\",\"note\":\"本種の学名史・シノニム関係を解説したページ。狭義のAsarum kooyanum var. kooyanum（コウヤカンアオイ）が高野山を含む和歌山県に限定される一方、より広域に分布する集団は後にAsarum nipponicum（カンアオイ）として別種扱いされた経緯を説明している。\"}},\"japanDistribution\":{\"summary\":\"狭義のコウヤカンアオイ（Asarum kooyanum var. kooyanum）は、基準産地である和歌山県高野山周辺を含む紀伊半島の山地に分布が限定される、近畿地方南部の地域固有種とされる。かつて牧野富太郎により命名されたAsarum kooyanumは、後の研究で紀伊半島に限定される狭義の集団（var. kooyanum）と、本州太平洋岸（千葉県〜東海地方）・瀬戸内側などより広域に分布する集団（後にAsarum nipponicum var. nipponicumとして別種化）とに整理された。\",\"status\":\"自生\",\"source\":{\"name\":\"三河の植物観察「カンアオイ Asarum nipponicum var. nipponicum」\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種は牧野富太郎による古い記載種で分類学的な変遷が複雑であり、狭義の分布域（紀伊半島・高野山周辺）についての一次資料（フロラ調査報告等）には今回アクセスできていない。三河の植物観察サイトの解説は他のシノニム関係の記述とも整合しており、一定の信頼性はあると考えられるが、最新のゲノム解析等による分類の見直しが行われている可能性がある点には留意が必要。\",\"habitat\":\"常緑性の多年草で、紀伊半島の山地林床に生育する。地際に隠れるように壺形の花をつける、カンアオイ属に共通する形態を持つ。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（紀伊半島南部＝和歌山県高野山周辺固有種のため。近畿地方には属するが兵庫県とは別地域）\",\"detail\":\"コウヤカンアオイ（狭義、Asarum kooyanum var. kooyanum）は基準産地の高野山（和歌山県）を含む紀伊半島に分布が限定される近畿地方南部の地域固有種である。和歌山県は兵庫県と同じ近畿地方に属するため、本種は今回調査した10種の中では兵庫県への地理的関連性が比較的高いグループに位置づけられる。しかし実際の自生地は和歌山県・三重県南部の紀伊山地に限られており、大阪府・奈良県を挟んで北西に離れた兵庫県（丹波・但馬・播磨・淡路等）にまで本種が分布するという記録は確認できなかった。なお、広くAsarum nipponicum（カンアオイ）として別種扱いされる近縁の広域分布集団は本州太平洋側〜瀬戸内側に分布するとされるが、これは本種（狭義のコウヤカンアオイ）とは別の分類群であり、混同しないよう注意が必要である。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"三河の植物観察「カンアオイ Asarum nipponicum var. nipponicum」\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"近畿地方南部（紀伊半島）に分布する種であり、他の9種と比べて兵庫県との地理的距離は近いグループに入るが、それでも紀伊半島と兵庫県中北部の間には大阪府・奈良県が介在し、生育記録として兵庫県を含む資料は確認できていない。狭義・広義の分類の混乱がある種であるため、断定的な「完全に無関係」という表現は避け、近畿地方内での位置関係を明示した上で兵庫県への分布拡大の証拠がないと記述した。兵庫県産維管束植物目録での本種の直接的な扱いは今回未確認。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種（狭義）と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは自生地の記録上重ならないため、兵庫県内で本種に似た株を見た場合はこの3種、あるいは兵庫県内に分布する広義のカンアオイ（Asarum nipponicum）である可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"地上茎の先に2枚の葉が対生する落葉性草本で、根際から葉が直接出るコウヤカンアオイとは草姿が明確に異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"薄く柔らかい落葉性の葉を持ち、早春に開花する。コウヤカンアオイの常緑・厚葉の性質とは異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿地方の京都・兵庫周辺に分布する常緑性カンアオイ。紀伊半島南部（和歌山県）に限定されるコウヤカンアオイとは同じ近畿地方内でも自生記録のある地域が異なる。\"}],\"source\":{\"name\":\"三河の植物観察「カンアオイ」\",\"url\":\"https://mikawanoyasou.org/data/kanaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"分類学的な変遷が複雑な種であり、詳細な形態比較データは限定的。近畿地方内での地域的すみ分け（紀伊半島南部 vs 京阪神・兵庫周辺）を中心にまとめた。\"}},{\"id\":\"asarum-kumageanum\",\"nameJa\":\"クワイバカンアオイ\",\"nameJaAlt\":[\"クマゲカンアオイ\"],\"sciName\":\"Asarum kumageanum Masam.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"クワイバカンアオイ\",\"くわいばかんあおい\",\"クマゲカンアオイ\",\"Asarum kumageanum\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有。和名「クマゲ（熊毛）」は鹿児島県熊毛地域（種子島・屋久島などからなる大隅諸島南部）を指す地名に由来し、この地域を中心とした固有種とされる。\",\"source\":{\"name\":\"国立科学博物館プレスリリース（PR TIMES転載）「日本の植物多様性を代表するカンアオイ類ほぼ全種の進化の道筋を解明」\",\"url\":\"https://prtimes.jp/main/html/rd/p/000000083.000047048.html\",\"type\":\"secondary\",\"note\":\"属全体の狭域固有性の一般的裏付けとして参照。和名の地名由来自体が分布地を強く示唆する例。\"}},\"japanDistribution\":{\"summary\":\"鹿児島県熊毛地域（屋久島・種子島などからなる大隅諸島南部の島嶼群）に分布する日本固有種。変種のムラクモアオイ（var. satakeanum）が種子島固有として知られることから、基本変種であるクワイバカンアオイ自体は主に屋久島を中心に分布すると考えられる。\",\"status\":\"自生\",\"source\":{\"name\":\"EVERGREEN植物図鑑「クワイバカンアオイ」\",\"url\":\"https://www.love-evergreen.com/zukan/plant/4418.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"参照した植物図鑑サイトには具体的な分布地の記載がなく、分布地の同定は主に和名の地名由来（熊毛＝屋久島・種子島地域）と、近縁変種ムラクモアオイの種子島固有という記録から推測している部分がある。より一次的なフロラ資料には今回アクセスできておらず、情報の厚みは限定的。\",\"habitat\":\"常緑性の多年草で、暖温帯の照葉樹林の林床に生育する。地際に隠れるように咲く壺形の花をつける、カンアオイ属に共通する形態を持つ。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（鹿児島県熊毛地域＝屋久島・種子島固有種のため）\",\"detail\":\"本種の分布は鹿児島県熊毛地域（屋久島・種子島などの島嶼群）という九州最南端沖の離島地域に限られ、本州に位置する兵庫県・近畿地方とは気候帯・地理的に大きく隔たっている。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が根本的に異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"n カンアオイ\",\"Asarum leucosepalum\",\"カンアオイ\",\"谷村葵\"],\"worldDistribution\":{\"summary\":\"日本固有。琉球列島（南西諸島）に分布する種で、国立科学博物館の南西諸島生物多様性ホットスポット調査データベースにも掲載されている、日本の中でも南方に偏った分布を持つカンアオイ属の一種。\",\"source\":{\"name\":\"国立科学博物館「陸産貝類データベース／ホットスポット調査・琉球」タニムラアオイ\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S21.html\",\"type\":\"primary\"}},\"japanDistribution\":{\"summary\":\"鹿児島県の徳之島（奄美群島、琉球列島に含まれる）に分布する日本固有種で、絶滅危惧種として知られる。琉球列島の照葉樹林内に生育する。\",\"status\":\"自生\",\"source\":{\"name\":\"山川草木図譜「タニムラアオイ」\",\"url\":\"https://neko-net.com/hana/archives/42047\",\"type\":\"secondary\"},\"reliabilityNote\":\"国立科学博物館の南西諸島データベース（「琉球」への分布記載）と個人ブログ（徳之島との具体的な記載）の情報を組み合わせている。徳之島以外の琉球列島島嶼にも産地がある可能性は否定できないが、いずれにせよ南西諸島に限定される分布であることは複数資料で一致している。\",\"habitat\":\"常緑照葉樹林の林床に生育する多年草。3月頃に開花し、地際に隠れるように花をつける、カンアオイ属に共通する形態を持つ。絶滅危惧種として知られる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（鹿児島県徳之島＝琉球列島固有種のため）\",\"detail\":\"本種の分布は鹿児島県徳之島を含む琉球列島（南西諸島）に限られ、本州に位置する兵庫県・近畿地方とは気候帯・地理的に大きく隔たっている。この点で兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が根本的に異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"国立科学博物館「ホットスポット調査・琉球」タニムラアオイ\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S21.html\",\"type\":\"primary\"},\"reliabilityNote\":\"兵庫県産維管束植物目録にも本種の記載は確認できず、琉球列島固有種であることと矛盾しない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"地上茎の先に2枚の葉が対生する落葉性草本で、根際から葉が直接出るタニムラアオイとは草姿が異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"薄く柔らかい落葉性の葉を持ち、亜熱帯性の照葉樹林に生育する常緑性のタニムラアオイとは生育環境・葉質が異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"近畿地方の温帯域に分布する常緑性カンアオイで、亜熱帯の琉球列島（徳之島）に固有のタニムラアオイとは分布域・気候帯が全く異なる。\"}],\"source\":{\"name\":\"国立科学博物館「ホットスポット調査・琉球」タニムラアオイ\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S21.html\",\"type\":\"primary\"},\"reliabilityNote\":\"詳細な形態比較データは入手できておらず、生育域・気候帯の違いを中心にまとめた。\"}},{\"id\":\"asarum-lutchuense\",\"nameJa\":\"オオバカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum lutchuense (Honda) Koidz.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"オオバカンアオイ\",\"おおばかんあおい\",\"Asarum lutchuense\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的分布は奄美大島・徳之島（鹿児島県奄美群島）に限られ、日本国外には分布しない。\",\"source\":{\"name\":\"国立科学博物館「日本の生物多様性ホットスポット」データベース\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S22.html\",\"type\":\"secondary\",\"note\":\"奄美群島の生物多様性ホットスポット紹介ページ\"}},\"japanDistribution\":{\"summary\":\"奄美大島・徳之島（鹿児島県奄美群島）に分布する常緑カンアオイ。琉球列島北部の固有種。\",\"status\":\"自生\",\"source\":{\"name\":\"牧野植物図鑑ウェブ版（botanic.jp）\",\"url\":\"https://www.botanic.jp/plants-aa/oobaka.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布情報は複数の一般向け植物データベースで一致しているが、学術的な分布論文の一次確認は行っていない。\",\"habitat\":\"亜熱帯の常緑広葉樹林の林床。草丈10〜20cmの常緑多年草で、葉は厚く光沢がある。12月〜5月に地際で緑紫〜暗紫褐色の花をつけ、萼裂片は外側に反り返る。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（奄美群島固有種のため）\",\"detail\":\"本種は奄美大島・徳之島（鹿児島県奄美群島）に分布が限られる琉球列島北部固有の常緑カンアオイで、亜熱帯性の気候に適応した種である。兵庫県・近畿地方を含む本州の温帯域には全く分布しておらず、両地域は1000km近く離れている。兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"国立科学博物館「日本の生物多様性ホットスポット」データベース\",\"url\":\"https://www.kahaku.go.jp/research/activities/project/hotspot_japan/ryukyus/db/S22.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"兵庫県産維管束植物目録等の一次資料は参照していないが、本種の分布が奄美群島に限定されることは複数の資料で一致しており、兵庫県での自生は地理的にありえないと判断できる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が全く重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で茎の先に2枚の葉をつけ、葉は薄く艶がない。オオバカンアオイは常緑で葉が厚く光沢があり、花期も冬〜春と異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉が薄く無毛に近い。オオバカンアオイは常緑で葉が厚く、萼裂片が外側に反り返る点で異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"落葉性で葉の表面や葉柄に粗い毛が目立つ。オオバカンアオイは常緑で毛が少なく葉がより厚い。\"}],\"source\":{\"name\":\"三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/hutabaaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"オオバカンアオイと兵庫県産3種との直接の形態比較資料は限られるため、一般的な特徴（常緑性・落葉性の別、葉の質感）に基づく概略比較である。\"}},{\"id\":\"asarum-majale\",\"nameJa\":\"コトウカンアオイ\",\"nameJaAlt\":[],\"sciName\":\"Asarum majale T.Sugaw.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"コトウカンアオイ\",\"ことうかんあおい\",\"Asarum majale\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的分布は近畿地方の鈴鹿山脈（滋賀県・三重県境）に限られ、日本国外には分布しない。\",\"source\":{\"name\":\"Wikipedia日本語版「コトウカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/コトウカンアオイ\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"近畿地方の鈴鹿山脈、藤原岳・鍋尻山・日本コバなど滋賀県・三重県境の石灰岩地の山域に分布が限られる常緑カンアオイ。\",\"status\":\"自生\",\"source\":{\"name\":\"Wikipedia日本語版「コトウカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/コトウカンアオイ\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布情報はWikipedia記事に基づくが、記載された産地（藤原岳・鍋尻山・日本コバ等）はレッドリスト関連資料とも整合的である。\",\"habitat\":\"低山地の広葉樹林下。常緑多年草で短い根茎の先端から毎年1枚の葉を出す。5月中旬〜下旬に開花する遅咲きの種。環境省レッドリスト絶滅危惧II類。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（鈴鹿山脈固有種のため）\",\"detail\":\"本種は近畿地方に属するとはいえ、分布は滋賀県・三重県境の鈴鹿山脈（藤原岳・鍋尻山・日本コバ等）の石灰岩地に強く限定されており、そこから100km以上離れた兵庫県には分布が及んでいない。同じ近畿地方の種ではあるが兵庫県内での自生記録はなく、兵庫県内に分布記録のあるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域が異なる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"Wikipedia日本語版「コトウカンアオイ」\",\"url\":\"https://ja.wikipedia.org/wiki/コトウカンアオイ\",\"type\":\"secondary\"},\"reliabilityNote\":\"本種は今回調査した10種の中で唯一近畿地方内に分布する点で他種より地理的に兵庫県に近いため要注意フラグとして明記する。ただし鈴鹿山脈の石灰岩地という限定的な生育環境と兵庫県からの距離を踏まえると、兵庫県内での自生記録は確認されていない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カンアオイ属は葉の形や地際に隠れるように咲く花の外見が互いに似ており、種の識別には専門的な観察が必要とされる。本種と兵庫県内で見られるフタバアオイ・ウスバサイシン・ミヤコアオイとは分布域がほぼ重ならないため、兵庫県内で本種に似た株を見た場合はこの3種のいずれかである可能性が高い。\",\"items\":[{\"name\":\"フタバアオイ\",\"sciName\":\"Asarum caulescens Maxim.\",\"distinguishingPoints\":\"落葉性で花期は4〜5月上旬、萼はほぼ扁平な浅い皿状。コトウカンアオイは常緑で花期が5月中旬以降と遅く、萼は鐘形で内側に多数の隆起線がある点で異なる。\"},{\"name\":\"ウスバサイシン\",\"sciName\":\"Asarum sieboldii Miq.\",\"distinguishingPoints\":\"落葉性で葉が薄く、萼筒は壺形で開口部が狭い。コトウカンアオイは常緑で葉が厚く光沢があり、開花期が遅い点で異なる。\"},{\"name\":\"ミヤコアオイ\",\"sciName\":\"Asarum asperum F.Maek.\",\"distinguishingPoints\":\"落葉性で葉に粗い毛が目立つ。コトウカンアオイは常緑で毛は少なく、萼裂片内面の隆起が発達する点で異なる。\"}],\"source\":{\"name\":\"三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/hutabaaoi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"コトウカンアオイと兵庫県産3種との詳細な形態比較資料は限られるため、一般的な特徴に基づく概略比較である。\"}},{\"id\":\"asarum-maruyamae\",\"nameJa\":\"イズモサイシン\",\"nameJaAlt\":[],\"sciName\":\"Asarum maruyamae Yamaji et Ter.Nakam.\",\"family\":\"ウマノスズクサ科 Aristolochiaceae\",\"searchTerms\":[\"イズモサイシン\",\"いずもさいしん\",\"Asarum maruyamae\",\"カンアオイ\"],\"worldDistribution\":{\"summary\":\"日本固有種。世界的分布は中国地方（島根県東部〜鳥取県中部、広島県北東部〜岡山県北部）に限られ、日本国外には分布しない。\",\"source\":{\"name\":\"Wikipedia日本語版「イズモサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/イズモサイシン\",\"type\":\"secondary\"}},\"japanDistribution\":{\"summary\":\"中国地方の島根県東部から鳥取県中部、広島県北東部から岡山県北部にかけて分布する落葉性カンアオイ。2007年に新種記載され、2024年公表の研究で分布域が島根単県から4県にまたがることが判明した。\",\"status\":\"自生\",\"source\":{\"name\":\"Wikipedia日本語版「イズモサイシン」\",\"url\":\"https://ja.wikipedia.org/wiki/イズモサイシン\",\"type\":\"secondary\"},\"reliabilityNote\":\"2024年公表の最新研究により分布域の理解が更新されており、本情報はその内容を反映している。\",\"habitat\":\"山地の落葉広葉樹林の林床、小渓流沿いの林縁。根茎は短く地表を這い、毎年1〜2枚の葉をつける。3月下旬〜4月上旬に開花。環境省レッドリスト情報不足(DD)。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に分布なし（中国地方固有種のため）\",\"detail\":\"本種の分布は中国地方（島根県東部〜鳥取県中部、広島県北東部〜岡山県北部）に限られ、鳥取県内でも中部までにとどまり、兵庫県と接する鳥取県東部までは達していない。兵庫県・近畿地方は分布域に含まれず、兵庫県内に分布記録のあるフタバアオイ・ウ
