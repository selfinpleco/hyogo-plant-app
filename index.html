<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>兵庫植物ノート（パイロット版）</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="兵庫植物ノート">
<meta name="theme-color" content="#1f6b4d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --green-900:#173d2c;
    --green-800:#1f6b4d;
    --green-700:#2c8562;
    --green-100:#e8f3ec;
    --green-050:#f4f9f6;
    --ink:#1c2620;
    --ink-soft:#4b5a52;
    --line:#dbe6df;
    --amber:#b5762a;
    --amber-bg:#fbf1e2;
    --red:#a13a3a;
    --red-bg:#fbeaea;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--green-050);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--green-050);display:flex;flex-direction:column;}

  header.top{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,var(--green-800),var(--green-700));
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  header.top h1{margin:0 0 2px;font-size:1.15rem;font-weight:700;letter-spacing:.02em;}
  header.top p{margin:0;font-size:.72rem;opacity:.85;}
  .offline-badge{
    display:inline-flex;align-items:center;gap:4px;
    margin-top:8px;font-size:.68rem;background:rgba(255,255,255,.15);
    padding:3px 9px;border-radius:999px;
  }
  .offline-badge .dot{width:6px;height:6px;border-radius:50%;background:#7ee2ab;}

  .search-wrap{padding:14px 16px 6px;}
  .search-box{
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .search-box svg{flex:0 0 auto;color:var(--green-700);}
  .search-box input{
    border:none;outline:none;flex:1;font-size:1rem;background:transparent;color:var(--ink);
  }
  .search-box input::placeholder{color:#9aa8a0;}
  .clear-btn{border:none;background:none;color:#9aa8a0;font-size:1.1rem;padding:2px 4px;display:none;}

  .filter-row{padding:0 16px;margin-top:10px;}
  .filter-toggle{
    display:inline-flex;align-items:center;gap:7px;
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:7px 12px 7px 10px;font-size:.8rem;color:var(--ink);
    cursor:pointer;user-select:none;
  }
  .filter-toggle input{
    appearance:none;-webkit-appearance:none;width:17px;height:17px;flex:0 0 auto;
    border:1.5px solid var(--line);border-radius:5px;background:#fff;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    position:relative;margin:0;
  }
  .filter-toggle input:checked{background:var(--green-700);border-color:var(--green-700);}
  .filter-toggle input:checked::after{
    content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);
  }
  .filter-toggle .count-hint{color:var(--ink-soft);font-size:.72rem;}

  .scope-note{
    margin:8px 16px 0;padding:10px 12px;background:var(--amber-bg);color:#7a4d17;
    border-radius:10px;font-size:.78rem;line-height:1.5;
  }

  main{flex:1;padding:10px 16px 24px;}

  .result-count{font-size:.75rem;color:var(--ink-soft);margin:10px 2px 8px;}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card:active{background:var(--green-100);}
  .card .name-block .ja{font-size:1.05rem;font-weight:700;}
  .card .name-block .alt{font-size:.72rem;color:var(--ink-soft);margin-top:1px;}
  .card .name-block .sci{font-size:.8rem;font-style:italic;color:var(--green-800);margin-top:3px;}
  .card .name-block .fam{font-size:.7rem;color:var(--ink-soft);margin-top:4px;}
  .genus-tag{color:var(--green-700,#3a7350);text-decoration:underline dotted;cursor:pointer;}
  .genus-tag:hover, .genus-tag:focus{color:var(--green-900,#1f4230);}
  .chev{color:#b7c3bc;font-size:1.1rem;flex:0 0 auto;}

  .badge{
    display:inline-block;font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:999px;
    white-space:nowrap;
  }
  .badge.yes{background:var(--green-100);color:var(--green-800);}
  .badge.no{background:#eef0ee;color:#6b776f;}

  .empty{
    text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:.9rem;line-height:1.7;
  }

  /* Detail view */
  .detail{display:none;}
  .detail.active{display:block;}
  .list-view.hidden{display:none;}

  .detail-header{
    background:linear-gradient(180deg,var(--green-800),var(--green-700));
    color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 20px;
    position:sticky;top:0;z-index:10;
  }
  .back-btn{
    display:inline-flex;align-items:center;gap:4px;color:#fff;background:rgba(255,255,255,.15);
    border:none;border-radius:999px;padding:6px 12px 6px 8px;font-size:.85rem;margin-bottom:14px;
  }
  .detail-header .ja{font-size:1.4rem;font-weight:800;}
  .detail-header .alt{font-size:.78rem;opacity:.85;margin-top:2px;}
  .detail-header .sci{font-style:italic;font-size:.95rem;margin-top:6px;opacity:.95;}
  .detail-header .fam{font-size:.78rem;margin-top:6px;opacity:.85;}

  .detail-body{padding:16px;}

  .section{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .section h2{
    margin:0 0 10px;font-size:.85rem;font-weight:700;color:var(--green-800);
    display:flex;align-items:center;gap:6px;
    text-transform:uppercase;letter-spacing:.03em;
  }
  .section h2 .ico{font-size:1rem;}
  .section p.summary{margin:0 0 10px;font-size:.92rem;line-height:1.75;}

  .status-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;
    padding:6px 12px;border-radius:999px;margin-bottom:10px;
  }
  .status-pill.yes{background:var(--green-100);color:var(--green-800);}
  .status-pill.no{background:#eef0ee;color:#5c6a62;}
  .status-pill.info{background:#e7eef9;color:#33547d;}

  .fact-row{display:flex;gap:8px;font-size:.82rem;padding:5px 0;border-top:1px dashed var(--line);}
  .fact-row:first-of-type{border-top:none;}
  .fact-row .k{flex:0 0 84px;color:var(--ink-soft);}
  .fact-row .v{flex:1;}

  .source{
    margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:.74rem;color:var(--ink-soft);line-height:1.6;
  }
  .source .tag{
    display:inline-block;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;
  }
  .source .tag.primary{background:var(--green-100);color:var(--green-800);}
  .source .tag.secondary{background:var(--amber-bg);color:#7a4d17;}
  .source a{color:var(--green-800);word-break:break-all;}
  .reliability-note{
    margin-top:8px;padding:8px 10px;background:var(--amber-bg);color:#7a4d17;
    border-radius:8px;font-size:.72rem;line-height:1.6;
  }

  .family-note-card{
    border-left:4px solid var(--amber);
  }

  .sub-heading{
    font-size:.78rem;font-weight:700;color:var(--green-800);
    margin:14px 0 4px;display:flex;align-items:center;gap:5px;
  }
  .habitat-block p.summary{margin:0 0 4px;}

  .locality-list{
    list-style:none;margin:6px 0 0;padding:0;
    display:flex;flex-direction:column;gap:6px;
  }
  .locality-list li{
    font-size:.8rem;line-height:1.55;padding:7px 10px;
    background:var(--green-050);border-radius:8px;border:1px solid var(--line);
  }
  .locality-list li .idx{
    display:inline-block;min-width:1.4em;color:var(--green-700);font-weight:700;margin-right:4px;
  }
  .locality-count{
    font-size:.74rem;color:var(--ink-soft);margin:2px 0 0;
  }

  .similar-list{
    display:flex;flex-direction:column;gap:8px;margin:8px 0 0;
  }
  .similar-item{
    padding:9px 11px;background:#fdf7ec;border:1px solid #f0dfb8;border-radius:10px;
  }
  .similar-item.linkable{
    cursor:pointer;transition:background .12s ease;
  }
  .similar-item.linkable:active,
  .similar-item.linkable:hover{
    background:#faedcc;
  }
  .similar-name{
    font-size:.85rem;font-weight:700;color:#7a4d17;margin-bottom:3px;
    display:flex;align-items:center;flex-wrap:wrap;gap:2px;
  }
  .similar-sci{
    font-weight:400;font-style:italic;color:#9a7a3d;margin-left:6px;font-size:.75rem;
  }
  .similar-chev{
    margin-left:auto;color:#b3893f;font-weight:700;font-size:1rem;padding-left:6px;
  }
  .similar-unavail{
    margin-left:auto;color:#a99a86;font-weight:400;font-size:.68rem;padding-left:6px;white-space:nowrap;
  }
  .similar-points{
    font-size:.8rem;line-height:1.6;color:#4a4139;
  }

  footer.app-footer{
    text-align:center;padding:18px 16px 30px;color:#9aa8a0;font-size:.68rem;line-height:1.7;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- LIST VIEW -->
  <div id="listView" class="list-view">
    <header class="top">
      <h1>兵庫植物ノート</h1>
      <p>分布域 × 兵庫県での記録有無を調べる（野外観察用）</p>
      <div class="offline-badge"><span class="dot"></span>オフラインで使用可能</div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" inputmode="search" placeholder="植物名の一部を入力（例：ソテツ）" autocomplete="off" autocapitalize="off" autocorrect="off">
        <button class="clear-btn" id="clearBtn">×</button>
      </div>
    </div>

    <div class="filter-row">
      <label class="filter-toggle" for="hyogoOnlyToggle">
        <input type="checkbox" id="hyogoOnlyToggle">
        <span>兵庫県内に記録がある植物のみ表示</span>
      </label>
    </div>

    <div class="scope-note" id="scopeNote"></div>

    <main>
      <div class="result-count" id="resultCount"></div>
      <div id="resultList"></div>
      <div id="emptyState" class="empty" style="display:none;"></div>
    </main>

    <footer class="app-footer" id="footerInfo"></footer>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detailView" class="detail">
    <div class="detail-header">
      <button class="back-btn" id="backBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        一覧に戻る
      </button>
      <div class="ja" id="dJa"></div>
      <div class="alt" id="dAlt"></div>
      <div class="sci" id="dSci"></div>
      <div class="fam" id="dFam"></div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

</div>

<script>
// ============ DATA ============
// data.js — 兵庫植物ノート データファイル
// PLANT_DATAはJSON文字列として保持し、JSON.parseでロードする（iOS Safari対応）
const PLANT_DATA = JSON.parse("{\"generatedAt\":\"2026-08-09\",\"scopeNote\":\"対象は裸子植物（ソテツ科・ザミア科・イチョウ科・ウェルウィッチア科・グネツム科・マオウ科・マツ科・ナンヨウスギ科・マキ科・コウヤマキ科・ヒノキ科・イチイ科の12科）、および基部被子植物・モクレン類の全8目（アンボレラ目・スイレン目・シキミ目・センリョウ目・カネラ目・コショウ目・モクレン目・クスノキ目）です。これにより、当初計画していた「裸子植物＋基部被子植物・モクレン類」の範囲は全て収録が完了しました。種の選定は、兵庫県での野外観察という目的に照らし、YList掲載種のうち日本での自生・帰化種（自然変種・自然雑種を含む）、および国内で広く植栽され野外で見かける機会が多い代表的な栽培種を中心に収録しました（分類学上のシノニムや、園芸品種としての細かな色・樹形バリエーション、および明確な人工交配起源の園芸雑種は基本的に対象外としています）。一方、日本に自生する種であれば、分布が兵庫県・近畿地方に及ばず遠隔地の固有種であるという理由だけでは収録対象から除外していません。そのような種についても「兵庫県内に分布記録なし」の参考ページとして収録し、世界・日本国内の分布や兵庫県に分布しない地理的理由を明記した上で、類似する兵庫県産種との識別点とあわせて掲載しています（例：カンアオイ属では兵庫県内に分布するフタバアオイ・ウスバサイシン・ミヤコアオイの3種に加え、日本に自生する近縁70種すべてを「分布記録なし」ページとして収録しました）。この方針に基づき、既収録の目（裸子植物・アンボレラ目・スイレン目・シキミ目・センリョウ目・カネラ目・コショウ目）についても地理的理由のみでの除外がないか点検し、シラビソ、コウホネ属・ウマノスズクサ属の未収録種など12種を追加収録した経緯があります。モクレン目では、コブシ・ホオノキ・タムシバ・オガタマノキ等の兵庫県内自生種に加え、キタコブシ・シデコブシ・オオヤマレンゲ・コブシモドキ・タイワンオガタマノキ・クロボウモドキ（バンレイシ科）等、日本に自生するが兵庫県には分布しない種も「分布記録なし」ページとして収録し、ハクモクレン・タイサンボク・ユリノキ等、県内で広く植栽される代表的な栽培種もあわせて収録しています。最後に追加したクスノキ目では、クスノキ・ヤブニッケイ・クロモジ・オオバクロモジ・アオガシ・タブノキ・イヌガシ・シロダモ等の兵庫県内自生種、キタコブシに準じてオキナワコウバシ・オオバクロモジ等の変種・地方分化を含む種、帰化種テンダイウヤク、および県内で植栽されるゲッケイジュ・ロウバイ・ソシンロウバイを収録する一方、小笠原諸島や南西諸島固有種（ナガバシロダモ・ハスノハギリ・コブガシ等）は「分布記録なし」ページとして収録しました。なお、マルバヤブニッケイ（Cinnamomum brevifolium）はPOWOとGBIF/Catalogue of Lifeの間でどの分類群を指すか見解が一致せず、分類学的実体が不安定なため個別種としての収録を見送りました。またテングノハナについては、兵庫県内（美方郡新温泉町）に1件のGBIF標本記録が存在するものの、本種の国内での既知自生地が石垣島の1か所・2個体に限られる極めて希少な種であることと整合しないため、産地誤記または同定誤りの可能性が高いと判断し「分布記録なし」として扱いました（同様の判断はコショウ目のイトスナヅルでも行っています）。自生・栽培例がほぼ皆無の科（アンボレラ科・カネラ科・シキミモドキ科・デゲネリア科・ニクズク科等）については個別の種ではなく科単位の説明ノートとして収録しています。\\n\\n【単子葉類の追加（ショウブ目・オモダカ目）】ショウブ目ショウブ科3種（ショウブ・セキショウ・ヒメセキショウ）、およびオモダカ目のオモダカ科・アマモ科・カワツルモ科・ベニアマモ科・チシマゼキショウ科・シバナ科・ホロムイソウ科・トチカガミ科の計9科・69種（自然雑種を含む）を追加収録しました。トチカガミ科では、淡水生のスブタ属・オオカナダモ属・コカナダモ属・クロモ属・トチカガミ属・ミズオオバコ属・セキショウモ属、絶滅危惧種の多いイバラモ属（11タキサ）、および海産のウミショウブ属・ウミヒルモ属・リュウキュウスガモ属（11タキサ、うち兵庫県記録があるのはウミヒルモ1種のみ）を収録しています。なお、セイヨウオモダカ（Sagittaria sagittifolia）は日本国内での定着自体が確認できなかったため収録を見送りました。ネジレモ（Vallisneria natans var. biwaensis）は「琵琶湖・淀川水系固有」とする通説に反し、兵庫県内（たつの市・神戸市西区・赤穂市）から複数の独立した標本記録が確認されたため、その齟齬を明記した上で収録しています。オモダカ目の残りの科（ヒルムシロ科、およびテンナンショウ属64分類群を含むサトイモ科）は今後の追加作業で収録予定です。\",\"hyogoCatalog\":{\"title\":\"兵庫県産維管束植物（兵庫県立人と自然の博物館）\",\"volumes\":12,\"url\":\"https://www.hitohaku.jp/publication/book/hyogoikansokusyokubutu.html\",\"note\":\"全12巻。第1巻はシダ植物、第2巻は裸子植物および被子植物の一部を扱う。凡例として「園芸目的に輸入されたものや農作物など明らかに栽培植物と思われる標本は除外したが、自生のものか野生化したものか判断しにくい標本はすべて記録されている」との記載があり、明白な植栽・栽培品は目録から除外される方針。\"},\"families\":[{\"familyNameJa\":\"イチョウ科\",\"familyNameLatin\":\"Ginkgoaceae\"},{\"familyNameJa\":\"ソテツ科\",\"familyNameLatin\":\"Cycadaceae\"},{\"familyNameJa\":\"ザミア科\",\"familyNameLatin\":\"Zamiaceae\"},{\"familyNameJa\":\"ウェルウィッチア科\",\"familyNameLatin\":\"Welwitschiaceae\"},{\"familyNameJa\":\"グネツム科\",\"familyNameLatin\":\"Gnetaceae\"},{\"familyNameJa\":\"マオウ科\",\"familyNameLatin\":\"Ephedraceae\"},{\"familyNameJa\":\"マツ科\",\"familyNameLatin\":\"Pinaceae\"},{\"familyNameJa\":\"ナンヨウスギ科\",\"familyNameLatin\":\"Araucariaceae\"},{\"familyNameJa\":\"マキ科\",\"familyNameLatin\":\"Podocarpaceae\"},{\"familyNameJa\":\"コウヤマキ科\",\"familyNameLatin\":\"Sciadopityaceae\"},{\"familyNameJa\":\"ヒノキ科\",\"familyNameLatin\":\"Cupressaceae\"},{\"familyNameJa\":\"イチイ科\",\"familyNameLatin\":\"Taxaceae\"},{\"familyNameJa\":\"アンボレラ科\",\"familyNameLatin\":\"Amborellaceae\"},{\"familyNameJa\":\"カネラ科\",\"familyNameLatin\":\"Canellaceae\"},{\"familyNameJa\":\"シキミモドキ科\",\"familyNameLatin\":\"Winteraceae\"},{\"familyNameJa\":\"ジュンサイ科\",\"familyNameLatin\":\"Cabombaceae\"},{\"familyNameJa\":\"スイレン科\",\"familyNameLatin\":\"Nymphaeaceae\"},{\"familyNameJa\":\"マツブサ科\",\"familyNameLatin\":\"Schisandraceae\"},{\"familyNameJa\":\"センリョウ科\",\"familyNameLatin\":\"Chloranthaceae\"},{\"familyNameJa\":\"ウマノスズクサ科\",\"familyNameLatin\":\"Aristolochiaceae\"},{\"familyNameJa\":\"コショウ科\",\"familyNameLatin\":\"Piperaceae\"},{\"familyNameJa\":\"ドクダミ科\",\"familyNameLatin\":\"Saururaceae\"},{\"familyNameJa\":\"モクレン科\",\"familyNameLatin\":\"Magnoliaceae\"},{\"familyNameJa\":\"バンレイシ科\",\"familyNameLatin\":\"Annonaceae\"},{\"familyNameJa\":\"クスノキ科\",\"familyNameLatin\":\"Lauraceae\"},{\"familyNameJa\":\"ハスノハギリ科\",\"familyNameLatin\":\"Hernandiaceae\"},{\"familyNameJa\":\"ロウバイ科\",\"familyNameLatin\":\"Calycanthaceae\"},{\"familyNameJa\":\"ショウブ科\",\"familyNameLatin\":\"Acoraceae\"},{\"familyNameJa\":\"オモダカ科\",\"familyNameLatin\":\"Alismataceae\"},{\"familyNameJa\":\"アマモ科\",\"familyNameLatin\":\"Zosteraceae\"},{\"familyNameJa\":\"カワツルモ科\",\"familyNameLatin\":\"Ruppiaceae\"},{\"familyNameJa\":\"ベニアマモ科\",\"familyNameLatin\":\"Cymodoceaceae\"},{\"familyNameJa\":\"チシマゼキショウ科\",\"familyNameLatin\":\"Tofieldiaceae\"},{\"familyNameJa\":\"シバナ科\",\"familyNameLatin\":\"Juncaginaceae\"},{\"familyNameJa\":\"ホロムイソウ科\",\"familyNameLatin\":\"Scheuchzeriaceae\"},{\"familyNameJa\":\"トチカガミ科\",\"familyNameLatin\":\"Hydrocharitaceae\"}],\"species\":[{\"id\":\"ginkgo-biloba\",\"nameJa\":\"イチョウ\",\"nameJaAlt\":[],\"sciName\":\"Ginkgo biloba L.\",\"family\":\"イチョウ科 Ginkgoaceae\",\"searchTerms\":[\"イチョウ\",\"いちょう\",\"銀杏\",\"ginkgo\",\"Ginkgo biloba\"],\"worldDistribution\":{\"summary\":\"確実な自生地は中国浙江省の一部地域に限られるとされる（隔離分布の遺存種）。世界各地（日本・韓国・欧州・北米など）では古くから植栽により導入され広く見られるが、それらは「導入（introduced）」であり自生ではない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Ginkgo biloba L.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262125-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is China (Zhejiang).\\\" Native to: China Southeast。Introduced into: Austria, China North-Central, China South-Central, Illinois, Japan, Korea, Romania 等。\"}},\"japanDistribution\":{\"summary\":\"日本国内に確実な自生集団は確認されておらず、寺社・公園・街路樹などとして古くから植栽されているのみ（POWO上でも「introduced」扱い）。\",\"status\":\"植栽のみ（自生の確証なし）\",\"source\":{\"name\":\"Plants of the World Online (Kew)\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262125-1\",\"type\":\"primary\"},\"reliabilityNote\":\"日本国内の自生の有無は研究者間でも議論があるとされるが、一次資料であるPOWOでは自生地に日本を含めていない。より詳細な学術的議論の追加調査は今後の課題。\",\"habitat\":\"自生ではなく、古くから寺院・神社の境内、庭園、公園、街路樹として北海道から沖縄まで全国的に植栽される。土地を選ばず生育し、大気汚染や強い剪定、病虫害にも強い適応力の高さに加え、樹皮が厚くコルク質で気泡を含むため耐火性に優れることから、江戸時代の火除け地や社寺境内に好んで植えられてきた。標高や立地を問わず、都市部の街路・公園から山間の寺社境内まで幅広い環境で植栽が可能である。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外）\",\"detail\":\"兵庫県産維管束植物 第2巻（裸子植物を扱う巻）の本文を確認したところ、「イチョウ」「Ginkgo」の語は一度も登場しない。同巻凡例に「明らかな栽培植物と思われる標本は除外した」とあり、イチョウは兵庫県内で自生が確認されておらず植栽のみであるため、目録の対象（自生種カタログ）から除外されているとみられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、目録本文に明示的な除外種リストがあるわけではない。将来的に他巻（追加報告等）に記載がないか、全巻での確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":false,\"note\":\"現存する種子植物の中でイチョウ科はイチョウ1種のみであり、扇形で二又分岐する葉脈をもつ独特な葉形・葉序は他のどの樹木とも似ておらず、野外で他種と混同される可能性はきわめて低い。太く縦に粗い割れ目の入る樹皮、晩秋に葉が鮮やかに黄葉して一斉に落葉する様子、雌株につく肉質で悪臭のある種子（ぎんなん）も他の裸子植物には見られない組み合わせで、識別は容易である。なお英名Maidenhair tree（メイデンヘアツリー）は、葉1枚1枚の形がシダ植物のアジアンタム（クジャクシダ属、和名「ホウライシダ」の仲間）の小葉に似ることに由来する呼び名だが、これは葉形の連想にすぎず、シダ植物全体の姿やアジアンタム自体と野外で見誤ることはない。\",\"source\":{\"name\":\"イチョウ - 庭木図鑑 植木ペディア\",\"url\":\"https://www.uekipedia.jp/%E8%90%BD%E8%91%89%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%A4%E3%83%81%E3%83%A7%E3%82%A6/\",\"type\":\"secondary\"},\"reliabilityNote\":\"イチョウが他種と混同されないことは分類学的にも形態学的にも広く知られた事実だが、この点を明示的に論じた一次資料は見当たらなかったため、樹木図鑑サイト（庭木図鑑）と一般的な植物学的知見に基づいて記載した。\"}},{\"id\":\"cycas-revoluta\",\"nameJa\":\"ソテツ\",\"nameJaAlt\":[\"蘇鉄\"],\"sciName\":\"Cycas revoluta Thunb.\",\"family\":\"ソテツ科 Cycadaceae\",\"searchTerms\":[\"ソテツ\",\"そてつ\",\"蘇鉄\",\"cycas\",\"Cycas revoluta\"],\"worldDistribution\":{\"summary\":\"自生地は中国福建省、日本（四国南部・九州）、台湾東部にかけての亜熱帯域。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cycas revoluta Thunb.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:328823-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is China (Fujian), Japan (S. Shikoku, Kyushu) to E. Taiwan.\\\" Native to: China Southeast, Japan, Nansei-shoto, Taiwan。\"}},\"japanDistribution\":{\"summary\":\"国内の自生北限は宮崎県串間市都井岬とされ、九州南部から南西諸島にかけて自生する。本州（兵庫県を含む）には自生せず、庭園樹・寺社の植栽として古くから利用されている。\",\"status\":\"九州南部〜南西諸島に自生／本州では植栽のみ\",\"source\":{\"name\":\"ソテツ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%BD%E3%83%86%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaを一次資料の補完として使用。学術的な一次資料（都道府県レッドデータブック等）による裏付けは今後の課題。\",\"habitat\":\"国内自生地（宮崎県串間市都井岬など九州南部〜南西諸島）では、主に海岸の風衝地や崖、石灰岩地など貧栄養で乾燥した立地に生育し、根に共生する窒素固定シアノバクテリアの働きで痩せ地でも育つ。兵庫県を含む本州には自生せず、関東以西の温暖な地域で寺社境内・庭園・公園・学校・官公庁などに植栽樹として利用される。乾燥や潮風には強い一方で寒さにはやや弱いため、水はけの良い土壌と日当たり・風通しの良い場所が好まれ、寒冷な地域では冬季に薦を巻くなどの防寒対策が施される。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（自生地外・植栽のため対象外）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を確認したところ、「ソテツ」「Cycas」の語は一度も登場しない。ソテツの自生北限は宮崎県であり兵庫県は自生範囲外。兵庫県内で見られる個体は庭園・寺社等への植栽によるものであり、目録の凡例にある「明らかな栽培植物」として対象外になっているとみられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認。全12巻の網羅的確認は今後の課題。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じソテツ科・ソテツ属の近縁種は日本国内にほとんど自生・栽培されておらず直接の混同は起こりにくいが、幹の先端に葉が集まって放射状に広がる樹形が似ているヤシ科植物（シュロ・フェニックスなど）や、同様の姿をとる木生シダ（ヘゴ類）とは、分類上まったく異なる系統であるにもかかわらず一般の観察者には誤認されやすい。\",\"items\":[{\"name\":\"シュロ（ワジュロ）\",\"sciName\":\"Trachycarpus fortunei\",\"distinguishingPoints\":\"シュロはヤシ科（真の被子植物）で、ソテツとは類縁関係にない。葉は掌状複葉（手のひら状に扇形に開く）で、葉身は薄く柔らかい。一方ソテツの葉は羽状複葉で、細い線形の小葉が羽根のように多数並び、質は硬く先端が鋭く尖って触ると痛い上、小葉の縁が裏側に反り返る（革質で光沢がある）。幹の表面も、シュロは黒褐色の粗い繊維（棕櫚毛）に覆われるのに対し、ソテツは落ちた古い葉の葉柄基部が鱗状・鎧状にびっしりと張り付いて硬い樹皮状になる点で区別できる。また果実もシュロは小さな黒紫色の液果が房状に付くが、ソテツは幹頂に大型のオレンジ色の種子（雌株）または黄褐色の毬状の雄花（雄株）を付ける。\"},{\"name\":\"フェニックス（カナリーヤシなど）\",\"sciName\":\"Phoenix canariensis / Phoenix roebelenii\",\"distinguishingPoints\":\"フェニックス類もヤシ科で、羽状複葉をもつためソテツと葉の輪郭が似て見えることがあるが、小葉はソテツより柔らかくしなやかで、縁の反り返りがない。幹はまっすぐ太く、古い葉の落ちた跡がひし形の模様として残るのみで、ソテツのような鎧状の葉柄基部の積み重なりは見られない。花や果実も、フェニックスは小さな実がヤシ科特有の房状の花序に多数つくのに対し、ソテツは幹の中心に大型の球果状構造（大胞子葉・小胞子葉）を1個つける点で大きく異なる。\"},{\"name\":\"ヘゴ・クロヘゴなどの木生シダ\",\"sciName\":\"Cyathea spp.（ヘゴ科）\",\"distinguishingPoints\":\"ヘゴ類はシダ植物であり種子植物のソテツとは全く系統が異なるが、太い幹の先端に大きな葉が放射状に集まって広がる樹形（ロゼット状の樹冠）が遠目にはソテツやヤシに似る。ヘゴの幹は木質の年輪ではなく、不定根が茎の周囲を覆って形成された繊維質の塊であり、表面に古い葉柄の落ちた丸い痕が並ぶ。葉（葉状体）はソテツよりはるかに大きく、2〜3回羽状に細かく分岐する柔らかいシダ特有の質感で、花や種子は一切つけず、葉裏に胞子嚢群をつけて胞子で増える点がソテツ（球果状の生殖器官と種子をつくる裸子植物）との決定的な違いとなる。\"}],\"source\":{\"name\":\"ソテツとは｜「生きた化石」と呼ばれる理由・育て方を解説 - 庭木図鑑 植木ペディア\",\"url\":\"https://www.uekipedia.jp/%E3%83%A4%E3%82%B7%E9%A1%9E%E3%81%BB%E3%81%8B%E7%89%B9%E6%AE%8A%E6%A8%B9%E6%9C%A8/%E3%82%BD%E3%83%86%E3%83%84/\",\"type\":\"secondary\"},\"reliabilityNote\":\"シュロ・フェニックスとの比較は庭木図鑑の記述および一般的な植物形態学の知見に基づく。ヘゴ類（木生シダ）との比較は個別の一次資料ではなく、シダ植物と裸子植物の一般的な形態学的知見を編集者が整理したものであり、学術的な出典による裏付けは今後の課題。\"}},{\"id\":\"taxus-cuspidata\",\"nameJa\":\"イチイ\",\"nameJaAlt\":[\"オンコ\",\"アララギ\"],\"sciName\":\"Taxus cuspidata Siebold et Zucc.\",\"family\":\"イチイ科 Taxaceae\",\"searchTerms\":[\"イチイ\",\"いちい\",\"一位\",\"オンコ\",\"アララギ\",\"Taxus cuspidata\",\"Japanese yew\"],\"worldDistribution\":{\"summary\":\"「南ロシア極東〜中国北部〜日本」に自生するとされる。POWOの分布リストでは中国北中部、日本、朝鮮、千島列島、満州、沿海地方（プリモリエ）、サハリンが自生地として挙げられている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Taxus cuspidata Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:324379-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Russian Far East to N. China and Japan.\\\" 分布：China North-Central, Japan, Korea, Kuril Is., Manchuria, Primorye, Sakhalin。\"}},\"japanDistribution\":{\"summary\":\"日本国内では北海道〜本州中部以北を主分布域とし、四国・九州にも産するが、それらでは主に山岳地帯（高標高地）に限られるとされる。近畿地方（兵庫県を含む）は本種（基本変種としてのイチイ）の分布域の南限〜西限付近にあたり、平地・低山での自生は一般に知られていない。\",\"status\":\"自生（本州中部以北が中心／近畿以西では山岳地の限られた高所のみ、または稀）\",\"habitat\":\"北海道では平地〜低山にも自生するが、四国・九州など分布の南限に近い地域では山岳地帯の限られた場所に生育する。暗い林内で1〜2本ずつ点在して生えることが多く、まとまった林を形成することは少ないが、北海道の屈斜路湖周辺などではまとまったイチイ林も見られる。陰樹で耐陰性が高く林床でも生育できる一方、明るい場所でも均等に枝を出してよく茂り、成長は遅いが寿命が長い。兵庫県では基本変種としての自生は確認されておらず、県内で見られるのは主に矮生変種キャラボクである。\",\"source\":{\"name\":\"日本語版ウィキペディア「イチイ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A4%E3%83%81%E3%82%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"ウィキペディアは二次資料であり、近畿・兵庫県における基本変種イチイの自生の有無について明示的な記述はない。本アプリでは兵庫県目録（下記）での不在確認と合わせて「近畿では稀〜自生確認なし」と判断している。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：基本変種としての記録なし（矮生変種キャラボクのみ記録あり）\",\"detail\":\"兵庫県産維管束植物 第2巻のイチイ属（Taxus）の項を確認したところ、掲載されているのは「Taxus cuspidata Sieb. et Zucc. var. nana Hort. ex Rehder キャラボク」の1エントリのみで、変種を伴わない基本種としての「イチイ」の独立した記載（産地・標本情報を伴うもの）は見当たらなかった。すなわち兵庫県内で記録されている本属の野生個体は、氷ノ山山系に自生する矮生変種キャラボクとしてのみカタログ化されており、樹形の大きい基本変種イチイ自体の産地は目録本文中に確認できない。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF要約はAIによる言い換えであり、原文そのものではないため、ページ番号は取得できず「記載がない」という判定も完全には保証されない。また目録がイチイ属の全個体をキャラボク（var. nana）として記録している可能性もあり、これは分類上の扱いの違いによるものかもしれない。「記載がない＝記録なし」という消去法的判断である点に留意。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同種の変種であるキャラボクとは樹形（直立高木か、地を這う低木か）でほぼ判別でき、近縁のカヤ・イヌガヤとは葉先を触った際の痛さの有無や実（仮種皮）の色・形で区別できる。\",\"items\":[{\"name\":\"キャラボク\",\"sciName\":\"Taxus cuspidata var. nana\",\"distinguishingPoints\":\"同じ種の変種で葉・実の基本構造はほぼ同じだが、キャラボクは幹が根元近くで枝分かれして地を這うように横に広がる低木状の樹形をとり、直立した高木にはならない（イチイは高木に育つ）。葉のつき方にも違いがあり、イチイの葉は枝に対しほぼ水平に二列に並ぶ（プロペラ状）のに対し、キャラボクの葉は枝の四方八方へ螺旋状につく傾向が強く、樹冠がこんもりと不揃いに茂って見える。兵庫県では基本変種イチイの自生記録が確認されておらず、氷ノ山などの山地で見られるイチイ属はほぼすべてキャラボクである点も判別の助けになる。\"},{\"name\":\"カヤ\",\"sciName\":\"Torreya nucifera\",\"distinguishingPoints\":\"葉の形はよく似るが、カヤの葉先は鋭く尖り触れると痛いのに対し、イチイの葉先は先端が尖ってはいるものの柔らかくチクチクしない。実も異なり、イチイは秋に鮮やかな赤色に熟す杯状（壺形）の肉質仮種皮に包まれ、上部が開いて種子の先端がのぞくのに対し、カヤの実は仮種皮が種子全体を包み込んだオリーブ状の核果で、赤くはならず黄緑〜紫褐色に熟す。カヤの葉はちぎるとかんきつ系（グレープフルーツ様）の香りがするが、イチイの葉にこの香りはない。\"},{\"name\":\"イヌガヤ\",\"sciName\":\"Cephalotaxus harringtonia var. harringtonia\",\"distinguishingPoints\":\"イヌガヤの葉はイチイよりも長く（3〜5cm程度、イチイは1.5〜2.5cm程度）、葉裏の白い気孔帯もイヌガヤの方が幅広く目立つ。実の形態も異なり、イチイの赤い杯状仮種皮に対し、イヌガヤはオリーブ状の実が緑色から翌年に赤紫〜暗紫色に熟す。\"},{\"name\":\"モミ など マツ科針葉樹\",\"sciName\":\"Abies firma 等\",\"distinguishingPoints\":\"遠目には同じような扁平な針状の葉に見えるが、モミなどマツ科の樹木は硬い球果（松ぼっくり状）を上向きにつけ、熟すと鱗片がばらばらに崩れ落ちて散布されるのに対し、イチイ科は球果を作らず、種子1個が肉質の仮種皮（イチイでは赤い杯状）に包まれてつく点で根本的に異なる。\"}],\"source\":{\"name\":\"庭木図鑑 植木ペディア「イチイ」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%A4%E3%83%81%E3%82%A4/\",\"type\":\"secondary\"},\"reliabilityNote\":\"葉先の痛さ・香りの有無によるカヤ・イヌガヤとの識別点は「花や草木との出会い」サイト（https://yamaiki.net/2022/01/11/ichii/ 、https://yamaiki.net/2020/06/29/difference-kayainugaya/）も参考にした。いずれも専門の分類学文献ではなく愛好家・園芸サイトによる二次的な解説である点に留意。\"}},{\"id\":\"taxus-cuspidata-var-nana\",\"nameJa\":\"キャラボク\",\"nameJaAlt\":[\"伽羅木\"],\"sciName\":\"Taxus cuspidata Siebold et Zucc. var. nana Hort. ex Rehder\",\"family\":\"イチイ科 Taxaceae\",\"searchTerms\":[\"キャラボク\",\"きゃらぼく\",\"伽羅木\",\"Taxus cuspidata var. nana\",\"Japanese yew dwarf\"],\"worldDistribution\":{\"summary\":\"イチイの矮生（匍匐性）変種。自生地はロシア極東、朝鮮、日本（本州西部）とされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Taxus cuspidata var. nana Rehder\",\"url\":\"https://powo.science.kew.org/taxon/324381-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Russian Far East, Korea, Japan (W. Honshu).\\\" 分類学的に受理された変種として掲載。分布：Japan, Korea, Primorye, Sakhalin。\"}},\"japanDistribution\":{\"summary\":\"山地の風衝地・岩場・尾根筋などに匍匐状の群落をなして自生する一方、庭園樹・生垣として全国的に広く植栽されている。自生の代表例として鳥取県・大山や、兵庫県北部と鳥取県にまたがる氷ノ山（ひょうのせん）山頂付近のキャラボク純林が知られ、氷ノ山の群落は天然記念物に指定されている。\",\"status\":\"自生（高標高の風衝地に点在、代表例：氷ノ山・大山）＋園芸植栽が全国的に多い\",\"habitat\":\"日本海側の山地（鳥海山・氷ノ山・大山・道後山など）に点在する常緑針葉樹で、亜高山〜高山帯の風の強い尾根筋や岩場に匍匐状の群落をなして自生する。豪雪地帯に適応した樹形をとり、幹が基部近くで枝分かれして横に這うように広がるのが特徴で、直立した高木にはなりにくい。氷ノ山（兵庫県北部・鳥取県境）や大山の群落が代表例として知られ、いずれも積雪と強風にさらされる高標高の風衝地という共通の環境に生育している。\",\"source\":{\"name\":\"とっとり文化財ナビ「氷ノ山のキャラボク群落」\",\"url\":\"https://db.pref.tottori.jp/bunkazainavi.nsf/bunkazai_web_view/C9BCF5D851C24FCD49257F0D00096973?OpenDocument=\",\"type\":\"secondary\"},\"reliabilityNote\":\"都道府県サイトの解説記事であり一次分類学文献ではないため二次資料として扱う。氷ノ山は兵庫県（養父市）と鳥取県の県境に位置し、天然記念物指定範囲や解説は鳥取県側の記述だが、兵庫県産維管束植物第2巻には兵庫県側（関宮町・大屋町・波賀町＝現・養父市）の産地が記録されている。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（氷ノ山山系で自生確認）\",\"detail\":\"兵庫県産維管束植物 第2巻に「Taxus cuspidata Sieb. et Zucc. var. nana Hort. ex Rehder キャラボク」として掲載され、計3か所の産地が確認された。産地は関宮町氷ノ山（S.H. 1055, HYO）・大屋町氷ノ山（M.H. 10341, SHO）・波賀町氷ノ山（T.K. 27672, HYO・SHO）で、いずれも氷ノ山山系（現・養父市）にあたる。\",\"volume\":2,\"page\":null,\"localities\":[\"関宮町氷ノ山（現・養父市） S.H. 1055 (HYO)\",\"大屋町氷ノ山（現・養父市） M.H. 10341 (SHO)\",\"波賀町氷ノ山（現・養父市） T.K. 27672 (HYO・SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF内容確認はAIによる言い換え（テキスト抽出＋要約）であり、原文の生テキストやOCR結果そのものではないため、原本での照合が望ましい。産地リストについては初回抽出後にさらに2回、既出産地を提示した上で「これ以外に産地はないか」を問う追加確認を行い、いずれも同一の3件（関宮町氷ノ山・大屋町氷ノ山・波賀町氷ノ山）が繰り返し得られ、追加の産地は報告されなかった。結果は2回連続で安定しており、リストは完全である可能性が高いが、AI要約経由の抽出である以上、絶対的な保証はない。正確なページ番号は取得できなかったためpageはnullとした。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じ種の基本変種であるイチイとは樹形（地を這う低木か、直立高木か）で区別するのが基本で、遠目にはカヤ・イヌガヤとも混同しうる。\",\"items\":[{\"name\":\"イチイ\",\"sciName\":\"Taxus cuspidata\",\"distinguishingPoints\":\"葉・実の基本構造は同じだが、イチイは直立した高木に育ち、葉が枝に対しほぼ水平に二列に並ぶのに対し、キャラボクは幹が根元近くで枝分かれして地を這うように横へ広がる低木状（匍匐性）の樹形をとり、葉も四方八方へ螺旋状につく傾向が強い。兵庫県内で山地に自生するイチイ属は氷ノ山などのキャラボクがほとんどで、直立高木の基本変種イチイの自生確認はない。\"},{\"name\":\"カヤ\",\"sciName\":\"Torreya nucifera\",\"distinguishingPoints\":\"葉の見た目は似るが、カヤの葉先は鋭く触ると痛いのに対し、キャラボク（イチイと同じ）の葉先は柔らかく痛くない。カヤは直立する高木になり、地を這うキャラボクとは樹形でも明確に異なる。実もカヤは赤くならずオリーブ状の核果として熟す点が異なる。\"},{\"name\":\"ハイイヌガヤ\",\"sciName\":\"Cephalotaxus harringtonia var. nana\",\"distinguishingPoints\":\"どちらも兵庫県北部の多雪地・山地に生える地を這うタイプの常緑針葉樹だが、生育環境が異なり、キャラボクは高標高の風の強い岩場・尾根筋（風衝地）に生えるのに対し、ハイイヌガヤは主に多雪山地のブナ林床に生える。葉はキャラボクの方が短く柔らかく密につき、ハイイヌガヤは葉裏の白い気孔帯がより幅広く目立つ。\"}],\"source\":{\"name\":\"「赤い実ではなく、赤い仮種皮？ 謎だらけのキャラボクの種」\",\"url\":\"https://beyond-ecophobia.com/taxus-cuspidata-var-nana/\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人ブログ・愛好家サイトによる解説であり一次分類学文献ではない。樹形・葉のつき方に関する記述は庭木図鑑「イチイ」の解説（https://www.uekipedia.jp/常緑針葉樹/イチイ/）とも整合する。\"}},{\"id\":\"torreya-nucifera\",\"nameJa\":\"カヤ\",\"nameJaAlt\":[],\"sciName\":\"Torreya nucifera (L.) Siebold et Zucc.\",\"family\":\"イチイ科 Taxaceae\",\"searchTerms\":[\"カヤ\",\"かや\",\"榧\",\"Torreya nucifera\",\"Japanese nutmeg-yew\",\"Japanese torreya\"],\"worldDistribution\":{\"summary\":\"日本と韓国に自生する。POWOの分布記述では「朝鮮（莞島・済州島）、日本中南部〜南部」とされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Torreya nucifera (L.) Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263999-1\",\"type\":\"primary\",\"note\":\"\\\"native to: Japan, Korea\\\"。詳細分布：\\\"Korea (Wando, Cheju-do), S. Central & S. Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"本州（宮城県以西）・四国・九州・屋久島にかけて自生する、比較的広い分布域を持つ樹種。近畿地方でも古くから普通に見られ、社寺林・里山林の構成種として、また種子（カヤの実）や碁盤・将棋盤材としての有用性から人為的にも保護・植栽されてきた歴史がある。\",\"status\":\"自生（本州中部以西〜九州・屋久島、近畿地方を含む）\",\"habitat\":\"暖帯林の樹種で、本州（宮城県以西）〜四国・九州・屋久島の山地に散生する。耐陰性が強く、林内であまり日の当たらない場所でも生育できるため、社寺林や里山の暗い林床にも見られる。標高の低い丘陵地から山地帯にかけて分布し、寒暖差が大きく降水量の多い気候でよく育つとされる（良材産地として知られる宮崎県日向地方の例）。\",\"source\":{\"name\":\"日本語版ウィキペディア「カヤ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AB%E3%83%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布域の記述はウィキペディア（二次資料）に基づく。近畿・兵庫県特有の記述はないが、POWOの「S. Central & S. Japan」との整合性および下記兵庫県目録での多数の産地記録から、兵庫県内で普通種であることは裏付けられる。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内各地に自生、産地多数）\",\"detail\":\"兵庫県産維管束植物 第2巻に「Torreya nucifera Sieb. et Zucc. カヤ」として掲載され、計9か所の産地が確認された。生野町銀山湖・千種町一ノ谷・福崎町七種山・黒田庄町妙見山・篠山町西光寺跡・西区布施畑・北区丹生山・洲本市鮎屋川・三原町馬廻の県内広域（但馬〜播磨〜北摂〜淡路）にわたる産地が記録されている。同ページには変種チャボカヤ（Torreya nucifera var. radicans Nakai）が別項として掲載され、こちらも9か所の産地が確認された（詳細はチャボガヤの項を参照）。\",\"volume\":2,\"page\":null,\"localities\":[\"生野町銀山湖 T.K. 29491 (SHO)\",\"千種町一ノ谷 T.K. 10434 (SHO)\",\"福崎町七種山 N.F. 8815 (SHO)\",\"黒田庄町妙見山 Y.Fujimoto & H.Tani. 1227 (SHO)\",\"篠山町西光寺跡 H.Taniguchi (SHO)\",\"西区布施畑 T.K. 10274 (SHO)\",\"北区丹生山 N.F. 9731 (SHO)\",\"洲本市鮎屋川 T.K. 15865 (SHO)\",\"三原町馬廻 N.F. et a1. 7957 (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF内容確認はAIによる言い換え（テキスト抽出＋要約）であり、原文の生テキストやOCR結果そのものではないため、原本での照合が望ましい。産地リストについては初回抽出後、既出9件を提示した上で追加産地の有無を問う確認を2回行い、いずれも「9件で全て、10件目は存在しない」との回答が安定して得られた。結果は複数回連続で安定しており、リストは完全である可能性が高いが、AI要約経由の抽出である以上、絶対的な保証はない。正確なページ番号は取得できなかったためpageはnullとした。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同変種のチャボガヤとは樹形・樹高で、近縁のイチイ・イヌガヤとは葉先の痛さや香りの有無で区別できる。\",\"items\":[{\"name\":\"チャボガヤ\",\"sciName\":\"Torreya nucifera var. radicans\",\"distinguishingPoints\":\"同種の日本海側多雪地適応変種で、葉や実の基本構造はほぼ同じだが、チャボガヤは幹の基部が地を這うように伸びる匍匐性で樹高が約3mほどにとどまるのに対し、カヤは直立して高木（10m以上）に育つ点で区別できる。兵庫県内ではチャボガヤは但馬地方の産地に偏るのに対し、カヤは県内ほぼ全域に産地がある。\"},{\"name\":\"イチイ／キャラボク\",\"sciName\":\"Taxus cuspidata（変種キャラボクを含む）\",\"distinguishingPoints\":\"葉の並び方は似るが、カヤの葉先は鋭く尖り触ると痛いのに対し、イチイ・キャラボクの葉先は柔らかく痛くない。カヤの葉をちぎるとかんきつ系の香りがするがイチイにはない。実も、イチイは秋に鮮やかな赤色に熟す杯状（上部が開く）の仮種皮をつけるのに対し、カヤの実は仮種皮が種子を完全に包み込んだオリーブ状で赤くはならない。\"},{\"name\":\"イヌガヤ\",\"sciName\":\"Cephalotaxus harringtonia var. harringtonia\",\"distinguishingPoints\":\"外見が非常によく似て混同されやすいが、決定的な違いは触感と匂い。カヤは葉先が鋭く触ると痛く、葉をちぎるとグレープフルーツに似た香りがするのに対し、イヌガヤは葉先を触っても痛くなく、ちぎっても匂いがしない。葉の長さもイヌガヤの方が長い（イヌガヤ3〜5cm程度、カヤ2〜3cm程度）。この違いから、カヤは「ホンガヤ」と呼ばれ区別されることもある。\"},{\"name\":\"モミ など マツ科針葉樹\",\"sciName\":\"Abies firma 等\",\"distinguishingPoints\":\"扁平な針状の葉が似て遠目には混同されうるが、モミなどマツ科は硬い球果を上向きにつけ熟すと鱗片がばらばらに崩れ落ちるのに対し、カヤは球果を作らず、種子がオリーブ状の仮種皮に包まれた実をつける点で根本的に異なる。\"}],\"source\":{\"name\":\"「榧（カヤ）と犬榧（イヌガヤ）の違い」花や草木との出会い\",\"url\":\"https://yamaiki.net/2020/06/29/difference-kayainugaya/\",\"type\":\"secondary\"},\"reliabilityNote\":\"愛好家による観察ブログを情報源としており一次分類学文献ではない。葉先の痛さ・香りの有無という識別点は庭木図鑑「カヤ」「イヌガヤ」の解説（https://www.uekipedia.jp/常緑針葉樹/カヤ/ 、https://www.uekipedia.jp/常緑針葉樹/イヌガヤ/）とも一致する。\"}},{\"id\":\"cephalotaxus-harringtonia\",\"nameJa\":\"イヌガヤ\",\"nameJaAlt\":[],\"sciName\":\"Cephalotaxus harringtonia (Knight ex Forbes) K.Koch var. harringtonia\",\"family\":\"イチイ科 Taxaceae\",\"searchTerms\":[\"イヌガヤ\",\"いぬがや\",\"犬榧\",\"Cephalotaxus harringtonia\",\"Japanese plum yew\"],\"worldDistribution\":{\"summary\":\"中国〜朝鮮・中南部および南部の日本・台湾にかけて自生するとされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cephalotaxus harringtonia (Knight ex J.Forbes) K.Koch\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:261818-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is China to Korea, Central & S. Japan, Taiwan.\\\" 分布：China North-Central, China South-Central, China Southeast, Hainan, Japan, Korea, Taiwan。POWOの当該ページではvar. nanaは独立の同意語としては明記されていない。\"}},\"japanDistribution\":{\"summary\":\"日本では岩手県以南から鹿児島県屋久島まで広く分布し、主に温暖な照葉樹林・落葉広葉樹林の林床に生育する常緑低木〜小高木。近畿地方（兵庫県を含む）は分布域のほぼ中央に位置し、普通に見られる樹種である。\",\"status\":\"自生（本州岩手県以南〜四国・九州・屋久島、近畿地方を含む）\",\"habitat\":\"岩手県以南から屋久島まで分布し、ブナ帯のような多雪地帯にはあまり見られず、主に暖温帯上部の渓谷など夏緑広葉樹林が発達する環境に生育する常緑低木〜小高木。耐陰性が強く、スギ人工林の暗い林床でもよく育つ。兵庫県内では山地の渓谷沿いから神戸市街地の丘陵、淡路島にかけて広く記録されており、低山〜山地の谷筋という比較的湿潤な環境を好む。\",\"source\":{\"name\":\"日本語版ウィキペディア「イヌガヤ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A4%E3%83%8C%E3%82%AC%E3%83%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布域の記述はウィキペディア（二次資料）に基づく。近畿・兵庫県に特化した記述はないが、岩手県以南という広い分布域と、POWOの「Central & S. Japan」との整合性、および下記兵庫県目録での産地記録から兵庫県内での自生は裏付けられる。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内に自生、産地複数）\",\"detail\":\"兵庫県産維管束植物 第2巻に「Cephalotaxus harringtonia (Knight) K.Koch イヌガヤ」として掲載され、計23か所の産地が確認された。但馬（美方町・千種町・波賀町・一宮町など）から播磨（上郡町・夢前町・市川町・西脇市など）、丹波（市島町・春日町・西紀町・篠山町）、北摂・神戸市内各区（西区・北区・中央区・灘区・東灘区）、阪神（宝塚市・西宮市）、淡路（北淡町・洲本市・三原町・南淡町）まで県内ほぼ全域にわたって広く産地が記録されており、県内では比較的普通に見られる樹種であることが裏付けられる。\",\"volume\":2,\"page\":null,\"localities\":[\"美方町小代渓谷 Y.Fujimoto & H.Tani 363 (HYO・SHO)\",\"千種町板馬見渓谷 T.K. 5868 (SHO)\",\"波賀町赤西 T.K. 6848 (SHO)\",\"一宮町溝谷 T.K. 10237 (SHO)\",\"上郡町金出地 N.F.& S.M. 5220 (SHO)\",\"夢前町雪彦山 S.Iwatani 53348 (SHO)\",\"市川町岩戸 M.Y. 19486 (SHO)\",\"西脇市西光寺山 T.K. 12054 (SHO)\",\"市島町大杉 Y.Fujimoto 93969 (SHO)\",\"春日町日ケ奥渓谷 N.F.& N.K. 1358 (SHO)\",\"西紀町西ケ嶽 T.K. 31797 (SHO)\",\"篠山町火打岩 T.K. 5051 (SHO)\",\"西区木幡 T.K. 12178 (SHO)\",\"北区逢山峡 S.Iwatani 57022 (SHO)\",\"中央区葺合町 S.M. 3888 (SHO)\",\"灘区西谷 S.M. 1179 (SHO)\",\"東灘区大月地獄谷 T.Shimizu 84-379 (SHO)\",\"宝塚市武田尾 N.F. et al. 4872 (SHO)\",\"西宮市塩瀬 A.Takahashi 1086 (HYO・SHO)\",\"北淡町原田 T.K. 12543 (SHO)\",\"洲本市立川 N.F. 11985 (SHO)\",\"三原町成相池 N.F.& S.M. 5366 (SHO)\",\"南淡町城方 N.F. et a1. 2598 (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF内容確認はAIによる言い換え（テキスト抽出＋要約）であり、原文の生テキストやOCR結果そのものではないため、原本での照合が望ましい。産地リストについては初回抽出後、既出23件を提示した上で項目の冒頭・末尾を含めた見落としの有無を問う確認をさらに1回行い、いずれも同一の23件で「見落としはない」との回答が得られた。結果は2回連続で安定しており、リストは完全である可能性が高いが、AI要約経由の抽出である以上、絶対的な保証はない。正確なページ番号は取得できなかったためpageはnullとした。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同変種のハイイヌガヤとは樹形・樹高で、近縁のカヤとは葉先の痛さや香りの有無で、イチイとは葉の長さや実の色・形で区別できる。\",\"items\":[{\"name\":\"ハイイヌガヤ\",\"sciName\":\"Cephalotaxus harringtonia var. nana\",\"distinguishingPoints\":\"葉・実の基本構造は同じだが、イヌガヤは常緑低木〜小高木になるのに対し、ハイイヌガヤは幹の下部が地を這い枝が斜上する匍匐性の樹形をとり、高さ1〜2m程度にとどまる。ハイイヌガヤは日本海側の多雪山地のブナ林床に多く、兵庫県内でも但馬地方北部に産地が集中する。\"},{\"name\":\"カヤ\",\"sciName\":\"Torreya nucifera\",\"distinguishingPoints\":\"外見が非常によく似て混同されやすいが、イヌガヤは葉先を触っても痛くなく、葉をちぎっても匂いがしないのに対し、カヤは葉先が鋭く触ると痛く、ちぎるとグレープフルーツに似た香りがする。葉の長さはイヌガヤの方が長い（3〜5cm程度、カヤは2〜3cm程度）。\"},{\"name\":\"イチイ\",\"sciName\":\"Taxus cuspidata\",\"distinguishingPoints\":\"葉はイヌガヤの方が長く、葉裏の白い気孔帯もイヌガヤの方が幅広くはっきり目立つ。実の形も異なり、イチイは鮮やかな赤色に熟す杯状（上部が開いた形）の仮種皮をつけるのに対し、イヌガヤの実はオリーブ状の楕円形で、緑色から翌年に赤紫〜暗紫色に熟す。\"}],\"source\":{\"name\":\"庭木図鑑 植木ペディア「イヌガヤ」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%A4%E3%83%8C%E3%82%AC%E3%83%A4/\",\"type\":\"secondary\"},\"reliabilityNote\":\"葉先の痛さ・香りの有無によるカヤとの識別点は「花や草木との出会い」サイト（https://yamaiki.net/2020/06/29/difference-kayainugaya/）も参考にした。いずれも愛好家・園芸サイトによる二次的な解説である。\"}},{\"id\":\"cephalotaxus-harringtonia-var-nana\",\"nameJa\":\"ハイイヌガヤ\",\"nameJaAlt\":[\"エゾイヌガヤ\"],\"sciName\":\"Cephalotaxus harringtonia var. nana (Nakai) Rehder\",\"family\":\"イチイ科 Taxaceae\",\"searchTerms\":[\"ハイイヌガヤ\",\"はいいぬがや\",\"エゾイヌガヤ\",\"Cephalotaxus harringtonia var. nana\",\"Cephalotaxus nana\"],\"worldDistribution\":{\"summary\":\"POWO上ではCephalotaxus harringtonia var. nanaという名前自体は独立種Cephalotaxus nana Nakaiのシノニム（異名）として扱われている。その受理名Cephalotaxus nanaの自生地は中国南部・朝鮮南部・日本（北西部・中西部）とされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cephalotaxus nana Nakai / Cephalotaxus harringtonia var. nana (Nakai) Rehder\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77270881-1\",\"type\":\"primary\",\"note\":\"var. nanaのページには \\\"This name is a synonym of Cephalotaxus nana\\\" とある。受理名Cephalotaxus nana（https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:324383-2）の自生地は \\\"S. China, S. Korea, NW. & W. Central Japan\\\"。すなわち現行のPOWO分類ではvar. nanaはharringtoniaの下位分類群ではなく、独立種として扱われている。\"}},\"japanDistribution\":{\"summary\":\"北海道西南部、本州の日本海側（青森県〜山口県）、四国の石鎚山に分布し、多雪地のブナ林床などに自生する匍匐性の常緑低木。兵庫県北部（但馬地方）は本州日本海側の多雪地帯に含まれ、分布域の範囲内にあたる。\",\"status\":\"自生（本州日本海側の多雪地・多雪山地：青森県〜山口県、兵庫県北部を含む）\",\"habitat\":\"北海道西南部から本州日本海側（青森県〜山口県）、四国の石鎚山にかけて分布する、ブナ林などの林床に見られる多雪地適応型の匍匐性常緑低木。積雪に適応して幹の下部が地を這い、枝が斜上する独特の樹形をとり、高さは1〜2m程度にとどまる。ユキツバキ・ヒメモチ・ヒメアオキなど日本海要素の常緑地這い植物と同様の環境（多雪山地のブナ林床）を共有する。兵庫県内の産地は北部の但馬地方に集中しており、この多雪環境と一致する。\",\"source\":{\"name\":\"日本語版ウィキペディア「ハイイヌガヤ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%82%A4%E3%82%A4%E3%83%8C%E3%82%AC%E3%83%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布域の記述はウィキペディア（二次資料）に基づき「北海道西南部、本州の日本海側の青森県から山口県、四国の石鎚山に分布し、多雪地の林床に自生する」との記載を典拠とする。兵庫県は分布範囲内（本州日本海側）に含まれ、下記兵庫県目録での産地記録とも整合する。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内に自生、計7か所の産地）\",\"detail\":\"兵庫県産維管束植物 第2巻に「var. nana (Nakai) Rehder ハイイヌガヤ」としてイヌガヤの項の下位に掲載され、計7か所の産地が確認された。産地は温泉町霧ケ滝・村岡町大笹・美方町貫田・香住町三川山・日高町大岡山・八鹿町小佐川・朝来町佐中で、いずれも但馬地方北部（旧美方郡・城崎郡・養父郡・朝来郡域）に集中しており、日本海側多雪山地の生態型であるハイイヌガヤの分布傾向と一致する。\",\"volume\":2,\"page\":null,\"localities\":[\"温泉町霧ケ滝 N.F. 11087 (SHO)\",\"村岡町大笹 N.K. 15804 (SHO)\",\"美方町貫田 N.F.& N.K. 1057 (SHO)\",\"香住町三川山 T.Shimizu (SHO)\",\"日高町大岡山 N.F.& K.Ueda 9 (SHO)\",\"八鹿町小佐川 N.F. et al. 6116 (SHO)\",\"朝来町佐中 S.M. 4175 (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF内容確認はAIによる言い換え（テキスト抽出＋要約）であり、原文の生テキストやOCR結果そのものではないため、原本での照合が望ましい。産地リストについては初回抽出後、既出7件を提示した上で追加産地の有無を問う確認をさらに1回行い、同一の7件が繰り返し得られ追加は報告されなかった。結果は2回連続で安定しており、以前の記載にあった「6か所」という産地数は誤りで、正しくは7か所である可能性が高い。ただしAI要約経由の抽出である以上、絶対的な保証はない。正確なページ番号は取得できなかったためpageはnullとした。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同変種のイヌガヤとは樹形・樹高で区別するのが基本で、同じく兵庫県北部の山地に生える匍匐性針葉樹キャラボクとも混同されうる。\",\"items\":[{\"name\":\"イヌガヤ\",\"sciName\":\"Cephalotaxus harringtonia var. harringtonia\",\"distinguishingPoints\":\"葉・実の基本構造は同じだが、ハイイヌガヤは幹の下部が地を這い枝が斜上する匍匐性の樹形をとり高さ1〜2m程度にとどまるのに対し、イヌガヤは常緑低木〜小高木として直立気味に育つ。ハイイヌガヤはブナ帯のような多雪地に多いのに対し、イヌガヤはブナ帯多雪地にはあまり見られず、暖温帯の渓谷などに多い点でも生育環境が異なる。\"},{\"name\":\"キャラボク\",\"sciName\":\"Taxus cuspidata var. nana\",\"distinguishingPoints\":\"どちらも地を這うように広がる匍匐性の常緑針葉樹で、遠目には似た印象を与えるが、生育環境が異なり、キャラボクは高標高の風の強い岩場・尾根筋（風衝地）に生えるのに対し、ハイイヌガヤは主に多雪山地のブナ林床に生える。葉裏の白い気孔帯はハイイヌガヤ（イヌガヤ譲り）の方が幅広く目立ち、実も熟すとキャラボクは鮮やかな赤い杯状の仮種皮になるのに対し、ハイイヌガヤはオリーブ状の実が赤紫〜暗紫色に熟す点で異なる。\"}],\"source\":{\"name\":\"日本語版ウィキペディア「ハイイヌガヤ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%82%A4%E3%82%A4%E3%83%8C%E3%82%AC%E3%83%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"生育環境の違いはWikipedia「ハイイヌガヤ」および本ファイル内のイヌガヤ・キャラボクの分布記述に基づく。葉裏の気孔帯幅や実の色に関する識別点は母種イヌガヤ・イチイに関する庭木図鑑等の解説を準用したもので、ハイイヌガヤ自体での直接確認ではない点に留意。\"}},{\"id\":\"sciadopitys-verticillata\",\"nameJa\":\"コウヤマキ\",\"nameJaAlt\":[\"高野槇\",\"高野槙\"],\"sciName\":\"Sciadopitys verticillata (Thunb.) Siebold et Zucc.\",\"family\":\"コウヤマキ科 Sciadopityaceae\",\"searchTerms\":[\"コウヤマキ\",\"こうやまき\",\"高野槇\",\"高野槙\",\"sciadopitys\",\"Sciadopitys verticillata\",\"Japanese umbrella pine\"],\"worldDistribution\":{\"summary\":\"コウヤマキ科は1属1種のみからなる単型科で、本種 Sciadopitys verticillata は日本固有種。POWO（Kew）の分布データでは自生範囲は「S. Central & S. Japan（本州中南部～南日本）」とされ、これが世界における唯一の自生地である。温帯林に生育する高木で、IUCNレッドリストでは準絶滅危惧（NT）に評価されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Sciadopitys verticillata (Thunb.) Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263735-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Central & S. Japan. It is a tree and grows primarily in the temperate biome.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、本州（福島県北西部および中部地方以西）、四国、九州（宮崎県まで）に散在的に自生する。特に紀伊半島（高野山・大台ヶ原周辺など）や中央構造線沿いの温帯～暖帯、標高700m前後の山地の岩場・蛇紋岩地などに分布が知られる。「高野槇」の名は高野山（和歌山県）に多く植えられ、仏事に用いられることに由来し、自生地は限られる一方、社寺・墓地・庭園への植栽は全国的に非常に多い。\",\"status\":\"自生（本州中部以西・四国・九州の山地に散在）＋社寺・庭園への植栽も全国的に多い\",\"habitat\":\"自生地では中央構造線沿いの温帯～暖帯、標高700m前後の山地の岩場に多く見られ、モミ・ツガ・クロベ・トガサワラ・ツクバネガシ・アラカシなどと混生する。酸性土壌を好み、暗い林床でも実生は生育できるが、土壌が露出した明るいギャップでより旺盛に生育する傾向がある。植栽木としては、高野山をはじめとする社寺の境内や墓地、庭園など、湿度を保てる涼しい環境に多く植えられている。\",\"source\":{\"name\":\"Wikipedia日本語版「コウヤマキ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%B3%E3%82%A6%E3%83%A4%E3%83%9E%E3%82%AD\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版を二次資料として使用。自生の都道府県別の詳細な一次資料（YList等での分布記載）までは確認できておらず、「中部地方以西」という記述の具体的な範囲（兵庫県が含まれるか）は不明確。紀伊半島（高野山・大台ヶ原）が代表的自生地として名指しされている一方、兵庫県への言及は見当たらなかった。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし\",\"detail\":\"兵庫県産維管束植物 第2巻（裸子植物を収録）の本文を確認したところ、「コウヤマキ」「Sciadopitys」の語は一度も登場しない。同巻はマツ科・スギ科（広義）・ヒノキ科・マキ科・イヌガヤ科・イチイ科などを収録しているが、単型科であるコウヤマキ科・コウヤマキ属についての記載自体が見当たらなかった。本種の自生範囲は本州中部以西・四国・九州の山地に散在するとされ、代表的な自生地として名指しされるのは紀伊半島（高野山・大台ヶ原）であり兵庫県は含まれていない可能性が高い。加えて、本種は社寺等への植栽例も多く、同巻凡例にある「明らかな栽培植物と思われる標本は除外した」という基準により、仮に兵庫県内に植栽されたコウヤマキがあったとしても目録には反映されないと考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認である点に加え、このPDFへのアクセスはAIによる要約結果を介しており、原文そのものを精査したものではないため、ページ番号等の詳細情報は不明。また自生種としての兵庫県内自生の有無と、植栽による兵庫県内存在の有無を明確に区別できていない点に留意。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"樹形全体としては輪生する『傘状』の針葉束が非常に特徴的で、単型科（コウヤマキ科1属1種）であることもあり形態的には他種と混同しにくい。ただし和名に『マキ』を含むため、全く系統の異なるマキ科のイヌマキ・ラカンマキ（Podocarpus属）と名称・植栽場所（寺社・庭園）の両面で混同されることがある。\",\"items\":[{\"name\":\"イヌマキ\",\"sciName\":\"Podocarpus macrophyllus\",\"distinguishingPoints\":\"マキ科に属し、コウヤマキ科とは分類上まったく別系統。葉はコウヤマキより幅が広い扁平な線形で、輪生して傘状にまとまることはなく螺旋状につく。果実は赤紫色に熟す多肉質の偽果（花床が肥大したもの）をつけるのに対し、コウヤマキは松笠状の球果をつける点が決定的な違い。生垣・寺社の植栽としてコウヤマキと植栽場所が重なるため、名前（『マキ』）だけで混同されやすい。\"},{\"name\":\"ラカンマキ\",\"sciName\":\"Podocarpus macrophyllus var. maki\",\"distinguishingPoints\":\"イヌマキの園芸品種で葉がやや小さいが、識別点はイヌマキと同様（葉が扁平で螺旋状につき、球果ではなく液質の偽果をつける）。コウヤマキの輪生する針状葉束とは葉序が根本的に異なる。\"}],\"source\":{\"name\":\"外構・ガーデニング専門店ライフアップ「マキとコウヤマキの決定的相違」\",\"url\":\"https://ecomake.jp/column/%E3%83%9E%E3%82%AD%E3%81%A8%E3%82%B3%E3%82%A6%E3%83%A4%E3%83%9E%E3%82%AD%E3%81%AE%E6%B1%BA%E5%AE%9A%E7%9A%84%E7%9B%B8%E9%81%95%EF%BF%BC/\",\"type\":\"secondary\"},\"reliabilityNote\":\"コウヤマキ自体は輪生する『傘状』葉序という単型科ならではの明確な識別形質を持ち、植物学的な誤同定のリスクは低い種である。ここで挙げた『類似種』は形態そのものの酷似というより、和名に共通する『マキ』の文字や植栽環境（寺社・庭園）の共通性に由来する一般的な混同であり、専門的な図鑑類でコウヤマキとイヌマキ属が形態的に酷似すると明記した一次資料までは確認できていない。\"}},{\"id\":\"araucaria-cunninghamii\",\"nameJa\":\"ナンヨウスギ\",\"nameJaAlt\":[\"アローカリア\"],\"sciName\":\"Araucaria cunninghamii Mudie\",\"family\":\"ナンヨウスギ科 Araucariaceae\",\"searchTerms\":[\"ナンヨウスギ\",\"なんようすぎ\",\"南洋杉\",\"araucaria\",\"Araucaria cunninghamii\",\"hoop pine\"],\"worldDistribution\":{\"summary\":\"ニューギニアから東オーストラリア（クイーンズランド州、ニューサウスウェールズ州）にかけての亜熱帯多雨林に自生する高木。POWOの分布データでは自生範囲は「New Guinea to E. Australia」とされる。良質な木材（フープパイン材）を産する林業樹種としても知られる。POWOではモーリシャスおよび南西諸島（Nansei-shoto）が「導入（introduced）」地域として記載されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Araucaria cunninghamii Mudie\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:60455476-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is New Guinea to E. Australia. It is a tree and grows primarily in the subtropical biome.\\\" Introduced（導入）地域としてMauritius、Nansei-shotoが記載。\"}},\"japanDistribution\":{\"summary\":\"日本には自生せず、公園・植物園・庭園などに観賞用・記念樹として植栽される導入種。独特な樹形（放射状に伸びる枝葉）が好まれ、九州・沖縄など温暖な地域を中心に植栽例が見られる。POWOの分布データでは南西諸島（Nansei-shoto）が「導入（introduced）」地域として記載されているが、これは植栽個体の存在を反映したものであり、自立した野生化・帰化個体群の存在を示す一次資料は確認できなかった。\",\"status\":\"植栽のみ（自生・野生化の確証なし）\",\"habitat\":\"原産地オーストラリア～ニューギニアでは、標高0～1000m程度の熱帯～亜熱帯の多雨林や、岩の多い山地・川沿いに自生する高木である。日本国内には自生地がなく、専ら公園・植物園・庭園に観賞用・記念樹として植栽され、特に温暖な沖縄・九州で見られる（沖縄県内では1962年頃ハワイから種子を導入し庭園木として栽培された記録がある）。独特の放射状の樹形を保つため、日当たりと十分な生育スペースのある場所に単植されることが多い。\",\"source\":{\"name\":\"Wikipedia日本語版「ナンヨウスギ属」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8A%E3%83%B3%E3%83%A8%E3%82%A6%E3%82%B9%E3%82%AE%E5%B1%9E\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版は種としての一般的性質（観葉植物・庭園樹としての利用）を述べるのみで、日本国内での具体的な植栽分布地（沖縄・九州等）を明記した一次資料までは確認できていない。またPOWOが「introduced」とする南西諸島の扱いが、植栽記録なのか野生化記録なのか区別できる一次資料も確認できておらず、念のため野生化の可能性を完全には排除していない。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外）\",\"detail\":\"兵庫県産維管束植物 第2巻（裸子植物を収録）の本文を確認したところ、「ナンヨウスギ」「Araucaria」の語は一度も登場しない。同巻凡例に「明らかな栽培植物と思われる標本は除外した」とあり、本種は日本国内では公園・植物園等への植栽例のみが知られ自生・野生化の記録がないことから、この基準により除外されたものと考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、このPDFへのアクセスはAIによる要約結果を介しているため、原文そのものを精査したものではない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"水平方向に規則正しく段状に広がる枝ぶりは遠目にも非常に特徴的で識別しやすいが、同属（ナンヨウスギ属 Araucaria）の近縁種、特に日本でも同じ『アローカリア』の通称で流通するシマナンヨウスギ（ノーフォークマツ）とは、植物園・公園などで並んで植えられている場合に混同されることがある。庭木図鑑では葉の印象が似た別系統の高木コウヨウザンも類似種として挙げられている。\",\"items\":[{\"name\":\"シマナンヨウスギ（ノーフォークマツ）\",\"sciName\":\"Araucaria heterophylla\",\"distinguishingPoints\":\"ナンヨウスギと同じ節（Section Eutacta）に属す近縁種で、日本でも観葉植物として『アローカリア』の名で流通するため名称面でも混同されやすい。ノーフォークマツは生涯を通じて枝間の間隔が広く整った三角形（円錐形）の樹形を保ち、葉が強く上向きに伸びるのに対し、ナンヨウスギ（フープパイン）はより柱状・不定形になりやすく、樹皮が水平方向に紙状・輪状に薄く剥がれる『フープ（樽の箍）』状の特徴的な樹皮を持つ点で区別できる。\"},{\"name\":\"ボウガンヒ（バンヤパイン）\",\"sciName\":\"Araucaria bidwillii\",\"distinguishingPoints\":\"ナンヨウスギとは別の節（Section Bunya）に属す近縁種。葉が非常に幅広く硬く鋭く尖った剣状であるのに対し、ナンヨウスギの葉は細く柔らかい針状〜鱗状で、成木では枝に密着した小さな鱗片状の葉になる点で区別できる。\"},{\"name\":\"コウヨウザン\",\"sciName\":\"Cunninghamia lanceolata\",\"distinguishingPoints\":\"ナンヨウスギ科ではなくヒノキ科（またはコウヨウザン科として独立させる説もある）に属す別系統の高木だが、庭木として似た印象を与えるため類似種として挙げられることがある。コウヨウザンの葉は扁平で硬く鋭い針状の単葉が螺旋状に密につくのに対し、ナンヨウスギは放射状に細かい葉が集まった小枝が規則的な段状（輪生状）に水平に広がる樹形になる点で区別できる。\"}],\"source\":{\"name\":\"庭木図鑑 植木ペディア「ナンヨウスギ／なんようすぎ／南洋杉」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%8A%E3%83%B3%E3%83%A8%E3%82%A6%E3%82%B9%E3%82%AE/\",\"type\":\"secondary\"},\"reliabilityNote\":\"近縁種であるA. cunninghamiiとA. heterophylla・A. bidwillii間の識別点は、球果学的知見も含む英語圏の専門資料（Conifers.org、Dave's Garden誌の記事）を基に整理したもので、日本語の一次資料では確認できていない。日本国内では本種は植栽のみで自生せず、類似種と隣接して植えられる場面は主に植物園・公園に限られるため、実際の混同事例は限定的と考えられる。またコウヨウザンとの類似性は庭木図鑑内『似た木』欄の記載に基づくが、同ページには具体的な識別根拠までは明記されていなかったため、葉の形態比較は一般的な樹木知識で補った。\"}},{\"id\":\"cryptomeria-japonica\",\"nameJa\":\"スギ\",\"nameJaAlt\":[],\"sciName\":\"Cryptomeria japonica (L.f.) D.Don\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"スギ\",\"すぎ\",\"杉\",\"cryptomeria\",\"Cryptomeria japonica\",\"japanese cedar\",\"sugi\"],\"worldDistribution\":{\"summary\":\"POWO（キュー王立植物園）は本種の自生域を中国（四川省〜浙江省北西部）および日本中南部としている。ただし日本語文献の多くは本種を「日本固有種」として扱っており、中国側個体群を自生とみなすかどうかは資料により見解が分かれる。台湾・朝鮮半島・中国・ヒマラヤ地域・レユニオン島・アゾレス諸島などに造林目的で導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cryptomeria japonica (Thunb. ex L.f.) D.Don\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:261870-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is China (Sichuan to NW. Zhejiang), Central & S. Japan.\\\" 導入先として Azores, Denmark, Great Britain, Italy, Sweden, Czechoslovakia, Korea, Mauritius, New Zealand, Réunion, Tunisia, Turkey を記載。\"}},\"japanDistribution\":{\"summary\":\"本州（北限は青森県西津軽郡）から四国、九州の屋久島まで、主に冷温帯（山地帯・ブナ帯）に自生する。標高は本州で0〜2,050m、四国で300〜1,400m、九州（屋久島）で300〜1,850mに及ぶ。モミ・ヒノキ・アスナロ・クロベ・ヒメコマツ・ブナ・ミズナラなどと混生する。日本での造林面積が最も広い樹種であり、古くから各地に植林されているため、天然林か人工林かの判断が難しい個体も多い。北海道でも南部を中心に植林され、最北端は利尻島に及ぶ。\",\"status\":\"自生（ただし全国的に大規模造林あり）\",\"habitat\":\"本州では標高0〜2,050m、四国で300〜1,400m、九州（屋久島）で300〜1,850mの範囲に分布し、自生木は主に冷温帯（山地帯・ブナ帯）に生育するが、人工林は暖温帯（低地帯）にも広く見られる。沢沿いなど水分・栄養分に富む谷筋の土壌を好み、岩上や湿原周囲に生育することもある。モミ・ヒノキ・アスナロ・クロベ・ヒメコマツ・ブナ・ミズナラなどと混生する。屋久島では標高700〜1,700mの、降水量は多いが花崗岩質で栄養分に乏しい環境にも適応している。\",\"source\":{\"name\":\"Wikipedia日本語版「スギ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%B9%E3%82%AE\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料であり、記述の正確性は一次資料（論文・図鑑類）で今後補強が望ましい。特に自生林と植林の区別はWikipedia自身も「判断が難しい」と明記している。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内各地に分布、計14産地）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文に「Cryptomeria japonica (L.f.)D.Don スギ」の項があり、県内14地点からの採集記録が列挙されている：浜坂町和田、村岡町銚子ヶ谷、美方町貫田、関宮町氷ノ山、波賀町赤西、新宮町馬立、夢前町雪彦山、姫路市山田町、西区雌岡山、北区坂本、東灘区御影山手、北淡町常隆寺山、東浦町月ノ山観音、洲本市奥畑。ただしスギは日本有数の造林樹種であるため、これらの記録には天然生林由来の個体だけでなく植林起源の個体が相当数含まれている可能性が高く、目録自体もその区別を明示していない。\",\"volume\":2,\"page\":null,\"localities\":[\"浜坂町和田 H.Nakazawa 1325 (SHO)\",\"村岡町銚子ヶ谷 T.Maeda 396 (SHO)\",\"美方町貫田 N.F.& N.K. 1056 (SHO)\",\"関宮町氷ノ山 T.K. 18501 (SHO)\",\"波賀町赤西 T.Yoshizawa 20103 (SHO)\",\"新宮町馬立 M.Y. 7417 (SHO)\",\"夢前町雪彦山 T.Yoshizawa 19022 (SHO)\",\"姫路市山田町 T.Yoshizawa 20563 (SHO)\",\"西区雌岡山 T.K. 4999 (SHO)\",\"北区坂本 N.F. 9496 (SHO)\",\"東灘区御影山手 N.K. 12802 (SHO)\",\"北淡町常隆寺山 T.K. 17569 (SHO)\",\"東浦町月ノ山観音 T.K. 16868 (SHO)\",\"洲本市奥畑 T.K. 12418 (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF読み取りを、産地一覧の初回抽出→未抽出産地の確認→該当箇所の生テキストそのままの引用、という3段階のクロスチェックで実施し、いずれの回も同一の14産地（浜坂町和田〜洲本市奥畑）で一致・安定した。そのため産地数についてはかなり高い確度で完全と考えられる。ただし、WebFetchはPDF全文をAIが要約・言い換えて返す仕組みであり、生のテキストとの完全一致を人手で照合したわけではないため、ページ番号は特定できず（null）、地名の漢字表記（例：ヶ／か）や採集者名の細部表記に誤りが残っている可能性はなお否定できない。また造林地由来か天然生かの判定基準は本文からは確認できていない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"スギは螺旋状に密生する鉤爪状の葉と赤褐色で縦に薄く剥がれる繊維質の樹皮を持ち、ヒノキ科の中では見誤りにくい方だが、遠目には赤褐色の樹皮とまっすぐ伸びる高い幹の印象からメタセコイアやラクウショウなど落葉性の針葉樹と混同されることがある。\",\"items\":[{\"name\":\"メタセコイア\",\"sciName\":\"Metasequoia glyptostroboides\",\"distinguishingPoints\":\"スギは常緑で、葉は枝に螺旋状に密着してつく鉤爪状の鱗片葉であるのに対し、メタセコイアは落葉性で、線形の柔らかい葉が小枝に対生（2列対生）し、羽状複葉のように扁平に広がる。秋には葉のついた小枝ごと落葉するため、冬季は落葉して枝だけになる点でスギ（常緑）と容易に区別できる。樹皮はどちらも赤褐色で縦に裂けるが、メタセコイアは幹の基部が板根状に張り出しやすい。\"},{\"name\":\"ラクウショウ（ヌマスギ）\",\"sciName\":\"Taxodium distichum\",\"distinguishingPoints\":\"スギとは異なり落葉性で、線形の葉が枝に互生（やや不規則な互生）してつく点、また湿地や水辺に植栽されることが多く、根元周囲に「気根（呼吸根）」と呼ばれる瘤状の突起を地上に出すことがある点が特徴で、これはメタセコイアにもスギにも見られない。葉の対生（メタセコイア）・互生（ラクウショウ）の違いで両者も区別できる。\"}],\"source\":{\"name\":\"自然観察大学ブログ「ラクウショウとメタセコイアをくらべる」\",\"url\":\"https://sizenkan.exblog.jp/25484953/\",\"type\":\"secondary\"},\"reliabilityNote\":\"スギとメタセコイア・ラクウショウとの混同は、専門家レベルでは葉の形態（常緑・螺旋状の鉤爪葉か、落葉性で対生・互生の線形葉か）が全く異なるため起こりにくいが、樹皮の色や遠目の樹形の印象から非専門家が公園等で見誤ることがある組み合わせとして言及した。メタセコイア・ラクウショウ自体の識別点は自然観察大学ブログに基づくが、スギとの直接比較を論じた一次資料は確認できておらず、この点はエージェントによる整理を含む。\"}},{\"id\":\"chamaecyparis-obtusa\",\"nameJa\":\"ヒノキ\",\"nameJaAlt\":[],\"sciName\":\"Chamaecyparis obtusa (Siebold et Zucc.) Endl.\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"ヒノキ\",\"ひのき\",\"檜\",\"桧\",\"chamaecyparis obtusa\",\"hinoki\",\"hinoki cypress\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本・台湾としている。朝鮮半島には導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Chamaecyparis obtusa (Siebold et Zucc.) Endl.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:261845-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan, Taiwan.\\\" 導入先として Korea を記載。\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、本州の福島県以南から四国、九州の屋久島まで分布する。多雪環境を嫌うため日本海側には少なく、スギに比べて分布は太平洋側に著しく偏る。岡山県・愛媛県・高知県・熊本県など西日本各県が丸太生産量の上位常連であり、造林樹種としても広く利用される。造林の北限は岩手県南部〜宮城県北部付近とされる。\",\"status\":\"自生（ただし全国的に大規模造林あり、太平洋側偏重）\",\"habitat\":\"福島県以南の本州から四国、九州の屋久島まで分布するが、多雪環境に弱いため日本海側には少なく、太平洋側に偏って生育する。天然木は尾根筋の岩場など、酸性で乾燥した劣悪な土壌にも耐えて生育し、造林でも雪の少ない乾いた尾根筋や斜面上部が適地とされる。幼木は典型的な陰樹で日当たりを嫌う一方、浅根性のため急斜面には定着しにくい。植栽の北限は宮城県北部〜岩手県南部付近で、最低気温-8℃以下・最深積雪1.0m以上の地域は造林不適地とされる。\",\"source\":{\"name\":\"Wikipedia日本語版「ヒノキ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%92%E3%83%8E%E3%82%AD\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。太平洋側偏重の記述からすると、日本海側に面した兵庫県北部（但馬地方）での自生密度はスギより低い可能性がある点に留意。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内各地に分布、計8産地）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文に「Chamaecyparis obtusa (Sieb. et Zucc.)Endl. ヒノキ」の項があり、県内8地点からの採集記録が列挙されている：浜坂町和田、温泉町菅原、三日月町春哉、市島町北奥、北区丹生山、灘区大月地獄谷、洲本市柏原山、三原町成相ダム。スギと同様、ヒノキも造林樹種として広く植栽されているため、記録中には植林由来の個体が含まれている可能性がある。\",\"volume\":2,\"page\":null,\"localities\":[\"浜坂町和田 H.Nakazawa 1326 (SHO)\",\"温泉町菅原 N.F.et al. 7644 (SHO)\",\"三日月町春哉 M.Y. 14901 (SHO)\",\"市島町北奥 N.F.& N.K. 1389 (SHO)\",\"北区丹生山 N.F. 9724 (SHO)\",\"灘区大月地獄谷 N.K. 17245 (SHO)\",\"洲本市柏原山 T.K. 19032 (SHO)\",\"三原町成相ダム Z.Shimidzu (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF読み取りを、産地一覧の初回抽出→未抽出産地の確認→該当箇所の生テキストそのままの引用、という3段階のクロスチェックで実施し、いずれの回も同一の8産地（浜坂町和田〜三原町成相ダム）で一致・安定した。そのため産地数についてはかなり高い確度で完全と考えられる。ただし、WebFetchはPDF全文をAIが要約・言い換えて返す仕組みであり、生のテキストとの完全一致を人手で照合したわけではないため、ページ番号は特定できず（null）、地名・採集者名表記の細部の正確性はなお完全には保証できない。植林由来か天然生かの区別も本文からは確認できていない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"ヒノキ科の中でも特に紛らわしいのがサワラで、日本の樹木同定における最も古典的な難問の一つとされる。葉裏の白い気孔帯の形（Y字型かX字型か）と葉先の鋭さが基本的な見分けのポイントで、さらにアスナロやコノテガシワも遠目には似て見えるため注意が必要。\",\"items\":[{\"name\":\"サワラ\",\"sciName\":\"Chamaecyparis pisifera (Siebold et Zucc.) Endl.\",\"distinguishingPoints\":\"最も混同されやすい近縁種。葉裏の白い気孔帯の形状が、ヒノキではぼんやりと丸みを帯びたY字型（蝶が羽を広げたような形）であるのに対し、サワラではくっきりと鋭いX字型（個体によってはH字・W字状に見えることもある）になる。葉先はヒノキが丸みを帯びて鈍く触れても痛くないのに対し、サワラは針状に鋭く尖り触れるとチクチクする。気孔帯の形は新葉や個体差による例外があり単独では決め手にならないため、葉先の鋭さと併せて総合的に判断するのが確実とされる。\"},{\"name\":\"アスナロ\",\"sciName\":\"Thujopsis dolabrata\",\"distinguishingPoints\":\"別名ヒバ。葉の一片がヒノキより明らかに大きく分厚い（長さ5〜7mm程度）うえ、葉先が尖らない点で区別できる。葉裏の白い気孔帯もヒノキよりはるかに幅広く目立つ帯状に入るため、慣れれば遠目でも判別しやすい。日本海側（東北・北陸など）に多く、兵庫県では庭木・社寺境内木として見かける可能性がある。\"},{\"name\":\"コノテガシワ\",\"sciName\":\"Platycladus orientalis\",\"distinguishingPoints\":\"枝葉が地面に対して垂直に立ち上がり、表裏の区別がはっきりしない扇状・うちわ状の平面をなす独特の樹形をとるため、樹形を見ればヒノキとは容易に区別できる。葉の質感にも光沢がなく、艶のあるヒノキの葉とは触感が異なる。公園・庭園・生垣に植栽される。\"}],\"source\":{\"name\":\"自然観察大学ブログ「ヒノキとサワラを見分ける その1」\",\"url\":\"https://sizenkan.exblog.jp/29168174/\",\"type\":\"secondary\"},\"reliabilityNote\":\"気孔帯のY字/X字による識別は日本の樹木図鑑で広く紹介される伝統的な方法だが、引用元の自然観察大学ブログ自身が『Y字・H字の区別だけでは決め手にならない場合がある（サワラでW字状に広がる例、新葉でY字状に見える例がある）』と指摘しており、葉先の鋭さなど複数の形質を組み合わせて判断することが望ましい。アスナロ・コノテガシワの形質は植木図鑑サイト（庭木図鑑）の記述を基にした一般的傾向であり、個体差がありうる。\"}},{\"id\":\"chamaecyparis-pisifera\",\"nameJa\":\"サワラ\",\"nameJaAlt\":[],\"sciName\":\"Chamaecyparis pisifera (Siebold et Zucc.) Endl.\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"サワラ\",\"さわら\",\"椹\",\"chamaecyparis pisifera\",\"sawara cypress\",\"sawara\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本（本州南部、九州中部）としている。イギリス・アイルランド・朝鮮半島・アメリカ（ニューヨーク州）に導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Chamaecyparis pisifera (Siebold et Zucc.) Endl.\",\"url\":\"https://powo.science.kew.org/taxon/261847-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan (S. Honshu, Central Kyushu).\\\"\"}},\"japanDistribution\":{\"summary\":\"本州中部（福島県〜福井県）を中心に分布し、さらに岩手県（早池峰山）、和歌山県、広島県、九州（熊本県、長崎県島原半島）などに散在的な隔離分布が見られる。冷温帯（ブナ帯）から亜高山帯にかけての、湿った谷筋などで生育が良い。近畿地方では和歌山県に散在記録があるが、兵庫県の自生については日本語版Wikipediaの記述からは確認できなかった。\",\"status\":\"自生（本州中部を中心に隔離的・散在的分布、造林もされる）\",\"habitat\":\"本州中部（福島県〜福井県）を中心に、岩手県・和歌山県・広島県・九州などに散在的に分布し、山地帯（冷温帯・ブナ帯）から亜高山帯にかけて生育する。ヒノキが山の中腹より上の乾いた土地を好むのに対し、サワラは谷筋の湿った場所に多く、日当たりの良い場所から半日陰まで、水はけの良い湿地を好む。いったん根付くと乾燥にも強くなる。自生木と植林由来の個体が混在し区別が難しいことに加え、公園樹・庭木としても植栽される。\",\"source\":{\"name\":\"Wikipedia日本語版「サワラ (植物)」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%B5%E3%83%AF%E3%83%A9_(%E6%A4%8D%E7%89%A9)\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料であり、兵庫県を含む近畿地方全域での自生の有無について網羅的な記述ではない可能性がある。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（本文中に該当種名を確認できず）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を2回にわたって検索したが、「サワラ」「Chamaecyparis pisifera」の語は検出されなかった。サワラの自生域は本州中部が中心で、近畿地方では和歌山県に散在記録がある程度とされ、日本海側に面した兵庫県北部を含め兵庫県全域での自生報告は乏しいとみられることと整合的である。ただし、これはWebFetchによるAI要約抽出に基づく「記載がない＝記録なし」という消去法的な確認であり、本文の完全な全文検索を行ったわけではない。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchはPDF全文をそのまま検索するのではなくAIによる要約を返すため、抽出漏れにより実際には記載があるのに「記録なし」と誤って判定している可能性を否定できない。より確実な確認には目録本文（原本PDF）の直接閲覧・全文検索が必要。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"最大の混同相手はヒノキで、葉裏の白い気孔帯の形（X字型かY字型か）と葉先の鋭さが基本的な見分けのポイント。さらにサワラには野生型と外見が大きく異なる園芸品種が非常に多く、同一種であることに気づきにくい点にも注意が必要。\",\"items\":[{\"name\":\"ヒノキ\",\"sciName\":\"Chamaecyparis obtusa (Siebold et Zucc.) Endl.\",\"distinguishingPoints\":\"サワラとの対比で最も紛らわしい種。葉裏の白い気孔帯はサワラでくっきりしたX字型（個体によりH字・W字状）になるのに対し、ヒノキではぼんやりと丸みを帯びたY字型になる。葉先はサワラが針状に鋭く尖り触れるとチクチクするのに対し、ヒノキは丸みを帯びて鈍く触れても痛くない。気孔帯の形だけでは新葉や個体差による例外があるため、葉先の鋭さと合わせて判断するのが確実。\"},{\"name\":\"アスナロ\",\"sciName\":\"Thujopsis dolabrata\",\"distinguishingPoints\":\"葉の一片がサワラより明らかに大きく分厚く（長さ5〜7mm程度）、葉裏の白い気孔帯もサワラよりはるかに幅広く目立つ帯状に入る点で区別できる。別名ヒバ。日本海側（東北・北陸など）に多く自生する。\"},{\"name\":\"イトヒバ・ヒヨクヒバなどサワラの園芸品種群\",\"sciName\":\"Chamaecyparis pisifera 'Filifera' / 'Squarrosa' 等\",\"distinguishingPoints\":\"サワラには枝がひも状に垂れ下がる「イトヒバ（糸檜葉）」や、幼木の針状の青緑色の葉を成木になっても保持し続ける「ヒヨクヒバ（別名シノブヒバ）」など、野生型のサワラとは葉の形・色つやが大きく異なる園芸品種が非常に多く作出されている。これらは公園・庭園の生垣や庭木として全国的に極めて多く植栽されているが、分類学上はいずれも同一種（Chamaecyparis pisifera）の栽培品種であり、野生のサワラとは似ても似つかない姿のため同種と気づきにくい点が実務上の混同の原因となる。\"}],\"source\":{\"name\":\"三河の植物観察「サワラ Chamaecyparis pisifera」\",\"url\":\"https://mikawanoyasou.org/data/sawara.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"気孔帯のX字/Y字による識別は日本の樹木図鑑で広く紹介される伝統的な方法だが、個体差・新葉での例外があり単独では決め手にならない場合があることが複数の樹木観察系サイトで指摘されている。イトヒバ・ヒヨクヒバ等の園芸品種情報は庭木図鑑等の一般的な記述に基づく。\"}},{\"id\":\"juniperus-chinensis\",\"nameJa\":\"イブキ\",\"nameJaAlt\":[\"ビャクシン\"],\"sciName\":\"Juniperus chinensis L. var. chinensis\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"イブキ\",\"いぶき\",\"伊吹\",\"ビャクシン\",\"柏槇\",\"びゃくしん\",\"juniperus chinensis\",\"chinese juniper\"],\"worldDistribution\":{\"summary\":\"POWOは本変種（var. chinensis）の自生域を中国（中国北中部・南中部・東南部・内モンゴル・台湾）からミャンマー北部、朝鮮半島、日本など温帯東アジア一帯としている。イギリス・ノルウェーに導入記録がある。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Juniperus chinensis var. chinensis\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77170218-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this variety is China to N. Myanmar and Temp. E. Asia.\\\" 自生地に Japan, Korea, China North-Central, China South-Central, China Southeast, Inner Mongolia, Myanmar, Taiwan を含む。\"}},\"japanDistribution\":{\"summary\":\"本州（岩手県以南）、四国、九州の太平洋岸および瀬戸内海沿岸に分布する。ふつう海岸の岩場や砂地、ときに石灰岩地などの山上に生育し、強風地では独特のねじれた樹形になる。一方で観賞用としても広く植栽され、庭木・生垣・盆栽用に多数の園芸品種が作出されている。\",\"status\":\"自生（海岸の岩場等）／観賞用にも広く植栽\",\"habitat\":\"本州（岩手県以南）・四国・九州の太平洋岸および瀬戸内海沿岸に分布し、海岸の岩場や砂地、ときに石灰岩地の山上など、主に沿岸の岩礫質の立地に生育する。ウバメガシ・ヒメユズリハ・トベラなど暖温帯の海岸性樹種と混生することが多く、強風地では独特のねじれた樹形になる。一方で観賞用として庭木・生垣・盆栽用にも広く植栽され、野生と植栽の判別が課題となる。\",\"source\":{\"name\":\"Wikipedia日本語版「イブキ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A4%E3%83%96%E3%82%AD\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。兵庫県における自生・植栽の別についての言及はなく、県内での野生・植栽の区別は個別の一次資料での確認が必要。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（瀬戸内海沿岸の島嶼部、計4産地、野生の可能性が高い）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文に「Juniperus chinensis L. イブキ」の項があり、県内4地点からの採集記録が列挙されている：赤穂市生島、家島町上島、淡路町大和島、一宮町明神崎。生島・家島諸島はいずれも瀬戸内海の岩場を持つ島嶼であり、イブキの典型的な自生環境（海岸の岩場）と一致するため、これらは庭木としての植栽ではなく自生個体である可能性が高いと考えられる。ただし目録本文に「自生」「植栽」の別が明記されているかは確認できていない。\",\"volume\":2,\"page\":null,\"localities\":[\"赤穂市生島 N.F.& T.Kato 100 (SHO)\",\"家島町上島 N.K. 15868 (SHO)\",\"淡路町大和島 T.K. 12532 (SHO)\",\"一宮町明神崎 T.K. 12428 (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF読み取りを2回にわたって行い、初回抽出時と再確認時（追加産地の有無を問うたパス）のいずれも同一の4産地（赤穂市生島〜一宮町明神崎）で一致・安定したため、産地数については高い確度で完全と考えられる。ただしWebFetchはPDF全文をAIが要約・言い換えて返す仕組みであり、ページ番号（null）・地名表記・採集者名の細部の正確性については人手による原本照合を行っていない。またイブキは観賞用に非常に広く植栽される種であるため、採集地が離島の岩場であることから自生の可能性が高いと推測したが、これは状況証拠に基づく推定であり、標本ラベル等での確認ではない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同種の変種であるハイビャクシンとは生育型（直立高木か匍匐低木か）が主な区別点。イブキ自身が幼木・成木を問わず針状葉と鱗片状葉の両方をつけうる点も紛らわしさの一因で、近縁のネズミサシや、同種の代表的な園芸品種であるカイヅカイブキとの混同にも注意が必要。\",\"items\":[{\"name\":\"ハイビャクシン\",\"sciName\":\"Juniperus chinensis var. procumbens Siebold ex Endl.\",\"distinguishingPoints\":\"同種の変種で、最大の違いは樹形。イブキは直立する高木（時に10m以上）になるのに対し、ハイビャクシンは地を這うように広がる匍匐性の低木で、直立した主幹をほとんど作らない。葉の形態自体はよく似ており、針状葉の長さがハイビャクシンでは0.8〜1.2cm程度とイブキ（0.6〜1.2cm程度）よりやや短めの傾向があるとされるが決定的な差ではなく、生育型（樹形が直立か匍匐か）で見分けるのが確実。\"},{\"name\":\"ネズミサシ（トショウ）\",\"sciName\":\"Juniperus rigida Siebold et Zucc.\",\"distinguishingPoints\":\"イブキは若木・成木を問わず針状葉と鱗片状葉の両方をつけ、特に成木では大部分が鱗片状葉になるのに対し、ネズミサシは終生ずっと鋭く尖った針状葉のみをつけ、鱗片葉になることがない点で明確に区別できる。ネズミサシの葉は3個ずつ輪生し、葉の断面は三角形で、表面の深い溝の中に白い気孔帯の筋が入り、触れると痛いほど鋭い。葉の基部に関節があることも識別点。\"},{\"name\":\"カイヅカイブキ\",\"sciName\":\"Juniperus chinensis 'Kaizuka'（イブキと同種の栽培品種）\",\"distinguishingPoints\":\"イブキと分類学上は同一種（Juniperus chinensis）の代表的な栽培品種。枝が螺旋状にねじれながら伸び、枝先が炎のように立ち上がる渦巻き状の樹形をとり、幅が広くやや濃い緑色の葉を持つ点でイブキと区別できる。庭木・生垣として全国的に極めて多く植栽されており、野外でビャクシン類らしき木を見つけた場合、自生のイブキよりもこのカイヅカイブキが植栽・逸出した個体である可能性がまず疑われる。\"}],\"source\":{\"name\":\"三河の植物観察「イブキ Juniperus chinensis」\",\"url\":\"https://mikawanoyasou.org/data/ibuki.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"イブキの針状葉・鱗片状葉の形質記述、およびネズミサシとの識別点（葉の輪生・断面形状・基部の関節）は三河の植物観察の記載に基づく。カイヅカイブキとの外観比較は庭木図鑑等の一般的な記述に基づき、いずれも二次資料である点に留意。\"}},{\"id\":\"juniperus-chinensis-var-procumbens\",\"nameJa\":\"ハイビャクシン\",\"nameJaAlt\":[],\"sciName\":\"Juniperus chinensis var. procumbens Siebold ex Endl.\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"ハイビャクシン\",\"はいびゃくしん\",\"這柏槇\",\"juniperus procumbens\",\"juniperus chinensis var. procumbens\",\"shore juniper\"],\"worldDistribution\":{\"summary\":\"POWOは本タクソンを独立種 Juniperus procumbens (Siebold ex Endl.) Miq. として扱っており（Juniperus chinensis var. procumbens はそのシノニムの一つ）、自生域を韓国西部・南部および日本南部から南西諸島としている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Juniperus procumbens (Siebold ex Endl.) Miq.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:1143504-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is W. & S. Korea, S. Japan to Nansei-shotō.\\\" 匍匐性の低木（subshrub）とされる。Juniperus chinensis var. procumbens を含む13の異名（シノニム）を持つ。\"}},\"japanDistribution\":{\"summary\":\"国内の自生地は九州沿岸の限られた島嶼に限定され、福岡県沖ノ島、佐賀県馬渡島、長崎県五島列島（三面島）・壱岐・対馬などから知られ、韓国の大黒山島（テフクサン島）にも分布する。海岸の砂地や崖地に生育し、時に大きな群落を形成する。福岡県・佐賀県のレッドリストでは絶滅危惧IA類（CR）に指定されている（2023年時点）。\",\"status\":\"自生（九州沿岸の限られた島嶼のみ）／園芸用にも広く植栽\",\"habitat\":\"国内自生地は九州沿岸の限られた島嶼（福岡県沖ノ島、佐賀県馬渡島、長崎県五島列島・壱岐・対馬など）に限定され、海岸の砂地または崖地という特殊な立地に生育する。潮風や砂地に強い性質を持ち、時に大きな群落を形成する。園芸用に地被植物として広く植栽されるため、自生地以外で見られる個体はほぼ植栽由来と考えられる。\",\"source\":{\"name\":\"Wikipedia日本語版「ハイビャクシン」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%82%A4%E3%83%93%E3%83%A3%E3%82%AF%E3%82%B7%E3%83%B3\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。自生地が九州沿岸の島嶼に限定される点は複数の記述（POWO・Wikipedia）で一致しており、兵庫県（本州瀬戸内海・日本海沿岸）は自生の分布域に含まれないとみられる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「ハイビャクシン」「procumbens」の語は検出されなかった。本種の自生地は九州沿岸の一部島嶼（福岡・佐賀・長崎）と韓国南西部の島に限られており、本州の兵庫県は自生の分布域外にあるため、記録がないことは自然分布と整合的である。ハイビャクシンは地被植物として庭園・公園に広く植栽される種でもあるため、兵庫県内で見かける個体はほぼ全てが植栽由来と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため、抽出漏れの可能性を完全には排除できない。ただし自生分布域が九州沿岸島嶼に限定されるという複数資料の一致から、記録なしという結論の妥当性は比較的高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"変種として同種であるイブキとの関係が最も重要で、直立する高木か地を這う匍匐性低木かという生育型の違いが基本的な識別点となる。同じく匍匐性の海岸性ビャクシン属であるハイネズや、近縁のネズミサシとの混同にも注意が必要。\",\"items\":[{\"name\":\"イブキ（ビャクシン）\",\"sciName\":\"Juniperus chinensis L. var. chinensis\",\"distinguishingPoints\":\"本種の母変種にあたる直立性の高木。ハイビャクシンが地を這って広がる匍匐性低木で直立した主幹をほとんど持たないのに対し、イブキは10m近くに達する直立木に生育する点が最大の違い。葉の形態自体（針状葉・鱗片状葉が同一個体に混在する点を含む）はよく似ているため、樹形（生育型が直立か匍匐か）で見分けるのが基本となる。\"},{\"name\":\"ハイネズ\",\"sciName\":\"Juniperus conferta Parl.\",\"distinguishingPoints\":\"ハイビャクシンと同様に海岸に生育し地を這って広がる匍匐性のビャクシン属だが、ハイネズは終生鋭く尖った針状葉のみをつけ、ハイビャクシンのように成長に伴って鱗片状葉に変化することがない点で区別できる。触れると痛いほど鋭い葉であることが野外での手がかりになる。\"},{\"name\":\"ネズミサシ（トショウ）\",\"sciName\":\"Juniperus rigida Siebold et Zucc.\",\"distinguishingPoints\":\"ネズミサシは終生鋭い針状葉のみをつけ、成木になっても鱗片状葉に変化しない点でハイビャクシンと異なる。また樹形も直立する小高木となり、ハイビャクシンのような匍匐性の低い樹形にはならない。\"}],\"source\":{\"name\":\"三河の植物観察「ネズミサシ Juniperus rigida」\",\"url\":\"https://mikawanoyasou.org/data/nezumisasi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"ハイネズ（Juniperus conferta）は日本の海岸に分布する匍匐性の在来ビャクシン属で、ハイビャクシンとは別種だが生育環境・樹形が酷似するため、野外での混同事例として重要と判断し追加した。ネズミサシとの識別点は三河の植物観察の記載に基づく一次的な形態記述だが、いずれもハイビャクシンとの直接比較を論じた資料ではなく、エージェントによる整理を含む二次資料相当として扱う。\"}},{\"id\":\"juniperus-rigida\",\"nameJa\":\"ネズミサシ\",\"nameJaAlt\":[\"ネズ\"],\"sciName\":\"Juniperus rigida Siebold et Zucc.\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"ネズミサシ\",\"ねずみさし\",\"ネズ\",\"ねず\",\"杜松\",\"juniperus rigida\",\"needle juniper\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を中国青海省東部からサハリン・南西諸島に至る範囲としており、中国北中部、内モンゴル、日本、朝鮮半島、満州、沿海地方（プリモーリエ）、青海省を含む。アメリカ（アラバマ州・カリフォルニア州）に導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Juniperus rigida Siebold et Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262335-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is E. Qinghai to Sakhalin and Nansei-shotō.\\\"\"}},\"japanDistribution\":{\"summary\":\"本州（岩手県以南）、四国、九州、朝鮮半島、中国北部、ロシアに分布し、特に瀬戸内海地域に多い。日当たりがよく花崗岩質などの痩せた尾根、アカマツ林内、砂地などに見られる。近年はマツ枯れ（松くい虫被害）によりアカマツが減少した跡地で分布を広げる傾向も報告されている。\",\"status\":\"自生（里山・尾根の乾燥地に普通）\",\"source\":{\"name\":\"Wikipedia日本語版「ネズ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8D%E3%82%BA\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。瀬戸内海地域に多いとの記述は、瀬戸内海に面する兵庫県南部での分布の多さと整合的である。\",\"habitat\":\"日当たりのよい花崗岩質などの痩せた尾根や、アカマツ林内、海岸沿いの砂地など、乾燥した貧栄養の立地に生育する。丘陵地から低山帯にかけての里山環境に多く見られ、標高の高い山地よりも人里に近い乾いた尾根筋を好む傾向がある。近年はマツ枯れ（松くい虫被害）でアカマツが失われた跡地に侵入して分布を広げる例も報告されている。ナシ栽培地では赤星病の中間宿主となるため、植栽が規制されている地域もある。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内に広く分布、記録多数）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文「Juniperus rigida Sieb. et Zucc. ネズ」の項を、4回の独立したWebFetch照会（全件列挙・追加産地の有無確認・出現箇所の網羅確認・件数カウントの4通りの指示文）で照合した結果、合計28件の産地記録（大屋町加保坂 M.H. 75510 (SHO) から南淡町福良 N.F. 12156 (SHO) まで）が一貫して確認された。但馬（大屋町）、西播磨（上郡町・相生市・龍野市）、中播磨（姫路市・家島町）、北播磨（滝野町・社町・小野市・三木市）、東播磨（加古川市・明石市）、丹波（市島町・篠山町）、神戸市内（西区・北区・長田区・灘区・東灘区）、阪神間（宝塚市・西宮市）、淡路島（淡路町・北淡町・東浦町・洲本市・西淡町・緑町・南淡町）と、県内ほぼ全域にわたって記録があり、ヒノキ科の中でも特に記録数が多い種であることが裏付けられた。\",\"volume\":2,\"page\":null,\"localities\":[\"大屋町加保坂（現・養父市）M.H. 75510 (SHO)\",\"上郡町須時 N.F. 9132 (SHO)\",\"相生市瓜生 T.K. 31241 (SHO)\",\"龍野市大成山（現・たつの市）T.K. 20086 (SHO)\",\"家島町家島（現・姫路市）T.Shimizu (SHO)\",\"姫路市妻鹿 N.K. 16476 (SHO)\",\"滝野町光明寺山（現・加東市）T.K. 31639 (SHO)\",\"社町山国（現・加東市）M.Y. 25616 (SHO)\",\"小野市青野ケ原 M.Y. 16281 (SHO)\",\"三木市細川町 N.F. & M.Okamoto 38 (SHO)\",\"加古川市上荘町 N.K. 10896 (SHO)\",\"明石市高丘 T.K. 20631 (SHO)\",\"市島町永郷池（現・丹波市）N.K. 21270 (SHO)\",\"篠山町小金ケ嶽（現・丹波篠山市）N.K. 14781 (SHO)\",\"西区木津（神戸市西区）S.Aochi 55 (SHO)\",\"北区丹生山（神戸市北区）I.Okamoto 29 (SHO)\",\"長田区高取山（神戸市長田区）T.K. 24846 (SHO)\",\"灘区摩耶山（神戸市灘区）Y.Matsumura (SHO)\",\"東灘区ロックガーデン（神戸市東灘区）M.H. 7295 (SHO)\",\"宝塚市波豆 N.K. 7062 (SHO)\",\"西宮市丸山 T.K. 21452 (SHO)\",\"淡路町篝場山（現・淡路市）T.K. 17421 (SHO)\",\"北淡町野島（現・淡路市）T.K. 16766 (SHO)\",\"東浦町谷山（現・淡路市）T.K. 16583 (SHO)\",\"洲本市鮎屋川 T.K. 15869 (SHO)\",\"西淡町伊加利（現・南あわじ市）T.K. 14770 (SHO)\",\"緑町感応寺山（現・南あわじ市）T.K. 16974 (SHO)\",\"南淡町福良（現・南あわじ市）N.F. 12156 (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"当初の粗い抽出（大屋町加保坂・上郡町須時の2件のみ）から、内容・表現の異なる4回の独立したWebFetch照会（(1)全件列挙、(2)既出28件を提示した上で追加産地の有無確認、(3)ヒノキ科セクション内での『ネズ』『Juniperus rigida』の全出現箇所の網羅確認、(4)セミコロン区切りレコード数のカウントと全件の再列挙）を行った結果、4回すべてで完全に同一の28件・同一の地名/採集者/標本番号のリストが得られ、追加の産地は一件も検出されなかった。この一貫性から、28件というリストの完全性についてかなり高い確信度を持っている。ただし、(1)WebFetchツールには15分間のキャッシュ機構があり、後続の照会が完全に独立したPDF再読込でない可能性がある、(2)WebFetchの処理はAIによる要約的抽出であり、OCR品質やPDFのテキストレイヤーの問題による見落としを完全には排除できない、(3)印刷ページ番号は本文から特定できず（page: null）、地名の旧字体・異体字表記の完全な正確性も未検証、という限界があるため、100%の完全性を主張するものではない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁のハイネズや、庭木として植えられるイブキ・カイヅカイブキと混同されやすいが、樹形と葉の硬さ・鋭さで区別できる。\",\"items\":[{\"name\":\"ハイネズ\",\"sciName\":\"Juniperus conferta Parl.（Juniperus rigida var. confertaとされることもある）\",\"distinguishingPoints\":\"ネズミサシに極めて近縁で、歴史的には同種の変種として扱われたこともある。ネズミサシは直立する低木〜小高木（高さ数m）になるのに対し、ハイネズは海岸の砂地を這うように広がる匍匐性の低木で、樹高がほとんど立ち上がらない点が最大の違い。ハイネズの球果はネズミサシよりやや大きい（8〜10mm程度）とされる。生育地もネズミサシが内陸の乾いた尾根やアカマツ林などであるのに対し、ハイネズは海岸の砂浜に限られる。\"},{\"name\":\"イブキ（ビャクシン）／カイヅカイブキ\",\"sciName\":\"Juniperus chinensis L.\",\"distinguishingPoints\":\"イブキやその園芸品種カイヅカイブキは、成木の葉のほとんどが柔らかい鱗片状（ヒノキの葉に近い触感）で、触れても痛くない。一方ネズミサシの葉は生涯を通じて硬く鋭い針状（3枚輪生）で、触れると指に刺さるほど痛いため、この触感の違いで容易に区別できる。ただしイブキ類も若木や徒長枝には針状葉が混じることがあり、その場合は樹形（イブキは庭木として仕立てられた円錐形〜らせん状の樹形が多い）や生育場所（イブキは社寺・庭園に植栽されることが多く、ネズミサシは自生の乾いた尾根に多い）で判断する。\"}],\"source\":{\"name\":\"植木ペディア「ハイネズ」「ネズミサシ（鼠刺し）」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%8F%E3%82%A4%E3%83%8D%E3%82%BA/\",\"type\":\"secondary\"},\"reliabilityNote\":\"植木ペディア・三河の植物観察などの造園・植物観察系サイト（二次資料）を複数参照して整理した。ハイネズはKew POWOではネズミサシの変種（Juniperus rigida var. conferta）のシノニムとして扱われており、両者が分類学的にも近縁であることと符合する。\"}},{\"id\":\"thujopsis-dolabrata\",\"nameJa\":\"アスナロ\",\"nameJaAlt\":[],\"sciName\":\"Thujopsis dolabrata (L.f.) Siebold et Zucc. var. dolabrata\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"アスナロ\",\"あすなろ\",\"翌檜\",\"thujopsis dolabrata\",\"hiba\",\"hiba arborvitae\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本のみとしており、日本固有種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Thujopsis dolabrata (L.f.) Siebold et Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263878-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"基準変種（var. dolabrata）は本州・四国・九州に分布する。よく知られる主産地は青森県のヒバ天然林など東北地方であるが、分布域自体は本州全域から四国・九州にまで及ぶとされる。近畿地方・兵庫県についての具体的な記述はWikipediaの当該記事からは確認できなかったが、兵庫県豊岡市には「栃が谷平のアスナロ群生」という県指定天然記念物があり、少なくとも歴史的に兵庫県内に自生集団が存在することが確認できる。\",\"status\":\"自生（本州〜九州、主産地は東北〜中部だが西日本にも分布）\",\"source\":{\"name\":\"Wikipedia日本語版「アスナロ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A2%E3%82%B9%E3%83%8A%E3%83%AD\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料であり、近畿地方における詳しい自生状況の記述は乏しい。ただし同記事中に兵庫県豊岡市の天然記念物「栃が谷平のアスナロ群生」が挙げられている点は、兵庫県産維管束植物の記録（下記）と地理的に整合する。\",\"habitat\":\"湿潤な冷温帯（ブナ帯）に分布し、一般に斜面下部の湿った立地を好む。耐陰性が極めて高いため他の樹木の林床でも生育でき、ヒノキなどの林内下層に見られるほか、尾根筋や湿原周辺では純林を形成することもある。自生地ではクロベ（ネズコ）やブナと混生することが多く、積雪の影響で根元が曲がった個体も見られる。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（但馬・丹波地域に自生、天然記念物指定地あり）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文「Thujopsis dolabrata Sieb. et Zucc. アスナロ」の項を、2回の独立したWebFetch照会（全件列挙、および既出4件を提示した上での追加産地の有無確認）で照合した結果、合計4件（竹野町三原 T.Fujii 3873 (HYO)、日高町稲葉 S.H. 7833 (HYO)、丹南町追入金山 T.Fujii 9384 (HYO)、今田町辰巳 T.Fujii 9211 (HYO)）で全てであることが確認された。竹野町・日高町は現・豊岡市、丹南町・今田町は現・丹波篠山市にあたり、いずれも山地からの採集記録で、栽培由来ではなく自生集団と考えられる。豊岡市には県指定天然記念物「栃が谷平のアスナロ群生」があり、この記録と符合する。\",\"volume\":2,\"page\":null,\"localities\":[\"竹野町三原（現・豊岡市）T.Fujii 3873 (HYO)\",\"日高町稲葉（現・豊岡市）S.H. 7833 (HYO)\",\"丹南町追入金山（現・丹波篠山市）T.Fujii 9384 (HYO)\",\"今田町辰巳（現・丹波篠山市）T.Fujii 9211 (HYO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"内容の異なる2回の独立したWebFetch照会（全件列挙、および既出4件を提示した上での追加確認）を行い、いずれも同一の4件が全件であるとの回答が得られ、追加の産地は検出されなかった。前回の粗い抽出時点と同一の4件であったことも一致の傍証となる。件数が少なく2回の照会結果が完全に一致したため、この4件が完全なリストである確信度は比較的高い。ただしWebFetchによるPDFテキスト抽出はAIによる要約的抽出であり、印刷ページ番号は特定できておらず（page: null）、OCR品質等による見落としの可能性を完全には排除できない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"ヒノキ・サワラなどの同科の近縁種と葉形が似るが、アスナロの葉は明らかに大きく厚みがあり、葉裏の白い模様も他種よりずっと大きく目立つ点で区別できる。\",\"items\":[{\"name\":\"ヒノキ\",\"sciName\":\"Chamaecyparis obtusa (Siebold et Zucc.) Endl.\",\"distinguishingPoints\":\"アスナロの葉は長さ5〜7mm程度でヒノキの葉よりも明らかに大きく分厚く、葉先が尖らず丸みを帯びる（ヒノキの葉先は丸みがあるがより小さく薄い）。最も確実な違いは葉裏で、ヒノキの気孔帯は細いY字（Ψ字）形の白い筋であるのに対し、アスナロの気孔帯は葉の幅いっぱいに広がる大きな白斑（「の」の字や涎掛け＝ビブ状と形容される太い模様）になり、遠目にも白さが際立つ。手で触れても厚みの違いがはっきり分かる。\"},{\"name\":\"サワラ\",\"sciName\":\"Chamaecyparis pisifera (Siebold et Zucc.) Endl.\",\"distinguishingPoints\":\"サワラの葉はヒノキよりもさらに小さく先端が鋭く尖り、葉裏の気孔帯はH字・X字（あるいはW字）状に見えることが多いが個体差が大きい。アスナロはこれら2種よりひとまわり大きく厚い葉と、葉全体を覆うような幅広で明瞭な白斑によって明確に区別できる。\"},{\"name\":\"ヒノキアスナロ（ヒバ）\",\"sciName\":\"Thujopsis dolabrata var. hondae (Makino) Sarg.\",\"distinguishingPoints\":\"アスナロの変種で、青森県など東北地方に多く分布し「青森ヒバ」として知られる。基準変種アスナロ（var. dolabrata）に比べて葉や球果がやや小さく、球果には角（つの）状の突起がなく丸みを帯びる点で区別されるとされるが、両変種は非常によく似ており、野外での確実な同定には産地情報や球果の観察が必要になることが多い。兵庫県産の個体は基準変種アスナロに該当する。\"}],\"source\":{\"name\":\"植木ペディア「アスナロ（翌檜）」／もぐらのもぐ「ヒノキ、アスナロ、サワラの葉の見分け方」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%A2%E3%82%B9%E3%83%8A%E3%83%AD/\",\"type\":\"secondary\"},\"reliabilityNote\":\"複数の植物観察・造園系サイト（二次資料）を突き合わせて整理した。気孔帯の形状は個体差・観察部位によりばらつきがあるとの指摘もあり、断定的な識別形質というより傾向として捉えるべきである。\"}},{\"id\":\"thuja-standishii\",\"nameJa\":\"ネズコ\",\"nameJaAlt\":[\"クロベ\"],\"sciName\":\"Thuja standishii (Gordon) Carrière\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"ネズコ\",\"ねずこ\",\"クロベ\",\"くろべ\",\"黒檜\",\"鼠子\",\"thuja standishii\",\"japanese thuja\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本（本州、四国）としており、日本固有種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Thuja standishii (Gordon) Carrière\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263978-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan (Honshu, Shikoku).\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、本州（秋田県から中部地方）および四国の山地帯（ブナ帯）上部から亜高山帯にかけて分布する。近畿地方は秋田県〜中部地方という本州側の分布範囲と四国側の分布範囲の間に位置し、この記述からは近畿地方・兵庫県が自生域に含まれるとは読み取れない。兵庫県内の最高峰（氷ノ山、標高1,510m）は本種が典型的に生育する亜高山帯環境には届かない可能性が高く、分布域外である可能性が高い。\",\"status\":\"自生（本州中部以北・四国の山地帯上部〜亜高山帯、近畿地方は分布域外の可能性）\",\"source\":{\"name\":\"Wikipedia日本語版「クロベ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AD%E3%83%99\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。「秋田県から中部地方」という表現は近畿地方を明示的には含んでおらず、兵庫県における自生の可能性は低いと推測されるが、これはWikipediaの簡潔な記述からの推論であり、より詳細な分布図・標本データによる確認が望ましい。\",\"habitat\":\"山地帯（ブナ帯）上部から亜高山帯にかけての尾根や岩場、風衝地に生育し、陰樹で成長は比較的遅い。シラビソ・キタゴヨウ・コメツガなどの針葉樹やヒノキと混生することがあり、蛇紋岩地帯のような特殊な地質にも耐えて生育する。積雪の多い山地の急峻な地形に適応した樹種とされる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外の可能性が高い）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「ネズコ」「クロベ」「Thuja standishii」のいずれの語も検出されなかった。本種の自生域は本州の秋田県〜中部地方および四国の山地帯上部〜亜高山帯とされ、近畿地方（兵庫県を含む）はこの分布域の間に位置して自生域外とみられることと整合的である。兵庫県最高峰の氷ノ山（標高1,510m）は亜高山帯環境としては標高がやや不足している可能性もあり、記録がないことは自然分布上妥当と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし複数の資料（POWO・Wikipedia）が示す自生域（秋田県〜中部地方、四国）に近畿地方が含まれないことと整合しており、記録なしという結論の妥当性は比較的高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じ扁平葉のヒノキ科であるヒノキ・サワラ・アスナロと非常によく似るが、葉裏の白斑が目立たないこと、香りがないこと、樹皮が繊維状に細く裂けることで見分けられる。\",\"items\":[{\"name\":\"ヒノキ\",\"sciName\":\"Chamaecyparis obtusa (Siebold et Zucc.) Endl.\",\"distinguishingPoints\":\"ネズコ（クロベ）の葉は長さ2〜3mmとヒノキ・サワラより小さく、先端は丸みを帯びてより肉厚である。最大の違いは葉裏で、ヒノキは白いY字形の気孔帯がくっきり目立つのに対し、ネズコは気孔帯があまり白く目立たない。また、ヒノキの葉をちぎると特有の芳香があるが、ネズコにはこの香りがなく、この点でも簡単に区別できる。樹皮はどちらも赤褐色で繊維状に薄く剥がれる点が似るが、ネズコの方が剥がれる幅が狭く、より滑らかな印象を与える。\"},{\"name\":\"サワラ\",\"sciName\":\"Chamaecyparis pisifera (Siebold et Zucc.) Endl.\",\"distinguishingPoints\":\"サワラも葉先が鋭く尖り、葉裏に白い気孔帯（H字・X字状）が目立つ点でネズコと区別できる。葉の大きさは概ね「アスナロ＞ネズコ＞ヒノキ・サワラ」の順とされ、ネズコの葉はヒノキ・サワラよりやや大きく丸みを帯びる。\"},{\"name\":\"アスナロ\",\"sciName\":\"Thujopsis dolabrata (L.f.) Siebold et Zucc.\",\"distinguishingPoints\":\"アスナロは4種の中で最も葉が大きく厚みがあり、葉裏の白斑も最も幅広く目立つため、葉だけでもネズコと容易に区別できる。ネズコの自生地ではしばしばアスナロやブナと混生することがあり、同所的に生育している場合は特に葉裏の模様の大きさ・白さの違いに注目するとよい。\"}],\"source\":{\"name\":\"植木ペディア「クロベ（黒檜）」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%AF%E3%83%AD%E3%83%99/\",\"type\":\"secondary\"},\"reliabilityNote\":\"植木ペディアなど造園・植物観察系サイト（二次資料）の記述を整理した。兵庫県内には自生記録がない種であるため、識別ポイントは他地域での観察知見に基づく一般論である。\"}},{\"id\":\"metasequoia-glyptostroboides\",\"nameJa\":\"メタセコイア\",\"nameJaAlt\":[\"アケボノスギ\"],\"sciName\":\"Metasequoia glyptostroboides Hu et W.C.Cheng\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"メタセコイア\",\"めたせこいあ\",\"アケボノスギ\",\"あけぼのすぎ\",\"曙杉\",\"metasequoia\",\"Metasequoia glyptostroboides\"],\"worldDistribution\":{\"summary\":\"「生きた化石」として知られる遺存種で、確実な自生地は中国中南部の湖北省・重慶市・湖南省にまたがる限られた山地（利川市を中心とする渓谷帯）に限られる。1941年に三木茂が化石種として記載した属が、1940年代に湖北省利川市で生存個体として発見され、1948年に胡先驌・鄭萬鈞により新種記載された。世界的には20世紀半ば以降、公園樹・街路樹として世界中に広く植栽されているが、これらはすべて導入・栽培由来であり自生ではない。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Metasequoia glyptostroboides Hu & W.C.Cheng\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:828387-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is China (Chongqing, Hubei, Hunan).\\\" Distribution: China South-Central,
