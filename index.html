00〜2,000m程度の冷温帯〜亜高山帯にかけて、比較的降水量の少ない大陸的な冷涼・乾燥気候の岩屑斜面などに生育する。樹形はいわゆるクリスマスツリー型で、樹高25m前後・幹の直径1mに達する個体もある。近縁のヒメバラモミが比較的湿った雲霧帯・斜面に生育するのに対し、ヤツガタケトウヒは乾いた立地を好む傾向がある点で生育環境が異なる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外・極めて希少な局所分布種）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文をWebFetchで検索したが、「ヤツガタケトウヒ」「トウヒ属」「Picea」のいずれの語も検出されなかった。同巻マツ科の項に掲載されているのはモミ・アカマツ・ヒメコマツ・クロマツ・ツガの5種のみである。本種は長野県・山梨県境の八ヶ岳・南アルプス北部というごく限られた一地域にのみ自生し、野生個体数も全体で1,000本程度と推定される絶滅危惧IB類（EN）の希少種であり、兵庫県から数百km離れた別地域に隔離分布することから、兵庫県での記録がないことは地理的にきわめて当然である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的確認であり、抽出漏れの可能性は完全には排除できない。ただし本種の自生地は長野県・山梨県の八ヶ岳周辺にのみ限定されるとする複数資料（Wikipedia・森林総合研究所等）の記述と整合しており、記録なしという結論の妥当性はきわめて高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属で同じく八ヶ岳・南アルプス北部に自生する近縁の希少種ヒメバラモミとは特に混同されやすく、生育立地や葉幅・樹高で識別する。チョウセンハリモミとも近縁とされる。\",\"items\":[{\"name\":\"ヒメバラモミ\",\"sciName\":\"Picea maximowiczii Regel ex Carrière\",\"distinguishingPoints\":\"ヤツガタケトウヒは樹高35m・葉幅1.8〜2.6mmで比較的乾いた岩屑斜面に生育するのに対し、ヒメバラモミは樹高45mに達し葉幅1.4〜2.0mmとやや細く、降水量の多い湿った雲霧帯・亜高山斜面を好む点で区別される。\"},{\"name\":\"チョウセンハリモミ\",\"sciName\":\"Picea koraiensis Nakai\",\"distinguishingPoints\":\"朝鮮半島・中国東北部に分布する近縁種で、ヤツガタケトウヒと極めて近縁とされる。国内には自生しない。\"},{\"name\":\"ハリモミ（バラモミ）\",\"sciName\":\"Picea torano (Siebold ex K.Koch) Koehne\",\"distinguishingPoints\":\"葉が硬く触ると痛いハリモミに対し、ヤツガタケトウヒは葉に触れてもあまり痛くない点で区別できる。\"}],\"source\":{\"name\":\"トウヒ属 Picea – ざっそう屋\",\"url\":\"https://zassou-ya.com/plants/g-touhi/\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営サイト（二次資料）に基づく識別点であり、学術的検索表による確認ではない。\"}},{\"id\":\"picea-maximowiczii\",\"nameJa\":\"ヒメバラモミ\",\"nameJaAlt\":[],\"sciName\":\"Picea maximowiczii Regel ex Carrière\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ヒメバラモミ\",\"ひめばらもみ\",\"姫薔薇樅\",\"picea maximowiczii\",\"maximowicz's spruce\",\"maximowicz spruce\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を「Central Japan (Fuji-san, Yatsugadake Mountains)」（本州中部・富士山、八ヶ岳）としており、日本固有種で、国内でも中部地方の限られた山域にのみ分布する希少種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Picea maximowiczii Regel ex Mast.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262679-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Central Japan (Fuji-san, Yatsugadake Mountains).\\\" 分布域として単純に「Japan」とも記載されている。POWO上の命名者表記は「Regel ex Mast.」であり、本項の「Regel ex Carrière」とは命名者引用が異なるが同一の分類群を指す。\"}},\"japanDistribution\":{\"summary\":\"日本特産種で、八ヶ岳・南アルプス北部・秩父山地にかけての標高1,000〜2,000mの冷温帯〜亜高山帯に分布する。最終氷期には冷涼・乾燥気候の下で日本の広い範囲に分布していたことが化石記録から知られるが、現在は近年の過剰伐採やトウヒ林からカラマツ林への樹種転換などにより分布が著しく縮小し、現存個体数は1,000本足らずと推定される絶滅危惧種（IUCNレッドリスト：Endangered）となっている。分布地はいずれも長野県・山梨県・埼玉県境の関東甲信山地に集中しており、兵庫県を含む近畿地方からは大きく離れている。\",\"status\":\"自生（長野県・山梨県・埼玉県境の八ヶ岳・南アルプス北部・秩父山地のみ、日本固有・きわめて限定的な局所分布）。近畿地方・兵庫県は分布域から遠く離れている。\",\"source\":{\"name\":\"ヒメバラモミ — Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/ヒメバラモミ\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版という二次資料に基づく。分布地として挙げられる八ヶ岳・南アルプス北部・秩父山地はいずれも関東甲信地方の山域であり、近畿地方・兵庫県が含まれることを示す記述はない。個体数については資料によって『1,000本足らず』（Wikipedia）、『100に満たない』（別の解説サイト）など幅があり、いずれにせよ極めて少ないことは共通するが、正確な現存数については一次資料（学術論文等）による確認が望ましい。\",\"habitat\":\"標高1,000〜2,000mの冷温帯から亜高山帯にかけて分布し、近縁のヤツガタケトウヒが乾いた岩屑斜面を好むのに対し、本種は降水量の多い雲霧帯や亜高山の斜面など比較的湿った環境に生育する傾向がある。葉は太く短く（長さ6-13mm程度）、断面は菱形で硬く触ると痛い。樹高は45mに達する個体もある。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外・絶滅危惧の希少局所分布種）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文をWebFetchで検索したが、「ヒメバラモミ」「トウヒ属」「Picea」のいずれの語も検出されなかった。同巻マツ科の項に掲載されているのはモミ・アカマツ・ヒメコマツ・クロマツ・ツガの5種のみである。本種は長野県・山梨県・埼玉県境の八ヶ岳・南アルプス北部・秩父山地というごく限られた関東甲信の山域にのみ自生し、現存個体数も1,000本足らずと推定される絶滅危惧種であり、兵庫県から数百km離れた別地域に隔離分布することから、兵庫県での記録がないことは地理的にきわめて当然である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的確認であり、抽出漏れの可能性は完全には排除できない。ただし本種の自生地は長野県・山梨県・埼玉県境の山域にのみ限定されるとする複数資料の記述と整合しており、記録なしという結論の妥当性はきわめて高い。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属で同じく中部地方の山地に自生する近縁の希少種ヤツガタケトウヒとは特に混同されやすく、樹高・葉幅・生育立地で識別する。ハリモミとも近縁で葉の質感が似る。\",\"items\":[{\"name\":\"ヤツガタケトウヒ\",\"sciName\":\"Picea koyamae Shiras.\",\"distinguishingPoints\":\"ヒメバラモミは樹高45m・葉幅1.4〜2.0mmで降水量の多い湿った雲霧帯・斜面に生育するのに対し、ヤツガタケトウヒは樹高35m・葉幅1.8〜2.6mmとやや太く、比較的乾いた岩屑斜面を好む点で区別される。\"},{\"name\":\"ハリモミ（バラモミ）\",\"sciName\":\"Picea torano (Siebold ex K.Koch) Koehne\",\"distinguishingPoints\":\"ハリモミは葉が15-25mmとやや長く、球果も8-10cmとヒメバラモミより明らかに大きい点で区別できる。両種とも葉は硬く触ると痛い点は共通する。\"}],\"source\":{\"name\":\"トウヒ属 Picea – ざっそう屋\",\"url\":\"https://zassou-ya.com/plants/g-touhi/\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営サイト（二次資料）に基づく識別点であり、学術的検索表による確認ではない。\"}},{\"id\":\"pinus-amamiana\",\"nameJa\":\"ヤクタネゴヨウ\",\"nameJaAlt\":[],\"sciName\":\"Pinus amamiana Koidz.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ヤクタネゴヨウ\",\"やくたねごよう\",\"屋久種子五葉\",\"屋久島五葉\",\"pinus amamiana\",\"yakushima white pine\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本（屋久島）、南西諸島（種子島）としており、九州最南部の屋久島・種子島にのみ自生する日本固有種（島嶼固有種）である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pinus amamiana Koidz.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:676999-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan (Yakushima), Nansei-shotō (Tanegashima).\\\"\"}},\"japanDistribution\":{\"summary\":\"九州最南端よりさらに南に位置する屋久島（3個体群）および種子島（1個体群）にのみ自生する島嶼固有種で、自生個体数は屋久島で約1000〜2000本、種子島で約200本と推定される希少種である。兵庫県（北緯34度台）は屋久島・種子島（おおむね北緯30〜31度）よりも緯度にして4〜5度以上北に位置し、標高の問題ではなく緯度・島嶼隔離の問題として、本種の自生域から明確に外れる。近年はマツ材線虫病（マツノザイセンチュウ）への感受性が指摘され、個体数が激減しているとされる。\",\"status\":\"自生（屋久島・種子島固有、絶滅危惧種、近畿地方は分布域外）\",\"source\":{\"name\":\"ヤクタネゴヨウ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%A4%E3%82%AF%E3%82%BF%E3%83%8D%E3%82%B4%E3%83%A8%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本国内での分布・個体数情報はWikipedia（二次資料）に基づく。屋久島・種子島以外での自生記録は資料上確認されず、地理的隔離（緯度・海峡）の観点から兵庫県への自生の可能性はほぼ皆無と考えられるが、より一次資料に近い環境省レッドデータブック等での確認が望ましい。\",\"habitat\":\"海抜100〜800m程度の山地に自生するとされ（The Gymnosperm Database調べ）、IUCNおよび環境省レッドリストで絶滅危惧種に指定されている。庭園樹として植栽される例はあるが、これは人為的導入であり自然分布とは区別される。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外—屋久島・種子島固有種のため兵庫県への自生は地理的にありえない）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「ヤクタネゴヨウ」および学名 Pinus amamiana のいずれも検出されなかった。同目録に掲載されているマツ属（Pinus）は、アカマツ（Pinus densiflora）、ゴヨウマツ（Pinus parviflora）、クロマツ（Pinus thunbergii）の3種のみであった。ヤクタネゴヨウの自生域は屋久島・種子島（おおむね北緯30〜31度）に限られ、兵庫県（北緯34度台）とは大きな緯度差・海峡による地理的隔離があるため、記録がないことは自然分布上完全に整合的である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし屋久島・種子島固有種という自生域の性質上、兵庫県での記録がないことの妥当性は極めて高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"系統的にはゴヨウマツ（ヒメコマツ）に近縁とされる5針葉の白マツだが、分布域が全く重ならず、球果や種子の形態にも差異がある。\",\"items\":[{\"name\":\"ヒメコマツ\",\"sciName\":\"Pinus parviflora Siebold et Zucc.\",\"distinguishingPoints\":\"ヤクタネゴヨウの球果はやや大きく（5〜7×3〜4cm）、種子は灰黒色で翼はごく短い痕跡的なもの（長さ0.5〜1mm）にとどまる。分布域は屋久島・種子島に限られるのに対し、ヒメコマツ（ゴヨウマツ）は本州（東北南部）〜四国・九州の広い範囲に分布し、兵庫県内にも自生記録がある。分類学的には近縁種とされ、姉妹群的な位置づけで論じられることが多い。\"}],\"source\":{\"name\":\"The Gymnosperm Database — Pinus amamiana\",\"url\":\"https://www.conifers.org/pi/Pinus_amamiana.php\",\"type\":\"secondary\"},\"reliabilityNote\":\"球果・種子のサイズは専門データベース（二次資料）の記載に基づく。ヒメコマツ側の対応する数値との厳密な比較は行っておらず、定性的な違いの記述にとどまる。\"}},{\"id\":\"pinus-koraiensis\",\"nameJa\":\"チョウセンゴヨウ\",\"nameJaAlt\":[],\"sciName\":\"Pinus koraiensis Siebold et Zucc.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"チョウセンゴヨウ\",\"ちょうせんごよう\",\"朝鮮五葉\",\"pinus koraiensis\",\"korean pine\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域をロシア極東から朝鮮半島、日本としており、東アジア北部の冷温帯〜亜寒帯に広く分布する種である（一般に中国東北部を含む記述も見られる）。日本はこの広い分布域の南東端・島嶼部にあたる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pinus koraiensis Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263037-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Russian Far East to Korea, Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本国内では、本州中部の福島県南部から岐阜県にかけての山地と、四国の東赤石岳にわずかに隔離分布する希少種とされる。近畿地方（兵庫県を含む）は、本州側の分布南限とされる岐阜県付近と、四国側の隔離産地である東赤石岳との、ちょうど中間・西寄りに位置しており、いずれの記述からも近畿地方・兵庫県が自生域に含まれるとは読み取れない。純林を作ることはなく、広葉樹林に混生する形でまれに見られる。\",\"status\":\"自生（本州中部・四国東赤石岳の隔離分布、近畿地方は分布域外の可能性）\",\"source\":{\"name\":\"チョウセンゴヨウ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%81%E3%83%A7%E3%82%A6%E3%82%BB%E3%83%B3%E3%82%B4%E3%83%A8%E3%82%A6\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本国内での分布記述はWikipedia（二次資料）に基づく。「福島県南部から岐阜県」「四国東赤石岳」という表現は近畿地方を明示的に含んでおらず、兵庫県における自生の可能性は低いと推測されるが、これは簡潔な記述からの推論であり、より詳細な分布図・標本データによる確認が望ましい。\",\"habitat\":\"本州中部の山地に比較的稀に自生し、純林を構成せず広葉樹林に混生する形をとることが多いとされる。葉は6〜12cmとゴヨウマツより明らかに長く、球果は直径8〜16cmと日本に自生するマツ類の中で最も大きい部類に入る。種子（松の実として食用にもされる）には翼がない。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外の可能性が高い）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「チョウセンゴヨウ」および学名 Pinus koraiensis のいずれも検出されなかった。同目録に掲載されているマツ属（Pinus）は、アカマツ（Pinus densiflora）、ゴヨウマツ（Pinus parviflora）、クロマツ（Pinus thunbergii）の3種のみであった。チョウセンゴヨウの日本国内での自生は本州中部（福島県南部〜岐阜県）と四国東赤石岳という隔離分布にとどまり、近畿地方・兵庫県はこの二つの分布域の間に位置することから、記録がないことは分布域と整合的である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただしチョウセンゴヨウが日本国内でも隔離分布するごく稀な種であることと整合的であり、記録なしという結論の妥当性は比較的高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じ5針葉の白マツ類であるゴヨウマツ（ヒメコマツ）と混同されやすいが、葉の長さや球果・種子の特徴で識別できる。\",\"items\":[{\"name\":\"ヒメコマツ\",\"sciName\":\"Pinus parviflora Siebold et Zucc.\",\"distinguishingPoints\":\"チョウセンゴヨウは葉の長さが6〜12cmとヒメコマツ（ゴヨウマツ）より明らかに長く、球果は直径8〜16cmと日本産マツ類の中でも最大級であり、種子には翼がない点で区別できる。分布も本州中部〜四国の隔離分布にとどまり、兵庫県を含む広い地域に自生するヒメコマツとは分布域が異なる。\"}],\"source\":{\"name\":\"チョウセンゴヨウ（朝鮮五葉） - 庭木図鑑 植木ペディア\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%81%E3%83%A7%E3%82%A6%E3%82%BB%E3%83%B3%E3%82%B4%E3%83%A8%E3%82%A6/\",\"type\":\"secondary\"},\"reliabilityNote\":\"識別点は園芸系のまとめサイト（二次資料）の記載に基づく。学術的な検索表による厳密な確認ではない。\"}},{\"id\":\"pinus-luchuensis\",\"nameJa\":\"リュウキュウマツ\",\"nameJaAlt\":[],\"sciName\":\"Pinus luchuensis Mayr\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"リュウキュウマツ\",\"りゅうきゅうまつ\",\"琉球松\",\"pinus luchuensis\",\"luchu pine\",\"okinawa pine\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を南西諸島（Nansei-shotō）としており、亜熱帯域に自生する種である。小笠原諸島には人為的に導入（帰化）されたとされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pinus luchuensis Mayr\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:677067-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Nansei-shotō. It is a tree and grows primarily in the subtropical biome.\\\" Native to: Nansei-shoto／Introduced into: Ogasawara-shoto.\"}},\"japanDistribution\":{\"summary\":\"トカラ列島以南の南西諸島（琉球列島）に自生するが、本来自生していたのは第三紀層・中生層・古生層など地質時代の古い島に限られ、それ以外（新しく隆起したサンゴ礁の島など）は移入によるものとされる。国頭マージと呼ばれる変成岩由来の酸性の強い赤色・黄色土壌に適応した種で、尾根筋や岩場、乾燥気味の法面などに局所的に群落を作る。本州（福岡県）への移植試験では、発芽後数年は生育良好でも5年生以降に急激に生育が悪化することが報告されており、本土での植栽自体が不適とされる。兵庫県（本州）はリュウキュウマツの自生域である南西諸島（おおむねトカラ列島以南、北緯29度以南）から遠く離れた北緯34度台に位置し、緯度・気候・土壌のいずれの面からも自生域に含まれるとは考えられない。\",\"status\":\"自生（トカラ列島以南の南西諸島固有、本州には自生せず植栽も不適）\",\"source\":{\"name\":\"リュウキュウマツ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%A5%E3%82%A6%E3%82%AD%E3%83%A5%E3%82%A6%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本国内での分布・生態情報はWikipedia（二次資料）に基づく。南西諸島固有種であることは複数資料（POWO・Wikipedia）で一致しており、兵庫県における自生の可能性はほぼ皆無と考えられる。\",\"habitat\":\"亜熱帯域の尾根筋・岩場・乾燥気味の法面などに局所的な群落を作り、国頭マージ（酸性の強い変成岩由来の赤色・黄色土、特に黄色土での生育が良い）に適応する。本州に持ち込んだ場合、日長条件の違いなどにより植栽後数年で生育不良になるとされる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外—南西諸島固有種のため兵庫県への自生は地理的にありえない）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「リュウキュウマツ」および学名 Pinus luchuensis のいずれも検出されなかった。同目録に掲載されているマツ属（Pinus）は、アカマツ（Pinus densiflora）、ゴヨウマツ（Pinus parviflora）、クロマツ（Pinus thunbergii）の3種のみであった。リュウキュウマツの自生域はトカラ列島以南の南西諸島（おおむね北緯29度以南）に限られ、兵庫県（北緯34度台）とは大きな緯度差があるうえ、本州での植栽自体が生育不良のため実質的に成立しないことも報告されており、記録がないことは自然分布・栽培実態の両面から妥当である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし南西諸島固有種という自生域の性質上、兵庫県での記録がないことの妥当性は極めて高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁のクロマツ・アカマツと形態が似ており混同されやすいが、冬芽の色や葉の硬さ、分布域で区別できる。\",\"items\":[{\"name\":\"クロマツ\",\"sciName\":\"Pinus thunbergii Parl.\",\"distinguishingPoints\":\"クロマツは冬芽が白色で目立ち鱗片がほとんど反り返らず、葉は手のひらで触ると痛いほど硬い。一方リュウキュウマツは冬芽が赤褐色でアカマツに似て柔らかい葉を持ち、葉肉内の樹脂道の位置にも違いがある。分布域もクロマツが本州からトカラ列島にかけて広く分布するのに対し、リュウキュウマツはトカラ列島以南に限られる。\"},{\"name\":\"アカマツ\",\"sciName\":\"Pinus densiflora Siebold et Zucc.\",\"distinguishingPoints\":\"葉の柔らかさや樹皮の赤みなど外見が似るが、アカマツは本州・四国・九州に広く分布するのに対し、リュウキュウマツの自生は南西諸島に限られ、両種の分布域は重ならない。\"}],\"source\":{\"name\":\"クロマツ（黒松） - ざっそう屋\",\"url\":\"https://zassou-ya.com/plants/kuromatsu/\",\"type\":\"secondary\"},\"reliabilityNote\":\"識別点は植物解説サイト（二次資料）の記載に基づく。学術的な検索表による厳密な確認ではない。\"}},{\"id\":\"pinus-parviflora-var-pentaphylla\",\"nameJa\":\"キタゴヨウ\",\"nameJaAlt\":[\"キタゴヨウマツ\"],\"sciName\":\"Pinus parviflora Siebold et Zucc. var. pentaphylla (Mayr) A.Henry\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"キタゴヨウ\",\"きたごよう\",\"キタゴヨウマツ\",\"北五葉\",\"pinus parviflora var. pentaphylla\",\"pinus parviflora pentaphylla\"],\"worldDistribution\":{\"summary\":\"POWOは本変種（var. pentaphylla）の自生域を朝鮮（欝陵島）、南千島列島から日本の北部・中部としており、基本変種であるヒメコマツ（var. parviflora、中部・南日本固有、本アプリ既収録種）とは分布域が明確に区別される。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pinus parviflora var. pentaphylla (Mayr) A.Henry\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77189983-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this variety is Korea (Utsurio-To), S. Kuril Islands to N. & Central Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"北海道南部（渡島半島・日高地方など）から本州中部地方にかけて分布する変種で、本州中部では特に日本海側に多いとされる。北海道では海抜60〜800m、本州では海抜300〜2500mという、基本変種ヒメコマツ（本州中部以南〜四国・九州、海抜1300〜1800m程度が中心）よりも幅広い標高帯の岩の多い急斜面や尾根に自生する。両変種の分布はおおむね本州中部地方を境に分かれるとされ、近畿地方・兵庫県はキタゴヨウの分布域である「北海道〜本州中部」よりも南西に位置するため、自生域に含まれるとは考えにくい。なお近縁の雑種ハッコウダゴヨウ（Pinus × hakkodensis、ハイマツとの自然雑種）も本州中北部の山岳で知られ、従来種子の翼の長さでキタゴヨウ・ハイマツと区別されてきたが、近年の研究ではこの基準だけでは判別できないことが指摘されている。\",\"status\":\"自生（北海道南部〜本州中部の変種、近畿地方は分布域外の可能性）\",\"source\":{\"name\":\"The Gymnosperm Database — Pinus parviflora（var. parviflora / var. pentaphylla の分布比較）\",\"url\":\"https://www.conifers.org/pi/Pinus_parviflora.php\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布・標高データは専門データベース（二次資料）の記載に基づく。日本語版Wikipedia「ヒメコマツ」や立山自然保護センターのブログ記事とも照合し、北海道南部〜本州中部という分布の大枠は一致することを確認したが、変種レベルの詳細な分布境界線については、より一次資料に近い植物誌・分布図での確認が望ましい。\",\"habitat\":\"岩の多い急斜面や尾根など、風当たりの強い痩せ地に自生する陽樹。基本変種ヒメコマツよりも高標高（本州で300〜2500m）まで分布する傾向があり、北方系・日本海側気候への適応が進んだ変種とされる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（基本変種ヒメコマツ／ゴヨウマツの記録はあるが、変種キタゴヨウとしての記録はなし）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文には、基本変種にあたる「Pinus parviflora Sieb. et Zucc. ゴヨウマツ」（ヒメコマツ）の産地記録が香住町三川山・夢前町雪彦山・山南町篠ケ峰・三田市羽束山の計4件掲載されているが、変種キタゴヨウ（var. pentaphylla）を区別した記載や「キタゴヨウ」の語は検出されなかった。キタゴヨウの分布域は北海道南部から本州中部（日本海側中心）とされ、近畿地方・兵庫県はこの分布域よりも南西に位置することから、変種レベルでの兵庫県産の記録がないことは分布域とおおむね整合的である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"兵庫県の目録は種レベル（Pinus parviflora ゴヨウマツ）でのみ記載されており、変種同定を行っていない可能性がある。そのため「キタゴヨウとしての記録なし」という判断は、目録本文に変種名の記載がないことに基づく消去法的な確認であり、確度はやや限定的である。ただし本変種の分布域（北海道〜本州中部）から見て兵庫県産の個体がキタゴヨウに該当する可能性は低いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"基本変種ヒメコマツ（ゴヨウマツ、本アプリ既収録種）や雑種ハッコウダゴヨウとの識別が難しく、2針葉のアカマツ・クロマツとは葉の数で容易に区別できる。\",\"items\":[{\"name\":\"ヒメコマツ\",\"sciName\":\"Pinus parviflora Siebold et Zucc. var. parviflora\",\"distinguishingPoints\":\"同種の基本変種。分布域は本州中部以南〜四国・九州の主に太平洋側で、標高1300〜1800m程度が中心（兵庫県内にも自生記録がある）。キタゴヨウは北海道南部〜本州中部の日本海側に分布し、種子の翼がより長い点で区別されるとされるが、両変種の識別基準は必ずしも明確でなく中間的な個体も存在するとされる。\"},{\"name\":\"ハッコウダゴヨウ\",\"sciName\":\"Pinus × hakkodensis\",\"distinguishingPoints\":\"ハイマツとキタゴヨウ（またはヒメコマツ）との自然雑種とされ、幹が斜上し、種子に短い翼を持つ点で、ハイマツ（種子に翼がなく幹が地を這う）とキタゴヨウ（種子の翼が長く高木になる）の中間的な特徴を示す。ただし近年の研究では種子の翼の長さだけでは3者を判別できないことが指摘されている。\"},{\"name\":\"アカマツ\",\"sciName\":\"Pinus densiflora Siebold et Zucc.\",\"distinguishingPoints\":\"2針葉であるのに対し、キタゴヨウは5針葉である点で容易に区別できる。\"},{\"name\":\"クロマツ\",\"sciName\":\"Pinus thunbergii Parl.\",\"distinguishingPoints\":\"クロマツも2針葉であり、5針葉のキタゴヨウとは葉の数で明確に区別できる。\"}],\"source\":{\"name\":\"ハイマツ＆ハッコウダゴヨウ＆キタゴヨウ - 立山自然保護センターブログ\",\"url\":\"https://tateyama-shizenhogo-c.raicho-mimamori.net/blog/5800/\",\"type\":\"secondary\"},\"reliabilityNote\":\"識別点は自然保護センターのブログ記事（二次資料）の記載に基づく。同記事自身が「種子の翼の長さだけでは区別できない」と限界を指摘しており、識別は必ずしも容易ではないことに留意する必要がある。\"}},{\"id\":\"pinus-pumila\",\"nameJa\":\"ハイマツ\",\"nameJaAlt\":[],\"sciName\":\"Pinus pumila (Pall.) Regel\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ハイマツ\",\"はいまつ\",\"這松\",\"pinus pumila\",\"japanese stone pine\",\"dwarf siberian pine\",\"creeping pine\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域をシベリアから中国北部、日本としており、東アジア北部の亜寒帯〜高山帯に広く分布する氷期由来の種である。日本列島はこの分布域の南限にあたる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pinus pumila (Pall.) Regel\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263243-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Siberia to N. China and Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"氷期の遺存種で、日本列島は本種の分布南限にあたる。日本国内での分布南限は赤石山脈の光岳、西限は加賀の白山（石川県）とされ、本州では中部・北部の一部山地上部でのみ見られる（標高の高い富士山や男体山などでも見られない例がある）。生育標高は地域差が大きく、中部山岳帯では海抜2500〜3000m以上、青森県八甲田山では海抜1500m以上、北海道では海抜1000m以上とされる。分布西限の白山ですら兵庫県よりも北東に位置し、資料中に近畿地方・兵庫県への言及は一切ない。兵庫県最高峰の氷ノ山（標高1,510m）は本種が典型的に生育する高山帯環境（中部山岳でおおむね標高2500m以上）には遠く及ばず、標高・緯度の両面から兵庫県は明確に分布域外である。\",\"status\":\"自生（本州中北部〜北海道の高山帯・亜高山帯、氷期遺存種、近畿地方は分布域外）\",\"source\":{\"name\":\"ハイマツ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%82%A4%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本国内での分布南限・西限・標高情報はWikipedia（二次資料）に基づく。分布西限とされる白山（石川県）ですら兵庫県より北方に位置し、兵庫県が分布域から外れることは複数の記述（南限・西限・標高）から重層的に裏付けられるため、結論の妥当性は高いと考えられる。\",\"habitat\":\"高山帯・亜高山帯の風衝地や岩礫地に生育し、幹が地を這うように伏条形になるのが最大の特徴。日本の高山帯を代表する植生の一つで、ライチョウなど高山性動物の生息環境としても重要とされる。ヒメコマツ（ゴヨウマツ）と自然交雑し、ハッコウダゴヨウ（Pinus × hakkodensis）という雑種を生じることが青森県八甲田山などで報告されている。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外—高山帯を欠く兵庫県には自生し得ない）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「ハイマツ」および学名 Pinus pumila のいずれも検出されなかった。同目録に掲載されているマツ属（Pinus）は、アカマツ（Pinus densiflora）、ゴヨウマツ（Pinus parviflora）、クロマツ（Pinus thunbergii）の3種のみであった。ハイマツは氷期の遺存種として日本では標高の高い亜高山帯〜高山帯（中部山岳でおおむね海抜2500m以上）にのみ分布し、分布西限は石川県の白山とされる。兵庫県最高峰の氷ノ山（標高1,510m）は亜高山帯下部相当にとどまり、ハイマツが典型的に生育する高山帯環境には到達しないため、記録がないことは分布・標高の両面から自然分布上妥当である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし兵庫県内に本種の生育に適した高山帯（標高2000m超級の山地）が存在しないことと整合的であり、記録なしという結論の妥当性は極めて高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のヒメコマツ・キタゴヨウや、高山帯で同じく地を這うように生育するキャラボク（イチイ科）と混同されることがある。\",\"items\":[{\"name\":\"ヒメコマツ\",\"sciName\":\"Pinus parviflora Siebold et Zucc.\",\"distinguishingPoints\":\"ハイマツは種子に翼がなく幹が地を這う低木状であるのに対し、ヒメコマツ（ゴヨウマツ）は高木になり種子には翼がある。両種は交雑してハッコウダゴヨウ（Pinus × hakkodensis）を生じることがあり、この雑種は種子に短い翼を持ち幹が斜上する中間的な形態を示す。\"},{\"name\":\"キャラボク\",\"sciName\":\"Taxus cuspidata Siebold et Zucc. var. nana Rehder\",\"distinguishingPoints\":\"高山帯・亜高山帯で同じく地を這うように生育する常緑針葉樹だが、キャラボクはイチイ科で葉が扁平な線形で2列に並び、赤い多肉質の仮種皮に包まれた種子をつける点で、5針葉で球果をつけるハイマツとは容易に区別できる。\"}],\"source\":{\"name\":\"ハイマツ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%82%A4%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"ヒメコマツとの雑種（ハッコウダゴヨウ）についてはWikipedia本文に記載があるが、キャラボクとの識別点は一般的な植物学的知識に基づく補足であり、本記事内での明示的な比較記述ではない。\"}},{\"id\":\"pseudotsuga-japonica\",\"nameJa\":\"トガサワラ\",\"nameJaAlt\":[],\"sciName\":\"Pseudotsuga japonica (Shiras.) Beissn.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"トガサワラ\",\"とがさわら\",\"栂椹\",\"pseudotsuga japonica\",\"japanese douglas fir\",\"japanese douglas-fir\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を「W. & S. Japan（西日本・南日本）」としており、日本固有種である。分布は紀伊半島南部と高知県東部の2つの隔離集団に限られる極めて稀な種。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pseudotsuga japonica (Shiras.) Beissn.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:677138-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is W. & S. Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、本州では紀伊半島南部（和歌山県・奈良県・三重県の境界域、大台ヶ原・川上村周辺が最も個体数が多いとされる）、四国では高知県東部の魚梁瀬地方に、それぞれ隔離した2つの遺存的（レリック）集団としてのみ生育する。標高はおおむね300〜1,000m（多くは400〜1,000m）の、乾燥気味のやせ尾根や急斜面に限られる。環境省レッドリストでは1997年版以来「絶滅危惧II類（VU）」、IUCNレッドリストでは2013年版で「危急（VU）」から「絶滅危惧（EN, Endangered C2a(i)）」に引き上げられており、絶滅リスクが高い種とされる。\",\"status\":\"自生（日本固有種、紀伊半島南部・高知県東部の2箇所の隔離集団のみ）\",\"source\":{\"name\":\"トガサワラ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/トガサワラ\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布・標高・保全状況の記述はWikipedia日本語版（二次資料）および国立科学博物館「多様性ホットスポット」データベース（https://www.kahaku.go.jp/research/activities/project/hotspot_japan/database/natures_17.html ）に基づく。両資料とも紀伊半島南部（奈良県川上村・三重県熊野市周辺）と高知県東部（魚梁瀬地方）の2集団のみとする点で一致しており、信頼性は比較的高いと判断する。ただし正確な現存個体数・遺伝的隔離の程度についての定量データは今回参照した資料には含まれておらず未確認。\",\"habitat\":\"暖帯域（照葉樹林帯）から温帯域下部にわたる範囲の、特に乾燥気味のやせ尾根や急峻な岩尾根に多く生育する。同じ標高帯に自生するツガ・コウヤマキなどと混生することがある。三重県・奈良県境の「三ノ公川トガサワラ原始林」は国の天然記念物に指定されている。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外・隔離的遺存分布のため）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「トガサワラ」「Pseudotsuga japonica」のいずれの語も検出されなかった。本種は標高300〜1,000m程度という、兵庫県内にも存在する標高帯に生育する種ではあるが、単純な標高不足による分布域外ではなく、紀伊半島南部（大台ヶ原・川上村周辺）と高知県東部（魚梁瀬地方）というごく限られた2つの遺存的隔離集団としてのみ現存する日本固有種である点が兵庫県での記録なしの本質的な理由である。兵庫県は紀伊水道・大阪平野を挟んで紀伊山地・熊野山地とは山系・地質が異なる中国山地系の山地であり、この2つの隔離集団のいずれからも地理的に隔たっているため、自然分布域に含まれないと考えられる。現存個体群が極めて少なく絶滅リスクが高いとされる稀少種であることも、兵庫県を含む分布域外での記録が存在しない状況と整合する。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出ツールを用いた検索に基づくため、抽出漏れ・OCR由来の誤読等により本文中の記載を完全には拾えていない可能性がある（網羅性を保証するものではない）。ただし本種が紀伊半島南部・高知県東部の2つのごく限られた隔離集団以外には自生しないという分布特性（POWO・Wikipedia・国立科学博物館の複数資料が一致）から見て、兵庫県に記録がないという結論の妥当性は高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じマツ科針葉樹で、生育立地が重なることもあるツガ・モミと外見が似て紛らわしいが、球果（松かさ）の苞鱗片の形状に本種特有の決定的な違いがある。\",\"items\":[{\"name\":\"ツガ\",\"sciName\":\"Tsuga sieboldii Carrière\",\"distinguishingPoints\":\"枝の葉のつき方は似るが、トガサワラの葉は短い葉と長い葉が交互に生じる特徴があり、裏面の白い気孔帯もより目立つ。最も確実な区別点は球果で、トガサワラの球果は丸い種子鱗片の先端から3裂した尖った苞鱗片が長く突き出すのに対し、ツガの球果は苞鱗片が種子鱗片を超えて出てこない点が異なる。また枝への葉枕（葉が落ちた跡の隆起）の発達も、トガサワラでは発達しないのに対しツガでは発達する。\"},{\"name\":\"モミ\",\"sciName\":\"Abies firma Siebold & Zucc.\",\"distinguishingPoints\":\"葉の質感や色合いが似ることがあるが、球果の性質が根本的に異なる。モミ属（モミ）の球果は成熟すると鱗片がばらばらに脱落して軸のみが枝に残るのに対し、トガサワラ属（トガサワラ）の球果は苞鱗片・種子鱗片ともに脱落せず、まとまった果実状のまま枝から落ちる点で明確に区別できる。\"}],\"source\":{\"name\":\"トガサワラ - Wikipedia日本語版／トガサワラ属 - Wikipedia日本語版／トガサワラ（栂椹） 庭木図鑑 植木ペディア\",\"url\":\"https://ja.wikipedia.org/wiki/トガサワラ属\",\"type\":\"secondary\"},\"reliabilityNote\":\"識別点はWikipedia日本語版および植物図鑑サイト（庭木図鑑 植木ペディア、https://www.uekipedia.jp/常緑針葉樹/トガサワラ/ ）等の二次資料に基づく一般的な記述であり、個体差がある可能性がある。より厳密な識別は専門図鑑・現地標本での確認が望ましい。\"}},{\"id\":\"tsuga-diversifolia\",\"nameJa\":\"コメツガ\",\"nameJaAlt\":[],\"sciName\":\"Tsuga diversifolia (Maxim.) Mast.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"コメツガ\",\"こめつが\",\"米栂\",\"tsuga diversifolia\",\"northern japanese hemlock\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を「Central & S. Japan（中部日本・南日本）」としており、日本固有種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Tsuga diversifolia (Maxim.) Mast.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:264007-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Central & S. Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、本州の青森県（八甲田山）から中部地方の山岳を経て紀伊半島（大峰山脈・大台ヶ原、近畿地方最高峰の八経ヶ岳〈標高1,915m〉周辺を含む）まで、さらに四国（石鎚山・剣山）・九州（祖母山）まで分布する。近畿地方（紀伊半島）にも分布が及ぶ点でツガ（Tsuga sieboldii）より分布域は広いが、生育立地は標高でツガより高い、冷温帯上部から亜高山帯にかけての岩の多い尾根・岩塊地に限られる。この亜高山帯の下限は緯度が下がるほど（南に行くほど）高くなる傾向があり、西日本・近畿地方では概ね標高1,500m以上、山頂部など標高の高い場所ではおよそ1,700m前後以上が中心となる。\",\"status\":\"自生（日本固有種、本州〜九州の亜高山帯・冷温帯上部）\",\"source\":{\"name\":\"コメツガ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/コメツガ\",\"type\":\"secondary\"},\"reliabilityNote\":\"分布記述はWikipedia日本語版（二次資料）「本州の青森(八甲田山)から紀伊半島(大峰・大台ヶ原)、四国(石鎚山・剣山)、九州(祖母山)までの山岳地帯に分布する」「ツガ（学名: Tsuga sieboldii）よりも、より標高が高いところに自生する」との記述に基づく。西日本での具体的な下限標高（1,500〜1,700m前後）は複数の樹木図鑑サイト（三河の植物観察等）の記述を参考にした概算であり、資料によって数値に幅があるため目安として扱う。紀伊半島の八経ヶ岳周辺における本種の具体的な生育標高の一次資料での確認はできていない。\",\"habitat\":\"冷温帯上部から亜高山帯にかけての、土壌の発達が比較的悪い岩の多い尾根筋・岩塊地に多く生育し、シラビソ・オオシラビソなどと混生して亜高山帯針葉樹林を構成することが多い。近畿地方では大峰山脈・大台ヶ原周辺の標高の高い山頂部付近がこれに該当する。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（亜高山帯に達する標高の山が県内にないため）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「コメツガ」「Tsuga diversifolia」のいずれの語も検出されなかった。一方、同じツガ属の近縁種であるツガ（Tsuga sieboldii）は同目録に記載があり、夢前町雪彦山・福崎町七種滝・姫路市広嶺山など県内11か所からの採集記録が掲載されている。この違いは緯度ではなく標高による分布制限で説明できる。コメツガは紀伊半島（近畿地方）にも自生することから緯度的には近畿地方に達しており、単純な「近畿地方に分布しない」ケースではない。しかし本種は冷温帯上部〜亜高山帯（西日本ではおおむね標高1,500m以上、山頂部でおよそ1,700m前後以上）という高標高帯に生育が限られるのに対し、兵庫県の最高峰である氷ノ山は標高1,510mで、標高800m以上の山腹にブナ天然林が広がる冷温帯であり、コメツガが典型的に生育する亜高山帯には達していない。このため兵庫県内にはコメツガの生育に適した標高帯を持つ山がなく、記録がないことは自然分布上妥当と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出ツールを用いた検索に基づくため、抽出漏れ・OCR由来の誤読等により本文中の記載を完全には拾えていない可能性がある（網羅性を保証するものではない）。同ツールによる検索では同属のツガ（Tsuga sieboldii）については11件の産地記録が明確に検出されており、ツール自体がツガ属の記載を検出できることは確認済みである。氷ノ山（1,510m）が本種の主要な生育標高帯（西日本でおおむね1,500〜1,700m以上）の下限付近ないしそれ未満であることも、記録なしという結論を補強する。ただし西日本における本種の下限標高の数値には資料間で幅があり、氷ノ山の局所的な微気候・地形によりごく一部の個体が生育しうる可能性を完全には否定できない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属で兵庫県内にも自生記録があるツガ（Tsuga sieboldii）との区別が最も重要。また亜高山帯で混生することが多いシラビソ・オオシラビソ（モミ属）とも紛らわしい。\",\"items\":[{\"name\":\"ツガ\",\"sciName\":\"Tsuga sieboldii Carrière\",\"distinguishingPoints\":\"コメツガの葉は長さ約4〜14mm程度と全体に小さく大きさもほぼ均一なのに対し、ツガの葉は同じ小枝の中でも大きさが不揃いで、上向きの短い葉（約1cm弱）と横向きの大きい葉（2cm前後）が混在する。若い枝にも違いがあり、コメツガの一年枝には短い毛が生えるのに対し、ツガの一年枝は無毛。球果はコメツガが長さ約1.5〜2.0cmとツガ（約2.5cm前後）よりやや小さい。樹皮はコメツガが灰褐色、ツガは灰赤褐色を帯びる。生育標高でも、ツガが低山〜山地帯（兵庫県内では標高の低い尾根筋を含む）に多いのに対し、コメツガはより標高の高い冷温帯上部〜亜高山帯に限られ、両種は標高で棲み分ける。兵庫県ではツガの記録はあるがコメツガの記録はなく、この標高による棲み分けが兵庫県での分布差を説明する。\"},{\"name\":\"シラビソ\",\"sciName\":\"Abies veitchii Lindl. ex Hook.f.\",\"distinguishingPoints\":\"同じ亜高山帯針葉樹林に混生することが多いが、モミ属であり、コメツガ（ツガ属）より葉がやや長く先端が丸みを帯びる。球果は直立してつき成熟すると鱗片がばらばらに脱落する点がモミ属の特徴で、下向きに垂れ下がり鱗片が脱落しないコメツガの球果とは明確に異なる。\"},{\"name\":\"オオシラビソ\",\"sciName\":\"Abies mariesii Mast.\",\"distinguishingPoints\":\"シラビソ同様モミ属で、コメツガより大型の球果が直立してつき鱗片が脱落する点で区別できる。本州中部〜東北地方の多雪山地の亜高山帯に多く、コメツガと混生することがある。\"}],\"source\":{\"name\":\"コメツガ Tsuga diversifolia マツ科 Pinaceae ツガ属 三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/kometuga.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"識別点は植物観察サイト・図鑑サイト等の二次資料（三河の植物観察、庭木図鑑 植木ペディア等）に基づく一般的な記述であり、個体差・地域差がある可能性がある。より厳密な識別は専門図鑑での確認が望ましい。\"}},{\"id\":\"juniperus-chinensis-var-sargentii\",\"nameJa\":\"ミヤマビャクシン\",\"nameJaAlt\":[],\"sciName\":\"Juniperus chinensis L. var. sargentii A.Henry\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"ミヤマビャクシン\",\"みやまびゃくしん\",\"深山柏槇\",\"juniperus chinensis var. sargentii\",\"juniperus sargentii\",\"sargent juniper\"],\"worldDistribution\":{\"summary\":\"POWOは本変種の自生域をロシア極東地方から朝鮮半島・日本としており、樺太（サハリン）・千島列島・沿海地方（プリモーリエ）・ハバロフスク地方・満州・朝鮮半島・日本を含む、北東アジアの冷涼な地域に分布する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Juniperus chinensis var. sargentii A.Henry\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:70005481-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this variety is Russian Far East to N. Korea and Japan.\\\" 自生地としてJapan, Khabarovsk, Korea, Kuril Is., Manchuria, Primorye, Sakhalinを含む。\"}},\"japanDistribution\":{\"summary\":\"和名の通り「深山（みやま）」の名を持つ高山性の変種で、基本変種イブキから分化したとされる。文献によれば、サハリン・南千島・北海道・本州・四国・九州・朝鮮半島にかけての「高山や海岸の岩場」に分布するとされ、北海道から屋久島まで分布するとの記述もある。ただし実際の生育地はきわめて局所的で、北方（東北・北海道）では海岸の激浪を受ける岩崖（岩手県普代村黒崎海岸で1965年に採集された標本が現存）に、また中部地方以西の内陸では火山性の高山帯・亜高山帯の風衝地に限られる。大分県では九重火山群の標高1,300m以上の尾根筋の草原・林縁と、豊後水道沿岸の海食崖の2型のみが確認されており、いずれも「確認できる場所は極めて稀」とされる。福岡県では英彦山（標高1,199m）から1934年に記録があるのみで、その後確認されていない。近畿地方の山岳での生育記録は今回の調査では見当たらなかった。\",\"status\":\"自生（高山帯の岩場・北方の海食崖。西日本では九州の一部火山高峰・海岸に極めて局所的、近畿地方では生育記録未確認）\",\"source\":{\"name\":\"Wikipedia日本語版「イブキ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A4%E3%83%96%E3%82%AD\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaおよび大分県・福岡県レッドデータブック等の二次資料を組み合わせて整理した。全国的な分布範囲を示す記述（北海道〜屋久島）と、実際の確認記録が北方の海食崖や特定の火山高峰に限られるという記述の間には解像度の差があり、後者がより信頼性の高い具体的知見と考えられる。近畿地方・兵庫県における生育記録は今回の調査で確認できなかったが、これは網羅的な分布図調査ではなく、確認できなかったことをもって分布域外と断定できるわけではない。\",\"habitat\":\"強い風にさらされる高山帯・亜高山帯の岩場や火山性の草原・林縁、あるいは北方の波浪を直接受ける海食崖に生育する。主幹は著しく屈曲して地を這うように広がり、枝は斜上する独特の樹形をとる。若い木や徒長枝には針状葉をつけるが、成木では柔らかい鱗片状の葉が主体となる二形性を示す。厳しい環境に適応した結果、盆栽・庭園用に乱獲され、多くの県でレッドリストに指定されている。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外の可能性が高い）\",\"detail\":\"兵庫県産維管束植物 第2巻のヒノキ科ビャクシン属（Juniperus）の項を確認したところ、記載されているのはイブキ（Juniperus chinensis）とネズ（Juniperus rigida）の2種のみで、「ミヤマビャクシン」の語や変種名「var. sargentii」は検出されなかった。本種は高山帯の岩場や北方の海食崖という限定的な環境に生育する変種で、九州でも九重火山群の標高1,300m以上の尾根や英彦山（1,199m、記録は1934年のみ）といった特定の高峰に限られ、多くの府県で確認例が途絶えている。兵庫県最高峰の氷ノ山（標高1,510m）は標高こそ英彦山に近いが、風衝草原・岩塊斜面を持つ火山性の山ではなく、本種が典型的に生育するような環境ではないと考えられ、記録がないことは自然分布上妥当と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし本種が高山帯の岩場や北方の海食崖という特殊環境に強く依存し、西日本では確認例自体が極めて少ないことと整合しており、記録なしという結論の妥当性は比較的高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じイブキの変種であるハイビャクシンや基本変種のイブキと形態が似るほか、同様に高山の岩場に生育するミヤマネズ（別属変種）とも混同されやすい。\",\"items\":[{\"name\":\"イブキ\",\"sciName\":\"Juniperus chinensis L. var. chinensis\",\"distinguishingPoints\":\"ミヤマビャクシンの基本変種にあたる。イブキは幹が直立し高木（時に10m以上）になり、海岸の岩場や砂地、石灰岩地の丘陵などに自生するほか庭木としても広く植栽される。一方ミヤマビャクシンは主幹が著しく屈曲して地を這うように広がる矮性の樹形をとり、生育地も標高の高い高山帯の岩場や北方の海食崖に限られる点で区別できる。\"},{\"name\":\"ハイビャクシン\",\"sciName\":\"Juniperus chinensis var. procumbens (Siebold ex Endl.) Miq.\",\"distinguishingPoints\":\"ハイビャクシンも地を這う匍匐性の変種である点でミヤマビャクシンと似るが、九州沿岸の限られた島嶼（沖ノ島・壱岐・対馬等）の低地の海岸砂地・岩場に自生し、標高の高い高山帯には生育しない。ミヤマビャクシンより枝の這い方が徹底しており、成木でも鱗片葉主体になりやすい。\"},{\"name\":\"ミヤマネズ\",\"sciName\":\"Juniperus communis L. var. nipponica (Maxim.) E.H.Wilson\",\"distinguishingPoints\":\"同じく高山帯の岩場に生育し外見が似るが別属変種で、ミヤマネズは生涯を通じて鋭い針状葉のみをつけ、鱗片状の葉にはならない点でミヤマビャクシン（成木で鱗片葉主体となる）と区別できる。\"}],\"source\":{\"name\":\"植木ペディア「ミヤマビャクシン」／Wikipedia日本語版「イブキ」ほか\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%9F%E3%83%A4%E3%83%9E%E3%83%93%E3%83%A3%E3%82%AF%E3%82%B7%E3%83%B3/\",\"type\":\"secondary\"},\"reliabilityNote\":\"造園・植物観察系の二次資料を複数参照して整理した。ミヤマビャクシンとミヤマネズは近縁ではないが同様の高山環境に生育し外見が類似するため、葉の質感（鱗片葉か針状葉か）が実地での有力な識別点になると考えられる。\"}},{\"id\":\"juniperus-communis-var-nipponica\",\"nameJa\":\"ミヤマネズ\",\"nameJaAlt\":[\"ホンドミヤマネズ\",\"リシリビャクシン\"],\"sciName\":\"Juniperus communis L. var. nipponica (Maxim.) E.H.Wilson\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"ミヤマネズ\",\"みやまねず\",\"深山杜松\",\"ホンドミヤマネズ\",\"ほんどみやまねず\",\"リシリビャクシン\",\"りしりびゃくしん\",\"juniperus communis var. nipponica\",\"juniperus communis var. hondoensis\",\"juniperus communis var. montana\",\"alpine juniper\"],\"worldDistribution\":{\"summary\":\"POWOは本変種の自生域をカムチャツカ半島から日本としており、日本・カムチャツカ・朝鮮半島・千島列島・樺太（サハリン）を含む、周北極〜東アジア北部の寒冷地に分布するセイヨウネズ（Juniperus communis）の東アジア産変種にあたる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Juniperus communis var. nipponica (Maxim.) E.H.Wilson\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77189764-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this variety is Kamchatka to Japan.\\\" 自生地としてJapan, Kamchatka, Korea, Kuril Is., Sakhalinを含む。\"}},\"japanDistribution\":{\"summary\":\"セイヨウネズ（Juniperus communis）の日本産変種で、北海道から本州の高山帯にかけて分布する。国内にはさらに地域ごとに区別される近縁の型（変種）が知られ、北海道アポイ岳や本州北部の高山に見られる狭義のミヤマネズ（var. nipponica）のほか、本州の尾瀬至仏山から加賀白山にかけての中部地方の高山帯に限られるホンドミヤマネズ（var. hondoensis、確認標高は概ね2,500m前後）、北海道（利尻島など）に分布するリシリビャクシン（var. montana）が挙げられ、いずれも高山帯の岩場・風衝地に生育する矮性・匍匐性の針葉樹である。これらの分布はいずれも北海道と本州中部以北の高山帯に限られ、近畿地方に及ぶ記述は確認できなかった。\",\"status\":\"自生（北海道〜本州中部以北の高山帯・亜高山帯の岩場、標高約2,000〜2,500m前後を含む）。近畿地方への分布は確認できず\",\"source\":{\"name\":\"「ホンドミヤマネズ Juniperus communis var. hondoensis」ざっそう屋\",\"url\":\"https://zassou-ya.com/plants/hondomiyamanezu/\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営の植物観察サイトを主な情報源としている。ホンドミヤマネズの分布が「尾瀬至仏山〜加賀白山」という中部地方の限られた山域に明記されている点は、近畿地方が自生域に含まれないことを示す有力な状況証拠となるが、より権威的な分布図・標本データによる確認が望ましい。\",\"habitat\":\"標高2,000〜2,500m前後の高山帯・亜高山帯の風当たりの強い岩場・砂礫地・風衝草原に生育する矮性の常緑針葉樹で、地を這うように広がる匍匐性の樹形をとる。生涯を通じて鋭い針状葉をつけ、成木になっても鱗片状の葉に変化しない点がイブキ属（Sabina節）の種と異なる。厳しい高山環境に適応するため成長は非常に遅い。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（高山帯を持たないため分布域外）\",\"detail\":\"兵庫県産維管束植物 第2巻のヒノキ科ビャクシン属（Juniperus）の項を確認したところ、記載されているのはイブキ（Juniperus chinensis）とネズ（Juniperus rigida）の2種のみで、「ミヤマネズ」「ホンドミヤマネズ」「リシリビャクシン」「Juniperus communis」のいずれも検出されなかった。本変種は北海道および本州中部以北（尾瀬至仏山〜加賀白山）の標高2,000m超級の高山帯・亜高山帯に限られる高山植物であり、兵庫県最高峰の氷ノ山（標高1,510m）はブナ帯上部にとどまり、本種が生育するような真の高山帯環境には遠く及ばない。近畿地方には氷ノ山を含めそのような高山帯を持つ山が存在しないため、記録がないことは自然分布上妥当と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし本変種が本州中部以北の標高2,000m超の高山帯に厳密に限定されるという複数資料の記述と、近畿地方にそのような高山環境が存在しないという地形的事実が整合しており、記録なしという結論の妥当性は高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"国内に自生する近縁の針状葉ビャクシン属（ネズミサシ・ハイネズ）と葉の形が似るほか、外見の似た高山性の変種であるミヤマビャクシン（別種）とも混同されやすい。\",\"items\":[{\"name\":\"ネズミサシ\",\"sciName\":\"Juniperus rigida Siebold et Zucc.\",\"distinguishingPoints\":\"同じく鋭い針状葉をつけるが、ネズミサシは幹が直立して数mの小高木になり、内陸の乾いた尾根やアカマツ林など標高の低い里山環境に生育する。ミヤマネズは矮性・匍匐性で、標高2,000m超の高山帯の岩場・風衝地に限られる点で明確に区別できる。\"},{\"name\":\"ハイネズ\",\"sciName\":\"Juniperus conferta Parl.\",\"distinguishingPoints\":\"ハイネズも地を這う匍匐性の樹形を持つ点でミヤマネズと似るが、海抜0m近い海岸の砂浜に生育し、標高2,000mを超える高山帯には見られない点で生育環境が大きく異なる。\"},{\"name\":\"ミヤマビャクシン\",\"sciName\":\"Juniperus chinensis L. var. sargentii A.Henry\",\"distinguishingPoints\":\"同様に高山帯の岩場や風衝地に生育し外見も似るが、ミヤマビャクシンは成木になると柔らかい鱗片状の葉が主体になる（イブキ節の特徴）のに対し、ミヤマネズは生涯を通じて硬く鋭い針状葉のみをつける点で区別できる。\"}],\"source\":{\"name\":\"「ホンドミヤマネズ」ざっそう屋／Wikipedia日本語版「ネズ」\",\"url\":\"https://zassou-ya.com/plants/hondomiyamanezu/\",\"type\":\"secondary\"},\"reliabilityNote\":\"植物観察系サイト等の二次資料を複数参照して整理した。葉の質感（針状葉か鱗片状葉か）という属レベルの形態的特徴に基づく識別点は比較的信頼性が高いと考えられるが、生育標高の具体的な数値（2,000m超等）は個別サイトの記述に基づく概算である。\"}},{\"id\":\"juniperus-taxifolia\",\"nameJa\":\"シマムロ\",\"nameJaAlt\":[\"オキナワハイネズ\"],\"sciName\":\"Juniperus taxifolia Hook. et Arn.\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"シマムロ\",\"しまむろ\",\"島榁\",\"島牟呂\",\"ヒデ\",\"オキナワハイネズ\",\"おきなわはいねず\",\"juniperus taxifolia\",\"juniperus taxifolia var. lutchuensis\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本（本州南部）から南西諸島・小笠原諸島としており、日本固有種である。伊豆諸島・小笠原諸島に分布する基本変種var. taxifolia（シマムロ）と、琉球列島に分布するvar. lutchuensis（オキナワハイネズ）の2変種が認められている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Juniperus taxifolia Hook. et Arn.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262369-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan (S. Honshu) to Nansei-shoto, Ogasawara-shoto.\\\" 2変種（var. taxifolia, var. lutchuensis）を認める。\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、基本変種のシマムロ（var. taxifolia）は伊豆諸島および小笠原諸島（父島・母島列島等）に分布し、南西諸島（奄美群島・沖縄諸島・与那国島等）に分布する集団はオキナワハイネズ（var. lutchuensis）として区別されることが多い。海を越えて海洋島に定着・分化した系統とされ、特に小笠原諸島では「小笠原諸島唯一の裸子植物」として知られるなど、島嶼への強い固有性・隔離性を示す種である。伊豆諸島・小笠原諸島・南西諸島のいずれも本州から遠く離れた海洋島・列島であり、本州内陸部に位置する兵庫県が自生域に含まれるとは考えにくい。\",\"status\":\"自生（伊豆諸島・小笠原諸島、および南西諸島＝オキナワハイネズとして）。島嶼固有種で本州内陸には分布せず\",\"source\":{\"name\":\"Threatened Conifers of the World (RBGE) — Juniperus taxifolia\",\"url\":\"https://threatenedconifers.rbge.org.uk/conifers/juniperus-taxifolia\",\"type\":\"secondary\"},\"reliabilityNote\":\"王立エディンバラ植物園の絶滅危惧針葉樹データベースを主な情報源とした。本州の一部産地からの記録も報告されているが、当該資料自体が「自生かどうか不確実」としており、本種の中心的な自生域はあくまで伊豆諸島・小笠原諸島・南西諸島の海洋島であると考えられる。なお日本語文献の一部（世界球果図鑑等）はシマムロを小笠原諸島固有種とし、南西諸島の個体群を別種オキナワハイネズ（Juniperus lutchuensis）として扱う、より狭い種概念を採用しており、分類学的な扱いに幅があることに留意が必要。\",\"habitat\":\"海岸の潮風の当たる岩場・断崖から、内陸の草地・低木林の岩礫地まで、海洋島の多様な環境に生育する。海岸沿いでは満潮線の上の岩上を這うように広がる匍匐性の低木となるが、内陸の条件の良い場所では直立して高さ13mに達する小高木になることもある。塩風・乾燥・貧栄養な土壌に耐える性質を持ち、鳥に果実（液果）を採食されることで種子が散布され、海を越えて海洋島に定着したと考えられている。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（海洋島固有種のため分布域外）\",\"detail\":\"兵庫県産維管束植物 第2巻のヒノキ科ビャクシン属（Juniperus）の項を確認したところ、記載されているのはイブキ（Juniperus chinensis）とネズ（Juniperus rigida）の2種のみで、「シマムロ」「オキナワハイネズ」「Juniperus taxifolia」のいずれも検出されなかった。本種は伊豆諸島・小笠原諸島・南西諸島という日本列島から遠く離れた海洋島に固有の種であり、本州内陸に位置する兵庫県は地理的に自生域から完全に隔絶している。したがって本種は他の2種（ミヤマビャクシン・ミヤマネズ）のような標高・緯度の問題ではなく、島嶼隔離という地理的要因により、兵庫県に記録がないことは自然分布上明白かつ当然と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし本種が海洋島固有種であり本州内陸部には自生しないことは複数の資料（POWO・RBGE）で一致しており、記録なしという結論の妥当性はきわめて高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属で本州にも自生するイブキと外見・分類的位置づけが近いが、生育地が海洋島に限られる点で明確に区別できる。\",\"items\":[{\"name\":\"イブキ\",\"sciName\":\"Juniperus chinensis L. var. chinensis\",\"distinguishingPoints\":\"シマムロと同じくビャクシン属Sabina節に属し、成木で鱗片状の葉が主体になる点など形態的に近縁である。ただしイブキは本州・四国・九州の海岸の岩場や庭木として広く見られるのに対し、シマムロは伊豆諸島・小笠原諸島・南西諸島の海洋島にのみ自生し、本州の海岸には自生しない点で分布域が明確に異なる。\"},{\"name\":\"オキナワハイネズ\",\"sciName\":\"Juniperus taxifolia var. lutchuensis (Koidz.) Satake\",\"distinguishingPoints\":\"シマムロ（基本変種var. taxifolia）と同種の南西諸島産の変種で、地を這う匍匐性の低木にとどまる点でシマムロ（好条件下では高さ13mの小高木になる）と区別される。分布域も奄美群島・沖縄諸島・与那国島などシマムロ（伊豆諸島・小笠原諸島）とは異なる。\"},{\"name\":\"ネズミサシ\",\"sciName\":\"Juniperus rigida Siebold et Zucc.\",\"distinguishingPoints\":\"同じ科の樹木で兵庫県にも自生するが、生涯を通じて鋭い針状葉をつける点でシマムロ（成木では鱗片状の葉が主体）と大きく異なり、両者は容易に区別できる。\"}],\"source\":{\"name\":\"Threatened Conifers of the World (RBGE) — Juniperus taxifolia／世界球果図鑑「ビャクシン属」（サカタのタネ）\",\"url\":\"https://threatenedconifers.rbge.org.uk/conifers/juniperus-taxifolia\",\"type\":\"secondary\"},\"reliabilityNote\":\"英語圏の専門データベースと日本語の園芸系読み物を組み合わせて整理した。特に変種間（var. taxifolia／var. lutchuensis）の形態差については情報源による記述の粒度が異なり、より専門的な分類学的文献での裏付けが望ましい。\"}},{\"id\":\"brasenia-schreberi\",\"nameJa\":\"ジュンサイ\",\"nameJaAlt\":[\"ヌナワ\",\"沼菜\"],\"sciName\":\"Brasenia schreberi J.F.Gmel.\",\"family\":\"ジュンサイ科 Cabombaceae\",\"searchTerms\":[\"ジュンサイ\",\"じゅんさい\",\"純菜\",\"蓴菜\",\"ヌナワ\",\"沼菜\",\"brasenia\",\"Brasenia schreberi\",\"watershield\"],\"worldDistribution\":{\"summary\":\"アフリカ、温帯・亜熱帯アジア、オーストラリア東部、南北アメリカ大陸にまたがる汎世界的（隔離）分布を示す1属1種の水生植物。ロシア・イルクーツク州には導入（introduced）記録がある。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Brasenia schreberi J.F.Gmel.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:605270-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Africa, Temp. & Subtropical Asia, E. Australia, America.\\\" Native to多数の地域（アフリカ・アジア・オーストラリア東部・南北アメリカ）。Introduced into: Irkutsk-Baikal。\"}},\"japanDistribution\":{\"summary\":\"北海道から琉球まで日本全国の池沼・湿地に分布する在来の多年生水生植物だが、水質汚濁や池沼の開発により各地で減少・絶滅した個体群も多い。\",\"status\":\"自生\",\"source\":{\"name\":\"Wikipedia日本語版「ジュンサイ」\",\"url\":\"https://ja.wikipedia.org/wiki/ジュンサイ\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版を二次資料として参照。全国的な分布傾向としては信頼できる内容だが、個体群の消長は地域差が大きく、より詳細な現況は都道府県レッドデータブック等での確認が望ましい。\",\"habitat\":\"水深1〜3m程度の、風の影響を受けにくい貧栄養〜中栄養の池沼・湿地に生育する。水底には厚く堆積した軟らかい泥炭質・有機質の泥があることが多く、湧水や流入する渓流など水の動きがある清澄な水質を好むとされる（「清水であることがよい」と古くから言われる）。若い葉・茎・巻きひげ状の新芽は透明な寒天質（粘液）に覆われ、これを食用とする（秋田県山本郡三種町が国内生産量の大半を占める産地として著名だが、各地の農家・愛好家による小規模な栽培・採取も行われる）。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内での自生記録あり（三田市での学術調査記録を確認、目録本体の該当巻は技術的制約により確認未了）\",\"detail\":\"兵庫県立人と自然の博物館が刊行する目録シリーズ「兵庫県産維管束植物」は分類群ごとに巻を分けて刊行されており、スイレン目（ジュンサイ科・スイレン科）はキンポウゲ目等と共に第3巻（タデ科〜アブラナ科の範囲）に含まれると推定される。しかし同巻PDFは非常に大部で、WebFetchツールによる自動テキスト抽出が毎回タデ科（Polygonaceae）の途中（Rumex acetosella ヒメスイバの産地リストの記載途中）で物理的に打ち切られてしまい、複数の異なる問い合わせ方法・URL変更を試みても、後方に位置するスイレン科・ジュンサイ科の記載箇所まで到達できなかった（技術的な取得上限であり、本文中に当該種の記載が「ある」「ない」のいずれであるかを直接確認できていない）。代わりに、同館研究員 高橋晃氏による「兵庫県三田市の植物」（人と自然 Humans and Nature 22: 101-146, 2011）を確認したところ、三田市内の産地として「小野峠 (HK & SN 940418)」「下相野 (AT 2084)」の標本情報とともにジュンサイの記録が明記されていた。これは兵庫県内における自生の直接的な学術記録である。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市 小野峠 （HK & SN 940418）\",\"三田市 下相野 （AT 2084）\"],\"source\":{\"name\":\"高橋晃「兵庫県三田市の植物」人と自然 Humans and Nature 22: 101-146 (2011)（兵庫県産維管束植物 第3巻はPDF取得上限のため該当箇所を確認できず、代替の一次資料として使用）\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"本来この目のカタログ的な一次資料である「兵庫県産維管束植物」第3巻（https://www.hitohaku.jp/publication/r-bulletin/No122001105.pdf）の該当箇所は、WebFetchによるPDFテキスト抽出が毎回同じ地点（タデ科ヒメスイバの産地リスト途中）で打ち切られるという技術的制約により、複数回・複数の問い合わせ方法を試みたが確認できなかった。この点は既存の裸子植物データとは異なり、目録本体での直接確認ができていないことを明記する。代替として使用した「兵庫県三田市の植物」（高橋晃, 2011）は同博物館研究員による学術論文であり、産地・標本略号（HK, SN, AT等の採集者イニシャルと推定される）も付されている点で信頼性は高いが、県内全域を網羅した目録ではなく三田市域に限られた記録である点に留意。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"水中に沈む若い葉柄・茎が透明な粘液（寒天質）に覆われる点は、同じジュンサイ科のフサジュンサイ（ハゴロモモ）の若い茎とやや似た印象を与えることがあるが、ジュンサイは水面に浮く長楕円形の単葉（浮葉のみで水中葉を持たない）をつけるのに対し、フサジュンサイは水中に羽毛状に細裂した対生の沈水葉を密につけ、葉の形状そのものが大きく異なるため、葉が展開していれば容易に区別できる。\",\"items\":[{\"name\":\"フサジュンサイ\",\"sciName\":\"Cabomba caroliniana\",\"distinguishingPoints\":\"フサジュンサイ（ハゴロモモ）は扇状に細かく分岐する対生の沈水葉を密生させ、水面には小さな菱形〜線形の浮葉と白い小花をつける帰化植物。ジュンサイは沈水葉を持たず、水面に浮く長楕円形〜卵状楕円形の単葉と、粘液に覆われた若い茎・葉柄が特徴で、葉の形状・付き方が明確に異なる。両種とも若い部分が透明な寒天質に覆われる点は共通するため、葉が展開する前の新芽だけを見ると紛らわしい場合がある。\"}],\"source\":{\"name\":\"ハゴロモモ | 水草図鑑（外来種） | 大阪府立環境農林水産総合研究所\",\"url\":\"https://www.knsk-osaka.jp/zukan/zukan_database/mizukusa_gairai/4350b31dd019ea9/9850bd5a2574600.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"府県の水草図鑑サイトを二次資料として参照。形態的な識別点自体は広く知られた内容。\"}},{\"id\":\"euryale-ferox\",\"nameJa\":\"オニバス\",\"nameJaAlt\":[\"鬼蓮\"],\"sciName\":\"Euryale ferox Salisb.\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"オニバス\",\"おにばす\",\"鬼蓮\",\"euryale\",\"Euryale ferox\",\"prickly waterlily\"],\"worldDistribution\":{\"summary\":\"北インドからロシア極東南部・台湾にかけての、南アジア〜東アジアの温帯〜熱帯域に分布する1属1種の大型一年生水生植物。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Euryale ferox Salisb.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:605350-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is N. India to S. Russian Far East and Taiwan.\\\" Native to: Assam, Bangladesh, China North-Central, China South-Central, China Southeast, Hainan, India, Inner Mongolia, Japan, Korea, Manchuria, Myanmar, Primorye, Taiwan, West Himalaya。\"}},\"japanDistribution\":{\"summary\":\"かつては本州・四国・九州の平地に広く分布していたが、生育環境の悪化・埋め立て等により激減し、2020年時点での北限は新潟市とされる。かつて北限とされた宮城県ではすでに絶滅したとみられている。\",\"status\":\"自生（著しく減少、多くの都府県で絶滅危惧）\",\"source\":{\"name\":\"Wikipedia日本語版「オニバス」\",\"url\":\"https://ja.wikipedia.org/wiki/オニバス\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版を二次資料として参照。全国的な分布の縮小傾向は環境省レッドリスト（絶滅危惧II類）とも整合しており信頼性は高いと考えられるが、都道府県別の詳細現況は各地のレッドデータブックでの確認が望ましい。\",\"habitat\":\"平地にあるやや富栄養の湖沼、流れの緩やかな河川・水路、ため池や農業用調整池などに生育する。一年生で、種子から発芽したのち大きな刺のある浮葉を水面いっぱいに広げ、太い根茎ではなく毎年種子から更新する点が同じスイレン科のコウホネ属・スイレン属と異なる。しばしばヒシ（ミソハギ科）など富栄養な水域を好む浮葉植物と混生する。埋め立てや河川改修、水質悪化、水位管理の変化（種子の発芽に必要な水位低下が起きないなど）が減少の主因とされる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録の有無を確認できず（技術的制約により第3巻該当箇所を確認未了）\",\"detail\":\"「兵庫県産維管束植物」第3巻の該当箇所（タデ科の後、スイレン科の記載箇所と推定される部分）は、WebFetchによるPDFテキスト抽出が毎回タデ科の途中で打ち切られる技術的制約により確認できなかった。三田市の植物相調査（高橋晃, 2011）や、その他確認した兵庫県関連資料（オグラコウホネに関する三田市の論文、兵庫県版レッドリスト検索）のいずれにおいても、オニバスの兵庫県内における記録は見当たらなかった。オニバスは全国的に平地の富栄養な池沼を好む一年生植物であり、近畿地方では京都府・大阪府等での記録があるが、兵庫県内での確実な自生記録は今回の調査では確認できなかった。\",\"volume\":3,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第3巻（該当箇所はPDF取得上限のため未確認）\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No122001105.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"目録本体のスイレン科該当箇所をWebFetchツールで直接確認できなかったため、「記録なし」ではなく「確認できず」という消極的な結論にとどめる。今回は三田市の植物相論文（高橋晃, 2011）にも記載がなかったことを傍証としたが、これは県内全域を網羅する調査ではないため、断定的な「記録なし」の根拠としては弱い。将来的に目録原本（紙媒体等）での直接確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"巨大な浮葉を持つ点で南米原産のオオオニバス属（Victoria）と混同されることがあるが、日本国内で野外に見られる大型浮葉植物としては他に類似種が少なく、識別は比較的容易。\",\"items\":[{\"name\":\"コウホネ\",\"sciName\":\"Nuphar japonica\",\"distinguishingPoints\":\"コウホネ属は多年生で葉に刺がなく滑らかな長卵形の浮葉・水上葉をつけ、黄色い花を水面上に高く掲げる。オニバスは一年生で葉・葉柄・花柄全体に鋭い刺が密生し、葉は大きな円形で紫褐色を帯びる点で全く異なる印象を与える。\"}],\"source\":{\"name\":\"Wikipedia日本語版「オニバス」\",\"url\":\"https://ja.wikipedia.org/wiki/オニバス\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版の記述を基に、日本国内で野外観察時に紛らわしくなり得る種として編集部で整理した。オオオニバス属（Victoria）は日本に自生せず、植物園等でのみ見られるため、兵庫県内の野外観察という文脈では実質的に混同の危険は低い。\"}},{\"id\":\"nuphar-japonica\",\"nameJa\":\"コウホネ\",\"nameJaAlt\":[\"河骨\",\"川骨\"],\"sciName\":\"Nuphar japonica DC.\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"コウホネ\",\"こうほね\",\"河骨\",\"川骨\",\"nuphar\",\"Nuphar japonica\",\"Japanese pond lily\"],\"worldDistribution\":{\"summary\":\"ロシア極東南部から朝鮮半島・日本にかけて分布するとされるが、朝鮮・沿海地方・サハリンからの報告には疑義もあり、日本固有種とする見解もある。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Nuphar japonica DC.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:605440-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Russian Far East to Korea and Japan.\\\" Native to: Japan, Korea, Primorye, Sakhalin。\"}},\"japanDistribution\":{\"summary\":\"北海道南西部・本州・四国・九州に広く分布し、日本国内の池沼・水路で最も普通に見られるコウホネ属の一種。\",\"status\":\"自生\",\"source\":{\"name\":\"Wikipedia日本語版「コウホネ」\",\"url\":\"https://ja.wikipedia.org/wiki/コウホネ\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版を二次資料として参照。分布の大枠は他の図鑑類とも一致し信頼性は高いと考えられる。\",\"habitat\":\"浅い池沼、水路、流れの緩い河川に生育する多年生水生植物。白色で太さ1〜3cmほどの根茎が水底の泥中を横に這うように伸び、そこから水深や流れの強さに応じて異なる形の葉（抽水葉・浮葉・沈水葉）を分化させる特徴を持つ。水深の浅い場所では葉身を水面上に立ち上げる抽水葉（狭卵形〜長楕円形、長さ20〜50cm）を、水深のある場所では水面に浮く浮葉を、流れのある水中では細長い沈水葉（長さ10〜50cm）をつける。黄色い椀形の花（直径3〜5cm）を6〜10月にかけて水面上に咲かせる。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内での自生記録あり（三田市での学術調査記録を確認、目録本体の該当巻は技術的制約により確認未了）\",\"detail\":\"「兵庫県産維管束植物」第3巻の該当箇所（スイレン科の記載箇所と推定される部分）は、WebFetchによるPDFテキスト抽出が毎回タデ科の途中で打ち切られる技術的制約により直接確認できなかった。代わりに高橋晃「兵庫県三田市の植物」（人と自然 Humans and Nature 22: 101-146, 2011）を確認したところ、三田市北部の産地（HK & SN 940456）としてコウホネの記録が明記されていた。さらに、オグラコウホネに関する調査論文（Fujii et al. 1999）でも、三田市内230か所のため池調査でコウホネ（N. japonicum）が17か所で確認されたと報告されており、三田市を含む兵庫県内にコウホネが広く分布することは複数の学術資料から裏付けられる。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市 北部 （HK & SN 940456）\",\"三田市内のため池（230か所調査中17か所で確認、Fujii et al. 1999 人と自然10: 41-48）\"],\"source\":{\"name\":\"高橋晃「兵庫県三田市の植物」人と自然 Humans and Nature 22: 101-146 (2011)；藤井俊夫ほか「兵庫県三田市における絶滅危惧植物オグラコウホネ（スイレン科）の分布，生育環境と形態」人と自然 10: 41-48 (1999)（兵庫県産維管束植物 第3巻はPDF取得上限のため該当箇所を確認できず、代替の一次資料として使用）\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"本来のカタログ一次資料である「兵庫県産維管束植物」第3巻はPDFの取得上限（毎回タデ科の途中で抽出が打ち切られる）のため該当箇所を直接確認できておらず、この点は既存の裸子植物データと異なる。代替として使用した2件の学術論文はいずれも同博物館関係者による調査であり信頼性は高いが、三田市域に限定された記録であり、県内全域を網羅した目録としての「兵庫県産維管束植物」本体での確認が今後望まれる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じコウホネ属のヒメコウホネ・オグラコウホネと非常によく似ており、花・葉のサイズや抽水葉の有無、葉柄の断面などで注意深く区別する必要がある。\",\"items\":[{\"name\":\"ヒメコウホネ\",\"sciName\":\"Nuphar subintegerrima\",\"distinguishingPoints\":\"ヒメコウホネはコウホネ属の中でも小型で、花は直径2.5〜4cmとコウホネ（直径約5cm）よりひとまわり小さく、柱頭盤の先端が盤からあまり突き出ない点で区別される。日本固有種で、本州（愛知・岐阜・三重県周辺）の限られた地域に分布し、コウホネより分布域が狭い。\"},{\"name\":\"オグラコウホネ\",\"sciName\":\"Nuphar oguraensis\",\"distinguishingPoints\":\"オグラコウホネは葉柄が細く中空であることが特徴で、抽水葉をつくらず沈水葉と浮葉のみをつける点でコウホネ（抽水葉をつくる）と異なる。花の柱頭盤は黄色（近縁のベニオグラコウホネは赤色）。本州中部以南〜四国・九州に分布し、コウホネより流れのある環境をやや好むとされる。三田市では両種とも生育するため池間で明瞭なすみわけがみられ、同一池での混生はほとんど確認されていない。\"}],\"source\":{\"name\":\"ヒメコウホネ Nuphar subintegerrima スイレン科 | 三河の植物観察／オグラコウホネ | ざっそう屋\",\"url\":\"https://mikawanoyasou.org/data/himekouhone.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営の植物観察サイトを二次資料として参照。形態的特徴の記述は他の図鑑的記述とも概ね整合するが、学術的な検索表による厳密な照合が望ましい。\"}},{\"id\":\"nuphar-subintegerrima\",\"nameJa\":\"ヒメコウホネ\",\"nameJaAlt\":[\"姫河骨\"],\"sciName\":\"Nuphar subintegerrima (Casp.) Makino\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"ヒメコウホネ\",\"ひめこうほね\",\"姫河骨\",\"Nuphar subintegerrima\",\"nuphar\"],\"worldDistribution\":{\"summary\":\"日本中南部（本州中部以南）に限られる、日本固有の分布域を持つ種とされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Nuphar subintegerrima (Casp.) Makino\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:605471-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Central Japan.\\\" Native to: Japan。\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、本州（愛知県・岐阜県・三重県周辺の中部地方）を中心に分布するとされ、コウホネ属の中でも分布域が限定的な種。3種のコウホネ属間の複雑な交雑に由来する可能性も指摘されている。\",\"status\":\"自生（日本固有種）\",\"source\":{\"name\":\"ヒメコウホネ Nuphar subintegerrima スイレン科 Nymphaeaceae コウホネ属 — 三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/himekouhone.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営の植物観察サイトを二次資料として使用。POWOの「S. Central Japan」という表現とも整合するが、より広範囲（近畿地方等）からの報告例がないか、専門文献での追加確認が望ましい。日本語版Wikipediaの当該記事はツールの技術的制約により本調査では直接参照できなかった。 【追記】2015年の分類学的再検討（志賀・角野）により、ヒメコウホネは東海地方（愛知・岐阜・三重）に分布が限定される種として再定義され、西日本（近畿地方等）で報告されてきた個体群の多くはサイコクヒメコウホネ（Nuphar saikokuensis）として独立種に分離された。\",\"habitat\":\"池沼・ため池・河川など、比較的浅い止水〜緩流水域に生育する多年生水生植物。水中では波打つ縁を持つ薄い沈水葉を、水面には光沢のある厚い浮葉（長さ4〜17cm×幅4〜15cmの円形〜広卵形）をつける。黄色い花は直径2.5〜4cmとコウホネより小さく水面近くに咲く。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内での自生記録あり（三田市における学術調査でごく少数のため池から確認、目録本体の該当巻は技術的制約により確認未了）\",\"detail\":\"「兵庫県産維管束植物」第3巻の該当箇所は、WebFetchによるPDFテキスト抽出が毎回タデ科の途中で打ち切られる技術的制約により直接確認できなかった。一方、オグラコウホネに関する調査論文（藤井ほか, 1999）では、三田市内230か所のため池を対象とした水系別の悉皆調査で、ヒメコウホネ（原文表記：N. subintegerrimum）が2か所のため池で確認されたと報告されている。この論文はオグラコウホネ・コウホネ・ヒメコウホネの3種のすみわけを主題としており、ヒメコウホネが兵庫県内（三田市）に確実に自生することを示す一次資料となる。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市内のため池（230か所調査中2か所で確認、藤井俊夫ほか 1999 人と自然10: 41-48）\"],\"source\":{\"name\":\"藤井俊夫ほか「兵庫県三田市における絶滅危惧植物オグラコウホネ（スイレン科）の分布，生育環境と形態」人と自然 10: 41-48 (1999)（兵庫県産維管束植物 第3巻はPDF取得上限のため該当箇所を確認できず、代替の一次資料として使用）\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No101999041.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"本来のカタログ一次資料である「兵庫県産維管束植物」第3巻の該当箇所は技術的制約（PDFの取得上限）により直接確認できていない。代替として使用した論文はコウホネ属3種の識別・分布を専門的に扱った学術論文であり信頼性は高いが、具体的なため池名までは要約から得られず、三田市域に限定された記録である点に留意。 【重要フラグ】この記録の一次資料である藤井ほか(1999)は1999年発表であり、2015年のサイコクヒメコウホネ分離記載より前の分類学的枠組みに基づく。三田市で確認された「ヒメコウホネ（N. subintegerrimum）」が、現在の分類ではヒメコウホネ（東海地方固有とされる）とサイコクヒメコウホネ（近畿地方等に分布）のいずれに該当するかは、本データ整備時点では再検証できていない。地理的には近畿地方（兵庫県）に分布するのはサイコクヒメコウホネである可能性が高く、本種（狭義のヒメコウホネ）の兵庫県内における分布は再確認が必要である。アプリ内の「サイコクヒメコウホネ」のページも参照のこと。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のコウホネ・オグラコウホネと極めてよく似ており、花の大きさ・柱頭盤の形状・葉柄の断面（中実か中空か）・抽水葉の有無で区別する。\",\"items\":[{\"name\":\"サイコクヒメコウホネ\",\"sciName\":\"Nuphar saikokuensis Shiga et Kadono\",\"distinguishingPoints\":\"2015年まで本種（ヒメコウホネ）と同一種として扱われていた西日本の個体群が独立種として分離されたもの。兵庫県内（播磨地域）で見られるヒメコウホネ属の小型種は、本種ではなくサイコクヒメコウホネである可能性が高い。\"},{\"name\":\"コウホネ\",\"sciName\":\"Nuphar japonica\",\"distinguishingPoints\":\"コウホネはコウホネ属の中で最も大型で、直径約5cmの花と、水上に立ち上がる抽水葉をつける点でヒメコウホネと異なる。ヒメコウホネの花は直径2.5〜4cmと小さく、柱頭盤の先端が盤からあまり突き出ない。\"},{\"name\":\"オグラコウホネ\",\"sciName\":\"Nuphar oguraensis\",\"distinguishingPoints\":\"オグラコウホネは葉柄が細く中空である点や、抽水葉をつくらない点でヒメコウホネと共通する特徴もあるが、分布・生育環境（オグラコウホネはやや流れのある環境を好む）や柱頭盤の色調などで区別される。三田市の調査ではオグラコウホネ25か所・コウホネ17か所に対しヒメコウホネはわずか2か所と、生育するため池の数がとりわけ少ないことが報告されている。\"}],\"source\":{\"name\":\"藤井俊夫ほか「兵庫県三田市における絶滅危惧植物オグラコウホネ（スイレン科）の分布，生育環境と形態」人と自然 10: 41-48 (1999)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No101999041.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"三田市における現地調査に基づく一次資料であり信頼性は高いが、全国的な識別基準としては他地域の図鑑的記述と合わせて確認することが望ましい。\"}},{\"id\":\"nuphar-oguraensis\",\"nameJa\":\"オグラコウホネ\",\"nameJaAlt\":[\"巨椋河骨\"],\"sciName\":\"Nuphar oguraensis Miki\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"オグラコウホネ\",\"おぐらこうほね\",\"巨椋河骨\",\"Nuphar oguraensis\",\"nuphar\"],\"worldDistribution\":{\"summary\":\"日本の本州中南部・南部に分布域が限られる、日本の絶滅危惧種。POWOでは日本固有種として扱われている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Nuphar oguraensis Miki\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:605453-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Central & S. Japan.\\\" Native to: Japan。\"}},\"japanDistribution\":{\"summary\":\"本州（中部地方以南）・四国・九州に分布するとされ、環境省第4次レッドリストで絶滅危惧II類（VU）に指定されている全国的な希少種。京都府では絶滅寸前種、近畿地方版レッドデータブックでは最上位ランクに位置づけられるなど、多くの地域で著しい減少・局地的絶滅が報告されている。かつての基準産地とされる京都・巨椋池（おぐらいけ）は干拓により消滅している。\",\"status\":\"自生（国レベルで絶滅危惧II類=VU、多くの都府県でさらに深刻なランク）\",\"source\":{\"name\":\"京都府レッドデータブック2015「オグラコウホネ」\",\"url\":\"https://www.pref.kyoto.jp/kankyo/rdb/bio/db/flo0084.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"都道府県レッドデータブックを二次資料として参照。環境省第4次レッドリストでのVU（絶滅危惧II類）指定は複数の情報源で一致しており信頼性が高い。日本語版Wikipediaはツールの技術的制約により本調査では直接参照できなかった。\",\"habitat\":\"ため池・河川・水路などに生育する多年生水生植物で、コウホネ属の中では比較的流れのある水域への適応が強いとされる。抽水葉をつくらず、水中に細く中空の葉柄を持つ沈水葉と、水面に浮く浮葉のみをつける。三田市での調査では、電気伝導度が低い（富栄養化していない）貧栄養なため池を好み、土（自然の畦畔）構造のため池に多く生育する傾向が報告されている。河川改修や水質悪化（富栄養化）、護岸のコンクリート化、観賞用の採取などが減少の主因とされる。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内での自生記録あり（三田市に日本有数の集中分布地が存在することが専門論文で報告されている）\",\"detail\":\"兵庫県三田市を対象とした専門論文「藤井俊夫・鈴木武・麻生いずみ・滝花佐和子・高島敬昭・小野創（1999）兵庫県三田市における絶滅危惧植物オグラコウホネ（スイレン科）の分布，生育環境と形態．人と自然 Humans and Nature No.10, 41-48」が、市内8水系（武庫川本流域、羽束川流域、青野川流域、黒川流域、波豆川流域、鯰川流域、内神川流域、相野川流域）にある灌漑用ため池230か所を1997〜1998年にかけて悉皆調査した結果を報告している。オグラコウホネは武庫川本流域で5か所、羽束川流域で10か所、内神川流域で8か所、相野川流域で2か所の計25か所のため池で確認され、同属のコウホネ（17か所）・ヒメコウホネ（2か所）とあわせて計3種のコウホネ属が生育するが、いずれの種も同一池内での混生はほとんどなく、明瞭なすみわけがみられたとされる。個別のため池名までは要約からは得られなかったが、「黒井」地区の池が電気伝導度・硝酸態窒素濃度がやや高い個体群として言及されているほか、「春口町」「丹南町」周辺にも河川沿いの個体群があることが述べられている。この論文は「兵庫県産維管束植物」シリーズとは別の学術刊行物（同じ人と自然の博物館の紀要「人と自然」）であり、目録本体（第3巻）とは独立した一次資料として、三田市が国内でも有数のオグラコウホネ集中分布地であることを裏付けている。なお「兵庫県産維管束植物」第3巻本体の該当箇所は、WebFetchによるPDFテキスト抽出が毎回タデ科の途中で打ち切られる技術的制約により、直接の記載内容を確認できなかった。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市 武庫川本流域のため池（5か所）\",\"三田市 羽束川流域のため池（10か所）\",\"三田市 内神川流域のため池（8か所）\",\"三田市 相野川流域のため池（2か所）\",\"三田市 黒井地区のため池（電気伝導度・硝酸態窒素がやや高い個体群として言及）\",\"三田市 春口町・丹南町周辺（河川沿いの個体群）\"],\"source\":{\"name\":\"藤井俊夫ほか「兵庫県三田市における絶滅危惧植物オグラコウホネ（スイレン科）の分布，生育環境と形態」人と自然 Humans and Nature 10: 41-48 (1999年12月)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No101999041.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"この論文はWebFetchによるPDF自動要約（AIによる言い換え・要約）を通じて内容を把握しており、原文の生テキストそのものではないため、原本での照合が望ましい。特に個々のため池の固有名詞（25か所全ての池名）は要約からは得られておらず、水系別の内訳（5+10+8+2=25か所）と、地名として言及された「黒井」「春口町」「丹南町」のみが確認できた。「兵庫県産維管束植物」第3巻本体については、PDF取得上限のため該当箇所（スイレン科の記載部分）を直接確認できておらず、この点は他種のデータと異なる制約として明記する。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のコウホネ・ヒメコウホネと非常によく似ており、抽水葉の有無・葉柄の断面（中空か中実か）・柱頭盤の色で区別する。近縁変種のベニオグラコウホネとは柱頭盤の色で区別される。\",\"items\":[{\"name\":\"コウホネ\",\"sciName\":\"Nuphar japonica\",\"distinguishingPoints\":\"コウホネは水面上に葉身を立ち上げる抽水葉をつくるが、オグラコウホネは抽水葉をつくらず沈水葉・浮葉のみをつける点で明確に異なる。三田市の調査ではコウホネの方がオグラコウホネよりやや生育池数が多い（17か所 対 25か所）が、両種はほとんど同一池内で混生しない。\"},{\"name\":\"ヒメコウホネ\",\"sciName\":\"Nuphar subintegerrima\",\"distinguishingPoints\":\"ヒメコウホネもオグラコウホネと同様に小型で抽水葉をつくらないが、葉柄が中実か中空かなどの細部で区別される。三田市ではヒメコウホネはわずか2か所のため池でしか確認されておらず、オグラコウホネ（25か所）に比べ著しく稀である。\"},{\"name\":\"ベニオグラコウホネ\",\"sciName\":\"Nuphar oguraensis var. akiensis\",\"distinguishingPoints\":\"オグラコウホネの変種で、花の柱頭盤が黄色であるオグラコウホネに対し、ベニオグラコウホネは柱頭盤が赤色を帯びる点で区別される。\"}],\"source\":{\"name\":\"オグラコウホネ Nuphar oguraensis var. oguraensis — ざっそう屋\",\"url\":\"https://zassou-ya.com/plants/ogurakouhone/\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営の植物図鑑サイトを二次資料として使用。形態的特徴自体は藤井ほか(1999)など学術論文の内容とも整合する。\"}},{\"id\":\"nymphaea-tetragona\",\"nameJa\":\"ヒツジグサ\",\"nameJaAlt\":[\"未草\"],\"sciName\":\"Nymphaea tetragona Georgi\",\"family\":\"スイレン科 Nymphaeaceae\",\"searchTerms\":[\"ヒツジグサ\",\"ひつじぐさ\",\"未草\",\"nymphaea\",\"Nymphaea tetragona\",\"pygmy water lily\"],\"worldDistribution\":{\"summary\":\"北東ヨーロッパから朝鮮半島・ヒマラヤにかけて、また亜北極圏の北米から北米北西部にかけての、北半球周極〜温帯に広く分布する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Nymphaea tetragona Georgi\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:171226-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is NE. Europe to Korea and Himalaya, Subarctic America to NW. U.S.A.\\\" Native to欄には北米（アラスカ・ユーコンからワシントン州まで）、北欧から東進してシベリアを経て日本・朝鮮、南はベトナム・バングラデシュ・ミャンマーに至るまで40以上の地域が列挙されている。\"}},\"japanDistribution\":{\"summary\":\"北海道から九州まで日本全国に分布する、日本に自生する唯一のスイレン属（Nymphaea）野生種。庭園・公園池などで見られる大輪の熱帯性・温帯性スイレン（睡蓮）の園芸品種は、いずれも外国産のスイレン属種や本種を含む交配による栽培品種であり、野生のヒツジグサとは区別する必要がある。北方の個体群ほど葉・花弁が大きくなる地理的変異が知られる。\",\"status\":\"自生（日本産スイレン属唯一の野生種）\",\"source\":{\"name\":\"Wikipedia日本語版「ヒツジグサ」\",\"url\":\"https://ja.wikipedia.org/wiki/ヒツジグサ\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版を二次資料として参照。「日本に自生する唯一のスイレン属」という点は複数の植物図鑑・大学植物園サイトでも共通して述べられており信頼性は高いと考えられる。東アジア集団を独立種Nymphaea pygmaeaとして扱うべきとする分類学的議論があることにも留意。\",\"habitat\":\"中性〜弱酸性で、貧栄養〜中栄養、あるいは腐植質に富む池沼・湖沼・水路に生育する多年生の浮葉植物。根茎で水底の泥に固着し、水面に円形の葉を浮かべる。日中に開き夕方に閉じる白い花を早朝から昼にかけて咲かせ、名前は花が夕方（未の刻）に閉じることに由来するとされる。北海道の一部には柱頭が赤みを帯びるエゾベニヒツジグサという地理的変異も知られる。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内での自生記録あり（三田市での学術調査記録を確認、目録本体の該当巻は技術的制約により確認未了）\",\"detail\":\"「兵庫県産維管束植物」第3巻の該当箇所は、WebFetchによるPDFテキスト抽出が毎回タデ科の途中で打ち切られる技術的制約により直接確認できなかった。代わりに高橋晃「兵庫県三田市の植物」（人と自然 Humans and Nature 22: 101-146, 2011）を確認したところ、三田市内の複数の産地（母子、小野峠、大川瀬）にヒツジグサの記録が明記されていた。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市 母子 （SH 16435）\",\"三田市 小野峠 （HK & SN 940440）\",\"三田市 大川瀬 （AT and HI 1974）\"],\"source\":{\"name\":\"高橋晃「兵庫県三田市の植物」人と自然 Humans and Nature 22: 101-146 (2011)（兵庫県産維管束植物 第3巻はPDF取得上限のため該当箇所を確認できず、代替の一次資料として使用）\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"本来のカタログ一次資料である「兵庫県産維管束植物」第3巻の該当箇所は技術的制約（PDFの取得上限）により直接確認できていない。代替として使用した論文は同博物館研究員による学術論文であり信頼性は高いが、三田市域に限定された記録である点に留意。ヒツジグサは全国的に広く分布する種であるため、兵庫県内の他地域（北部の湿原・ため池等）にも記録がある可能性が高いが、今回は三田市の記録のみ確認できた。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"公園・庭園池などで植栽される外国産・園芸品種のスイレン類（一般に「スイレン」と呼ばれるもの）と、野生種であるヒツジグサを混同しないよう注意が必要。\",\"items\":[{\"name\":\"セイヨウスイレン（園芸品種群）\",\"sciName\":\"Nymphaea spp. (栽培品種)\",\"distinguishingPoints\":\"公園池等でよく見られる大輪で多色（赤・ピンク・黄色等）のスイレンは、エジプト原産や熱帯アメリカ・アフリカ原産のスイレン属他種、あるいはそれらとヒツジグサ等との交配による園芸品種であり、いずれも自生ではなく植栽由来。野生のヒツジグサは花が白色一色で、花・葉ともに小型（花径3〜5cm程度）である点で、大輪・多色の園芸品種と区別できる。\"}],\"source\":{\"name\":\"Wikipedia日本語版「ヒツジグサ」\",\"url\":\"https://ja.wikipedia.org/wiki/ヒツジグサ\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版の記述と、スイレン属の栽培史に関する一般的な植物学的知見に基づく。個々の園芸品種の交配親の詳細までは今回確認していない。\"}},{\"id\":\"cabomba-caroliniana\",\"nameJa\":\"フサジュンサイ\",\"nameJaAlt\":[\"ハゴロモモ\",\"カボンバ\"],\"sciName\":\"Cabomba caroliniana A.Gray\",\"family\":\"ジュンサイ科 Cabombaceae\",\"searchTerms\":[\"ハゴロモモ\",\"はごろもも\",\"羽衣藻\",\"フサジュンサイ\",\"ふさじゅんさい\",\"カボンバ\",\"cabomba\",\"Cabomba caroliniana\",\"fanwort\",\"carolina fanwort\"],\"worldDistribution\":{\"summary\":\"アメリカ合衆国中部・東部からメキシコ北東部、ブラジル南部からアルゼンチン中部にかけての南北アメリカ大陸に自生する。カンザス州では絶滅（extinct）扱いとされる一方、世界の多くの地域（日本を含む）に観賞魚・水草として導入され帰化している。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cabomba caroliniana A.Gray\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:273581-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Central & E. U.S.A. to NE. Mexico, Brazil to Central Argentina.\\\" Native to多数の米国州・アルゼンチン・ブラジル・ボリビア・パラグアイ・メキシコ北東部。Extinct in: Kansas。Introduced into多数の地域。\"}},\"japanDistribution\":{\"summary\":\"1929年に観賞用として東京・小石川植物園に導入され、1950年には東京近郊で野生化（帰化）が確認された。以降、本州から九州にかけて全国の池沼・湿地・水路に広がっている帰化植物（外来種）で、日本に自生するものではない。\",\"status\":\"帰化（アメリカ大陸原産の外来種、日本には自生しない）\",\"source\":{\"name\":\"Wikipedia日本語版「ハゴロモモ」\",\"url\":\"https://ja.wikipedia.org/wiki/ハゴロモモ\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版を二次資料として参照。導入年代・帰化確認年代の記述は他の外来種図鑑サイト（大阪府立環境農林水産総合研究所等）とも整合しており信頼性は高いと考えられる。\",\"habitat\":\"富栄養で低pHの環境でよく成長し、水深3m以浅の緩やかな流れがある水域を好み、細かい底質を好む。池沼・湖沼・河川・用水路に、対生する扇状に細裂した羽毛状の沈水葉を密生させて群落を形成し、水面には小さな菱形〜線形の浮葉をつけて7〜10月に白い小花（直径約2cm）を咲かせる。殖芽（冬芽）による栄養繁殖力が非常に強く、ちぎれた茎片からも再生するため、水路・河川を通じて急速に拡散しやすい。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録の有無を確認できず（技術的制約により第3巻該当箇所を確認未了、帰化植物のため目録の収録方針上そもそも対象外の可能性あり）\",\"detail\":\"「兵庫県産維管束植物」第3巻の該当箇所は、WebFetchによるPDFテキスト抽出が毎回タデ科の途中で打ち切られる技術的制約により確認できなかった。三田市の植物相調査（高橋晃, 2011）や、オグラコウホネに関する三田市の論文でも、ハゴロモモ／フサジュンサイの記録は見当たらなかった。ハゴロモモは環境省の生態系被害防止外来種リストにおいて「重点対策外来種」に指定されている全国的な帰化植物であり、近畿地方の淀川水系（大阪府）等では定着が報告されているが、兵庫県内における確実な野生化・帰化の記録は今回の調査では確認できなかった。なお同シリーズの凡例には「園芸目的に輸入されたものや農作物など明らかに栽培植物と思われる標本は除外した」とある一方、「自生のものか野生化したものか判断しにくい標本はすべて記録されている」ともあり、野生化が確認されていれば本来は記録対象となりうる。\",\"volume\":3,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第3巻（該当箇所はPDF取得上限のため未確認）\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No122001105.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"目録本体の該当箇所をWebFetchツールで直接確認できなかったため、「記録なし」ではなく「確認できず」という消極的な結論にとどめる。三田市の植物相論文2件にも記載がなかったことを傍証としたが、これらは県内全域を網羅する調査ではなく、また同論文の対象期間（1990年代〜2011年）以降にハゴロモモが兵庫県内に侵入している可能性も否定できない。生態系被害防止外来種リストでの指定状況から、県内水域への侵入・拡散には注意が必要な種である。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じジュンサイ科の在来種ジュンサイと、水中に沈む若い部分の質感がやや似るため、葉が展開していない状態では紛らわしいことがある。\",\"items\":[{\"name\":\"ジュンサイ\",\"sciName\":\"Brasenia schreberi\",\"distinguishingPoints\":\"ジュンサイは水面に浮く長楕円形の単葉（浮葉）のみをつけ、沈水葉を持たない。ハゴロモモ（フサジュンサイ）は扇状に細裂した対生の沈水葉を水中に密生させ、水面には別形の小さな浮葉と白い花をつける点で、葉の形状が大きく異なる。ジュンサイは在来の食用植物、ハゴロモモは外来の帰化植物（重点対策外来種）である点でも対照的。\"}],\"source\":{\"name\":\"ハゴロモモ | 水草図鑑（外来種） | 大阪府立環境農林水産総合研究所\",\"url\":\"https://www.knsk-osaka.jp/zukan/zukan_database/mizukusa_gairai/4350b31dd019ea9/9850bd5a2574600.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"府県の水草図鑑サイトを二次資料として参照。形態的な識別点自体は広く知られた内容。\"}},{\"id\":\"illicium-anisatum\",\"nameJa\":\"シキミ\",\"nameJaAlt\":[\"樒\",\"マッコウ\",\"マッコウギ\"],\"sciName\":\"Illicium anisatum L.\",\"family\":\"マツブサ科 Schisandraceae\",\"searchTerms\":[\"シキミ\",\"しきみ\",\"樒\",\"マッコウ\",\"マッコウギ\",\"illicium\",\"Illicium anisatum\",\"sacred anisetree\",\"Japanese star anise toxic\"],\"worldDistribution\":{\"summary\":\"東アジアの暖温帯~亜熱帯域に自生する常緑小高木。POWOでは自生地を日本・朝鮮半島(済州島)・台湾とし、韓国から日本を経て台湾に至る分布域とする。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Illicium anisatum\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554492-1\",\"type\":\"primary\",\"note\":\"POWOは自生地を「Japan, Korea, Nansei-shoto, Taiwan」、要約分布を「S. Korea, Japan to Taiwan」と記載。異名としてIllicium religiosum Siebold & Zucc.が挙げられている。\"}},\"japanDistribution\":{\"summary\":\"本州(宮城県・石川県以西)、四国、九州、屋久島、種子島、トカラ列島、奄美大島、徳之島、沖縄島、慶良間諸島に分布し、暖温帯の山地林内にやや普通に自生する。古くから寺院・墓地に植栽され、日本各地の人里近くでも極めて普通に見られる。\",\"status\":\"自生\",\"source\":{\"name\":\"日本語版ウィキペディア「シキミ」\",\"url\":\"https://ja.wikipedia.org/wiki/シキミ\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版ウィキペディアの記載に基づく。分布北限(宮城県・石川県)については複数の一般図鑑類でも共通して言及されるが、YList等の一次資料でのクロスチェックは行っていない。\",\"habitat\":\"暖温帯の照葉樹林(ウラジロガシ・コジイ林など)の下層に生育するほか、寺院・墓地への植栽としても極めて普通に見られる。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に広く自生・植栽（三田市で複数記録、六甲山系にも分布）\",\"detail\":\"兵庫県立人と自然の博物館紀要『人と自然』22号所収の高橋晃(2011)「兵庫県三田市の植物」に、三田市内4地点からの標本記録がある。また国土交通省近畿地方整備局『六甲山系電子植生図鑑』によれば、六甲山系では標高300m以上の照葉樹林(ウラジロガシ・コジイ林など)の下層に広く分布するとされる。シキミは日本で唯一「毒物及び劇物取締法」により植物として劇物指定される猛毒種であり、寺院・墓地の植栽としても兵庫県内で極めて普通に見られる。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市 乙原奥\",\"三田市 上青野(母子大池付近)\",\"三田市 羽束山\",\"三田市 虚空蔵山\",\"六甲山系(標高300m以上の照葉樹林)\"],\"source\":{\"name\":\"高橋晃(2011)「兵庫県三田市の植物」『人と自然』22: 101-146. 兵庫県立人と自然の博物館\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\",\"note\":\"兵庫県産維管束植物 第3巻(https://www.hitohaku.jp/publication/r-bulletin/No122001105.pdf)を直接照会したが、WebFetchによる文書抽出がタデ科(Polygonaceae)記載部分で毎回打ち切られ、マツブサ科の該当箇所に到達できなかった(既知の技術的制約)。そのため同館発行の地域フロラ調査報告である本稿を代替の一次資料として用いた。\"},\"reliabilityNote\":\"兵庫県産維管束植物 第3巻での直接確認はPDF抽出の制約により行えなかったため、同博物館紀要の三田市フロラ調査(2011)を代替資料とし、国土交通省近畿地方整備局の六甲山系植生図鑑で補強した。三田市は兵庫県南東部の内陸部であり、シキミが同地に自生することと極めて普通種であるという性質から、県内他地域(六甲山系・播磨・淡路島等)にも広く自生・植栽されていると考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のトウシキミ(食用スターアニス)と外見が似るが、毒性が全く異なる重要な判別対象。シキミは全木有毒(特に果実は猛毒)である一方、トウシキミは食用のスターアニスとして流通する。輸入スターアニスにシキミの果実が混入して中毒事故が発生した例が国内外で報告されており、野外のシキミ属の果実を安易に採取・喫食しないよう注意が必要。\",\"items\":[{\"name\":\"トウシキミ\",\"sciName\":\"Illicium verum Hook.f.\",\"distinguishingPoints\":\"花被片はピンク~暗赤色で広楕円形(シキミは細長く淡黄白色)。果実(八角)は無毒で食用のスターアニスとして流通するが、シキミの果実(毒八角)は猛毒のアニサチンを含み混同すると重篤な中毒を起こす。日本には自生せず栽培のみで、シキミのように寺院・野山に普通には見られない。\"}],\"source\":{\"name\":\"三河の植物観察「シキミ」\",\"url\":\"https://mikawanoyasou.org/data/sikimi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"一般向け植物解説サイトの記載に基づく。毒性に関する情報は東京都健康安全研究センター等の公的機関の解説とも整合する。\"}},{\"id\":\"illicium-verum\",\"nameJa\":\"トウシキミ\",\"nameJaAlt\":[\"唐樒\",\"ダイウイキョウ\",\"大茴香\",\"スターアニス\",\"八角\"],\"sciName\":\"Illicium verum Hook.f.\",\"family\":\"マツブサ科 Schisandraceae\",\"searchTerms\":[\"トウシキミ\",\"とうしきみ\",\"唐樒\",\"ダイウイキョウ\",\"大茴香\",\"スターアニス\",\"八角\",\"star anise\",\"Illicium verum\"],\"worldDistribution\":{\"summary\":\"中国南東部(広西チワン族自治区南部・西部)からベトナム北東部が原産。中国南部・インド南部・インドシナ半島などで香辛料(八角/スターアニス)として広く栽培され、カンボジア・中国中南部・ミャンマーなどに導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Illicium verum\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554553-1\",\"type\":\"primary\",\"note\":\"POWOは自生地を「China (S. & W. Guangxi) to N. Vietnam」とし、導入地としてCambodia, China South-Central, Myanmarを挙げている。\"}},\"japanDistribution\":{\"summary\":\"日本には自生せず、香辛料・薬用・観賞用として植物園やハーブ園、寺院などでごく少数が栽培されるのみ。日本に自生するのは近縁の別種であるシキミ(本州~沖縄諸島)とヤエヤマシキミ(先島諸島)である。\",\"status\":\"栽\",\"source\":{\"name\":\"日本語版ウィキペディア「トウシキミ」\",\"url\":\"https://ja.wikipedia.org/wiki/トウシキミ\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版ウィキペディアの記載に基づく。日本国内での栽培規模・栽培地点数に関する統計的な一次データは確認できていない。\",\"habitat\":\"原産地の中国南部では亜熱帯の丘陵地に果樹的作物として植栽される。日本国内では植物園・薬用植物園・寺院庭園等での限定的な栽培にとどまり、野生化・逸出の報告はない。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内での野生記録なし（栽培のみ、稀）\",\"detail\":\"トウシキミは中国南部~ベトナム北部原産のスパイス植物であり、日本国内では自生しない。近隣府県の薬用植物園(例: 武田薬品工業京都薬用植物園)での栽培例はあるが、兵庫県内で本種が野外で確認された記録は見当たらない。兵庫県産維管束植物(全12巻)は県内に自生・帰化・野生化した植物を対象とする目録であり、純粋な栽培種であるトウシキミは収録対象外である可能性が高い。ヒマラヤスギなど、人為的に植栽されるのみで兵庫県の自然植生の一部とは言えない種と同様の扱いとして「野生記録なし」とする。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"日本語版ウィキペディア「トウシキミ」\",\"url\":\"https://ja.wikipedia.org/wiki/トウシキミ\",\"type\":\"secondary\",\"note\":\"兵庫県産維管束植物 第3巻(https://www.hitohaku.jp/publication/r-bulletin/No122001105.pdf)はPDF抽出の技術的制約により直接照会できなかったが、トウシキミは日本に自生しない栽培専用の外来種であるため、同目録(自生・帰化種を主対象とする)への収録可能性は低いと判断した。\"},\"reliabilityNote\":\"トウシキミは非自生の栽培種であるため、兵庫県産維管束植物における野生記録は原理的に想定されない。本エントリは既存データセットで採用した『人為植栽のみで自然分布のない外来種』(例: ヒマラヤスギ)の扱い方に準拠している。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"シキミと非常によく似た近縁種で、混同すると重大な健康被害につながる危険な組み合わせ。八角(スターアニス)として流通する香辛料にシキミの果実が混入していた食中毒事例が報告されている。\",\"items\":[{\"name\":\"シキミ\",\"sciName\":\"Illicium anisatum L.\",\"distinguishingPoints\":\"花被片は細長く淡黄白色(トウシキミは広楕円形でピンク~暗赤色)。果実は猛毒のアニサチンを含み「毒八角」とも呼ばれる。日本の照葉樹林や寺院・墓地に極めて普通に自生・植栽される点でも、栽培のみで稀なトウシキミと大きく異なる。\"}],\"source\":{\"name\":\"東京都健康安全研究センター「トウシキミ(八角)とシキミ」\",\"url\":\"https://www.tmiph.metro.tokyo.lg.jp/lb_iyaku/plant/yudoku-top/sikimi/\",\"type\":\"secondary\"},\"reliabilityNote\":\"東京都の公的機関による食品衛生・薬事の注意喚起ページに基づく。\"}},{\"id\":\"kadsura-japonica\",\"nameJa\":\"サネカズラ\",\"nameJaAlt\":[\"実葛\",\"美男葛\",\"ビナンカズラ\",\"実蔓\"],\"sciName\":\"Kadsura japonica (L.) Dunal\",\"family\":\"マツブサ科 Schisandraceae\",\"searchTerms\":[\"サネカズラ\",\"さねかずら\",\"実葛\",\"ビナンカズラ\",\"美男葛\",\"kadsura\",\"Kadsura japonica\",\"scarlet kadsura\"],\"worldDistribution\":{\"summary\":\"朝鮮半島南部(済州島)から日本南部を経て台湾に至る東アジア暖温帯~亜熱帯域に自生する常緑つる性木本。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Kadsura japonica\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:554582-1\",\"type\":\"primary\",\"note\":\"POWOは自生地を「Japan, Korea, Nansei-shoto, Taiwan」、要約分布を「S. Korea, S. Japan to Taiwan」と記載している。\"}},\"japanDistribution\":{\"summary\":\"本州(関東地方以西)、四国、九州、南西諸島、済州島、台湾に分布。暖地の丘陵・山地の広葉樹林の林縁や林床に自生するほか、庭木としても広く栽培される。\",\"status\":\"自生\",\"source\":{\"name\":\"日本語版ウィキペディア「サネカズラ」\",\"url\":\"https://ja.wikipedia.org/wiki/サネカズラ\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版ウィキペディアの記載に基づく一般的な分布情報。\",\"habitat\":\"暖温帯の広葉樹林の林縁・林床に自生する常緑つる性木本。ふつう雌雄異株(まれに雌雄同株)で、秋に赤く球状に熟す集合果をつける。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に自生記録あり（三田市弥生が丘で確認）\",\"detail\":\"兵庫県立人と自然の博物館紀要『人と自然』22号所収の高橋晃(2011)「兵庫県三田市の植物」に、三田市弥生が丘での採集記録(HI et al. 04112803)がある。三田市は兵庫県南東部の内陸丘陵地であり、暖地性のサネカズラが同地まで分布することから、より温暖な瀬戸内海沿岸部(播磨地方・淡路島等)や六甲山系にはさらに広く自生していると推測される。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市 弥生が丘\"],\"source\":{\"name\":\"高橋晃(2011)「兵庫県三田市の植物」『人と自然』22: 101-146. 兵庫県立人と自然の博物館\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\",\"note\":\"兵庫県産維管束植物 第3巻(https://www.hitohaku.jp/publication/r-bulletin/No122001105.pdf)を直接照会したが、WebFetchによる文書抽出がタデ科(Polygonaceae)記載部分で毎回打ち切られ、マツブサ科の該当箇所に到達できなかった(既知の技術的制約)。そのため同館発行の地域フロラ調査報告である本稿を代替の一次資料として用いた。\"},\"reliabilityNote\":\"兵庫県産維管束植物 第3巻での直接確認はPDF抽出の制約により行えなかったため、同博物館紀要の三田市フロラ調査(2011)を代替資料として使用した。三田市1地点のみの記録であるため、県内全域での分布状況はより広範な追加調査が望まれる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同科のマツブサ属(マツブサ、チョウセンゴミシ)と混同されやすいが、サネカズラは常緑、マツブサ属は落葉という大きな違いがある。果実の付き方の違いも判別に有効。\",\"items\":[{\"name\":\"マツブサ\",\"sciName\":\"Schisandra repanda (Siebold & Zucc.) Radlk.\",\"distinguishingPoints\":\"落葉つる性木本(サネカズラは常緑)。果実は球状にまとまらず柄に沿って房状につく点で、サネカズラの球状集合果と区別できる。\"},{\"name\":\"チョウセンゴミシ\",\"sciName\":\"Schisandra chinensis (Turcz.) Baill.\",\"distinguishingPoints\":\"落葉つる性木本で葉は薄く葉脈がくぼむ(サネカズラは常緑で葉が厚く光沢がある)。兵庫県には自然分布せず、分布域も北海道・本州中部地方以北と大きく異なる。\"}],\"source\":{\"name\":\"ざっそう屋「マツブサ」\",\"url\":\"https://zassou-ya.com/plants/matsubusa/\",\"type\":\"secondary\"},\"reliabilityNote\":\"一般向け植物解説サイトの記載に基づく形態比較。\"}},{\"id\":\"schisandra-repanda\",\"nameJa\":\"マツブサ\",\"nameJaAlt\":[\"松房\"],\"sciName\":\"Schisandra repanda (Siebold & Zucc.) Radlk.\",\"family\":\"マツブサ科 Schisandraceae\",\"searchTerms\":[\"マツブサ\",\"まつぶさ\",\"松房\",\"schisandra\",\"Schisandra repanda\",\"Schisandra nigra\"],\"worldDistribution\":{\"summary\":\"朝鮮半島(済州島)と日本に自生する東アジア温帯域の落葉つる性木本。POWOでは現在Schisandra repanda (Siebold & Zucc.) Radlk.を正名とし、一部の古い文献等で用いられるSchisandra nigra Maxim.は異名として扱われる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Schisandra repanda\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:555078-1\",\"type\":\"primary\",\"note\":\"POWOでは本種を「accepted(承認された学名)」と明記し、自生地を「Korea (Jejudo), Japan」としている。異名としてSchisandra nigra Maxim.及びSchisandra nigra var. hypoglauca Makinoが挙げられている。\"}},\"japanDistribution\":{\"summary\":\"本州から九州、および済州島に分布する落葉つる性木本。山地の林縁などに自生し、秋に黄葉する。\",\"status\":\"自生\",\"source\":{\"name\":\"日本語版ウィキペディア「マツブサ」\",\"url\":\"https://ja.wikipedia.org/wiki/マツブサ\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版ウィキペディアの記載に基づく。生育環境の詳細(土壌条件等)は同記事に記載がなく、他の樹木解説サイトの記述で補足した。\",\"habitat\":\"山地の林縁・低木林に自生するつる性木本。葉は互生し光沢がありやや厚く、鋸歯は低く目立たない。雌雄異株。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県内に自生記録あり（三田市羽束山で確認）\",\"detail\":\"兵庫県立人と自然の博物館紀要『人と自然』22号所収の高橋晃(2011)「兵庫県三田市の植物」に、三田市羽束山での採集記録(TK 19620)がある。マツブサは本州~九州の温帯域に広く分布する種であり、兵庫県内でも山地の林縁部に点在的に自生していると考えられる。\",\"volume\":3,\"page\":null,\"localities\":[\"三田市 羽束山\"],\"source\":{\"name\":\"高橋晃(2011)「兵庫県三田市の植物」『人と自然』22: 101-146. 兵庫県立人と自然の博物館\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"primary\",\"note\":\"兵庫県産維管束植物 第3巻(https://www.hitohaku.jp/publication/r-bulletin/No122001105.pdf)を直接照会したが、WebFetchによる文書抽出がタデ科(Polygonaceae)記載部分で毎回打ち切られ、マツブサ科の該当箇所に到達できなかった(既知の技術的制約)。そのため同館発行の地域フロラ調査報告である本稿を代替の一次資料として用いた。\"},\"reliabilityNote\":\"兵庫県産維管束植物 第3巻での直接確認はPDF抽出の制約により行えなかったため、同博物館紀要の三田市フロラ調査(2011)を代替資料として使用した。三田市1地点のみの記録であるため、県内全域での分布状況はより広範な追加調査が望まれる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じマツブサ属のチョウセンゴミシ、および同科のサネカズラと混同されやすい。\",\"items\":[{\"name\":\"チョウセンゴミシ\",\"sciName\":\"Schisandra chinensis (Turcz.) Baill.\",\"distinguishingPoints\":\"より冷涼な地域(北海道・本州中部地方以北)に分布し、兵庫県には自然分布しない。葉身は先寄りで幅広い倒卵形、葉質が薄く葉脈がくぼんで目立つ点で、葉に光沢がありやや厚いマツブサと区別できる。\"},{\"name\":\"サネカズラ\",\"sciName\":\"Kadsura japonica (L.) Dunal\",\"distinguishingPoints\":\"常緑つる性木本(マツブサは落葉性)。果実は球状に集合するのに対し、マツブサの果実は柄に沿って房状につく。\"}],\"source\":{\"name\":\"ざっそう屋「マツブサ」\",\"url\":\"https://zassou-ya.com/plants/matsubusa/\",\"type\":\"secondary\"},\"reliabilityNote\":\"一般向け植物解説サイトの記載に基づく形態比較。\"}},{\"id\":\"schisandra-chinensis\",\"nameJa\":\"チョウセンゴミシ\",\"nameJaAlt\":[\"朝鮮五味子\",\"ゴミシ\",\"五味子\"],\"sciName\":\"Schisandra chinensis (Turcz.) Baill.\",\"family\":\"マツブサ科 Schisandraceae\",\"searchTerms\":[\"チョウセンゴミシ\",\"ちょうせんごみし\",\"朝鮮五味子\",\"ゴミシ\",\"五味子\",\"schisandra\",\"Schisandra chinensis\",\"magnolia vine\",\"five-flavor berry\"],\"worldDistribution\":{\"summary\":\"ロシア極東(アムール・ハバロフスク・沿海地方・サハリン)から中国北部・内モンゴル・満州・朝鮮半島、および日本中部に至る東アジア北部の冷温帯域に自生する落葉つる性木本。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Schisandra chinensis\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:60456331-2\",\"type\":\"primary\",\"note\":\"POWOでは自生地として「Amur, China North-Central, Inner Mongolia, Japan, Khabarovsk, Korea, Manchuria, Primorye, Sakhalin」を挙げ、要約分布を「Russian Far East to N. China and Central Japan」としている。\"}},\"japanDistribution\":{\"summary\":\"北海道全域および本州の中部地方以北に分布し、それより南の近畿地方以西には自然分布しない。冷涼な気候を好み、山地の林縁などに自生する。\",\"status\":\"自生（ただし兵庫県を含む近畿地方以南には自然分布しない）\",\"source\":{\"name\":\"日本語版ウィキペディア「チョウセンゴミシ」\",\"url\":\"https://ja.wikipedia.org/wiki/チョウセンゴミシ\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版ウィキペディアの記載に基づく。「中部地方以北」という分布域の理解は、熊本大学・武庫川女子大学等の薬用植物データベースの記述とも一致しており、比較的信頼性が高いと判断する。\",\"habitat\":\"冷温帯~亜寒帯の山地林縁に自生するつる性木本。果実(生薬名: 五味子)は薬用として利用される。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県内に自然分布なし（自然分布域外・北方系種のため）\",\"detail\":\"チョウセンゴミシは冷温帯性の種で、日本国内の自然分布は北海道と本州中部地方以北に限られ、近畿地方(兵庫県を含む)はその自然分布域の南限よりも南に位置する。兵庫県立人と自然の博物館紀要『人と自然』22号所収の高橋晃(2011)「兵庫県三田市の植物」でも、同科のマツブサ・サネカズラは記録されている一方、チョウセンゴミシの記載は見られなかった。これは分布域外であるとする見方と整合する。ハイマツやコメツガが高標高・北方適応種として兵庫県に自然分布しないのと同様、本種も緯度・気候帯の制約により兵庫県には自生しないと考えられる。\",\"volume\":null,\"page\":null,\"locality\":null,\"source\":{\"name\":\"日本語版ウィキペディア「チョウセンゴミシ」および高橋晃(2011)「兵庫県三田市の植物」『人と自然』22: 101-146(チョウセンゴミシの記載なし)\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/HN22_12_101_146-1.pdf\",\"type\":\"secondary\",\"note\":\"兵庫県産維管束植物 第3巻(https://www.hitohaku.jp/publication/r-bulletin/No122001105.pdf)はPDF抽出の技術的制約により直接照会できなかった。三田市フロラ調査で同科の近縁種(マツブサ・サネカズラ)は記録されている一方、チョウセンゴミシの記載がないことは、分布論的な『記録なし』の判断を補強する状況証拠として扱った(不在の直接証明ではない点に留意)。\"},\"reliabilityNote\":\"「記録なし」の判断は、(1)一般的に知られる分布域(北海道・本州中部地方以北)に基づく地理的推論、(2)三田市フロラ調査での不記載、という間接的根拠に基づくものであり、兵庫県産維管束植物 第3巻そのものを直接確認できたわけではない。断定的に『県内記録が存在しない』と主張するのではなく、『自然分布域外にあるため記録される可能性が低い』という地理的な推論であることに留意されたい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のマツブサ、同科のサネカズラと形態が似ており混同されやすい。\",\"items\":[{\"name\":\"マツブサ\",\"sciName\":\"Schisandra repanda (Siebold & Zucc.) Radlk.\",\"distinguishingPoints\":\"兵庫県を含む本州~九州の温帯域に広く分布する(チョウセンゴミシは北海道・本州中部地方以北のみ)。葉に光沢がありやや厚い点で、葉が薄く葉脈がくぼむチョウセンゴミシと区別できる。\"},{\"name\":\"サネカズラ\",\"sciName\":\"Kadsura japonica (L.) Dunal\",\"distinguishingPoints\":\"常緑つる性木本(チョウセンゴミシは落葉性)。果実は球状に集合する点で、チョウセンゴミシの房状の果実と異なる。\"}],\"source\":{\"name\":\"ざっそう屋「チョウセンゴミシ」\",\"url\":\"https://zassou-ya.com/plants/chousengomishi/\",\"type\":\"secondary\"},\"reliabilityNote\":\"一般向け植物解説サイトの記載に基づく形態比較。\"}},{\"id\":\"chloranthus-quadrifolius\",\"nameJa\":\"ヒトリシズカ\",\"nameJaAlt\":[\"一人静\",\"Chloranthus japonicus（旧学名として図鑑等で今も広く使用）\"],\"sciName\":\"Chloranthus quadrifolius (A.Gray) H.Ohba & S.Akiyama\",\"family\":\"センリョウ科 Chloranthaceae\",\"searchTerms\":[\"ヒトリシズカ\",\"ひとりしずか\",\"一人静\",\"chloranthus\",\"Chloranthus quadrifolius\",\"Chloranthus japonicus\",\"hitorishizuka\",\"センリョウ科\"],\"worldDistribution\":{\"summary\":\"ロシア極東南部（沿海地方、アムール、サハリン）から中国北部・満州、朝鮮半島を経て、日本の中部・南部にかけて分布する東アジア温帯要素の多年草。POWOでは学名がTricercandra quadrifolia A.Grayを基準異名とするChloranthus quadrifolius (A.Gray) H.Ohba & S.Akiyamaが正名として扱われており、長らく使われてきたChloranthus japonicus Sieboldという名は、実際にはフタリシズカ（Chloranthus serratus）の異名にあたる誤用名（auct. non Siebold）とされている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) - Chloranthus quadrifolius\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77142866-1\",\"type\":\"primary\",\"note\":\"学名の変更経緯（Chloranthus japonicus auct. non Sieboldがフタリシズカの異名扱いとなり、ヒトリシズカの正名がC. quadrifoliusに整理された点）を確認。\"}},\"japanDistribution\":{\"summary\":\"北海道から本州、四国、九州まで日本全国に広く分布し、南千島列島にも産する。山野の明るい落葉樹林や疎林の林床に群生する早春植物で、日本の里山でごく普通に見られる種のひとつ。\",\"status\":\"自生\",\"source\":{\"name\":\"ヒトリシズカ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%92%E3%83%88%E3%83%AA%E3%82%B7%E3%82%BA%E3%82%AB\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaの記述を、植物観察サイト「三河の植物観察」の記載（北海道・本州・四国・九州・朝鮮・中国・ロシアに分布する在来種）と照合し、大きな齟齬がないことを確認した。ただし学名の扱い（quadrifolius vs 旧称japonicus）については情報源により表記が混在しているため、POWOの現行分類を優先した。\",\"habitat\":\"山野の林内、明るい落葉広葉樹林や疎林の林床（腐植質に富む半日陰地）\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"但馬地域（香美町）に分布記録あり（局地的な代替資料による確認）\",\"detail\":\"一次資料である『兵庫県産維管束植物』第3巻（センリョウ目掲載巻）のPDFを直接参照しようとしたが、同PDFはタデ科（Polygonaceae）の途中でテキスト抽出が打ち切られる既知の技術的制約があり、センリョウ科の該当箇所を確認できなかった。代替として、兵庫県美方郡香美町のハチ北観光協会のウェブサイトに、ハチ北地域の林縁でヒトリシズカが自生している旨の記述（2020年5月投稿の観察記事）を見出し、これを参考情報として用いた。同記事では、同じ場所に自生するフタリシズカに比べてヒトリシズカはシカの食害を受けやすく、個体数が少ない状況にあると述べられている。なお、ヒトリシズカは兵庫県版レッドリスト（2020）に掲載されておらず、これは県内で相応に普通に見られる種であることを示唆するが、レッドリスト非掲載は積極的な分布確認資料ではない点に留意が必要である。同じ兵庫県立人と自然の博物館発行の三田市フロラ調査（高橋晃 2011）ではフタリシズカの記録はあるがヒトリシズカの記録は確認できなかった。\",\"volume\":3,\"page\":null,\"localities\":[\"香美町（ハチ北地域、但馬）\"],\"source\":{\"name\":\"ハチ北観光協会「ヒトリシズカ」\",\"url\":\"https://hachikita.jp/%E3%83%92%E3%83%88%E3%83%AA%E3%82%B7%E3%82%BA%E3%82%AB/\",\"type\":\"secondary\",\"note\":\"地域観光協会が運営するブログ記事で、学術的な植物目録ではないため証拠としての厳密性はやや低いが、具体的な地名と生育状況（シカ食害の影響）が記載されている点で参考価値がある。\"}},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属のフタリシズカ、キビヒトリシズカと外見が非常によく似ており、花序の本数や雄しべ（葯隔）の長さで識別する。同科のチャランとは生活形が大きく異なるため区別は容易。\",\"items\":[{\"name\":\"フタリシズカ\",\"sciName\":\"Chloranthus serratus (Thunb.) Roem. & Schult.\",\"distinguishingPoints\":\"フタリシズカは花序がふつう2本（まれに1〜5本）出るのに対し、ヒトリシズカは花序が1本のみ。また、ヒトリシズカは茎頂に4枚の葉が輪生状に集まってつくのに対し、フタリシズカは大きな葉が2〜3対つく点で区別できる。花期はほぼ同じ4〜6月。\"},{\"name\":\"キビヒトリシズカ\",\"sciName\":\"Chloranthus fortunei (A.Gray) Solms\",\"distinguishingPoints\":\"外見が非常によく似るが、雄しべの葯隔（花糸状に伸びる部分）がヒトリシズカでは3〜5mmと短く、中央の葯を欠くことが多いのに対し、キビヒトリシズカでは8〜12mmと長い。キビヒトリシズカは近畿地方以西・四国・九州に局地的に分布し、兵庫県レッドデータブックBランクの希少種である点も異なる。\"},{\"name\":\"チャラン\",\"sciName\":\"Chloranthus spicatus (Thunb.) Makino\",\"distinguishingPoints\":\"同じチャラン属だが、ヒトリシズカが多年草の草本であるのに対し、チャランは常緑小低木で、強い芳香のある花を分枝した円錐状の花序に多数つける点で外見上は大きく異なる。\"}],\"source\":{\"name\":\"ヒトリシズカ - Wikipedia（日本語版）／キビヒトリシズカ - Wikipedia（日本語版）\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%92%E3%83%88%E3%83%AA%E3%82%B7%E3%82%BA%E3%82%AB\",\"type\":\"secondary\"},\"reliabilityNote\":\"識別点（葯隔の長さ、花序数、葉のつき方）は日本語版Wikipediaのキビヒトリシズカの項目に記載された比較記述を主に用いた。現地での識別には花期の実物観察が推奨される。\"}},{\"id\":\"chloranthus-serratus\",\"name
