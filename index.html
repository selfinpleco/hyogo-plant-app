China Southeast（自生地としてこの3地域のみを掲載。導入先としてGreat Britain, Italy等も記録）。\"}},\"japanDistribution\":{\"summary\":\"日本にはメタセコイアの自生・野生化の記録はなく、すべて戦後に導入された栽培由来の個体である。1948年に米国の古生物学者ラルフ・チェイニーらが中国から種子を持ち帰り、これが世界的な普及の端緒となった。日本へは1949年前後に種子・苗木がもたらされ、以後成長が早く樹形が美しいことから公園樹・街路樹・学校の記念樹として日本全国で爆発的に植栽が広まった（滋賀県高島市マキノ高原の「メタセコイア並木」など著名な並木も戦後の植栽による）。これらはいずれも植栽由来であり、野生化・自生の記録はない。\",\"status\":\"植栽のみ（自生・野生化の記録なし、戦後導入）\",\"habitat\":\"中国の自生地では谷筋や川岸など湿った土地に生育し、乾燥した斜面には見られない。日本ではこうした自生環境とは無関係に、公園・街路樹・校庭の記念樹として全国的に植栽される。成長が早く樹形が円錐状に整うため並木仕立てに適し、滋賀県高島市の「メタセコイア並木」（新・日本街路樹百景）や東京都葛飾区水元公園の「メタセコイアの森」など、広い敷地に列植・群植された景観が各地の紅葉の名所となっている。\",\"source\":{\"name\":\"Wikipedia日本語版「メタセコイア」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%A1%E3%82%BF%E3%82%BB%E3%82%B3%E3%82%A4%E3%82%A2\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaを情報源としており、導入年・献上の経緯等の細部は一次資料による裏付けが望ましい。ただし「日本に自生集団は存在せず、全て戦後の導入・植栽由来」という大枠は複数の樹木図鑑・行政資料でも一致しており、信頼性は高いと考えられる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外）\",\"detail\":\"兵庫県産維管束植物 第2巻（裸子植物を収録）の本文をPDFで確認したところ、「メタセコイア」「Metasequoia」の語は一度も登場しない。同巻凡例に「園芸目的に輸入されたものや農作物など明らかに栽培植物と思われる標本は除外したが、自生のものか野生化したものか判断しにくい標本はすべて記録されている」とあり、メタセコイアは戦後に導入された明白な植栽樹木（街路樹・公園樹・記念樹）であって野生化の報告も存在しないため、そもそも採録対象になり得なかったと考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF内容確認はAIによる要約であり、逐語的な全文検索を保証するものではないため、「記載がない＝記録なし」という結論は消去法的な確認にとどまる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"落葉性で樹皮・樹形がよく似たラクウショウ（ヌマスギ）、および常緑針葉樹のスギと混同されやすいが、葉（小枝）の付き方が対生か互生かを見れば確実に区別できる。\",\"items\":[{\"name\":\"ラクウショウ（ヌマスギ）\",\"sciName\":\"Taxodium distichum\",\"distinguishingPoints\":\"最も確実な違いは葉（小枝）の付き方。メタセコイアは小枝・葉が対生（2枚が向かい合ってきっちり並ぶ）で、球果もバレーボールのように整った多角形になる。一方ラクウショウは互生（互い違いで不規則）で、球果もサッカーボール状にややアバウトな形になる。ラクウショウは湿地に生えると根元付近に膝根（気根）と呼ばれるこぶ状の突起が地表に現れることがあるが、メタセコイアにはこの気根が生じない。両種とも秋に赤褐色に紅葉して小枝ごと落ちる落葉性で、幹の樹皮も赤褐色で薄く縦に裂けて剥がれる点はよく似ている。\"},{\"name\":\"スギ\",\"sciName\":\"Cryptomeria japonica\",\"distinguishingPoints\":\"スギは常緑で冬も葉を落とさず、葉は螺旋状（らせん状）に一枚ずつ独立してつく針状〜鎌状の葉であり、メタセコイア・ラクウショウのように小枝ごと羽状に並ぶ柔らかい線形の葉とは質感が大きく異なる。赤褐色で縦に裂ける樹皮の色合いは3種とも似ているため紛らわしいが、晩秋〜冬に葉が枯れ落ちて丸裸の枝になるかどうか（メタセコイア・ラクウショウは落葉、スギは常緑）で容易に判別できる。\"}],\"source\":{\"name\":\"自然観察大学ブログ「ラクウショウとメタセコイアをくらべる」\",\"url\":\"https://sizenkan.exblog.jp/25484953/\",\"type\":\"secondary\"},\"reliabilityNote\":\"対生（メタセコイア）・互生（ラクウショウ）の違いは樹木観察の定番の見分け方として複数の樹木図鑑・観察会資料で一致しており信頼性は高いが、上記ブログは専門家による観察記録であり査読を経た学術一次資料ではない。\"}},{\"id\":\"juniperus-chinensis-kaizuka\",\"nameJa\":\"カイヅカイブキ\",\"nameJaAlt\":[\"カイヅカビャクシン\"],\"sciName\":\"Juniperus chinensis L. 'Kaizuka'\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"カイヅカイブキ\",\"かいづかいぶき\",\"貝塚伊吹\",\"カイヅカビャクシン\",\"kaizuka\",\"Juniperus chinensis Kaizuka\",\"Juniperus chinensis 'Kaizuka'\"],\"worldDistribution\":{\"summary\":\"'Kaizuka'（カイヅカイブキ）は基本種イブキ（Juniperus chinensis）、あるいはミヤマビャクシン（Juniperus chinensis var. procumbens）から選抜されたとされる栽培品種（cultivar）であり、独自の自然分布は存在しない。参考として基本種イブキの自然分布を示すと、極東ロシアからミャンマー北部・東アジア温帯域にかけて広く分布する。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Juniperus chinensis L.（基本種の情報。栽培品種'Kaizuka'自体はPOWOに独立分類群として収録されていない）\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:30044367-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Russian Far East to N. Myanmar and Temp. E. Asia.\\\" Native to: China North-Central, China South-Central, China Southeast, Inner Mongolia, Japan, Khabarovsk, Korea, Kuril Is., Manchuria, Myanmar, Primorye, Sakhalin, Taiwan.\"},\"reliabilityNote\":\"POWOは栽培品種（cultivar）を独立の分類群として扱わないため、上記は基本種Juniperus chinensisの自然分布であり、'Kaizuka'という特定の栽培品種そのものの分布情報ではない点に注意。\"},\"japanDistribution\":{\"summary\":\"カイヅカイブキは日本で極めて広く植栽される栽培品種で、公園・庭園・生垣・道路の緑化樹（街路樹）などに用いられる。由来については、基本種イブキ（ビャクシン）から選抜されたとする説と、匍匐性のミヤマビャクシンから選抜されたとする説の両方があり、確定していない。基本種のイブキ自体は日本に自生するが、カイヅカイブキはあくまで挿し木等で増殖される栽培品種であり、日本国内で野生状態のカイヅカイブキが確認された記録はない。\",\"status\":\"植栽のみ（栽培品種であり自生の記録なし。基本種イブキ自体は日本に自生する）\",\"habitat\":\"公園・庭園・生垣、道路の緑化帯（街路樹）など人工的に管理された環境に広く植栽される。昭和期には洋風庭園の雰囲気に合うことや枝葉が密生し目隠し効果が高いことから庭木・生垣として特に盛んに使われ、また大気汚染や強い剪定に耐える性質から高速道路脇の緑化にも用いられてきた。基本種イブキ（ビャクシン）は海岸の岩場など厳しい環境に自生するが、カイヅカイブキ自体は挿し木で殖やされる栽培品種であり、野生の生育地は持たない。\",\"source\":{\"name\":\"Wikipedia日本語版「カイヅカイブキ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AB%E3%82%A4%E3%83%85%E3%82%AB%E3%82%A4%E3%83%96%E3%82%AD\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaを情報源としており、由来（選抜元の種）や名称由来について複数説が併記され確定していない旨も本文に明記されている。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：カイヅカイブキとしての記録なし（栽培品種のため対象外／基本種イブキ自体は別途記録あり）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文をPDFで確認したところ、「Juniperus chinensis L. イブキ」の項目が実在し、赤穂市生島、家島町上島、淡路町大和島、一宮町明神崎の4産地が記録されている。これらはいずれも瀬戸内海沿岸・島嶼部の岩礁地帯であり、イブキが海岸の岩場に自生する性質と整合することから、この記録は基本種（野生のイブキ）についてのものと判断される。一方、「カイヅカイブキ」「Kaizuka」の語は本文中に一度も登場せず、この栽培品種としての記録は存在しない。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF内容確認はAIによる要約であり、逐語的な全文検索を保証するものではない。目録記載の「イブキ」の標本が基本種の野生型であってカイヅカイブキ等の栽培品種でないことは、産地が海岸岩場である状況証拠からの推定である。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じイブキ（ビャクシン）の基本種や匍匐性品種、また生垣・庭園でよく使われる他のヒノキ科樹木（特にコノテガシワ）と、非専門家には「濃い緑色の円錐形の生垣樹」として混同されやすい。\",\"items\":[{\"name\":\"イブキ（ビャクシン、基本種）\",\"sciName\":\"Juniperus chinensis\",\"distinguishingPoints\":\"カイヅカイブキは基本種イブキから選抜された栽培品種で、側枝が螺旋状にねじれながら立ち上がり、枝先が炎（火炎）状に渦を巻く独特の樹形になるのが最大の識別点。葉も基本種に比べて幅が広く色が濃い緑。基本種イブキはこのようなねじれを持たず、自然な円錐形〜広がった樹形になり、海岸の岩場など自生地では地を這うように広がる個体も多い。\"},{\"name\":\"ミヤマビャクシン・ハイビャクシン等の匍匐性品種\",\"sciName\":\"Juniperus chinensis var. procumbens など\",\"distinguishingPoints\":\"カイヅカイブキは直立して高木状（樹高10m前後）に育つのに対し、ミヤマビャクシンやハイビャクシンは地面を這うように横に広がる匍匐性の低木で、ほとんど高くならない点で容易に区別できる。\"},{\"name\":\"コノテガシワ\",\"sciName\":\"Platycladus orientalis\",\"distinguishingPoints\":\"どちらも濃緑色で生垣・庭園に使われる直立形の針葉樹だが、葉のつき方が全く異なる。カイヅカイブキは鱗片状の葉をつけた細い小枝がねじれて縄状（渦巻き状）の房になり、枝の断面は丸みを帯びる。一方コノテガシワは扁平な葉状の小枝が団扇（うちわ）のように平らに並び、それが地面に対して垂直（縦向き）に立ち並ぶため、枝先の断面が薄い板状になる。この「縄状にねじれた丸い枝」か「垂直に立つ平らな板状の枝」かで見分けられる。\"}],\"source\":{\"name\":\"庭木図鑑 植木ペディア「カイヅカイブキ（貝塚息吹）」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%AB%E3%82%A4%E3%83%85%E3%82%AB%E3%82%A4%E3%83%96%E3%82%AD/\",\"type\":\"secondary\"},\"reliabilityNote\":\"植木ペディアは造園・園芸業界でよく参照される図鑑サイトだが査読を経た学術一次資料ではない。カイヅカイブキとイブキ基本種・匍匐性品種の由来（選抜元）については諸説あり確定していない点に留意。\"}},{\"id\":\"platycladus-orientalis\",\"nameJa\":\"コノテガシワ\",\"nameJaAlt\":[],\"sciName\":\"Platycladus orientalis (L.) Franco\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"コノテガシワ\",\"このてがしわ\",\"児の手柏\",\"platycladus\",\"Platycladus orientalis\",\"Thuja orientalis\",\"Biota orientalis\"],\"worldDistribution\":{\"summary\":\"中国原産の常緑針葉樹。POWOでは自生域として極東ロシア（アムール地方）から中国中東部・朝鮮半島にかけての範囲が記録されている。日本語資料では、より限定的に中国北部〜中西部を原産地とする説明が一般的で、古くから自生地以外にも盛んに植栽されてきたため、現在では自生地と植栽起源の集団との区別が明確でない地域が多いとされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Platycladus orientalis (L.) Franco\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:677124-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Russian Far East to E. Central China and Korea.\\\" Native to: Amur, China North-Central, China Southeast, Khabarovsk, Korea.\"},\"reliabilityNote\":\"POWOの自生域（極東ロシア・朝鮮半島を含む）は、日本語資料で言われる中国北部原産説よりやや広く、これは長期にわたる植栽の歴史により自生・植栽起源の区別が曖昧になっていることを反映していると考えられる。\"},\"japanDistribution\":{\"summary\":\"コノテガシワは日本には自生せず、すべて中国からの導入・栽培による。日本語版Wikipediaによれば元文年間（1736〜1741年）に渡来したとされる。以後、街路・公園・庭園・人家の生垣などに植栽され、特有の扁平で直立する葉状の小枝から古くより寺院・墓地にも好んで植えられてきた。日本国内で野生化・自生化した記録はなく、確認できるのはすべて植栽由来の個体である。\",\"status\":\"植栽のみ（自生・野生化の記録なし、江戸時代に渡来）\",\"habitat\":\"原産地の中国北部（河北省・山西省・陝西省など）では乾燥に強く、丘陵地や岩の多い土地にも生育するとされ、樹齢千年を超える大木が道教寺院や北京の公園などに残る例もある。日本では街路・公園・庭園・人家の生垣、鉢植えなど観賞用に広く植栽され、扁平で直立する特徴的な葉状の小枝から縁起の良い樹とされて、特に寺院や墓地に好んで植えられてきた。\",\"source\":{\"name\":\"Wikipedia日本語版「コノテガシワ」\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%B3%E3%83%8E%E3%83%86%E3%82%AC%E3%82%B7%E3%83%AF\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本語版Wikipediaを情報源としており、渡来年代（元文年間）等の細部は一次資料での裏付けが望ましいが、「日本に自生はなく全て植栽由来」という大枠は複数の樹木図鑑類でも一致しており信頼性は高いと考えられる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文をPDFで確認したところ、「コノテガシワ」「Platycladus orientalis」「Thuja orientalis」のいずれの語も一度も登場しない。同巻凡例に「明らかに栽培植物と思われる標本は除外した」とあり、コノテガシワは寺院・墓地・庭園等に植栽される典型的な栽培樹木で野生化の報告もないことから、そもそも採録対象になり得なかったと考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF内容確認はAIによる要約であり、逐語的な全文検索を保証するものではないため、「記載がない＝記録なし」という結論は消去法的な確認にとどまる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"葉状の小枝が地面に対して垂直な扁平面をつくる樹形はヒノキ科の中でもかなり特徴的で見分けやすいが、遠目や生垣に仕立てられた状態ではヒノキ・サワラなど他のヒノキ科樹木や、同じく生垣によく使われるカイヅカイブキと混同されることがある。\",\"items\":[{\"name\":\"ヒノキ・サワラ\",\"sciName\":\"Chamaecyparis obtusa / Chamaecyparis pisifera\",\"distinguishingPoints\":\"ヒノキ・サワラはいずれも葉状の小枝が水平方向に扁平に広がり、枝垂れるように茂るのに対し、コノテガシワは葉状の小枝が地面に対して垂直に立ち上がり、団扇（うちわ）状の面が真横（左右）を向く点で樹形の向きが根本的に異なる。またヒノキは葉の裏の気孔帯（白い模様）がY字形、サワラはX字形（蝶形）になるのに対し、コノテガシワは葉の表裏がほとんど区別できず鱗片状の葉に目立った白い気孔帯が見えにくい点でも区別できる。\"},{\"name\":\"カイヅカイブキ\",\"sciName\":\"Juniperus chinensis 'Kaizuka'\",\"distinguishingPoints\":\"どちらも生垣や庭園でよく使われる濃緑色の直立形針葉樹だが、コノテガシワは扁平な葉状の小枝が垂直な板状に並ぶのに対し、カイヅカイブキは鱗片状の葉をつけた細い小枝がねじれて縄状・渦巻き状の房になる点で見分けられる。\"}],\"source\":{\"name\":\"庭木図鑑 植木ペディア「コノテガシワ」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%B3%E3%83%8E%E3%83%86%E3%82%AC%E3%82%B7%E3%83%AF/\",\"type\":\"secondary\"},\"reliabilityNote\":\"ヒノキ・サワラの気孔帯形状（Y字・X字）は樹木観察の定番の識別点として複数の樹木図鑑で一致しているが、コノテガシワとの直接比較についてはこのページに詳細な記述はなく、一般的な樹木学的知見を踏まえて補足した。\"}},{\"id\":\"podocarpus-macrophyllus\",\"nameJa\":\"イヌマキ\",\"nameJaAlt\":[],\"sciName\":\"Podocarpus macrophyllus (Thunb.) Sweet\",\"family\":\"マキ科 Podocarpaceae\",\"searchTerms\":[\"イヌマキ\",\"いぬまき\",\"犬槇\",\"Podocarpus macrophyllus\",\"マキ\"],\"worldDistribution\":{\"summary\":\"確実な自生地は中国南部からミャンマー北部、台湾、日本にかけての暖温帯〜亜熱帯域とされる。北米南部・ハワイ・英国・韓国・プエルトリコなどにも観賞用として導入・帰化している。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Podocarpus macrophyllus (Thunb.) Sweet\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263522-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. China to N. Myanmar, Taiwan, Japan.\\\" Native to: China South-Central, China Southeast, Japan, Myanmar, Taiwan. Introduced into: Alabama, Arkansas, Great Britain, Hawaii, Korea, Leeward Is., Puerto Rico.\"}},\"japanDistribution\":{\"summary\":\"本州（房総半島以西）、四国、九州、南西諸島の海岸沿いの山地に自生し、暖地の照葉樹林（常緑広葉樹林）の構成種となる。潮風に強く耐陰性も高い。一方で生け垣・庭園木として古くから全国的に広く植栽され、自生範囲よりはるかに広い地域（寒冷地を含む）で栽培されている。\",\"habitat\":\"海岸に近い山地の照葉樹林（暖地性常緑広葉樹林）に自生し、潮風への耐性が高く、耐陰性も高いため日向から日陰まで幅広い光環境に適応できる。栽培下では水はけの良い、適度に湿った肥沃地を好み、日当たりが良いほど生育は旺盛になる。生垣・防風林・防火樹・防潮樹として海岸部の住宅地や集落周辺にも広く植栽され、房総半島や遠州地方では特に生け垣栽培が盛んである。\",\"status\":\"自生（本州西部〜南西諸島）＋植栽（全国的に広く利用）\",\"source\":{\"name\":\"Wikipedia日本語版「イヌマキ」\",\"url\":\"https://ja.wikipedia.org/wiki/イヌマキ\",\"type\":\"secondary\"},\"reliabilityNote\":\"百科事典的な二次資料であり、自生範囲の詳細はYList等の一次資料による確認が望ましい。本種はYList上で生態欄が空欄（＝自生種）として扱われているが、庭木・生け垣として極めて普及しているため、個々の個体・標本が自生か植栽由来かの判別は難しい場合がある。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり\",\"detail\":\"兵庫県産維管束植物 第2巻のマキ科の項に「Podocarpus macrophyllus (Thunb.) D.Don イヌマキ」として1種のみ掲載され、原文は「西区太山寺T.K.10033(SHO); 洲本市三熊山N.K. et al. 2631 (SHO); 南淡町沼島T.K. 7259 (SHO)。」と記されている。これに基づき、標本記録は計3件（神戸市西区太山寺、洲本市三熊山、南淡町沼島＝現・南あわじ市）である。マキ科の項自体がPodocarpus macrophyllus 1種のみで構成されており、複数回にわたりPDF全文（マキ科の項および「イヌマキ」「Podocarpus macrophyllus」の全文検索）を再確認し、「これ以外にまだ記載されている産地があれば、一件も省略せずすべて列挙してください」と明示的に尋ねる追加確認も行ったが、いずれも同じ3件のみが返され、追加の産地は見つからなかった。標本地はいずれも神戸市沿岸部や淡路島の温暖な立地であり、本種の自生に適した暖地の分布傾向と符合する。目録凡例では明らかな栽培品と判断される標本は除外されているため、これらは自生ないし野生化個体として記録されたものと考えられるが、標本ごとの自生／植栽の最終的な判定根拠は原本文を直接参照する必要がある。\",\"volume\":2,\"page\":null,\"localities\":[\"西区太山寺（神戸市） T.K.10033 (SHO)\",\"洲本市三熊山 N.K. et al. 2631 (SHO)\",\"南淡町沼島（現・南あわじ市） T.K. 7259 (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"PDF取得ツールを用い、(1)マキ科の項の直接抽出、(2)全3件の産地について「西区太山寺／洲本市三熊山／南淡町沼島」以外に記載がないかを明示的に問う追加確認、(3)文書全体を対象とした「イヌマキ」「Podocarpus macrophyllus」の全文検索、の計3種のクエリで独立に再検証し、いずれも同一の3件（西区太山寺、洲本市三熊山、南淡町沼島）のみが返された。これにより、マキ科＝イヌマキ1種のみを収録するこの目録において、産地記録がこの3件で全てである可能性は高いと判断する。ただし、PDF取得ツールはテキストを要約・言い換えする性質があるため、OCR不良や表記ゆれによる見落としが皆無であるとは断言できず、正確なページ番号や原文の改行・体裁は原本PDFで直接確認することが望ましい。また、原文の命名者表記はD.Don、現行のPOWO等ではSweetとする場合が多く、資料間で異なる点に留意。なお原文では「西区太山寺」のように区名のみで記載されており、神戸市西区・北区・灘区などはいずれも神戸市所属のため「（神戸市）」を注記として補った。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"最もまぎらわしいのは同種の栽培品種であるラカンマキで、葉の幅・長さと株全体の大きさで見分ける。\",\"items\":[{\"name\":\"ラカンマキ\",\"sciName\":\"Podocarpus macrophyllus var. maki\",\"distinguishingPoints\":\"イヌマキはラカンマキに比べて葉の幅が広く（幅8〜12mm程度）、葉の長さも長く、樹形も大木になる。ラカンマキは葉幅4〜6mm・長さ4〜8cmとより細く短い葉が密生し、葉が上向きに伸びる傾向があり、株全体もより低木・コンパクトにまとまる。\"}],\"source\":{\"name\":\"庭木図鑑 植木ペディア「ラカンマキ（羅漢槙）」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%A9%E3%82%AB%E3%83%B3%E3%83%9E%E3%82%AD/\",\"type\":\"secondary\"},\"reliabilityNote\":\"造園・園芸系の解説サイトによる二次情報であり、葉のサイズは個体・栽培環境によって幅がある目安値として扱うのが望ましい。\"}},{\"id\":\"podocarpus-macrophyllus-var-maki\",\"nameJa\":\"ラカンマキ\",\"nameJaAlt\":[\"羅漢槇\"],\"sciName\":\"Podocarpus macrophyllus var. maki Siebold & Zucc.\",\"family\":\"マキ科 Podocarpaceae\",\"searchTerms\":[\"ラカンマキ\",\"らかんまき\",\"羅漢槇\",\"Podocarpus macrophyllus var. maki\",\"Podocarpus macrophyllus f. macrophyllus\"],\"worldDistribution\":{\"summary\":\"基本種イヌマキ（Podocarpus macrophyllus）の変種としてPOWO上でも独立の受理名を持ち、中国南部からミャンマー北部・台湾・日本中南部にかけての分布域が示されている。ただし日本国内での実態は、庭園・生け垣用に選抜・栽培されてきた矮性・狭葉タイプを指すことが多く、純粋な野生型としての分布域の線引きは曖昧である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Podocarpus macrophyllus var. maki Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:51014356-1\",\"type\":\"primary\",\"note\":\"\\\"native range... S. China to N. Myanmar, Taiwan, S. Central & S. Japan.\\\" 受理名（accepted）；Leeward Is.・プエルトリコにも導入。\"}},\"japanDistribution\":{\"summary\":\"日本語版Wikipedia「イヌマキ」によれば、イヌマキの基準標本はラカンマキ型に由来するとされ、その起源地は中国とも静岡県西部とも言われ判然としないが、「古くから庭木として栽培されてきた」とされる。葉が細く、樹高もイヌマキより低いため、庭園向けに好まれてきた。YList上では「栽」（栽培）の扱いとされ、自生記録として扱われる基本種イヌマキ（生態欄空欄＝自生種）とは区別される。\",\"habitat\":\"ラカンマキは基本種イヌマキの栽培型・矮性品種であり、野生下での自然な生育環境についての確立した記録は乏しい。日当たりが良く、水はけの良い肥沃な土壌を好み、基本種同様に潮風や大気汚染にもある程度強いとされる。刈り込みへの耐性が高いため、庭園・公園の生け垣や玉仕立て・寺社の植え込みなど、人為的に管理された植栽環境で全国的に広く利用されている。\",\"status\":\"植栽（栽培型・矮性タイプ、庭木・生け垣として全国的に流通）\",\"source\":{\"name\":\"Wikipedia日本語版「イヌマキ」\",\"url\":\"https://ja.wikipedia.org/wiki/イヌマキ\",\"type\":\"secondary\"},\"reliabilityNote\":\"ラカンマキの学名の扱いには複数の説がある（var. maki、f. macrophyllus、あるいは無学名的に「園芸品種」とする説など）。本データではYListや主要な樹木図鑑で一般的に用いられるvar. maki Siebold & Zucc.を採用したが、資料によって表記が異なる点に注意。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（イヌマキとして一括されている可能性あり）\",\"detail\":\"兵庫県産維管束植物 第2巻のマキ科の項には「Podocarpus macrophyllus (Thunb.) D.Don イヌマキ」の1種のみが掲載され、ラカンマキ／var. maki／f. macrophyllusといった変種・品種レベルでの独立記載は見当たらなかった。ラカンマキは同一種（Podocarpus macrophyllus）の栽培型・矮性型であるため、仮に県内で観察されていたとしても種レベルの「イヌマキ」記録に包含されている可能性が高い。また目録凡例では「明らかな栽培植物と思われる標本は除外した」とされており、庭木・生け垣として植栽されるラカンマキ個体はそもそも採集・収録の対象になりにくかったとも考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認である。本目録がマキ属を種（イヌマキ）単位でしか記録しない方針であった可能性があり、仮にラカンマキ型の標本が収集されていたとしても、変種名が本文からは判別できない可能性がある。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"基本種イヌマキとは同一種内の変種（栽培型）にすぎず、葉の幅・長さと樹形の大きさで見分ける。\",\"items\":[{\"name\":\"イヌマキ\",\"sciName\":\"Podocarpus macrophyllus\",\"distinguishingPoints\":\"ラカンマキはイヌマキに比べて葉が細く短い（幅4〜6mm・長さ4〜8cm程度）密生した葉を持ち、上向きに伸びる傾向があり、株もより低木状・コンパクトにまとまる。イヌマキは葉幅8〜12mm程度とより広く長く、樹形も大木になる点で区別できる。\"}],\"source\":{\"name\":\"庭木図鑑 植木ペディア「ラカンマキ（羅漢槙）」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%A9%E3%82%AB%E3%83%B3%E3%83%9E%E3%82%AD/\",\"type\":\"secondary\"},\"reliabilityNote\":\"造園・園芸系の解説サイトによる二次情報であり、葉のサイズは個体・栽培環境・剪定管理によって幅がある目安値として扱うのが望ましい。ラカンマキの学名の扱い自体にも複数説がある点に留意（japanDistributionのreliabilityNote参照）。\"}},{\"id\":\"nageia-nagi\",\"nameJa\":\"ナギ\",\"nameJaAlt\":[\"梛\"],\"sciName\":\"Nageia nagi (Thunb.) Kuntze\",\"family\":\"マキ科 Podocarpaceae\",\"searchTerms\":[\"ナギ\",\"なぎ\",\"梛\",\"Nageia nagi\",\"Podocarpus nagi\"],\"worldDistribution\":{\"summary\":\"自生地は中国南東部から海南島、日本（九州）、台湾にかけての暖温帯〜亜熱帯域とされる。朝鮮半島には導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Nageia nagi (Thunb.) Kuntze\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262544-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is SE. China to Hainan, Japan (Kyushu) to Taiwan.\\\" Native to: China Southeast, Hainan, Japan, Nansei-shoto, Taiwan. Introduced into: Korea.\"}},\"japanDistribution\":{\"summary\":\"日本語版Wikipedia「ナギ」によれば、自然分布は本州南部（式根島、紀伊半島、山口県など）、四国、九州、南西諸島の暖帯〜亜熱帯域とされ、台湾・海南島・朝鮮半島・中国南部にも及ぶ。ただし「古くから植栽されているため自然分布域外にも見られ」るとされ、伊豆や奈良県などにも植栽由来の個体がある。熊野信仰の広まりとともに神社境内（熊野三山など）にご神木として植えられ、各地に広がった歴史を持つ。兵庫県はこの記述上の自然分布域（紀伊半島・山口県・四国・九州・南西諸島）には明示的に含まれておらず、自然分布のやや外側に位置すると考えられる。\",\"habitat\":\"本州南部から南西諸島にかけての暖温帯〜亜熱帯域の常緑広葉樹林（照葉樹林）に生育し、肥沃で深い土壌を好む。海岸沿いの照葉樹林に見られるほか、内陸のやや標高のある社寺林にも点在する。寒さに弱く、自然分布域より寒冷な地域（関東地方など）に植栽する場合は若木に防寒対策が必要とされる。熊野信仰との関わりから神社境内のご神木として古くから植栽されてきた歴史があり、自然分布域外にも社寺林の形で点々と広がっている。\",\"status\":\"自生（本州南部〜南西諸島が中心）＋社寺等への植栽例あり（全国的、自然分布域外にも点在）\",\"source\":{\"name\":\"Wikipedia日本語版「ナギ」\",\"url\":\"https://ja.wikipedia.org/wiki/ナギ\",\"type\":\"secondary\"},\"reliabilityNote\":\"百科事典的な二次資料であり、兵庫県が自然分布域に含まれるか否かの断定は一次資料（YList、兵庫県目録等）による確認が必要。YList上では生態欄が空欄（＝自生種）とされているが、これは種全体としての扱いであり、兵庫県内における自生の有無を直接示すものではない。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし\",\"detail\":\"兵庫県産維管束植物 第2巻の本文（マキ科からブナ科まで収録範囲を確認）を検索したところ、「ナギ」「Nageia」「Podocarpus nagi」のいずれの語も一度も登場しない。マキ科の項にはPodocarpus macrophyllus（イヌマキ）1種のみが掲載されている。ナギの自然分布は紀伊半島・山口県・四国・九州・南西諸島が中心とされ兵庫県はその範囲にやや含まれない可能性があり、また社寺植栽由来の個体であっても目録凡例により明らかな栽培品は除外対象となるため、兵庫県内で自生・植栽いずれの形でも標本が採集・記録されなかった（あるいは記録されたが除外された）と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、PDF自動要約ツールによる検索のため、OCR不良や表記ゆれ（旧字体・異表記等）により本文中の記載を見落としている可能性がゼロではない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"ナギは針葉樹（裸子植物）でありながら葉が幅広い卵形で中脈がなく、一見すると広葉樹（被子植物）の常緑樹のように見えるため、現場での識別では『そもそも針葉樹だと気づかれない』ことが最大の落とし穴であり、モチノキなど無関係な広葉樹と混同されやすい。同じマキ科のイヌマキとは葉の形が大きく異なり、見た目で混同することはまずない。\",\"items\":[{\"name\":\"モチノキ\",\"sciName\":\"Ilex integra\",\"distinguishingPoints\":\"モチノキはナギと同様に光沢のある全縁の楕円形の葉を持つ常緑広葉樹（被子植物）で、遠目・葉一枚だけでは似た印象を与える。しかしモチノキの葉は中央に1本の主脈（中肋）とそこから分岐する側脈を持つ典型的な網状脈であるのに対し、ナギの葉は中央脈を欠き、基部で分かれて先端に向かって収束する多数の平行な縦脈（20〜30本前後）を持つ点で明確に区別できる。実際に神社境内などではナギの代用としてモチノキが植えられている例もあり、名称・由緒だけで判断せず葉脈で確認する必要がある。\"},{\"name\":\"イヌマキ\",\"sciName\":\"Podocarpus macrophyllus\",\"distinguishingPoints\":\"同じマキ科の近縁種だが、イヌマキの葉は幅数mm程度の線形（細長い針葉樹らしい形）で中脈がはっきりしており、ナギの幅広い卵形〜長楕円状披針形（幅1〜3cm）の葉とは形状が大きく異なるため、葉を見れば容易に区別できる。\"}],\"source\":{\"name\":\"Wikipedia日本語版「ナギ」\",\"url\":\"https://ja.wikipedia.org/wiki/ナギ\",\"type\":\"secondary\"},\"reliabilityNote\":\"百科事典的な二次資料。ナギの葉脈が中央脈を欠き平行脈状である点は複数の樹木図鑑サイトでも共通して記載されているが、モチノキとの誤認事例の一般性については更なる一次資料での裏付けが望ましい。\"}},{\"id\":\"pinus-densiflora\",\"nameJa\":\"アカマツ\",\"nameJaAlt\":[\"メマツ\"],\"sciName\":\"Pinus densiflora Siebold et Zucc.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"アカマツ\",\"あかまつ\",\"赤松\",\"メマツ\",\"pine\",\"red pine\",\"pinus densiflora\",\"Pinus densiflora\"],\"worldDistribution\":{\"summary\":\"自生地はロシア極東南部（沿海地方）から朝鮮半島を経て、日本の中部・南部に至る地域とされる。中国北部・中北部には人為的に導入（栽培）されている。日本産のマツ属の中では最も分布域が広い種。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pinus densiflora Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262894-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Russian Far East to Korea and Central & S. Japan.\\\" 中国北中部への導入についても記載あり。\"}},\"japanDistribution\":{\"summary\":\"日本産マツ属で最も広い範囲に分布し、本州・四国・九州に自生する（北海道南部を自生の北限とする説もある）。尾根沿いや岩場などの貧栄養で乾いた立地に多く、酸性土壌を好む一方、多雪地には弱い。\",\"status\":\"自生（在来種）\",\"habitat\":\"尾根沿いや岩場など、他の植物が生育しにくい貧栄養で乾燥した立地によく分布し、石灰岩・蛇紋岩・花崗岩（真砂土）のような植物に嫌われがちな土壌でも生育でき、しばしば優占種となる。典型的な陽樹で日当たりを強く好むため、林冠が閉じた暗い環境では更新しにくい。多雪には弱く、積雪が吹き溜まる場所では実生が定着できないため、比較的雪の少ない尾根上に多く出現する一方、三陸海岸など一部地域では海岸付近まで分布することもあり、必ずしも内陸限定の種ではない。\",\"source\":{\"name\":\"アカマツ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/アカマツ\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本国内での分布傾向の記述はWikipedia（二次資料）に基づく。より一次資料に近い情報としてはYList等での確認が望ましい。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内全域に自生記録多数）\",\"detail\":\"兵庫県産維管束植物 第2巻の「Pinus densiflora Sieb. et Zucc. アカマツ」の項には、標本引用に基づく産地記録が計15件掲載されている（但馬：浜坂町奥諸寄、城崎町大師山、出石町西床尾山、但東町郷路岳、大屋町加保坂／播磨：家島町西島、姫路市山田町、三木市細川町／丹波：氷上町香良／摂津：三田市天神、北区丹生山、東灘区保久良神社／淡路：洲本市池内、緑町感応寺山、南淡町福良）。それぞれ採集者名・標本番号（HYO/SHO）付きで記載されており、但馬・丹波・播磨・摂津・淡路の全域にわたって記録される、県内に広く普通に自生する種として扱われている。\",\"volume\":2,\"page\":null,\"localities\":[\"浜坂町奥諸寄（採集: H.Nakazawa 1464, SHO）\",\"城崎町大師山（採集: T.Fujii 7513, HYO）\",\"出石町西床尾山（採集: N.F. 13294, SHO）\",\"但東町郷路岳（採集: M.Y. 28109, SHO）\",\"大屋町加保坂（採集: N.F. et al. 6445, SHO）\",\"家島町西島（採集: Y.Fujimoto et al. 8, SHO）\",\"姫路市山田町（採集: T.Yoshizawa 20507, SHO）\",\"三木市細川町（採集: N.F. 8573, SHO）\",\"氷上町香良（採集: N.F. 8780, SHO）\",\"三田市天神（採集: T.Fujii 3719, HYO）\",\"北区丹生山（採集: S.Aochi 38, SHO）\",\"東灘区保久良神社（採集: T.Shimizu, SHO）\",\"洲本市池内（採集: T.K. 14296, SHO）\",\"緑町感応寺山（採集: T.K. 16976, SHO）\",\"南淡町福良（採集: T.Fujii 9357, HYO）\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"PDF取得ツール（本文を要約・言い換えて返す仕様）に対し、独立した4回の問い合わせ（初回抽出、追加分の有無確認、件数の数え直し、地名のみの再列挙）をすべて別々の文面で行い、いずれも同一の15件・同一の地名リストが返された。これにより一定の再現性は確認できたが、ツールが原文を逐語的に引用することを拒否する仕様のため、原文との一字一句の突合はできておらず、ページ番号も未確認。特に読み取りにくい旧地名・くずれた表記（「西床尾山」「郷路岳」等）や、万一ツールが見落とした産地が残っている可能性は否定できない。原本（現物のPDFまたは冊子体）での目視確認を推奨する。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じマツ科マツ属で2針葉（二葉松）のクロマツ、および両種の自然雑種アイグロマツと特に混同されやすい、日本の樹木識別における代表的な紛らわしいペア。\",\"items\":[{\"name\":\"クロマツ\",\"sciName\":\"Pinus thunbergii Parl.\",\"distinguishingPoints\":\"樹皮はアカマツが赤みを帯びた橙褐色〜赤褐色（特に樹冠に近い上部の樹皮で赤みが際立つ）であるのに対し、クロマツは黒灰色〜暗褐色で、ひび割れが深く鋭くゴツゴツした印象を与える。針葉はアカマツの方が細く柔らかくやや青みがかった緑色で、手で触っても痛くない（長さは7〜12cm程度とクロマツよりやや短い）のに対し、クロマツの針葉は太く硬く先端が鋭く触るとチクチク痛む。最も確実とされる識別点は冬芽（新芽）の色で、アカマツは赤褐色、クロマツは白色〜灰白色を呈する。球果もアカマツの方が小さい（4cm前後、クロマツは7cm前後）。生育立地はアカマツが内陸の尾根・岩場に多く、クロマツは海岸の砂地に多い傾向があるが、植栽由来の個体も多いため立地だけでは判断できない。\"},{\"name\":\"アイグロマツ\",\"sciName\":\"Pinus × densithunbergii Uyeki\",\"distinguishingPoints\":\"アカマツとクロマツの自然雑種で、樹皮の色・針葉の硬さや太さ・冬芽の色などあらゆる形質が両種の中間的な性質を示すため、典型的なアカマツの特徴と部分的に重なり、野外での確実な識別が難しい個体が多い。特にアカマツ林とクロマツ林が接する移行帯（海岸から内陸へ向かう丘陵地など）に生じた個体は、樹皮だけ・葉だけといった単一の形質では判別できないことがある点に注意。\"}],\"source\":{\"name\":\"アカマツとクロマツの見分け方5つのポイント｜自然植物図鑑\",\"url\":\"https://rs-hamada.net/?p=645\",\"type\":\"secondary\"},\"reliabilityNote\":\"冬芽の色による識別は複数の一般向け樹木図鑑サイト（本サイトのほか植木ペディア等）で共通して「最も確実な識別点」として挙げられているが、いずれも二次資料に基づく記述であり、学術的な一次資料での裏付けは未確認。アイグロマツのような中間的個体では形質が連続的であるため、これらの識別点だけでは判別できない場合がある。\"}},{\"id\":\"pinus-thunbergii\",\"nameJa\":\"クロマツ\",\"nameJaAlt\":[\"オマツ\"],\"sciName\":\"Pinus thunbergii Parl.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"クロマツ\",\"くろまつ\",\"黒松\",\"オマツ\",\"black pine\",\"pinus thunbergii\",\"Pinus thunbergii\"],\"worldDistribution\":{\"summary\":\"自生地は朝鮮半島南部（島嶼部）から日本の中部・南部にかけてとされる。アメリカ（メリーランド州・ニューヨーク州）に導入（植栽）された記録もある。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pinus thunbergii Parl.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263377-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Korea, Central & S. Japan.\\\" アメリカ北東部への導入についても記載あり。\"}},\"japanDistribution\":{\"summary\":\"本州・四国・九州に分布し、海岸に多く自生する。ただし北海道南部を含め海岸線への植栽が古くから盛んに行われてきたため、本来の自生分布と植栽由来の個体群との区別が難しい地域も多いとされる。\",\"status\":\"自生（在来種、海岸部に多いが植栽由来の個体も多い）\",\"habitat\":\"海岸に多く自生する海岸性のマツで、耐乾性・耐塩性に優れ、潮風や砂地といった内陸のマツには厳しい環境にもよく適応する。パイオニア種として海岸の裸地・砂丘にいち早く侵入・定着する性質があり、そのため古くから防風林・防潮林として海岸線に広く植栽されてきた。この植栽の歴史が長いため、現在見られる個体群のうち本来の自生由来のものと植栽由来のものとを区別することが難しい地域も多い。\",\"source\":{\"name\":\"クロマツ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/クロマツ\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本国内での分布・自生植栽の区別についてはWikipedia（二次資料）の記述に基づく。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（瀬戸内海・淡路島沿岸を中心に記録）\",\"detail\":\"兵庫県産維管束植物 第2巻の「Pinus thunbergii Parl. クロマツ」の項には、標本引用に基づく産地記録が計5件掲載されている（家島町黒島、明石市中八木、垂水区舞子ケ浜、西淡町慶野松原、南淡町福良）。それぞれ採集者名・標本番号（SHO）付きで記載されており、瀬戸内海沿岸部および淡路島沿岸を中心とした海岸性の種として県内沿岸部に記録されている。\",\"volume\":2,\"page\":null,\"localities\":[\"家島町黒島（採集: N.F. 13523, SHO）\",\"明石市中八木（採集: T.K. 10947, SHO）\",\"垂水区舞子ケ浜（採集: T.K. 11436, SHO）\",\"西淡町慶野松原（採集: T.K. 12448, SHO）\",\"南淡町福良（採集: N.F.& N.K. 1482, SHO）\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"PDF取得ツールに対し独立した5回の問い合わせを行った。うち4回は同一の5件・同一地名リストで一致したが、1回だけ「家島町家島 T.Shimizu (SHO)」という6件目が追加で報告された。直後の再確認問い合わせでは、この6件目は誤りで実際は5件のみであり、「家島町家島」はクロマツの項ではなく別種の記録との混同である旨が説明された。多数決および再現性の観点から5件を正式なリストとして採用したが、ツールの回答にこのような揺れが生じた事実は残るため、家島町黒島以外に家島町関連のクロマツ記録が本当に存在しないかは、原本での目視確認を推奨する。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じマツ科マツ属で2針葉（二葉松）のアカマツ、および両種の自然雑種アイグロマツと特に混同されやすい、日本の樹木識別における代表的な紛らわしいペア。\",\"items\":[{\"name\":\"アカマツ\",\"sciName\":\"Pinus densiflora Siebold et Zucc.\",\"distinguishingPoints\":\"樹皮はクロマツが黒灰色〜暗褐色で、ひび割れが深く鋭くゴツゴツした印象を与えるのに対し、アカマツは赤みを帯びた橙褐色〜赤褐色（特に樹冠に近い上部の樹皮で赤みが際立つ）。針葉はクロマツの方が太く硬く先端が鋭く触るとチクチク痛むのに対し、アカマツの針葉は細く柔らかくやや青みがかった緑色で、手で触っても痛くない（長さもクロマツよりやや短い）。最も確実とされる識別点は冬芽（新芽）の色で、クロマツは白色〜灰白色、アカマツは赤褐色を呈する。球果もクロマツの方が大きい（7cm前後、アカマツは4cm前後）。生育立地はクロマツが海岸の砂地に多く、アカマツは内陸の尾根・岩場に多い傾向があるが、クロマツは防風林・防潮林として古くから広く植栽されてきたため、立地だけで自生・植栽や種を判断するのは難しい。\"},{\"name\":\"アイグロマツ\",\"sciName\":\"Pinus × densithunbergii Uyeki\",\"distinguishingPoints\":\"アカマツとクロマツの自然雑種で、樹皮の色・針葉の硬さや太さ・冬芽の色などあらゆる形質が両種の中間的な性質を示すため、典型的なクロマツの特徴と部分的に重なり、野外での確実な識別が難しい個体が多い。特にアカマツ林とクロマツ林が接する移行帯（海岸性クロマツ林の内陸側縁辺部など）に生じた個体は、樹皮だけ・葉だけといった単一の形質では判別できないことがある点に注意。\"}],\"source\":{\"name\":\"アカマツとクロマツの見分け方5つのポイント｜自然植物図鑑\",\"url\":\"https://rs-hamada.net/?p=645\",\"type\":\"secondary\"},\"reliabilityNote\":\"冬芽の色による識別は複数の一般向け樹木図鑑サイト（本サイトのほか植木ペディア等）で共通して「最も確実な識別点」として挙げられているが、いずれも二次資料に基づく記述であり、学術的な一次資料での裏付けは未確認。アイグロマツのような中間的個体では形質が連続的であるため、これらの識別点だけでは判別できない場合がある。\"}},{\"id\":\"pinus-parviflora\",\"nameJa\":\"ヒメコマツ\",\"nameJaAlt\":[\"ゴヨウマツ\"],\"sciName\":\"Pinus parviflora Siebold et Zucc. var. parviflora\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ヒメコマツ\",\"ひめこまつ\",\"ゴヨウマツ\",\"五葉松\",\"姫子松\",\"pinus parviflora\",\"Pinus parviflora\"],\"worldDistribution\":{\"summary\":\"本変種（var. parviflora）の自生地は日本の中部・南部地域とされる（日本固有）。北海道・東北北部に分布する変種キタゴヨウ（var. pentaphylla）とは分布域が区別される。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Pinus parviflora var. parviflora\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77168877-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this variety is Central & S. Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種。本州の東北地方南東部から四国・九州にかけて分布し、標高1300〜1800m程度の山地に生育する（例外的に房総丘陵では標高120〜350mに産する）。年降水量1000〜3000mmの湿潤な酸性土壌を好む。\",\"status\":\"自生（在来種、日本固有）\",\"habitat\":\"本州・四国・九州の標高1300〜1800m程度の亜高山帯寄りの山地に自生し（例外的に房総丘陵では標高120〜350mという低標高に産する）、年間降水量1000〜3000mmの温帯気候下、湿潤なポドゾル質の土壌を好む。近縁のキタゴヨウ（北海道・東北に分布する変種）は岩の多い急斜面や尾根に自生する傾向があり、カラマツやナナカマドなど他の樹種と混生する針葉樹林帯に見られる。\",\"source\":{\"name\":\"ゴヨウマツ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/ゴヨウマツ\",\"type\":\"secondary\"},\"reliabilityNote\":\"日本国内での標高分布等の詳細はWikipedia（二次資料）の記述に基づく。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内山地に点在）\",\"detail\":\"兵庫県産維管束植物 第2巻の「Pinus parviflora Sieb. et Zucc. ゴヨウマツ」の項には、標本引用に基づく産地記録が計4件掲載されている（香住町三川山、夢前町雪彦山、山南町篠ケ峰、三田市羽束山）。それぞれ採集者名・標本番号（HYO・SHO）付きで記載されており、県内では但馬・播磨・丹波・摂津の各地の山地に点在する種として扱われている。\",\"volume\":2,\"page\":null,\"localities\":[\"香住町三川山（採集: S.H. 7013, HYO）\",\"夢前町雪彦山（採集: T.K. 19746, SHO）\",\"山南町篠ケ峰（採集: S.H. 1263, HYO・SHO）\",\"三田市羽束山（採集: S.H. 16829, HYO・SHO）\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"PDF取得ツールに対し独立した3回の問い合わせ（初回抽出、追加分の有無確認、地名のみの再列挙）をすべて別々の文面で行い、いずれも同一の4件・同一の地名リストが返された。再現性は高く、他の2種（アカマツ・クロマツ）と比べても産地数が少なく安定していることから、完全性への確信度は比較的高い。ただし原文の逐語引用はツールの仕様上不可のため、ページ番号および表記の一字一句は未確認であり、原本での最終確認が望ましい。目録上の学名表記は「ゴヨウマツ」だが和名の主表記をどちらにするかは本文の確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"5針葉（五葉松）の仲間である同種内変種キタゴヨウや近縁種ハイマツと混同されうる一方、2針葉のアカマツ・クロマツとは針葉の本数によって容易に区別できる。\",\"items\":[{\"name\":\"キタゴヨウ\",\"sciName\":\"Pinus parviflora Siebold et Zucc. var. pentaphylla (A.Henry) Ohwi\",\"distinguishingPoints\":\"ヒメコマツ（基本変種 var. parviflora、本州中部以南〜四国・九州に分布）に対し、キタゴヨウは北海道（渡島半島）・東北地方に分布する別変種で、分布域がほぼ重ならない。キタゴヨウは岩の多い急斜面や尾根に自生し、樹高25m・幹径80cmに達するなどより大型になる傾向がある。葉や球果の形態差そのものは微妙で識別しにくいため、実際には分布域・生育標高帯によって区別されることが多い。\"},{\"name\":\"ハイマツ\",\"sciName\":\"Pinus pumila (Pall.) Regel\",\"distinguishingPoints\":\"同じ5針葉のマツ属だが、ハイマツは高山帯・森林限界付近に生育する常緑低木で、幹から不定根を出しながら地を這うように匍匐成長する点で、高木となるヒメコマツ（ゴヨウマツ）と樹形が明確に異なる。若枝には褐色の毛が密生する（ヒメコマツの若枝は毛が少ないか無毛）。球果は裂開せず種子に翼がなく、長さ3〜5cm程度とヒメコマツより小型。\"},{\"name\":\"アカマツ・クロマツ\",\"sciName\":\"Pinus densiflora / Pinus thunbergii\",\"distinguishingPoints\":\"最も基本的な識別点は葉（針葉）の本数で、ヒメコマツ（ゴヨウマツ）は短枝に5本束生する五葉松であるのに対し、アカマツ・クロマツはいずれも2本束生する二葉松であり、この一点だけで容易に区別できる。\"}],\"source\":{\"name\":\"ゴヨウマツ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/ゴヨウマツ\",\"type\":\"secondary\"},\"reliabilityNote\":\"キタゴヨウとの識別に関する記述はWikipedia（二次資料）に基づき、ハイマツとの識別点（若枝の毛・球果の形状等）は樹木図鑑サイト「ざっそう屋」（二次資料）に基づく。いずれも一般向け図鑑サイトの記述であり、より一次資料に近い情報としてはYList等での確認が望ましい。\"}},{\"id\":\"abies-firma\",\"nameJa\":\"モミ\",\"nameJaAlt\":[],\"sciName\":\"Abies firma Siebold et Zucc.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"モミ\",\"もみ\",\"樅\",\"japanese fir\",\"abies firma\",\"Abies firma\"],\"worldDistribution\":{\"summary\":\"自生地は日本の中部・南部地域とされる。朝鮮半島には人為的に導入（植栽）されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Abies firma Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:261525-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Central & S. Japan.\\\" 朝鮮半島への導入についても記載あり。\"}},\"japanDistribution\":{\"summary\":\"本州（秋田県以西）、四国、九州（屋久島まで）に分布する。分布は太平洋側に偏っており、日本海側では局所的にしか知られていない。日本に自生するモミ属の中で最も温暖な地域に分布し、暖温帯上部〜冷温帯下部の代表的な樹種の一つ。\",\"status\":\"自生（在来種）\",\"source\":{\"name\":\"モミ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/モミ\",\"type\":\"secondary\"},\"habitat\":\"ヒノキやツガと混交する森林に生育し、太平洋側に偏って分布するため日本海側では局所的にしか見られない。典型的な陰樹で、母樹近くの林冠ギャップで稚樹が更新し、実生の耐陰性が高いため小さなギャップでも更新できる。ヒノキ・ツガ混交林の中では傾斜40度を超えるような急斜面によく出現する一方、ヒノキはそうした急斜面には出現しない。根系は深根性で明瞭な直根を持ち、ヒノキと異なり小さな実生のうちから硬い土壌にも深く根を伸ばす性質がある。\",\"reliabilityNote\":\"日本国内での分布傾向・生育立地の記述はWikipedia（二次資料）に基づく。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内山地に分布）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文にモミ（Abies firma）の項があり、大河内町宮野、市島町妙高山、春日町妙高山、三田市三国岳、北区丹生山、中央区摩耶山の計6件の採集記録（産地・採集者・標本庫）が掲載されている。播磨・丹波・摂津の各地域の山地からの記録で、県内の山地に自生する種として扱われている。複数回の照合により、これ以外の追加産地は見つからなかった。\",\"volume\":2,\"page\":null,\"localities\":[\"大河内町宮野（S.H. 15602, HYO）\",\"市島町妙高山（N.F. 14159, SHO）\",\"春日町妙高山（S.H. 506, HYO）\",\"三田市三国岳（A.Takahashi 1415, HYO）\",\"北区丹生山（N.F. 9063, SHO）\",\"中央区摩耶山（T.K. 23944, HYO・SHO）\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"PDF取得ツールに対し、産地一覧の抽出を複数回（初回抽出＋2回の追加確認・本文逐語引用の再確認を含む計4回）繰り返し依頼し、いずれも同一の6件（大河内町宮野、市島町妙高山、春日町妙高山、三田市三国岳、北区丹生山、中央区摩耶山）に収束した。1回は本文をセミコロン区切りで逐語引用させ、記載順・産地数を照合した。これらの結果からリストは完全である可能性が高いと判断するが、PDF取得ツールは本文を要約・言い換えて返す仕様であり、OCR由来の誤読や見落としが完全には排除できない。正確なページ番号は目録原本での確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属で近縁のウラジロモミとの混同が最も多く、また同じマツ科針葉樹のツガ属・イチイ属とも葉だけを見ると紛らわしい。\",\"items\":[{\"name\":\"ウラジロモミ\",\"sciName\":\"Abies homolepis\",\"distinguishingPoints\":\"モミは、日当たりの良い枝の上部の葉は葉先が丸く小さく凹む程度だが、日陰の枝や若木の葉は先端が鋭く2裂して尖り触れると痛い（同じ木の中でも葉先の形にばらつきがある）。葉裏の気孔帯は白いが幅が狭く、葉裏全体は淡緑色に見える。対してウラジロモミは葉先が丸みを帯びて2裂し全体的に尖らずやわらかい（触れても痛くない）ことが多く、葉裏には白色で幅の広い気孔帯が2本目立ち、緑と白のストライプが明瞭でモミより白さが際立つ。生育標高もモミの方が低く（暖温帯〜冷温帯下部）、ウラジロモミはより高標高（冷温帯上部〜亜高山帯下部）を好む点も参考になる。\"},{\"name\":\"ツガ\",\"sciName\":\"Tsuga sieboldii\",\"distinguishingPoints\":\"同じマツ科で混生することもあるが、ツガは葉先がわずかに凹む程度でモミほど葉が硬く尖らず、葉の大きさも同じ小枝の中で不揃い（大小の葉が交互）である。決定的な違いは球果で、モミ属（モミ）は球果が枝上に上向きに直立してつき、成熟すると鱗片がばらばらに落ちて軸だけが枝に残るのに対し、ツガ属（ツガ）の球果は小さく下向き・垂れ下がってつき、鱗片が離れずに果実状のまま丸ごと落下する。この球果の向きと落ち方の違いは、モミ属・ツガ属・イチイ属など紛らわしい針葉樹を見分ける際の最も確実な手がかりになる。\"}],\"source\":{\"name\":\"モミ Abies firma マツ科 Pinaceae モミ属 三河の植物観察／ウラジロモミ（裏白樅） 庭木図鑑 植木ペディア／モミ属 - Wikipedia\",\"url\":\"https://mikawanoyasou.org/data/momi.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"植物観察サイト・図鑑サイト等の二次資料（三河の植物観察 https://mikawanoyasou.org/data/momi.htm 、庭木図鑑 植木ペディア「ウラジロモミ」 https://www.uekipedia.jp/常緑針葉樹/ウラジロモミ/ 、Wikipedia「モミ属」 https://ja.wikipedia.org/wiki/モミ属 ）に基づく一般的な識別点であり、個体差・地域差がある可能性がある。\"}},{\"id\":\"tsuga-sieboldii\",\"nameJa\":\"ツガ\",\"nameJaAlt\":[\"トガ\"],\"sciName\":\"Tsuga sieboldii Carrière\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ツガ\",\"つが\",\"栂\",\"トガ\",\"japanese hemlock\",\"tsuga sieboldii\",\"Tsuga sieboldii\"],\"worldDistribution\":{\"summary\":\"自生地は日本の中南部地域とされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Tsuga sieboldii Carrière\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:264018-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Central & S. Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"本州中部（福島県以西）、四国、九州、屋久島に分布する。暖帯林（照葉樹林）から温帯林（落葉広葉樹林）にかけて生育し、モミが山腹に多いのに対し、ツガは標高約1500m以上の尾根筋に多く生える傾向がある。分布域内では普通種で、優占林を形成することもある。\",\"status\":\"自生（在来種）\",\"source\":{\"name\":\"ツガ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/ツガ\",\"type\":\"secondary\"},\"habitat\":\"暖帯林（照葉樹林）から温帯林（落葉広葉樹林）にかけて生育し、分布域内では比較的普通に見られる樹種である。モミが山腹に多いのに対し、ツガは標高約1500m以上の尾根筋によく生える傾向があり、両種の生育立地は住み分けている。モミと混生することがあるほか、一部地域ではトガサワラとも混生する。\",\"reliabilityNote\":\"日本国内での分布・生育立地の記述はWikipedia（二次資料）に基づく。土壌・日照条件についての具体的記述は同記事になく未確認。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（県内山地の尾根筋に分布）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文にツガ（Tsuga sieboldii）の項があり、夢前町雪彦山、福崎町七種滝、姫路市広嶺山、加美町金蔵山、市島町愛宕山、西紀町西ヶ嶽、篠山町小金嶽、三田市母子、西区伊川谷町、北区帝釈山、洲本市鮎屋ノ滝の計11件の採集記録（産地・採集者・標本庫）が掲載されている。播磨・丹波・摂津・淡路の広範囲の山地からの記録で、県内の山地尾根部に自生する種として扱われている。複数回の照合により、これ以外の追加産地は見つからなかった。\",\"volume\":2,\"page\":null,\"localities\":[\"夢前町雪彦山（T.Yoshizawa 18969, HYO・SHO）\",\"福崎町七種滝（M.H. 10272, SHO）\",\"姫路市広嶺山（N.K. 17007, HYO・SHO）\",\"加美町金蔵山（S.H. 13993, HYO）\",\"市島町愛宕山（S.H. 860, HYO）\",\"西紀町西ヶ嶽（T.K. 31747, SHO）\",\"篠山町小金嶽（T.K. 26284, HYO）\",\"三田市母子（A.Takahashi 1806, HYO）\",\"西区伊川谷町（T.K. 10974, SHO）\",\"北区帝釈山（T.Shimizu, SHO）\",\"洲本市鮎屋ノ滝（T.K. 14573, HYO・SHO）\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"PDF取得ツールに対し、産地一覧の抽出を複数回（初回抽出＋2回の追加確認を含む計4回）繰り返し依頼した。うち1回で「市島町妙高山」が追加候補として提示されたが、種名を明示して照合し直した結果、これはモミ（Abies firma）の項の記録との混同（標本番号S.H.506の取り違え）であることが判明し、ツガの項には含まれないと確認した。それ以外の3回の照会・記載順の逐語確認では同一の11件に収束しており、リストは完全である可能性が高いと判断する。ただしPDF取得ツールは本文を要約・言い換えて返す仕様であり、OCR由来の誤読や見落としが完全には排除できない。正確なページ番号は目録原本での確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属で標高の高い場所に生えるコメツガとの混同が代表的で、また同じマツ科針葉樹のモミ属・イチイ属とも葉だけでは紛らわしい。\",\"items\":[{\"name\":\"コメツガ\",\"sciName\":\"Tsuga diversifolia\",\"distinguishingPoints\":\"ツガの葉は同じ小枝の中でも大きさが不揃いで、上向きにつく長さ約1cm弱の小さい葉と、横向きにつく長さ2cm前後の大きい葉が混在する（葉の長さはおよそ10〜20mm）。一方コメツガの葉は長さ約4mm前後と全体に小さく、大きさもほぼ均一に揃う点が最大の違いで、和名の「米栂」もこの葉の小ささに由来する。若い枝の毛の有無も補助的な手がかりで、ツガの若枝は無毛だがコメツガの若枝には短く柔らかい毛がある。分布・生育標高もツガが低山〜山地帯に多いのに対し、コメツガはより標高の高い亜高山帯に多く、両種は標高で棲み分ける傾向がある。\"},{\"name\":\"モミ\",\"sciName\":\"Abies firma\",\"distinguishingPoints\":\"モミの葉は先端が鋭く2裂して尖り触れると痛いことが多いのに対し、ツガの葉先はごくわずかに凹む程度で尖らずやわらかい。決定的な違いは球果で、モミ属（モミ）の球果は枝上に上向きに直立してつき、成熟すると鱗片がばらばらに落ちて軸だけが枝に残るのに対し、ツガ属（ツガ）の球果は小さく（長さ2〜3cm）下向きに垂れ下がってつき、鱗片が離れずに果実状のまま丸ごと落下する。この球果の向きと落ち方の違いは、モミ属とツガ属を見分ける最も確実な手がかりになる。\"}],\"source\":{\"name\":\"コメツガ Tsuga diversifolia マツ科 Pinaceae ツガ属 三河の植物観察／ツガ（栂） 庭木図鑑 植木ペディア\",\"url\":\"https://mikawanoyasou.org/data/kometuga.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"植物観察サイト・図鑑サイト等の二次資料（三河の植物観察「コメツガ」 https://mikawanoyasou.org/data/kometuga.htm 、庭木図鑑 植木ペディア「ツガ」 https://www.uekipedia.jp/常緑針葉樹/ツガ/ ）に基づく一般的な識別点であり、個体差・地域差がある可能性がある。コメツガ（Tsuga diversifolia）は兵庫県産維管束植物 第2巻での記録有無を本タスクでは確認していない。\"}},{\"id\":\"larix-kaempferi\",\"nameJa\":\"カラマツ\",\"nameJaAlt\":[\"ニホンカラマツ\",\"フジマツ\"],\"sciName\":\"Larix kaempferi (Lamb.) Carrière\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"カラマツ\",\"からまつ\",\"唐松\",\"落葉松\",\"karamatsu\",\"Larix kaempferi\",\"Larix leptolepis\"],\"worldDistribution\":{\"summary\":\"日本固有種で、確実な自生地は本州中部に限られる（POWOの原産地記載は「Central Japan」の一語のみで、他国への自生分布はない）。ヨーロッパ各国、韓国、北米東部などに造林・園芸目的で広く導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Larix kaempferi (Lamb.) Carrière\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:60457419-2\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Central Japan.\\\" 導入先としてAustria, Baltic States, Belgium, Denmark, Finland, France, Germany, Great Britain, Hungary, Ireland, Korea, Netherlands, New York, Newfoundland, Norway, Poland, Sweden, Türkiyeなどが列挙されている。\"}},\"japanDistribution\":{\"summary\":\"天然分布は本州中部の亜高山帯に限定される。北限は宮城県の蔵王山、西限は石川県・岐阜県境の白山、南限は静岡県（富士山周辺）とされ、長野県内を中心に浅間山・草津白根山・八ヶ岳・木曽山脈・赤石山脈など日本アルプス周辺、栃木県奥日光周辺に天然林がみられる、日本のほぼ中央部を分布の中心とする種。一方で成長が早く材質にも優れるため、明治期以降とりわけ北海道・東北・長野県などで大規模に造林され、天然分布域をはるかに超えて全国的に植栽されている。\",\"status\":\"自生（本州中部の亜高山帯）＋全国（特に北海道・東北・長野県）で造林・植栽\",\"habitat\":\"自生地は本州中部の亜高山帯で、火山性土壌の山地に多く生育する。日当たりを好む陽樹・先駆樹種であり、山火事跡地や崩壊地など裸地状の環境にいち早く侵入して純林（カラマツ林）を形成する性質をもつ。標高が高くなるにつれて樹高は低くなり、風衝地では矮小化してねじ曲がった樹形を示すこともある。寒冷な気候によく耐えるため、天然分布域を越えて北海道・東北など高緯度の冷涼な地域でも造林地として広く利用されている。\",\"source\":{\"name\":\"カラマツ — Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AB%E3%83%A9%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"二次資料（Wikipedia）を用いたが、天然分布が本州中部に限られるという記述はPOWOの原産地情報（Central Japan）と整合する。兵庫県（六甲山系・氷ノ山など最高峰でも標高1500m程度）は本種の天然分布域からも、造林が盛んな北海道・東北・長野県等の主要産地からも外れる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし\",\"detail\":\"兵庫県産維管束植物 第2巻の本文をWebFetchで全文検索したところ、「カラマツ」「Larix」の語は一度も登場しない。カラマツの自生域は本州中部の亜高山帯（概ね標高1000〜2500m級）に限られ、兵庫県内の最高峰（氷ノ山1510m等）はその範囲にわずかに近いものの一致せず、また造林の中心地（北海道・東北・長野県等）からも地理的に外れているため、自生・造林いずれの記録もないことは地理的にも整合する。ただし公園・庭園等で観賞用に少数植栽されている可能性までは否定できず、その場合は同目録の「明らかな栽培植物と思われる標本は除外した」という凡例により記録対象外となっていると考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"PDFのAIによる全文検索に基づく確認であり、OCR変換の精度やページ単位の照合までは保証できない。「記載がない＝記録なし」という消去法的確認である。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"カラマツは針葉樹としては珍しく秋に紅葉して落葉するため、同じく落葉する針葉樹であるメタセコイアやラクウショウと紛らわしいことがあるが、葉の付き方を見れば容易に区別できる。\",\"items\":[{\"name\":\"メタセコイア\",\"sciName\":\"Metasequoia glyptostroboides\",\"distinguishingPoints\":\"ヒノキ科（旧スギ科）の落葉針葉樹で、マツ科のカラマツとは科が異なる。葉は柔らかい線形の小葉が枝の左右に「対生」（向かい合わせ）に並び、羽根のような平らな葉群（葉状枝）をつくる。一方カラマツは長い枝には針状の葉がらせん状につき、多数の短枝（distinct spur shoot）には20〜30本ほどの葉が球状に束生（放射状のブラシ状）する点が大きく異なり、平たい羽根状の葉群にはならない。樹形も、メタセコイアは幹がまっすぐ通り円錐形に整うのに対し、カラマツは枝ぶりがやや不規則。\"},{\"name\":\"ラクウショウ（ヌマスギ）\",\"sciName\":\"Taxodium distichum\",\"distinguishingPoints\":\"同じくヒノキ科（旧スギ科）の落葉針葉樹。葉は線形の小葉が枝に「互生」（互い違い）につき、メタセコイア同様に平たい羽根状の葉群をつくるが、対生か互生かでメタセコイアと区別できる。カラマツとは、短枝に束生する針状の葉の集まり方（放射状に密集）で明確に区別でき、ラクウショウ・メタセコイアのような平たい羽根状の葉列にはならない。また湿地や水辺に生育し、気根（膝根）を出すことがある点も、山地に生えるカラマツとの生育環境の違いとして参考になる。\"}],\"source\":{\"name\":\"カラマツ／メタセコイア／ラクウショウ ― 庭木図鑑 植木ペディア、深谷市ホームページ「ラクウショウとメタセコイア」\",\"url\":\"https://www.uekipedia.jp/%E8%90%BD%E8%91%89%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%AB%E3%83%A9%E3%83%9E%E3%83%84/\",\"type\":\"secondary\"},\"reliabilityNote\":\"いずれも二次資料（造園・樹木図鑑サイト）に基づく一般的な識別ポイントであり、学術的な形態記載ではない。\"}},{\"id\":\"cedrus-deodara\",\"nameJa\":\"ヒマラヤスギ\",\"nameJaAlt\":[\"ヒマラヤ杉\"],\"sciName\":\"Cedrus deodara (Roxb. ex D.Don) G.Don\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ヒマラヤスギ\",\"ひまらやすぎ\",\"ヒマラヤ杉\",\"deodar cedar\",\"himalayan cedar\",\"Cedrus deodara\"],\"worldDistribution\":{\"summary\":\"確実な自生地は西ヒマラヤ（アフガニスタン北東部からネパール西部・インド北西部にかけて）に限られ、標高約1500〜3200mの山地に分布する。ヨーロッパに観賞用に導入されている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Cedrus deodara (Roxb. ex D.Don) G.Don\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:676701-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is NE. Afghanistan to W. Nepal and NW. India (Morni Hills).\\\" 分布域としてAfghanistan, India, Nepal, Pakistan, Tibet, West Himalayaが列挙されている。\"}},\"japanDistribution\":{\"summary\":\"日本には自生せず、明治12年（1879年）頃、横浜在住の英国人がカルカッタ経由で種子を輸入したのが最初とされる導入種。以後全国に普及し、盛岡市付近を北限として全国的に公園・学校・官公庁・団地・工場・寺社など広い敷地を確保しやすい公共の場に植栽される、代表的な観賞用針葉樹となっている。日本国内での野生化・自生の記録は確認できない。\",\"status\":\"植栽のみ（自生・野生化の記録なし）\",\"habitat\":\"原産地の西ヒマラヤ〜アフガニスタンでは標高約1500〜3200mの山地に自生し、寒冷な高地気候に適応している（耐寒性の低い個体は－25℃を下回るような厳寒地では生育が難しいとされる）。日本国内では野生化・自生は確認されておらず、盛岡市付近を北限として、それより南の各地で公園・大きな庭園・学校・官公庁・団地・工場・寺社などの広い敷地に観賞用・シンボルツリーとして植栽されるのが専らの生育環境である。\",\"source\":{\"name\":\"ヒマラヤスギ — Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%92%E3%83%9E%E3%83%A9%E3%83%A4%E3%82%B9%E3%82%AE\",\"type\":\"secondary\"},\"reliabilityNote\":\"二次資料（Wikipedia）に基づく。「世界三大公園樹」という表現は学術的な出典ではなく日本の園芸業界で広く使われる通俗的な形容であり、参考情報として付記した。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（植栽のため対象外）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文をWebFetchで全文検索したところ、「ヒマラヤスギ」「Cedrus」の語は一度も登場しない。ヒマラヤスギは西ヒマラヤ原産で日本への自生・野生化の記録が一切ない明確な栽培・植栽樹であり、同巻凡例の「明らかな栽培植物と思われる標本は除外した」という方針に該当するため、兵庫県内の学校・公園・寺社等で実際にごく普通に植栽されている木であっても目録に記録がないことは整合的である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、PDFのAIによる全文検索に基づくためOCR精度等の限界がある。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"ヒマラヤスギは「スギ」の名を持つがマツ科マツ属に近縁な針葉樹で、長い針葉と大きな樹形からマツ属の樹木と誤認されやすいが、枝先が優雅に垂れ下がる樹形と、短枝に多数の葉が球状に束生する葉の付き方によってマツ属や他のヒマラヤスギ属近縁種と見分けられる。\",\"items\":[{\"name\":\"マツ属（クロマツ・アカマツなど）\",\"sciName\":\"Pinus thunbergii / Pinus densiflora など\",\"distinguishingPoints\":\"マツ属の葉は長い針葉が2本（または3〜5本）ずつ束になって短枝につくのに対し、ヒマラヤスギは短枝１つあたり30〜50本ほどの葉が放射状の球状に密に束生し、束になる本数がはるかに多い。また樹形は、マツ属は枝が横に張るか斜め上に伸びる姿が多いのに対し、ヒマラヤスギは大枝が水平から下垂気味に伸び、特に枝先の小枝が優雅にしだれる点で全体の樹形から見分けやすい。葉色もヒマラヤスギはやや粉白を帯びた銀緑〜青緑色を示すことが多く、マツ属の緑色とは印象が異なる。\"},{\"name\":\"レバノンスギ・アトラスヒマラヤスギなどヒマラヤスギ属の近縁種\",\"sciName\":\"Cedrus libani / Cedrus atlantica\",\"distinguishingPoints\":\"同じヒマラヤスギ属で葉の束生パターンは共通するため遠目には区別しにくいが、ヒマラヤスギ（デオダラ）は枝先の小枝が明瞭に下垂するのに対し、レバノンスギやアトラスヒマラヤスギは枝先があまり垂れず水平に近い樹形を保つ点が目安になる。日本国内の植栽では圧倒的にヒマラヤスギ（デオダラ）が普通であり、他のCedrus種に出会う機会は少ない。\"}],\"source\":{\"name\":\"ヒマラヤスギ — 庭木図鑑 植木ペディア\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%92%E3%83%9E%E3%83%A9%E3%83%A4%E3%82%B9%E3%82%AE/\",\"type\":\"secondary\"},\"reliabilityNote\":\"造園・樹木図鑑サイト（二次資料）に基づく一般的な識別ポイントであり、Cedrus属近縁種との比較は日本国内での植栽事情を踏まえた参考情報である。\"}},{\"id\":\"torreya-nucifera-var-radicans\",\"nameJa\":\"チャボガヤ\",\"nameJaAlt\":[\"チャボカヤ\"],\"sciName\":\"Torreya nucifera (L.) Siebold et Zucc. var. radicans Nakai\",\"family\":\"イチイ科 Taxaceae\",\"searchTerms\":[\"チャボガヤ\",\"ちゃぼがや\",\"チャボカヤ\",\"矮鶏榧\",\"torreya nucifera var. radicans\",\"Torreya nucifera radicans\"],\"worldDistribution\":{\"summary\":\"母種カヤ（Torreya nucifera）の自然分布は日本（本州中部以南〜九州）と韓国（済州島・莞島）で、POWOではこの変種チャボガヤ（var. radicans）を独立した分類群とせず、カヤの異名（シノニム）として広義のTorreya nuciferaに含めている。日本国内の文献（YList・Wikipedia等）では、日本海側の多雪地に適応した生態型・変種として区別されており、山形県以西の日本海側多雪地を中心に、紀伊半島や四国の山地にも点在するとされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Torreya nucifera (L.) Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:263999-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Korea (Wando, Cheju-do), S. Central & S. Japan.\\\" Torreya nucifera var. radicans Nakaiは、POWO上でカヤ(T. nucifera)の異名として扱われる17件のシノニムの一つとして記載されており、独立変種としての分布ページは設けられていない。\"}},\"japanDistribution\":{\"summary\":\"日本海側の多雪地帯に適応した匍匐性の生態型で、幹の基部が地を這うように伸び、高さ約3mほどにとどまる点でカヤと区別される。山形県以西の日本海側多雪地を中心に分布し、紀伊半島や四国の山地にも隔離的に見られるとされる。\",\"status\":\"自生（日本海側多雪地の生態型・変種）\",\"habitat\":\"母種カヤの日本海側多雪地適応型で、ブナ林などの林床に見られる。積雪の重みに適応した樹形をとり、幹の下部が地を這うように伸び、樹高は約3mほどにとどまる点で直立するカヤと区別される。分布の中心は山形県以西の日本海側の多雪山地で、紀伊半島や四国の山地にも隔離的に分布する。兵庫県内の産地は北部の但馬地方（旧美方郡域など）に集中しており、日本海側多雪地という一般的な生育環境と一致する。\",\"source\":{\"name\":\"チャボガヤ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%81%E3%83%A3%E3%83%9C%E3%82%AC%E3%83%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版を情報源としており、原記載論文等の一次文献では未確認。\"},\"hyogoRecord\":{\"recorded\":true,\"statusLabel\":\"兵庫県目録：記録あり（チャボカヤとして9か所の産地）\",\"detail\":\"兵庫県産維管束植物 第2巻のカヤ属の項に、母種カヤ（Torreya nucifera）とは別に「var. radicans Nakai チャボカヤ」として変種が独立記載されている。今回の再確認により計9か所の産地が確認された。産地は温泉町霧ケ滝・村岡町山田渓谷・香住町香住・日高町阿瀬渓谷・出石町西床尾山・但東町黒見渓谷・八鹿町小佐川・朝来町奥田路・千種町天児屋で、いずれも旧美方郡・城崎郡・出石郡など但馬地方（日本海側の多雪地帯）に集中しており、チャボガヤの一般的な分布傾向（日本海側多雪地の生態型）と一致する。\",\"volume\":2,\"page\":null,\"localities\":[\"温泉町霧ケ滝 Y.Fujimoto & H.Tani. 1053 (SHO)\",\"村岡町山田渓谷 N.K.& H.Imai 584 (SHO)\",\"香住町香住 H.Kato 940220 (SHO)\",\"日高町阿瀬渓谷 H.Imai 73 (SHO)\",\"出石町西床尾山 N.F. 13272 (SHO)\",\"但東町黒見渓谷 H.Taniguchi 98278 (SHO)\",\"八鹿町小佐川 N.F. et a1. 5906 (HYO・SHO)\",\"朝来町奥田路 N.F. 14412 (SHO)\",\"千種町天児屋 T.K. 11892 (SHO)\"],\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"WebFetchによるPDF内容確認はAIによる言い換え（テキスト抽出＋要約）であり、原文の生テキストやOCR結果そのものではないため、原本での照合が望ましい。当初の要約では代表的な2産地（温泉町霧ケ滝・村岡町山田渓谷）のみが得られていたが、今回改めて全文抽出を依頼し9件を取得、さらに既出9件を提示した上で追加産地の有無を問う確認をもう1回行い、同一の9件が繰り返し得られ追加は報告されなかった。結果は2回連続で安定しており、以前の記載にあった「8か所」という産地数は誤りで、正しくは9か所である可能性が高い。ただしAI要約経由の抽出である以上、絶対的な保証はない。正確なページ番号は取得できなかったためpageはnullとした。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"母種カヤとは樹形・樹高でほぼ判別でき、イチイ・イヌガヤとの区別点は基本的にカヤと共通（葉先の痛さ・香りの有無）。\",\"items\":[{\"name\":\"カヤ\",\"sciName\":\"Torreya nucifera\",\"distinguishingPoints\":\"葉・実の基本構造は母種カヤと同じだが、チャボガヤは幹の基部が地を這うように伸びる匍匐性で樹高が約3mほどにとどまるのに対し、カヤは直立する高木（10m以上）に育つ点で区別できる。積雪の重みに適応した低い樹形が最大の識別ポイント。\"},{\"name\":\"イチイ／キャラボク\",\"sciName\":\"Taxus cuspidata（変種キャラボクを含む）\",\"distinguishingPoints\":\"葉の並び方は似るが、チャボガヤ（カヤと同じ）の葉先は鋭く尖り触ると痛いのに対し、イチイ・キャラボクの葉先は柔らかく痛くない。特にキャラボクも地を這う匍匐性のため樹形だけでは紛らわしいが、葉先を触って痛ければチャボガヤ（カヤ属）、痛くなければキャラボク（イチイ属）と判断できる。\"},{\"name\":\"イヌガヤ／ハイイヌガヤ\",\"sciName\":\"Cephalotaxus harringtonia\",\"distinguishingPoints\":\"外見が似るが、チャボガヤ（カヤと同じ）は葉先が鋭く触ると痛く、葉をちぎるとかんきつ系の香りがするのに対し、イヌガヤ類は葉先を触っても痛くなく、ちぎっても匂いがしない。\"}],\"source\":{\"name\":\"チャボガヤ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%81%E3%83%A3%E3%83%9C%E3%82%AC%E3%83%A4\",\"type\":\"secondary\"},\"reliabilityNote\":\"母種カヤとの識別点（樹高・樹形）はWikipedia「チャボガヤ」の記述に基づく。葉先の痛さ・香りの有無によるイチイ・イヌガヤとの識別は母種カヤに関する解説サイト（庭木図鑑、花や草木との出会い）の記述をチャボガヤにも適用したもので、チャボガヤ自体での直接確認ではない点に留意。\"}},{\"id\":\"juniperus-conferta\",\"nameJa\":\"ハイネズ\",\"nameJaAlt\":[],\"sciName\":\"Juniperus conferta Parl.\",\"family\":\"ヒノキ科 Cupressaceae\",\"searchTerms\":[\"ハイネズ\",\"はいねず\",\"這杜松\",\"juniperus conferta\",\"Juniperus rigida var. conferta\"],\"worldDistribution\":{\"summary\":\"POWOでは本種はJuniperus rigida var. conferta（ネズの変種）のシノニムとして扱われ、独立種としての分布ページはない。受理名Juniperus rigida var. confertaの自生範囲は樺太（サハリン）および日本とされる。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Juniperus rigida var. conferta (Parl.) Patschke\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77078637-1\",\"type\":\"primary\",\"note\":\"「Juniperus conferta Parl.」のページはJuniperus rigida var. confertaへのシノニムとしてリダイレクトされ、当該変種の自生範囲は\\\"Sakhalin\\\"および\\\"Japan\\\"とされる（Kew Backbone Distributions）。\"}},\"japanDistribution\":{\"summary\":\"海岸の砂浜に匍匐して広がる常緑針葉樹で、北海道・本州・四国・九州、および千島・樺太の海岸砂地に分布するとされる。太平洋側では房総半島・三浦半島・伊豆半島・伊豆諸島・御前崎・渥美半島・紀伊半島などの砂浜でよく知られるが、日本海側を含む本州各地の海岸砂丘にも分布するとされる。\",\"status\":\"自生（海岸砂地の匍匐性針葉樹）\",\"source\":{\"name\":\"ハイネズ Juniperus conferta ヒノキ科 Cupressaceae ビャクシン属 三河の植物観察\",\"url\":\"https://mikawanoyasou.org/data/hainezu.htm\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営の植物観察サイトを情報源としている。一次文献（POWO）ではネズの変種として統合されているため、独立種としての正確な分布境界（特に日本海側各地の詳細）は確認できていない。\",\"habitat\":\"海岸の砂浜に地を這うように広がって生育する匍匐性の常緑針葉樹で、直射日光の当たる海岸最前線の砂地環境に適応している。塩風や乾燥に強く、他の高木が育ちにくい土壌の乏しい砂丘や海岸段丘の縁などに群落を形成することが多い。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（Vol.2にJuniperus conferta/ハイネズの記載なし）\",\"detail\":\"兵庫県産維管束植物 第2巻のヒノキ科の項を確認したところ、掲載されているJuniperus属はイブキ（Juniperus chinensis）とネズ（Juniperus rigida）の2種のみで、ハイネズ（Juniperus conferta）およびその変種としての記載は見当たらなかった。兵庫県の海岸線（日本海側の但馬海岸・瀬戸内海側）はハイネズの一般的分布域（本州各地の海岸砂地）に含まれ得るが、目録には産地記録がない。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるPDF内テキスト検索はAIによる要約であるため、OCR不良等による見落としの可能性は排除できない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁のネズミサシと混同しやすいが、地を這う匍匐性の樹形が最大の識別点であり、庭木のハイビャクシンとも似るため生育環境と葉の質感を合わせて確認するとよい。\",\"items\":[{\"name\":\"ネズミサシ（ネズ）\",\"sciName\":\"Juniperus rigida Siebold et Zucc.\",\"distinguishingPoints\":\"ハイネズはネズミサシに極めて近縁で、分類上ネズミサシの変種（Juniperus rigida var. conferta）として扱われることもある。最大の違いは樹形で、ネズミサシは直立して数mの小高木になるのに対し、ハイネズは茎が立ち上がらず地面を這うように広がる匍匐性の低木である。ハイネズの球果はネズミサシよりやや大きい（8〜10mm程度、ネズミサシは6〜8mm程度）。生育地もネズミサシが内陸の乾いた尾根や松林であるのに対し、ハイネズは海岸の砂浜に限られ、生育環境そのものが有力な手がかりになる。\"},{\"name\":\"ハイビャクシン\",\"sciName\":\"Juniperus chinensis var. procumbens (Siebold ex Endl.) Miq.\",\"distinguishingPoints\":\"ハイビャクシンもハイネズと同様に地を這う匍匐性の樹形を持つため紛らわしいが、ハイビャクシンはイブキ（ビャクシン）の変種で、成木になると柔らかい鱗片状の葉が主体になる点で、生涯を通じて硬く鋭い針状葉を持つハイネズと区別できる。ハイビャクシンは海岸の砂丘・岩場に自生するほか、造園用に広く植栽される。\"}],\"source\":{\"name\":\"植木ペディア「ハイネズ」／三河の植物観察「ネズミサシ」\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%8F%E3%82%A4%E3%83%8D%E3%82%BA/\",\"type\":\"secondary\"},\"reliabilityNote\":\"植木ペディア・三河の植物観察などの造園・植物観察系サイト（二次資料）を複数参照して整理した。ハイネズがKew POWO上でネズミサシの変種のシノニムとして扱われている点は、両者の近縁性の裏付けとなる一次資料由来の情報である。\"}},{\"id\":\"pinus-densithunbergii\",\"nameJa\":\"アイグロマツ\",\"nameJaAlt\":[\"アカクロマツ\"],\"sciName\":\"Pinus × densithunbergii Uyeki\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"アイグロマツ\",\"あいぐろまつ\",\"間黒松\",\"アカクロマツ\",\"pinus densithunbergii\",\"Pinus × densithunbergii\"],\"worldDistribution\":{\"summary\":\"アカマツ（Pinus densiflora）とクロマツ（Pinus thunbergii）の間に自然に生じる雑種（ノト種）で、両種の分布が重なる地域――内陸性のアカマツ林と海岸性のクロマツ林が接する移行帯――に出現するとされる。POWOには本雑種の独立した分類群ページはなく、両親種であるPinus densiflora・Pinus thunbergiiはそれぞれ日本を含む東アジアを自生域とする独立種として掲載されている。\",\"source\":{\"name\":\"GKZ植物事典・アイグロマツ（間黒松）\",\"url\":\"https://gkzplant.sakura.ne.jp/mokuhon/syousai/agyou/a/aiguromatu.html\",\"type\":\"secondary\",\"note\":\"「アカマツは内陸部に多く自生が見られ、クロマツは沿岸部に自生が多く見られるが、この両者が混在するような場所に本種が生まれやすい」との記述がある。\"},\"reliabilityNote\":\"POWOに本雑種（nothospecies）の独立掲載がないため、世界分布は日本語の樹木図鑑サイト（二次資料）に基づく。学名（Pinus × densithunbergii Uyeki）自体はIPNI・Wikispecies等で確認できるが、Kewの分類学的backboneでは個別taxonページ化されていない。\"},\"japanDistribution\":{\"summary\":\"アカマツとクロマツの自然雑種で、西日本を中心に両種が近接して生育する海岸〜内陸移行帯に点在的に出現する。兵庫県内でも明石公園（明石市）などで個体が確認されている。庭園樹として「吉祥の木」の名目で植栽されることもあるが、本来は自然交雑によって野外に生じる個体群である。\",\"status\":\"自生（自然雑種、アカマツ×クロマツ）\",\"habitat\":\"内陸に多いアカマツ林と海岸に多いクロマツ林とが近接・混在する移行帯に生じやすいとされ、典型的には海岸から内陸へ向かう途中の丘陵地や、海岸性クロマツ林の内陸側縁辺部など、両種の生育立地が重なり合う場所に点在的に出現する。独立した固有の生育環境を持つわけではなく、両親種の生育条件（アカマツ：尾根・岩場など貧栄養で乾いた陽当たりのよい立地／クロマツ：耐塩性・耐乾性を要する海岸砂地）のいずれにも一定程度適応できる個体が生じると考えられる。\",\"source\":{\"name\":\"アイグロマツ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A2%E3%82%A4%E3%82%B0%E3%83%AD%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版は分布記述が乏しいスタブ記事で、生息環境に関する直接的な記述はない。habitatの記述はGKZ植物事典（両親種の生育立地の混在という一文）および両親種（アカマツ・クロマツ）自身の生育環境記述から推論的に補って作成したものであり、アイグロマツ自体の生育環境を直接記した一次・secondary資料は確認できていない。明石公園での確認例は写真記録サイト（BPUCPhoto）由来の二次情報であり、当該個体が自然発生か植栽由来かは明記されていない。自然雑種は形態が連続的で、自生・植栽の判別・同定自体が難しい点に留意が必要。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（Vol.2にアイグロマツ/雑種の記載なし）\",\"detail\":\"兵庫県産維管束植物 第2巻のマツ科の項を確認したところ、アカマツ（Pinus densiflora）とクロマツ（Pinus thunbergii）はそれぞれ独立種として多数の産地とともに掲載されているが、「アイグロマツ」「densithunbergii」「雑種」「交雑」といった語は本文中に見当たらず、両種の雑種に関する記載は確認できなかった。一方、明石公園（明石市）など兵庫県内での個体確認例が写真記録サイトで報告されており、目録編纂当時に雑種として区別・記録されていなかった可能性がある。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認である。自然雑種は形態的にアカマツ・クロマツの個体変異と連続的であるため、目録調査時に区別されず母種いずれかとして記録されている可能性も否定できない。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"両親種であるアカマツ・クロマツそのものと形態が連続的であり、典型的な特徴を示さない中間的個体との区別が最も紛らわしい。\",\"items\":[{\"name\":\"アカマツ\",\"sciName\":\"Pinus densiflora Siebold et Zucc.\",\"distinguishingPoints\":\"アイグロマツはアカマツに似た赤みを帯びた樹皮を持ちながら、針葉がアカマツより太く硬い、冬芽の色がやや白みがかるなど、部分的にクロマツの形質が混じる点で純粋なアカマツと異なる。ただし形質の現れ方は個体ごとの偏りが大きく、樹皮・葉・冬芽のいずれか一つの形質だけでは判別できないことが多い。\"},{\"name\":\"クロマツ\",\"sciName\":\"Pinus thunbergii Parl.\",\"distinguishingPoints\":\"アイグロマツはクロマツに似た黒みがかった樹皮や硬い針葉を持ちながら、樹皮に赤みが差す、針葉がクロマツよりやや細く柔らかい、冬芽がやや赤褐色を帯びるなど、部分的にアカマツの形質が混じる点で純粋なクロマツと異なる。確実な同定には樹皮の色・針葉の硬さと色・冬芽の色といった複数の形質を総合的に観察する必要があり、単独の個体を野外で確実にアイグロマツと同定するのは難しい場合が多い。\"}],\"source\":{\"name\":\"GKZ植物事典・アイグロマツ（間黒松）\",\"url\":\"https://gkzplant.sakura.ne.jp/mokuhon/syousai/agyou/a/aiguromatu.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"アイグロマツ自体の形態的な識別点を直接記した一次資料は確認できておらず、本項目はアカマツ・クロマツそれぞれの識別形質（樹皮・葉・冬芽）が中間的に現れるという一般的な雑種の性質から推論的に補って作成したものである。自然雑種は形態が連続的であるため、記載した識別点はあくまで傾向であり、確実な同定には遺伝解析等が必要な場合もある。\"}},{\"id\":\"abies-homolepis\",\"nameJa\":\"ウラジロモミ\",\"nameJaAlt\":[],\"sciName\":\"Abies homolepis Siebold et Zucc.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ウラジロモミ\",\"うらじろもみ\",\"裏白樅\",\"abies homolepis\"],\"worldDistribution\":{\"summary\":\"日本固有種で、自生範囲は「中央・南日本」とされる。冷温帯上部から亜高山帯下部にかけて分布し、モミ（Abies firma）よりも標高が高く冷涼な環境を好む。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Abies homolepis Siebold & Zucc.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:261546-1\",\"type\":\"primary\",\"note\":\"\\\"Native to: Japan\\\"。分布は\\\"Central & S. Japan\\\"とされる（Kew Backbone Distributions）。\"}},\"japanDistribution\":{\"summary\":\"福島県から四国にかけての冷温帯上部〜亜高山帯下部に分布するとされ、本州中部では標高約1000m付近からモミに代わって優占し、標高1700〜1800m付近ではシラビソ（近縁種）と入れ替わる。近畿地方の高標高山地もこの分布帯の南西端に位置すると考えられる。\",\"status\":\"自生（本州〜四国の山地帯、冷温帯上部〜亜高山帯）\",\"source\":{\"name\":\"ウラジロモミ - Wikipedia\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A6%E3%83%A9%E3%82%B8%E3%83%AD%E3%83%A2%E3%83%9F\",\"type\":\"secondary\"},\"habitat\":\"温帯北部（落葉広葉樹林帯）から亜高山帯下部にかけて生育し、モミよりも寒冷な気候を好む。本州中部では標高約1000m付近を境にモミと入れ替わって優占するようになり、さらに標高1700〜1800m付近ではシラビソ（近縁種）と入れ替わる、垂直的な分布帯を形成する。\",\"reliabilityNote\":\"Wikipedia日本語版に基づく記述であり、氷ノ山を含む兵庫県内の具体的自生記録は同記事に明示されていない。分布の南西限（近畿地方）が氷ノ山（標高1510m）を含むかどうかは、本記事だけでは確認できていない。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（Vol.2にウラジロモミ/Abies homolepisの記載なし）\",\"detail\":\"兵庫県産維管束植物 第2巻のマツ科の項を確認したところ、モミ（Abies firma）は掲載されているが、ウラジロモミ（Abies homolepis）の記載は見当たらなかった。ウラジロモミの一般的分布は福島県から四国にかけての冷温帯上部〜亜高山帯下部とされ、氷ノ山（標高1510m、兵庫県最高峰級）はこの標高帯に近く生育しうる環境とも考えられるが、目録上には産地記録がない。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認である。氷ノ山山頂付近の針葉樹相はブナ・ミズナラ帯からモミ属・トウヒ属混交林への移行帯にあたり、目録以外の現地調査文献での追加確認が望ましい。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同属で標高の低い場所に分布が重なるモミとの混同が最も多く、また同じマツ科針葉樹のツガ属・イチイ属とも葉だけを見ると紛らわしい。\",\"items\":[{\"name\":\"モミ\",\"sciName\":\"Abies firma\",\"distinguishingPoints\":\"ウラジロモミの葉先は丸みを帯びて浅く2裂し、全体的にやわらかく触れても痛くないことが多いのに対し、モミの葉は日陰の枝や若木では葉先が鋭く2裂して針状に尖り、触れると痛い（ただし日なたの成木上部の葉は丸くなることもあり、個体・枝の位置によるばらつきに注意）。最も分かりやすい違いは葉裏の気孔帯で、ウラジロモミは白色で幅の広い気孔帯が2本くっきりと目立ち緑と白のストライプが明瞭であるのに対し、モミは気孔帯が細く葉裏全体が淡緑色に見え白さがあまり目立たない。生育標高もウラジロモミの方が高く（冷温帯上部〜亜高山帯下部）、モミはより低い暖温帯〜冷温帯下部を好む。\"},{\"name\":\"ツガ\",\"sciName\":\"Tsuga sieboldii\",\"distinguishingPoints\":\"ツガの葉は同じ小枝の中で大小の長さが不揃いで、葉先はほとんど尖らずわずかに凹む程度と、ウラジロモミよりさらに柔らかい印象を受ける。決定的な違いは球果で、モミ属（ウラジロモミ）の球果は枝上に上向きに直立してつき、成熟すると鱗片がばらばらに分解して軸だけが枝に残るのに対し、ツガ属（ツガ）の球果は小さく下向きに垂れ下がってつき、鱗片が離れずに果実状のまま丸ごと落下する。この球果の向きと落ち方の違いは、モミ属・ツガ属・イチイ属など紛らわしい針葉樹を見分ける最も確実な手がかりになる。\"}],\"source\":{\"name\":\"ウラジロモミ（裏白樅） 庭木図鑑 植木ペディア／モミ Abies firma 三河の植物観察／モミ属 - Wikipedia\",\"url\":\"https://www.uekipedia.jp/常緑針葉樹/ウラジロモミ/\",\"type\":\"secondary\"},\"reliabilityNote\":\"植物観察サイト・図鑑サイト等の二次資料（庭木図鑑 植木ペディア「ウラジロモミ」 https://www.uekipedia.jp/常緑針葉樹/ウラジロモミ/ 、三河の植物観察「モミ」 https://mikawanoyasou.org/data/momi.htm 、Wikipedia「モミ属」 https://ja.wikipedia.org/wiki/モミ属 ）に基づく一般的な識別点であり、個体差・地域差がある可能性がある。\"}},{\"id\":\"abies-mariesii\",\"nameJa\":\"オオシラビソ\",\"nameJaAlt\":[\"アオモリトドマツ\"],\"sciName\":\"Abies mariesii Mast.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"オオシラビソ\",\"おおしらびそ\",\"アオモリトドマツ\",\"あおもりとどまつ\",\"大白檜曽\",\"abies mariesii\",\"marie's fir\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本（本州）としており、日本固有種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Abies mariesii Mast.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:261575-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Japan (Honshu).\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、西限を白山（石川県・岐阜県境）、南限を南アルプスまたは富士山付近、北限を八甲田山（青森県）とする本州中部から東北地方にかけての亜高山帯に分布する。近畿地方はこの分布域（白山以北・以東の本州中部〜東北地方）に含まれず、兵庫県は分布の西限とされる白山よりもさらに南西に位置するため、自生域外である可能性が高い。\",\"status\":\"自生（本州中部・東北地方の亜高山帯、近畿地方は分布域外の可能性）\",\"source\":{\"name\":\"オオシラビソ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AA%E3%82%AA%E3%82%B7%E3%83%A9%E3%83%93%E3%82%BD\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。「西限：白山、南限：南アルプス／富士山、北限：八甲田山」という記述は近畿地方を明示的には含んでおらず、兵庫県における自生の可能性は低いと推測されるが、これはWikipediaの簡潔な記述からの推論であり、より詳細な分布図・標本データによる確認が望ましい。\",\"habitat\":\"亜高山帯針葉樹林を構成する代表種で、日本の針葉樹の中でも最も多雪環境に適応した樹種の一つとされる。中部山岳地方では標高1,500〜2,500m前後の亜高山帯（いわゆる「オオシラビソ帯」）に純林・優占林を形成し、積雪の多い東北地方ではより低い標高（1,000m以下）にも分布が及ぶ。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外の可能性が高い）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「オオシラビソ」「アオモリトドマツ」「Abies mariesii」のいずれの語も検出されなかった。目録の裸子植物部でモミ属として記載されているのはモミ（Abies firma）のみである。本種は西限を白山とする本州中部・東北地方の亜高山帯固有種であり、兵庫県最高峰の氷ノ山（標高1,510m）は本種が典型的に生育する標高帯（中部山岳で1,500〜2,500m前後）の下限付近にすぎないうえ、分布の西限である白山よりもさらに南西・低緯度に位置するため、記録がないことは自然分布上妥当と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし複数の資料（POWO・Wikipedia）が示す自生域に近畿地方が含まれないことと整合しており、記録なしという結論の妥当性は比較的高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁のシラビソ（Abies veitchii）と外見が非常によく似ており、亜高山帯針葉樹林で混同されやすい。\",\"items\":[{\"name\":\"シラビソ\",\"sciName\":\"Abies veitchii Lindl. ex Hook.f.\",\"distinguishingPoints\":\"球果（松かさ）の先端の形状で区別され、オオシラビソは先端が丸みを帯びるのに対し、シラビソはやや尖る。分布域も一部重なるが、シラビソはより南方・低標高側にも分布する。\"},{\"name\":\"コメツガ\",\"sciName\":\"Tsuga diversifolia (Maxim.) Mast.\",\"distinguishingPoints\":\"同じ亜高山帯針葉樹林に混生することがあるが、ツガ属であり葉がより短く柔らかく、球果も小さいため、慣れれば容易に区別できる。\"}],\"source\":{\"name\":\"オオシラビソ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%AA%E3%82%AA%E3%82%B7%E3%83%A9%E3%83%93%E3%82%BD\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料であり、より詳細な識別点は専門図鑑での確認が望ましい。\"}},{\"id\":\"abies-sachalinensis\",\"nameJa\":\"トドマツ\",\"nameJaAlt\":[\"アカトドマツ\",\"アオトドマツ\"],\"sciName\":\"Abies sachalinensis (F.Schmidt) Mast.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"トドマツ\",\"とどまつ\",\"アカトドマツ\",\"あかとどまつ\",\"アオトドマツ\",\"あおとどまつ\",\"椴松\",\"abies sachalinensis\",\"sakhalin fir\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域をロシア極東（樺太・千島列島・カムチャツカを含む）から日本北部（北海道）としている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Abies sachalinensis (F.Schmidt) Mast.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:261629-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Russian Far East to N. Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本国内では北海道のみに自生し、道内森林蓄積の約3割を占める北海道を代表する針葉樹である。基準変種アカトドマツ（var. sachalinensis）のほか、樹皮や球果の形質が異なるアオトドマツ（var. mayriana）などの変種が知られるが、いずれも分布は北海道内にとどまる。本州以南（近畿地方・兵庫県を含む）には自然分布せず、最終氷期には東北地方まで広く分布していたとされる化石記録があるものの、現在の自生域は北海道に限られる。\",\"status\":\"自生（北海道全域、本州以南・近畿地方は分布域外）\",\"source\":{\"name\":\"トドマツ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%88%E3%83%89%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。現在の自然分布が北海道のみである点は複数の資料（POWO・林業関係資料）とも整合しており、信頼性は比較的高いと考えられる。\",\"habitat\":\"適潤で肥沃な土壌を好み、耐陰性が高く、全天日照の50〜80%程度の光環境でも生育できる。しばしば純林を形成するほか、エゾマツ・ミズナラ・シナノキなどの広葉樹と混交林を形成する。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（自生域外＝北海道固有のため）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「トドマツ」「Abies sachalinensis」のいずれの語も検出されなかった。目録の裸子植物部でモミ属として記載されているのはモミ（Abies firma）のみである。本種は日本国内では北海道にのみ自生し、本州以南には自然分布しないため、近畿地方に位置する兵庫県内に自生記録がないことは分布上当然の結果と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし本種の自生域が北海道に限られることは複数資料で一致しており、記録なしという結論の妥当性は高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"北海道内ではエゾマツ・アカエゾマツと混同されることがあるが、いずれもトウヒ属であり、モミ属のトドマツとは球果のつき方や葉先の形状で区別できる。\",\"items\":[{\"name\":\"エゾマツ\",\"sciName\":\"Picea jezoensis (Siebold et Zucc.) Carrière\",\"distinguishingPoints\":\"エゾマツ（トウヒ属）の球果は枝先に垂れ下がり、成熟後もそのままの形で落下するのに対し、トドマツ（モミ属）の球果は上向きに直立してつき、成熟すると鱗片がばらばらに脱落して軸だけが枝に残る。葉先はトドマツでは浅く2裂するが、エゾマツでは全縁でやや尖る。\"},{\"name\":\"シラビソ（アオモリトドマツとは別種）\",\"sciName\":\"Abies veitchii Lindl. ex Hook.f.\",\"distinguishingPoints\":\"最終氷期にトドマツの祖先集団が南下し本州の亜高山帯で隔離的に分化した近縁種と考えられており、系統的に近いが分布域は北海道と本州で明確に分かれる。\"}],\"source\":{\"name\":\"トドマツ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%88%E3%83%89%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料であり、より詳細な識別点は専門図鑑での確認が望ましい。\"}},{\"id\":\"picea-alcoquiana\",\"nameJa\":\"イラモミ\",\"nameJaAlt\":[\"マツハダ\"],\"sciName\":\"Picea alcoquiana (Veitch ex Lindl.) Carrière\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"イラモミ\",\"いらもみ\",\"マツハダ\",\"まつはだ\",\"伊良樅\",\"松肌\",\"picea alcoquiana\",\"alcock's spruce\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本中部としており、日本固有種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Picea alcoquiana (Veitch ex Lindl.) Carrière\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262615-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Central Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、福島県南部から岐阜県にかけての本州中部の山地帯上部から亜高山帯にかけて点在的に分布するが、林内で優占することは少なく個体数も少ない希少な樹種とされる。近畿地方はこの分布範囲（福島県南部〜岐阜県）の記述に含まれておらず、兵庫県はこの範囲よりもさらに南西に位置するため、自生域に含まれるとは考えにくい。\",\"status\":\"自生（本州中部の山地帯〜亜高山帯に点在、近畿地方は分布域外の可能性）\",\"source\":{\"name\":\"マツハダ（イラモミ）- Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%9E%E3%83%84%E3%83%8F%E3%83%80\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。「福島県南部から岐阜県」という表現は近畿地方を明示的には含んでおらず、庭木図鑑等の資料でも「栃木県（蛭峨山）から岐阜県」といった同様の範囲が示されており、複数の二次資料が近畿地方を分布域外として扱っている点で整合的である。より詳細な分布図・標本データによる確認が望ましい。\",\"habitat\":\"冷温帯から亜高山帯にかけての山地に生育し、標高2,000m前後の高標高域にコメツガなどと混生してまれに出現する。老木は樹皮がマツ類のように鱗片状に剥がれることが和名（マツハダ）の由来となっている。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外の可能性が高い）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「イラモミ」「マツハダ」「Picea alcoquiana」のいずれの語も検出されず、目録の裸子植物部を通じてトウヒ属（Picea属）の記載自体が一件も確認されなかった。本種は福島県南部〜岐阜県にかけての本州中部の山地帯〜亜高山帯に点在する希少種であり、兵庫県はこの分布域よりも南西に位置する。兵庫県最高峰の氷ノ山（標高1,510m）は本種が生育するとされる標高2,000m前後の高標高環境には届かず、自生の可能性は低いと考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし目録全体にPicea属の記載が一切見られないことは、複数資料が示す本種の分布域に近畿地方が含まれないこととも整合しており、記録なしという結論の妥当性は比較的高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じトウヒ属のハリモミ・トウヒなどと葉の断面形状が似ており混同されやすいが、葉先の鋭さや樹皮の様子で区別される。\",\"items\":[{\"name\":\"ハリモミ\",\"sciName\":\"Picea polita (Siebold et Zucc.) Carrière\",\"distinguishingPoints\":\"ハリモミの葉は太く鋭く尖り、触れると痛みを感じるほど硬いのに対し、イラモミの葉は先端がハリモミほど鋭くとがらずやや丸みを帯び、断面もより扁平である。\"},{\"name\":\"トウヒ\",\"sciName\":\"Picea jezoensis var. hondoensis (Mayr) P.A.Schmidt\",\"distinguishingPoints\":\"イラモミの球果はトウヒよりもやや大きい傾向があり、老木になると樹皮がマツ類のように鱗片状に剥がれる点（和名マツハダの由来）で区別できる。\"}],\"source\":{\"name\":\"イラモミ - 庭木図鑑 植木ペディア\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%82%A4%E3%83%A9%E3%83%A2%E3%83%9F/\",\"type\":\"secondary\"},\"reliabilityNote\":\"植木図鑑サイトは二次資料。より詳細な識別点は専門図鑑・標本データでの確認が望ましい。\"}},{\"id\":\"picea-glehnii\",\"nameJa\":\"アカエゾマツ\",\"nameJaAlt\":[],\"sciName\":\"Picea glehnii (F.Schmidt) Mast.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"アカエゾマツ\",\"あかえぞまつ\",\"赤蝦夷松\",\"picea glehnii\",\"sakhalin spruce\",\"glehn's spruce\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を南樺太（サハリン）から日本（北海道・本州北部）としている。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Picea glehnii (F.Schmidt) Mast.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262657-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is S. Sakhalin to Japan (Hokkaido, N. Honshu).\\\"\"}},\"japanDistribution\":{\"summary\":\"北海道の東部・北部および日高山脈を中心に分布し、道南（渡島半島）には産しない。北海道以外では本州の岩手県早池峰山に隔離分布があり、標高約980〜1,180mの「アイオン沢」に生育するのが本州における自然分布の南限とされる。近畿地方・兵庫県は、この南限である早池峰山よりもはるかに南西に位置しており、自生域に含まれるとは考えられない。\",\"status\":\"自生（北海道東部・北部が中心、本州は岩手県早池峰山のみ隔離分布、近畿地方は分布域外）\",\"source\":{\"name\":\"アカエゾマツ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A2%E3%82%AB%E3%82%A8%E3%82%BE%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料。本州における自生が岩手県早池峰山の隔離個体群に限られる点はPOWOの「Hokkaido, N. Honshu」という記述とも整合しており、近畿地方が分布域に含まれないことの根拠として比較的信頼できると考えられる。\",\"habitat\":\"湿原・蛇紋岩地・薄い火山灰の痩せ地・海岸砂丘など、エゾマツやトドマツが苦手とする貧栄養で厳しい環境によく適応し、そのような立地ではしばしば純林を形成する。根室・春国岱の砂丘林や阿寒湖畔の火山灰地の純林などが知られる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外＝北海道・東北の一部に限られるため）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を検索したが、「アカエゾマツ」「Picea glehnii」のいずれの語も検出されず、目録の裸子植物部を通じてトウヒ属（Picea属）の記載自体が一件も確認されなかった。本種の自然分布は北海道（道南を除く）と南樺太を中心とし、本州では岩手県早池峰山の隔離個体群が南限とされる。近畿地方の兵庫県はこの南限よりも大幅に南西に位置し、本種が好む蛇紋岩地・高層湿原等の特殊立地が兵庫県内に本種の自生に適した形で存在するとは考えにくく、記録がないことは自然分布上妥当と考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。ただし目録全体にPicea属の記載が一切見られないことは、本種の分布域に近畿地方が含まれないという複数資料の記述とも整合しており、記録なしという結論の妥当性は比較的高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁のエゾマツと外見が似ており、しばしば混同されるが、葉の長さや断面、気孔の並び方で区別できる。\",\"items\":[{\"name\":\"エゾマツ\",\"sciName\":\"Picea jezoensis (Siebold et Zucc.) Carrière\",\"distinguishingPoints\":\"アカエゾマツの葉は5〜12mmとやや短く、断面はひし形で四面すべてに気孔があるのに対し、エゾマツの葉はより長く扁平で気孔は2面のみに限られる。樹皮の色合い（アカエゾマツはやや赤みを帯びる）でも区別されることがある。\"}],\"source\":{\"name\":\"アカエゾマツ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%82%A2%E3%82%AB%E3%82%A8%E3%82%BE%E3%83%9E%E3%83%84\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaは二次資料であり、より詳細な識別点は専門図鑑での確認が望ましい。\"}},{\"id\":\"picea-polita\",\"nameJa\":\"ハリモミ\",\"nameJaAlt\":[\"バラモミ\"],\"sciName\":\"Picea polita (Siebold et Zucc.) Carrière\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ハリモミ\",\"はりもみ\",\"バラモミ\",\"ばらもみ\",\"針樅\",\"ベニバナハリモミ\",\"picea polita\",\"picea torano\",\"tiger-tail spruce\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を日本の中部・南部としており、日本固有種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Picea polita (Siebold et Zucc.) Carrière\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:262712-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Central & S. Japan.\\\"\"}},\"japanDistribution\":{\"summary\":\"日本固有種で、日本産トウヒ属の中では最も低標高・最も南方まで分布する種とされる。分布は福島県から紀伊半島・四国を経て九州の高隈山（鹿児島県）まで及ぶとされるが、この範囲全体に連続して分布するわけではなく、太平洋側の限られた山地に点在する隔離的・遺存的な分布を示し、日本海側の多雪地帯にはほとんど分布しないとされる。山梨県・東京都・福岡県・大分県など離れた地域での局地的な記録がレッドデータブック等で個別に知られる一方、近畿地方（京都府・奈良県・滋賀県・三重県）や兵庫県・岡山県における自生記録・レッドデータブック掲載は見当たらず、兵庫県を含む中国地方東部〜近畿地方には分布の空白域があるとみられる。\",\"status\":\"自生（本州太平洋側〜四国・九州にかけて点在する隔離的分布、兵庫県を含む近畿地方は分布の空白域とみられる）\",\"source\":{\"name\":\"ハリモミ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%83%AA%E3%83%A2%E3%83%9F\",\"type\":\"secondary\"},\"reliabilityNote\":\"「福島県から紀伊半島・四国・九州まで」という記述は分布の南北両端を示すのみで、連続分布を意味するものではない。実際には福岡県・大分県・東京都など各都道府県のレッドデータブックに希少種として個別に掲載されており、隔離的・点在的な分布であることがうかがえる。兵庫県および近隣の京都府・岡山県のレッドデータブック・目録類に本種の記載が見当たらないことから、兵庫県内には自生しない、または極めて稀であると推測されるが、これは複数の二次資料の消去法的な確認に基づくものであり、より詳細な植生調査・標本記録による確認が望ましい。5種の中では本種のみ分布の南限が近畿地方に地理的に最も近接しており、他の4種に比べて「分布域が届かない」根拠がやや弱い点に留意が必要である。\",\"habitat\":\"中部地方以南の冷温帯から亜高山帯にかけて土地的極相林を形成し、やや湿った土壌を好み、西日の当たる乾燥地では生育が悪いとされる。葉は日本産トウヒ属の中で最も太く硬く、触れると痛みを感じるほど鋭く尖ることが和名の由来である。山梨県・山中湖畔には約3万本からなる純林があり、天然記念物に指定されている。福岡県八女市（旧矢部村）御前岳では標高1,050〜1,150m付近の針広混交林に点在する隔離個体群が知られる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（近畿地方は分布の空白域とみられる）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文を「ハリモミ」「バラモミ」「Picea polita」「Picea torano」で検索したが、いずれも該当する記載は確認されず、目録の裸子植物部を通じてトウヒ属（Picea属）の記載自体が一件も見られなかった。本種は分布の南北限だけを見ると兵庫県を含む近畿地方も範囲内に入り得るように見えるが、実際には太平洋側の限られた山地に点在する隔離的分布を示す種であり、京都府・岡山県・兵庫県などのレッドデータブック・目録にも記載が見当たらないことから、近畿地方一帯には自生していない、もしくは少なくとも記録されていないと考えられる。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出に基づくため抽出漏れの可能性は完全には排除できない。本種は他の4種と異なり分布の南限（紀伊半島・四国・九州）が近畿地方に地理的に近接するため、他種に比べて「未記録の個体群が兵庫県内に将来的に発見される可能性」はやや高いと考えられる点に留意すべきである。ただし現時点では近隣府県（京都・岡山）を含めレッドデータブック等に記載がなく、記録なしという結論は現時点の資料からは妥当と考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"同じトウヒ属のイラモミ・トウヒなどと似るが、日本産トウヒ属の中で最も鋭く硬い葉を持つ点で区別できる。また和名に「モミ」を含むためモミ属のモミと混同されることがある。\",\"items\":[{\"name\":\"イラモミ\",\"sciName\":\"Picea alcoquiana (Veitch ex Lindl.) Carrière\",\"distinguishingPoints\":\"イラモミの葉は先端がハリモミほど鋭くとがらず、触れても痛みが少ない。分布域もより北・高標高側（本州中部の亜高山帯）に偏る。\"},{\"name\":\"モミ\",\"sciName\":\"Abies firma Siebold et Zucc.\",\"distinguishingPoints\":\"和名に「モミ」を含むが別属（モミ属ではなくトウヒ属）である。モミ属とトウヒ属は葉の脱落痕で区別でき、モミは葉が落ちると枝に滑らかな丸い痕が残るのに対し、ハリモミは葉の基部が葉枕として枝に残るため小枝の表面がざらつく。ハリモミの葉はモミよりもさらに硬く鋭い。\"}],\"source\":{\"name\":\"ハリモミ - Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/%E3%83%8F%E3%83%AA%E3%83%A2%E3%83%9F\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipediaおよび植木図鑑サイトは二次資料であり、より詳細な識別点は専門図鑑・標本データでの確認が望ましい。\"}},{\"id\":\"picea-jezoensis\",\"nameJa\":\"エゾマツ\",\"nameJaAlt\":[\"クロエゾマツ\"],\"sciName\":\"Picea jezoensis (Siebold et Zucc.) Carrière var. jezoensis\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"エゾマツ\",\"えぞまつ\",\"蝦夷松\",\"クロエゾマツ\",\"くろえぞまつ\",\"picea jezoensis\",\"yeddo spruce\",\"ezo spruce\",\"ezomatsu\"],\"worldDistribution\":{\"summary\":\"POWOでは本種を Picea jezoensis subsp. jezoensis として扱い、自生域を「E. Siberia to N. & N. Central Japan」（東シベリアから北日本・本州北部にかけて）としている。分布地域として日本のほか、カムチャツカ、ハバロフスク、千島列島、マガダン、沿海地方（プリモリエ）、サハリン、ヤクーチヤが挙げられており、日本固有ではなく東アジア北部に広く分布する種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Picea jezoensis subsp. jezoensis\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:77172535-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is E. Siberia to N. & N. Central Japan.\\\" 分布地域としてJapan, Kamchatka, Khabarovsk, Kuril Is., Magadan, Primorye, Sakhalin, Yakutiyaが挙げられている。POWOは基本変種を「subsp. jezoensis」として扱っており、本項の「var. jezoensis」という表記とは階級（亜種／変種）が異なるが、同一の分類群を指す。\"}},\"japanDistribution\":{\"summary\":\"国内では北海道（渡島半島を除く道内一円）と南千島に分布し、樺太・沿海州・朝鮮・中国東北部にも及ぶ。本州には自然分布せず、本州中部の高山帯に隔離分布する近縁の変種トウヒ（Picea jezoensis var. hondoensis）とは分布域が明確に区別される。生育標高は低地から標高1,000〜1,500m前後までとされ、道内では山地帯を中心にアカエゾマツ・トドマツなどと混生しつつ、しばしば純林状に群生する。近畿地方・兵庫県は北海道から見て緯度にして10度以上南に位置し、亜寒帯〜冷温帯性のエゾマツが自然分布しうる気候帯からは大きく外れている。\",\"status\":\"自生（北海道内［道南の渡島半島を除く］・南千島・樺太・沿海州・朝鮮・中国東北部）。本州には分布しない。\",\"source\":{\"name\":\"エゾマツ｜北海道立総合研究機構 林産試験場\",\"url\":\"https://www.hro.or.jp/forest/research/fpri/koho/default/doumoku-index/ezomatu.html\",\"type\":\"secondary\"},\"reliabilityNote\":\"北海道立総合研究機構（道立林産試験場）という公的研究機関のウェブページを参照したが、正式な分類学的一次資料ではないため二次資料として扱った。Wikipedia日本語版「エゾマツ」の記述（渡島半島以外の北海道、南千島、樺太、中国東北部に分布し、本州の高山に分布するトウヒは本種の変種とされる）とも整合する。標高情報については英語の球果植物専門サイト conifers.org（Gymnosperm Database）が『in Japan, it occurs in subalpine forests at 40-1000 m elevation』と記載しており、日本語資料の『低地から標高1500m前後』という記述とおおむね整合するが、細部の数値は資料により幅がある。\",\"habitat\":\"低地から山地帯にかけての冷温帯〜亜寒帯性針葉樹林に生育し、浅根性で土壌適応性が比較的高い。アカエゾマツやトドマツと混生することが多いが、しばしば純林状に群生する。粘質壌土を好むとされる。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文をWebFetchで検索したところ、「エゾマツ」「トウヒ」「トウヒ属」「Picea」のいずれの語も検出されず、同巻マツ科（Pinaceae）の項に掲載されているのはモミ Abies firma、アカマツ Pinus densiflora、ヒメコマツ Pinus parviflora、クロマツ Pinus thunbergii、ツガ Tsuga sieboldiiの5種のみで、トウヒ属（Picea）の種は一種も掲載されていない。エゾマツ（基本変種）は北海道・南千島・樺太・大陸側に分布し、本州には自然分布しないとされる種であり、本州最西南部に位置する近畿地方・兵庫県で記録がないことは地理的にきわめて妥当である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的な確認であり、WebFetchによるAI要約抽出のため抽出漏れの可能性は完全には排除できない。ただし本種は北海道と南千島・樺太・大陸に分布し本州を欠くとする複数資料の記述と整合しており、記録なしという結論の妥当性は高いと考えられる。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"トウヒ属の中では特に近縁変種トウヒ（本州中部の高山帯に分布）と混同されやすいほか、同じ北海道に自生するアカエゾマツとも識別に注意を要する。\",\"items\":[{\"name\":\"トウヒ\",\"sciName\":\"Picea jezoensis var. hondoensis (Mayr) Rehder\",\"distinguishingPoints\":\"エゾマツの変種で本州中部の亜高山帯に隔離分布。エゾマツより葉が短く（7-15mm程度）球果も小さい。樹皮はエゾマツが灰褐色で亀甲状に深く割れるのに対し、トウヒは赤褐色で鱗片状に剥離する点で区別できる。\"},{\"name\":\"アカエゾマツ\",\"sciName\":\"Picea glehnii (F.Schmidt) Mast.\",\"distinguishingPoints\":\"トウヒ属の中で唯一若い枝に毛が密生する点で明確に区別できる。葉は約1cmで密集してつき、エゾマツの扁平で光沢のある葉（7-20mm、若枝は無毛で淡黄褐色）とは触感・枝の様子が異なる。\"},{\"name\":\"トドマツ\",\"sciName\":\"Abies sachalinensis (F.Schmidt) Mast.\",\"distinguishingPoints\":\"同じ北海道の代表的針葉樹だがモミ属であり、球果が上向きにつき熟すと軸を残して鱗片が脱落する点でトウヒ属（下向きの球果がそのまま落下する）と区別できる。木材の外観も似ているため製材現場でも識別に注意を要する。\"}],\"source\":{\"name\":\"トウヒ属 Picea – ざっそう屋\",\"url\":\"https://zassou-ya.com/plants/g-touhi/\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人運営の植物解説サイト（二次資料）の記述に基づく識別点であり、学術的な検索表による確認ではない。\"}},{\"id\":\"picea-jezoensis-var-hondoensis\",\"nameJa\":\"トウヒ\",\"nameJaAlt\":[],\"sciName\":\"Picea jezoensis var. hondoensis (Mayr) Rehder\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"トウヒ\",\"とうひ\",\"唐檜\",\"唐桧\",\"picea jezoensis var hondoensis\",\"picea jezoensis subsp hondoensis\",\"hondo spruce\"],\"worldDistribution\":{\"summary\":\"POWOは本変種を Picea jezoensis subsp. hondoensis として扱い、自生域を「Japan (C. Honshu)」（日本・本州中部）のみとしている。エゾマツ本変種（subsp. jezoensis、北海道・大陸側に分布）とは異なり、本州中部の高山帯に隔離分布する日本固有の分類群である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Picea jezoensis subsp. hondoensis (Mayr) P.A.Schmidt\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:954894-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this taxon is Japan (C. Honshu).\\\" POWOは学名を「subsp. hondoensis (Mayr) P.A.Schmidt」として扱っており、本項の学名表記「var. hondoensis (Mayr) Rehder」とは命名者・階級表記が異なるが同一の分類群を指す。\"}},\"japanDistribution\":{\"summary\":\"日本固有の分類群で、紀伊半島の大台ヶ原から中部山岳地帯（日本アルプス周辺）を経て、福島県の吾妻山までの本州中部〜東北南部の山地に隔離分布する。現在は吾妻山より北の東北地方には分布しないとされ、北限は東北南部、南限・西限は紀伊半島の大台ヶ原（奈良県・三重県境）である。生育標高は海抜1,500〜2,500mの亜高山帯とされる。兵庫県は近畿地方の中でも大台ヶ原よりさらに西〜北に位置し、県内最高峰の氷ノ山でも標高1,510mと本種の主要な生育標高帯（1,500〜2,500m）の下限付近にしか達しない。分布記録として挙げられる地名（大台ヶ原・中部山岳・吾妻山）に兵庫県や近畿地方北部は含まれず、兵庫県は本種の自然分布域に含まれないと考えられる。\",\"status\":\"自生（本州中部を中心とする亜高山帯、紀伊半島大台ヶ原が分布の南西限）。近畿地方では奈良県・三重県境の大台ヶ原に限られ、兵庫県は分布域に含まれない。\",\"source\":{\"name\":\"トウヒ — Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/トウヒ\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版という二次資料に基づく。分布南限とされる大台ヶ原（奈良県上北山村付近、標高約1,600m超）は近畿地方内ではあるが兵庫県からは100km以上離れた紀伊半島南部に位置し、兵庫県内に本種の分布が及ぶことを示す記述はない。POWOの『Japan (C. Honshu)』という簡潔な記載とも整合する。より詳細な分布図・標本記録による裏付けが望ましい。\",\"habitat\":\"亜高山帯（標高1,500〜2,500m）の尾根や急斜面に生育し、シラビソ・コメツガなど他の亜高山性針葉樹と混交林を形成することが多い。エゾマツに比べて葉が短く（7-15mm程度）、球果も小さい。樹皮は赤褐色で鱗片状に剥離する。\"},\"hyogoRecord\":{\"recorded\":false,\"statusLabel\":\"兵庫県目録：記録なし（分布域外）\",\"detail\":\"兵庫県産維管束植物 第2巻の本文をWebFetchで検索したが、「トウヒ」「エゾマツ」「トウヒ属」「Picea」のいずれの語も検出されなかった。同巻マツ科の項に掲載されているのはモミ・アカマツ・ヒメコマツ・クロマツ・ツガの5種のみで、トウヒ属は一種も含まれない。本種の分布は紀伊半島大台ヶ原から中部山岳・東北南部にかけての標高1,500〜2,500mの亜高山帯に限られ、兵庫県最高峰の氷ノ山（1,510m）はこの標高帯にわずかに届く程度で、かつ分布記録の挙がる地域（大台ヶ原以東）からも大きく外れているため、記録がないことは地理的に妥当である。\",\"volume\":2,\"page\":null,\"locality\":null,\"source\":{\"name\":\"兵庫県産維管束植物 第2巻\",\"url\":\"https://www.hitohaku.jp/publication/r-bulletin/No112000085.pdf\",\"type\":\"primary\"},\"reliabilityNote\":\"「記載がない＝記録なし」という消去法的確認であり、抽出漏れの可能性は完全には排除できない。ただし本種の分布南西限とされる大台ヶ原からも兵庫県は離れており、複数資料の分布情報と整合的である。\"},\"similarSpecies\":{\"hasSimilar\":true,\"note\":\"近縁変種のエゾマツ（北海道に分布）のほか、同じ本州中部の亜高山帯に分布するヤツガタケトウヒ・ヒメバラモミ・ハリモミ・イラモミなど、トウヒ属の複数種と外見が似ており、球果・葉・樹皮の細部で識別する必要がある。\",\"items\":[{\"name\":\"エゾマツ\",\"sciName\":\"Picea jezoensis (Siebold et Zucc.) Carrière var. jezoensis\",\"distinguishingPoints\":\"基本変種で北海道・南千島・大陸側に分布。トウヒより葉が長く（15-25mm程度）、球果も大きい。樹皮は灰褐色で亀甲状に深く割れる。\"},{\"name\":\"ハリモミ（バラモミ）\",\"sciName\":\"Picea torano (Siebold ex K.Koch) Koehne\",\"distinguishingPoints\":\"葉の断面が菱形で先端が鋭く触ると痛いのに対し、トウヒ・エゾマツは葉の断面が楕円形で刺さりにくい点で区別できる。球果は8-10cmとトウヒ属の中でも大きい。\"},{\"name\":\"イラモミ\",\"sciName\":\"Picea bicolor (Maxim.) Mayr\",\"distinguishingPoints\":\"葉は1.5cm以下とやや小さくわずかに湾曲してつき、若枝は灰褐色で無毛〜まばらに毛がありあまり赤みを帯びない点でトウヒと区別できる。\"},{\"name\":\"ドイツトウヒ（オウシュウトウヒ）\",\"sciName\":\"Picea abies (L.) H.Karst.\",\"distinguishingPoints\":\"ヨーロッパ原産の植栽種。葉の断面が菱形になる点でトウヒ・エゾマツ（楕円形）と区別できる。公園・庭園にクリスマスツリーとして植栽されることがある。\"}],\"source\":{\"name\":\"トウヒ（唐檜）— 庭木図鑑 植木ペディア\",\"url\":\"https://www.uekipedia.jp/%E5%B8%B8%E7%B7%91%E9%87%9D%E8%91%89%E6%A8%B9/%E3%83%88%E3%82%A6%E3%83%92/\",\"type\":\"secondary\"},\"reliabilityNote\":\"個人・企業運営の植物解説サイト（二次資料）に基づく識別点であり、学術的検索表による確認ではない。\"}},{\"id\":\"picea-koyamae\",\"nameJa\":\"ヤツガタケトウヒ\",\"nameJaAlt\":[],\"sciName\":\"Picea koyamae Shiras.\",\"family\":\"マツ科 Pinaceae\",\"searchTerms\":[\"ヤツガタケトウヒ\",\"やつがたけとうひ\",\"八ヶ岳トウヒ\",\"picea koyamae\",\"koyama's spruce\",\"koyama spruce\"],\"worldDistribution\":{\"summary\":\"POWOは本種の自生域を「Central Japan (Yatsugadake Mountains)」（本州中部・八ヶ岳）としており、日本固有種、しかも国内でも八ヶ岳という極めて限られた一地域にのみ自生する希少種である。\",\"source\":{\"name\":\"Plants of the World Online (Kew) — Picea koyamae Shiras.\",\"url\":\"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:676963-1\",\"type\":\"primary\",\"note\":\"\\\"The native range of this species is Central Japan (Yatsugadake Mountains).\\\"\"}},\"japanDistribution\":{\"summary\":\"日本特産種で、長野県・山梨県境の八ヶ岳西岳中腹、標高約1,700m付近の針広混交林を中心に、八ヶ岳南部から南アルプス北部にかけてのごく限られた地域にのみ分布する。現存する個体数は全体で1,000本程度と推定され、IUCNレッドリストでは絶滅危惧IB類（EN）に分類される、日本を代表する希少樹木の一つである。比較的降水量・積雪量の少ない大陸的な冷涼・乾燥気候を好み、岩屑地のような乾いた立地に生育する傾向がある。分布は長野県・山梨県の八ヶ岳・南アルプス北部という極めて狭い山域に限定されており、兵庫県を含む近畿地方からは数百km離れている。\",\"status\":\"自生（長野県・山梨県境の八ヶ岳・南アルプス北部のみ、日本固有・極めて狭い局所分布）。近畿地方・兵庫県は分布域から遠く離れている。\",\"source\":{\"name\":\"ヤツガタケトウヒ — Wikipedia日本語版\",\"url\":\"https://ja.wikipedia.org/wiki/ヤツガタケトウヒ\",\"type\":\"secondary\"},\"reliabilityNote\":\"Wikipedia日本語版という二次資料に基づく。分布地が長野県・山梨県の八ヶ岳・南アルプス北部という極めて限定的な一地域として記載されており、兵庫県を含む近畿地方が分布域に含まれる可能性は事実上ない。国立研究開発法人 森林研究・整備機構 森林総合研究所の希少樹木紹介ページ等でも同様の分布が示されており、記述の信頼性は比較的高い。\",\"habitat\":\"標高1,0
