  "torreya": "カヤ属", "tsuga": "ツガ属", "monoon": "モノオン属",
  "cinnamomum": "クスノキ属", "lindera": "クロモジ属", "machilus": "タブノキ属",
  "neolitsea": "シロダモ属", "litsea": "ハマビワ属", "laurus": "ゲッケイジュ属",
  "chimonanthus": "ロウバイ属", "actinodaphne": "バリバリノキ属",
  "cassytha": "スナヅル属", "hernandia": "ハスノハギリ属", "persea": "ワニナシ属",
  "acorus": "ショウブ属", "alisma": "サジオモダカ属", "caldesia": "マルバオモダカ属",
  "sagittaria": "オモダカ属", "zostera": "アマモ属", "phyllospadix": "スガモ属",
  "ruppia": "カワツルモ属", "cymodocea": "ベニアマモ属", "halodule": "ウミジグサ属",
  "syringodium": "シオニラ属", "tofieldia": "チシマゼキショウ属", "triantha": "イワショウブ属",
  "triglochin": "シバナ属", "scheuchzeria": "ホロムイソウ属", "blyxa": "スブタ属",
  "egeria": "オオカナダモ属", "elodea": "コカナダモ属", "hydrilla": "クロモ属",
  "hydrocharis": "トチカガミ属", "ottelia": "ミズオオバコ属", "vallisneria": "セキショウモ属",
  "najas": "イバラモ属", "enhalus": "ウミショウブ属", "halophila": "ウミヒルモ属",
  "thalassia": "リュウキュウスガモ属"
};
function genusOf(sciName){
  if(!sciName) return "";
  const m = sciName.trim().match(/^([A-Za-z-]+)/);
  return m ? m[1] : "";
}
function genusJaOf(sciName){
  const g = genusOf(sciName).toLowerCase();
  return GENUS_JA[g] || "";
}

function matchesQuery(sp, q){
  if(!q) return true;
  const norm = q.trim().toLowerCase();
  if(!norm) return true;
  const genus = genusOf(sp.sciName);
  const genusJa = genusJaOf(sp.sciName);
  return sp.searchTerms.some(t => t.toLowerCase().includes(norm))
    || sp.sciName.toLowerCase().includes(norm)
    || sp.nameJa.toLowerCase().includes(norm)
    || sp.family.toLowerCase().includes(norm)
    || (genus && genus.toLowerCase().includes(norm))
    || (genusJa && genusJa.includes(norm))
    // "カンアオイ"のように「属」を省いた属名和名でも一致するようにする
    || (genusJa && norm && genusJa.replace(/属$/, "").includes(norm));
}

// Family-level notes (e.g. ザミア科: no native/naturalized species in Japan) —
// only shown when the search query actually matches, never on the blank/default list.
function matchingFamilyNotes(q){
  if(!q) return [];
  const norm = q.trim().toLowerCase();
  if(!norm) return [];
  return PLANT_DATA.familyNotes.filter(n =>
    n.family.toLowerCase().includes(norm) ||
    (n.searchTerms || []).some(t => t.toLowerCase().includes(norm))
  );
}

function renderList(){
  const q = searchInput.value;
  const hyogoOnly = hyogoOnlyToggle.checked;
  clearBtn.style.display = q ? "block" : "none";
  let items = PLANT_DATA.species.filter(sp => matchesQuery(sp, q));
  // 科レベルの補足ノートは個々の種の「記録あり/なし」に対応しないため、絞り込み中は対象外にする
  const noteMatches = hyogoOnly ? [] : matchingFamilyNotes(q);

  const totalBeforeFilter = items.length;
  if(hyogoOnly){
    items = items.filter(sp => sp.hyogoRecord.recorded === true);
  }

  if(items.length === 0 && noteMatches.length === 0){
    resultList.innerHTML = "";
    resultCount.textContent = "";
    emptyState.style.display = "block";
    if(hyogoOnly && totalBeforeFilter > 0){
      emptyState.innerHTML = q
        ? `「${esc(q)}」に一致する植物の中に、兵庫県内に記録がある種は見つかりませんでした。`
        : "兵庫県内に記録がある植物が見つかりませんでした。";
    } else {
      emptyState.innerHTML = q
        ? `「${esc(q)}」に一致する植物が見つかりませんでした。<br>現在このアプリは裸子植物（12科）のみ対応しています。`
        : "植物名を入力して検索してください。";
    }
    return;
  }
  emptyState.style.display = "none";
  resultCount.textContent = `${items.length}件`
    + (hyogoOnly ? `（兵庫県内に記録がある植物のみ表示中・全${totalBeforeFilter}件中）` : "")
    + (noteMatches.length ? `（科レベルの補足情報 ${noteMatches.length}件あり）` : "");

  const noteCardsHtml = noteMatches.map(n => `
    <div class="card family-note-card">
      <div class="name-block" style="width:100%;">
        <div class="fam" style="font-size:.95rem;font-weight:700;color:var(--green-900);margin-bottom:4px;">${esc(n.family)}</div>
        <div style="font-size:.82rem;line-height:1.7;color:#3a4a42;margin-bottom:8px;">${esc(n.note)}</div>
        ${sourceBlock(n.source)}
        ${n.reliabilityNote ? reliabilityBlock(n.reliabilityNote) : ""}
      </div>
    </div>
  `).join("");

  const speciesCardsHtml = items.map(sp => {
    const rec = sp.hyogoRecord.recorded;
    const genus = genusOf(sp.sciName);
    const genusJa = genusJaOf(sp.sciName);
    const genusLabel = genusJa ? `${genusJa} ${genus}` : genus;
    return `
      <div class="card" data-id="${esc(sp.id)}">
        <div class="name-block">
          <div class="ja">${esc(sp.nameJa)}</div>
          ${sp.nameJaAlt && sp.nameJaAlt.length ? `<div class="alt">${sp.nameJaAlt.map(esc).join("・")}</div>` : ""}
          <div class="sci">${esc(sp.sciName)}</div>
          <div class="fam">${esc(sp.family)}${genusLabel ? ` <span class="genus-tag" data-genus-q="${esc(genusJa || genus)}" role="button" tabindex="0" title="この属の種を一覧表示">／ ${esc(genusLabel)}</span>` : ""}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="badge ${rec ? "yes":"no"}">${rec ? "兵庫記録あり":"兵庫記録なし"}</span>
          <span class="chev">›</span>
        </div>
      </div>
    `;
  }).join("");

  resultList.innerHTML = speciesCardsHtml + noteCardsHtml;

  resultList.querySelectorAll(".card[data-id]").forEach(el => {
    el.addEventListener("click", (e) => {
      if(e.target.closest(".genus-tag")) return; // handled separately below
      openDetail(el.getAttribute("data-id"));
    });
  });

  // タップで属名検索に切り替え（例：「カンアオイ属」をタップするとカンアオイ属の全種を一覧表示）
  resultList.querySelectorAll(".genus-tag[data-genus-q]").forEach(el => {
    const go = (e) => {
      e.stopPropagation();
      searchInput.value = el.getAttribute("data-genus-q");
      renderList();
      searchInput.scrollIntoView({behavior:"smooth", block:"start"});
    };
    el.addEventListener("click", go);
    el.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(e); } });
  });
}

searchInput.addEventListener("input", renderList);
clearBtn.addEventListener("click", () => { searchInput.value=""; renderList(); searchInput.focus(); });
hyogoOnlyToggle.addEventListener("change", renderList);

// ============ RENDER: DETAIL ============
const listView = document.getElementById("listView");
const detailView = document.getElementById("detailView");
const backBtn = document.getElementById("backBtn");

function openDetail(id){
  const sp = PLANT_DATA.species.find(s => s.id === id);
  if(!sp) return;

  document.getElementById("dJa").textContent = sp.nameJa;
  document.getElementById("dAlt").textContent = (sp.nameJaAlt||[]).join("・");
  document.getElementById("dSci").textContent = sp.sciName;
  const genus = genusOf(sp.sciName);
  const genusJa = genusJaOf(sp.sciName);
  const genusLabel = genusJa ? `${genusJa} ${genus}` : genus;
  const dFamEl = document.getElementById("dFam");
  dFamEl.innerHTML = `${esc(sp.family)}${genusLabel ? ` <span class="genus-tag" id="dGenusTag" role="button" tabindex="0" title="この属の種を一覧表示">／ ${esc(genusLabel)}</span>` : ""}`;
  const genusTagEl = document.getElementById("dGenusTag");
  if(genusTagEl){
    const goGenus = () => {
      backBtn.click();
      searchInput.value = genusJa || genus;
      renderList();
      searchInput.scrollIntoView({behavior:"smooth", block:"start"});
    };
    genusTagEl.addEventListener("click", goGenus);
    genusTagEl.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); goGenus(); } });
  }

  const rec = sp.hyogoRecord;
  const body = document.getElementById("detailBody");
  body.innerHTML = `
    <div class="section">
      <h2><span class="ico">🌍</span>世界の分布</h2>
      <p class="summary">${esc(sp.worldDistribution.summary)}</p>
      ${sourceBlock(sp.worldDistribution.source)}
      ${reliabilityBlock(sp.worldDistribution.reliabilityNote)}
    </div>

    <div class="section">
      <h2><span class="ico">🗾</span>日本国内の分布</h2>
      ${sp.japanDistribution.status ? `<div class="status-pill info">${esc(sp.japanDistribution.status)}</div>` : ""}
      <p class="summary">${esc(sp.japanDistribution.summary)}</p>
      ${sp.japanDistribution.habitat ? `
        <div class="habitat-block">
          <div class="sub-heading">🌱 生息環境</div>
          <p class="summary">${esc(sp.japanDistribution.habitat)}</p>
        </div>
      ` : ""}
      ${sourceBlock(sp.japanDistribution.source)}
      ${reliabilityBlock(sp.japanDistribution.reliabilityNote)}
    </div>

    <div class="section">
      <h2><span class="ico">📍</span>兵庫県での記録</h2>
      <div class="status-pill ${rec.recorded ? "yes":"no"}">${rec.recorded ? "✓ 記録あり" : "— 記録なし"}</div>
      <p class="summary">${esc(rec.detail)}</p>
      ${rec.volume ? `<div class="fact-row"><div class="k">掲載巻</div><div class="v">兵庫県産維管束植物 第${rec.volume}巻</div></div>` : ""}
      ${rec.page ? `<div class="fact-row"><div class="k">該当ページ</div><div class="v">p.${esc(rec.page)}</div></div>` : ""}
      ${rec.localities && rec.localities.length ? `
        <div class="sub-heading">📌 記録地点（目録記載の全産地）</div>
        <div class="locality-count">全${rec.localities.length}件を省略なく記載</div>
        <ul class="locality-list">
          ${rec.localities.map((loc, i) => `<li><span class="idx">${i+1}.</span>${esc(loc)}</li>`).join("")}
        </ul>
      ` : ""}
      ${sourceBlock(rec.source)}
      ${reliabilityBlock(rec.reliabilityNote)}
    </div>

    ${simSpeciesBlock(sp.similarSpecies)}
  `;

  body.querySelectorAll(".similar-item.linkable[data-target-id]").forEach(el => {
    const go = () => openDetail(el.getAttribute("data-target-id"));
    el.addEventListener("click", go);
    el.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
  });

  listView.classList.add("hidden");
  detailView.classList.add("active");
  window.scrollTo(0,0);
}

backBtn.addEventListener("click", () => {
  detailView.classList.remove("active");
  listView.classList.remove("hidden");
  window.scrollTo(0,0);
});

renderList();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {
      // オフライン登録に失敗しても検索機能自体は通常どおり利用可能
    });
  });
}
</script>
</body>
</html>
